# Proposed project-scoped Lacuna Research MCP for trusted Codex environments.
# Official upstream: https://github.com/tiptreesystems/lacuna-research-mcp
# This declaration alone does not install or activate an MCP tool in ChatGPT.
# Requires uvx, network access and explicit approval/trust by the Codex operator.
[mcp_servers.lacuna-research]
command = "uvx"
args = ["lacuna-research-mcp"]
