name: COLLECT014 phase routing and ordering repair fits

on:
  push:
    branches: [research/collect014-trained-repairs-2026-11-02]
    paths: [research/collect014/LAUNCH_REQUEST.json]

permissions:
  contents: read

concurrency:
  group: collect014-internal-fixed-recipe
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/collect011
            research/collect012
            research/collect014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore permitted original source bytes
        working-directory: research/collect012
        run: python -m collect012.restore_data
      - name: Verify frozen registration and full source fixtures
        working-directory: research/collect014
        run: |
          python -m collect014.verify_launch > results/REMOTE_PREFLIGHT.json
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m unittest collect014.test_prefit -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect014-prefit-${{ github.run_id }}
          path: research/collect014/results/REMOTE_PREFLIGHT.json
          retention-days: 90

  fit:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [balance, write_first, combined]
        seed: [12001, 12002, 12003]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/collect011
            research/collect012
            research/collect014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore permitted original source bytes
        working-directory: research/collect012
        run: python -m collect012.restore_data
      - name: Verify exact launch inputs
        working-directory: research/collect014
        run: python -m collect014.verify_launch
      - name: Execute complete registered fit
        working-directory: research/collect014
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m collect014.train --arm '${{ matrix.arm }}' --seed '${{ matrix.seed }}' --output 'results/${{ matrix.arm }}_${{ matrix.seed }}'
      - name: Fresh process diagnostics
        working-directory: research/collect014
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m collect014.evaluate --run 'results/${{ matrix.arm }}_${{ matrix.seed }}' --output 'results/${{ matrix.arm }}_${{ matrix.seed }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect014-${{ matrix.arm }}-${{ matrix.seed }}-${{ github.run_id }}
          path: research/collect014/results/${{ matrix.arm }}_${{ matrix.seed }}/
          retention-days: 90
