name: COLLECT018 local acquisition and objective controls

on:
  push:
    branches: [research/collect018-local-acquisition-2026-11-03]
    paths: [research/collect018/LAUNCH_REQUEST.json]

permissions:
  contents: read

concurrency:
  group: collect018-internal-fixed-recipe
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/collect011
            research/collect012
            research/collect014
            research/collect016
            research/collect017
            research/collect018
            .github/workflows
            src
            tests/test_research_probe_agnostic.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install numpy==1.26.4 pytest==8.3.3
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore original licensed source bytes
        working-directory: research/collect012
        run: python -m collect012.restore_data
      - name: Check exact launch and full-graph fixtures
        working-directory: research/collect018
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          cmp WORKFLOW.yml ../../.github/workflows/collect018-local-acquisition.yml
          python -m collect018.verify_launch > results/REMOTE_PREFLIGHT.json
          python -m unittest collect018.test_prefit -v
      - name: Run original architecture-agnostic diagnostic tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_research_probe_agnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect018-prefit-${{ github.run_id }}
          path: research/collect018/results/REMOTE_PREFLIGHT.json
          retention-days: 90
  fit:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        arm: [phase_joint, phase_first, context_joint, context_first, gru_joint, gru_first]
        seed: [18001, 18002, 18003]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/collect011
            research/collect012
            research/collect014
            research/collect016
            research/collect017
            research/collect018
            .github/workflows
            src
            tests/test_research_probe_agnostic.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install numpy==1.26.4 pytest==8.3.3
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore original licensed source bytes
        working-directory: research/collect012
        run: python -m collect012.restore_data
      - name: Verify launch inputs
        working-directory: research/collect018
        run: python -m collect018.verify_launch
      - name: Execute complete registered fit
        working-directory: research/collect018
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m collect018.train --arm '${{ matrix.arm }}' --seed '${{ matrix.seed }}' --output 'results/${{ matrix.arm }}_${{ matrix.seed }}'
      - name: Fresh process frozen-checkpoint evaluation
        working-directory: research/collect018
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m collect018.evaluate --run 'results/${{ matrix.arm }}_${{ matrix.seed }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect018-${{ matrix.arm }}-${{ matrix.seed }}-${{ github.run_id }}
          path: research/collect018/results/${{ matrix.arm }}_${{ matrix.seed }}/
          retention-days: 90
