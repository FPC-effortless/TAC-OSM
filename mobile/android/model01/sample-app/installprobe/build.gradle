plugins {
    id 'com.android.application'
}
android {
    namespace 'org.tacosm.mobile.installprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'org.tacosm.mobile.installprobe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-diagnostic'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// Deliberately ZERO dependencies. In particular no ONNX or network clients:
// a successful install isolates Samsung sideload handling from neural package.
