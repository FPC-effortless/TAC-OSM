name: ME066 Git-owned original binary checkpoint storage probe
on:
  pull_request:
    paths:
      - 'scripts/me066_storage_probe.py'
      - '.github/workflows/me066-storage-probe.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: me066-frozen-original-checkpoint-storage-probe
  cancel-in-progress: false
jobs:
  prove-git-owned-binary-storage:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}",persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Original untrained probe bytes only; no publisher source/outcome read
        run: |
          if [ -f research/replay-bundles/ME066/STORAGE_PROBE_MANIFEST.json ]; then
            echo 'Original Git storage probe already exists; do not overwrite bytes'
          else
            PYTHONPATH=src:. python scripts/me066_storage_probe.py
          fi
      - name: Preserve binary bytes, manifest, full original sha in Git
        if: always()
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in research/replay-bundles/ME066/UNTRAINED_STORAGE_PROBE.pt research/replay-bundles/ME066/STORAGE_PROBE_MANIFEST.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me066): git owns original binary untrained checkpoint byte probe'
            for attempt in 1 2 3 4 5; do
              git fetch origin "$PUSH_BRANCH"
              git rebase "origin/$PUSH_BRANCH"
              if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
