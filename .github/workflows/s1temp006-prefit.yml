name: S1TEMP006 original long memory source and optimizer preflight (NO FIT)
on:
  push:
    branches: [research/s1temp006-fixed-state-slow-memory-2026-10-26]
    paths:
      - 'scripts/s1temp006_real_long_history_fit.py'
      - 'tests/test_s1temp006_real_source_prefit.py'
      - '.github/workflows/s1temp006-prefit.yml'
  pull_request:
    paths: ['scripts/s1temp006_real_long_history_fit.py','tests/test_s1temp006_real_source_prefit.py']
permissions:
  contents: read
jobs:
  no-training-eligible:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m py_compile scripts/s1temp006_real_long_history_fit.py
          PYTHONPATH=src:. python -m unittest tests.test_s1temp006_real_source_prefit -v
          PYTHONPATH=src:. python -m unittest tests.test_s1temp006_persistent_slow -v
