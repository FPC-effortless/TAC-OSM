name: LANG10M001 no-fit architecture and tokenizer source checks
on:
  pull_request:
    paths:
      - 'research/language-scaling/lang10m/**'
      - '.github/workflows/lang10m-prefit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only CPU dependencies
        run: |
          python -m pip install pytest==8.4.2 numpy==2.3.5 sentencepiece==0.2.1
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Count, source-boundary, causal-prefix and actual gradient checks
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m pytest -q research/language-scaling/lang10m/test_lang10m.py research/language-scaling/lang10m/test_capacity.py
