name: AXON StructMeans SECA phase 2

on:
  push:
    branches: [validation/operator-learning-phase2-ci]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Repository test suite
        run: python -m pytest tests/ -q
      - name: Run registered phase 2
        run: python scripts/run_axon_structmeans_seca_002.py
      - name: Upload phase 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-AXON-STRUCTMEANS-SECA-002
          path: artifacts/TACOSM-AXON-STRUCTMEANS-SECA-002.json
          if-no-files-found: error
