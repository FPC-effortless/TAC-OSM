name: ME049 valid real randomized three-action intelligent decision learning
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/tac_osm/me049_rct_action_models.py
      - scripts/me049_train_randomized_policy.py
      - tests/test_me049_valid_randomized_policy.py
      - research/mathematical-engineering/me049/**
      - docs/TACOSM-BASELINE-001.md
      - .github/workflows/me049-valid-real-rct.yml
permissions:
  contents: read
concurrency:
  group: me049-real-three-arm-rct
  cancel-in-progress: true
jobs:
  numerical-scientific-validity-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install same numerical environment as the real TAC experiments
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate genuine tri-action architecture source and scientific invariants
        run: |
          python -m py_compile src/tac_osm/me049_rct_action_models.py scripts/me049_train_randomized_policy.py
          python -m scripts.me049_train_randomized_policy --self-test
          python -m pytest -q tests/test_me049_valid_randomized_policy.py
      - name: Full original TAC regression and historical baseline count
        run: |
          python -m pytest -q
          python scripts/sync_test_count.py --check
  train-then-one-time-heldout-rct-and-replay:
    needs: numerical-scientific-validity-and-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install same CPU model numerical environment
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: SHA-verify original public randomized 64k customer Hillstrom trial, FIT six real models, then score fixed three-action TEST
        run: |
          set -o pipefail
          python -m scripts.me049_train_randomized_policy --out results/me049 | tee me049-original-randomized-full-fit.log
      - name: Independent original checkpoint/RNG and visit/conversion/spend forecast replay
        run: |
          set -o pipefail
          python -m scripts.me049_train_randomized_policy --out results/me049 --replay | tee me049-independent-replay.log
      - name: Verify actual observational treatment support, original real outcomes, registered mixed action counts and positive propensity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tac_osm.me049_rct_action_models import ARMS
          r=json.loads(Path("results/me049/results.json").read_text())
          assert r["study"]=="ME049_HILLSTROM_RANDOMIZED_THREE_ACTION_GOAL_MODEL"
          assert r["complete"] and r["source_original_SHA256"]=="0e5893329d8b93cefecc571777672028290ab69865718020c78c7284f291aece"
          assert r["all_original_FIT_checkpoints_SHA_frozen_before_test"]
          assert not r["heldout_labels_parsed_before_all_FIT_checkpoint_frozen"]
          assert len(r["models"])==6
          assert {(x["arm"],x["seed"]) for x in r["models"]}=={(a,s) for a in ARMS for s in (49001,49002)}
          assert all(q["real_randomized_training_exposures"]==800*256 for q in r["models"])
          assert min(r["FIT_support"]["action_counts"])>=5000
          assert min(r["DEV_support"])>=2500
          assert min(r["TEST_support"])>=2500
          assert r["selection"]["genuine_random_action_support_in_all_cohorts"]
          assert r["selection"]["parameter_count_ratio"]<1.01
          assert r["selection"]["no_model_merged_or_promoted"]
          print("ME049_VALID_THREE_ARM_RANDOMIZED_RCT_ALL_SCIENTIFIC_CHECKS_PASS")
          PY
      - name: Archive all genuine models, logged-action predictions, positive/negative measured results, provenance; no raw original customer file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me049-valid-hillstrom-RCT-3-actions-TAC-GRU-context-original-weights
          path: |
            results/me049/
            !results/me049/source-NOT-ARTIFACT/
            !results/me049/source-NOT-ARTIFACT/**
            me049-original-randomized-full-fit.log
            me049-independent-replay.log
          retention-days: 90
          if-no-files-found: ignore
