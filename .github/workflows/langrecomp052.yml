name: LANGRECOMP052 original trained TAC causal replay vs retained inference state CPU
on:
  pull_request:
    paths:
      - 'scripts/langrecomp052_replay.py'
      - 'tests/test_langrecomp052_replay.py'
      - 'research/mathematical-engineering/langrecomp052/**'
      - 'research/phone_queue/langrecomp052.json'
      - '.github/workflows/langrecomp052.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-trained-causal-cpu-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Legitimate FIT source, no-fit phone plan, numerical and source owner fixture tests
        run: |
          mkdir -p langrecomp052-evidence
          python scripts/phone_lab.py plan research/phone_queue/langrecomp052.json > langrecomp052-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langrecomp052/FAIR_COMPARISON.json --phase preflight > langrecomp052-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langrecomp052_replay.py
      - name: Retrieve original trained checkpoint with strict checksum and source provenance
        run: |
          gh run download 40797105091 --repo FPC-effortless/TAC-OSM --name LANGLAYER040-CPU-state48_no_graph-seed1701 --dir langrecomp052-original/tac
      - name: Original trained full-prefix recomputation vs incremental stream CPU parity and cost
        run: |
          PYTHONPATH=src:. python scripts/langrecomp052_replay.py --tac-dir langrecomp052-original/tac --output langrecomp052-evidence/RESULTS.json
          python - <<'PY'
          import json
          r=json.load(open('langrecomp052-evidence/RESULTS.json'))
          assert r['training_updates']==0 and r['gpu_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          assert r['whole_model_peak_vram']=='NOT_MEASURED_CPU_ONLY'
          assert r['training_activation_recomputation']=='NOT_TESTED'
          assert len(r['results'])==4
          for row in r['results']:
              assert row['source_proof']['max_abs_logit']<=3e-5
              assert row['source_proof']['incremental_tensor_state_bytes']==3904
          PY
      - name: Archive original trained CPU outcome and failed checks without overwriting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGRECOMP052-original-trained-tac-cpu-recomputation
          path: langrecomp052-evidence/
          retention-days: 90
          if-no-files-found: warn
