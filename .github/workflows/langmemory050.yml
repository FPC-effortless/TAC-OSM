name: LANGMEMORY050 authentic-source multi-continuation bounded memory CPU
on:
  pull_request:
    paths:
      - 'scripts/langmemory050_multivalue.py'
      - 'tests/test_langmemory050_multivalue.py'
      - 'research/mathematical-engineering/langmemory050/**'
      - 'research/phone_queue/langmemory050.json'
      - '.github/workflows/langmemory050.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-multicandidate-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 pytest==8.4.2
      - name: Original source and no-fit research planning and constructed tests
        run: |
          mkdir -p langmemory050-evidence
          python scripts/phone_lab.py plan research/phone_queue/langmemory050.json > langmemory050-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langmemory050/FAIR_COMPARISON.json --phase preflight > langmemory050-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langmemory050_multivalue.py
      - name: Genuine publisher FIT bounded 2/3-value source retrieval, 1536 4096 8192
        run: |
          PYTHONPATH=src:. python scripts/langmemory050_multivalue.py --output langmemory050-evidence/RESULTS.json
          python - <<'PY'
          import json
          r=json.load(open('langmemory050-evidence/RESULTS.json'))
          assert r['training_updates']==0 and r['gpu_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          assert len(r['cohorts'])==3
          for x in r['cohorts'].values():
              for owner in x['source_owners']:
                  for k in owner['multi_diagnostics'].values():
                      assert k['total_payload_bytes'] in (1344,4096)
                  assert all(a['queries']==owner['cases'] for a in owner['arms'].values())
          PY
      - name: Preserve genuine observed-source receipts and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGMEMORY050-real-source-multivalue-counts
          path: langmemory050-evidence/
          retention-days: 90
          if-no-files-found: warn
