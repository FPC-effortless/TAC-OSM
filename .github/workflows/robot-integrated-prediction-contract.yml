name: TAC real physical dynamics and masked takeover verification contract
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/tac_osm/real_robot_predictive_state.py
      - tests/test_real_robot_integrated_predict_and_correct.py
      - research/real-robot-integrated-physical-takeover-predict-verify-2026-10-22.md
      - docs/TACOSM-BASELINE-001.md
      - .github/workflows/robot-integrated-prediction-contract.yml
permissions:
  contents: read
jobs:
  native-real-physics-and-takeover-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATEN_CPU_CAPABILITY: avx2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test-only CPU PyTorch dependencies
        run: |
          python -m pip install 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Check full physical/onset prediction with real-observation information constraints
        run: |
          python -m py_compile src/tac_osm/real_robot_predictive_state.py
          PYTHONPATH=src python -m pytest -q tests/test_real_robot_integrated_predict_and_correct.py
      - name: Preserve the component contract after registered robot studies
        run: |
          python - <<'PY'
          from pathlib import Path
          from tac_osm.real_robot_predictive_state import RealRobotPredictiveState
          import torch
          model=RealRobotPredictiveState()
          assert sum(p.numel() for p in model.parameters() if p.requires_grad)>0
          registrations=list(Path('research/mathematical-engineering').glob('me*/FAIR_COMPARISON.json'))
          # This component began as software-only. Later studies are allowed to
          # register training evidence; their own manifests and workflows own
          # every scientific/resource claim. The component check must not fail
          # merely because immutable historical registrations now exist.
          assert registrations
          print('NATIVE_ROBOT_DUAL_FEEDBACK_COMPONENT_CONTRACT_PASS__STUDY_CLAIMS_REMAIN_MANIFEST_SCOPED')
          PY
        env:
          PYTHONPATH: src
