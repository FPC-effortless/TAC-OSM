name: S1TEMP008 full source-indexed System1 equal-budget graph and Observatory contract
on:
  push:
    branches: [research/s1temp008-source-entity-retention-2026-10-26]
    paths:
      - 'src/tac_osm/variants/s1temp008_source_entity_world.py'
      - 'tests/test_s1temp008_native_entity_model.py'
      - '.github/workflows/s1temp008-full-contract.yml'
  pull_request:
    paths:
      - 'src/tac_osm/variants/s1temp008_source_entity_world.py'
      - 'tests/test_s1temp008_native_entity_model.py'
permissions:
  contents: read
jobs:
  same-weight-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1temp008_native_entity_model -v
          PYTHONPATH=src:. python -m unittest tests.test_s1temp008_entity_retention -v
