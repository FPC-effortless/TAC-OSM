name: TAC-OSM fused frontier 001

on:
  push:
    branches:
      - research/fused-tacosm-frontier-001
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Test suite
        run: pytest -q
      - name: Registered fused run
        run: python scripts/run_fused_frontier_001.py > artifacts/TACOSM-FUSED-FRONTIER-001.stdout.json
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-FUSED-FRONTIER-001
          path: artifacts/
