name: LANGMATH098 state separation diagnostic
on:
  pull_request:
    paths:
      - 'research/mathematical-engineering/langstate098/**'
      - 'research/phone_queue/langmath098-state-separation-no-fit.json'
      - '.github/workflows/langstate098.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-state-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pytest>=8,<9'
      - run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/phone_lab.py plan research/phone_queue/langmath098-state-separation-no-fit.json
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langstate098/FAIR_COMPARISON.json --phase preflight
      - name: Original full-source reference and architecture-agnostic checks
        run: python -m pytest -q tests/test_langmath098.py tests/test_research_probe_agnostic.py
      - name: State interventions and end-to-end constructed costs, no fits
        run: python research/mathematical-engineering/langstate098/run_diagnostic.py --source-model research/mathematical-engineering/langmath098/model.py --output ci-artifacts/langstate098/DIAGNOSTIC.json
      - name: Replay exported initializations and state in a fresh process
        run: python research/mathematical-engineering/langstate098/replay.py --source-model research/mathematical-engineering/langmath098/model.py --results ci-artifacts/langstate098 --output ci-artifacts/langstate098/REPLAY.json
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langstate098/FAIR_COMPARISON.json --phase final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langmath098-state-separation-no-fit
          path: ci-artifacts/langstate098/
          if-no-files-found: error
