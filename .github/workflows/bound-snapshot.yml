name: Bound inference snapshot - untrained two-runner replay
on:
  pull_request:
    paths:
      - 'src/tac_osm/bound_snapshot.py'
      - 'tests/test_bound_snapshot.py'
      - 'scripts/replay_bound_snapshot.py'
      - 'research/bound_snapshot_20261112/**'
      - '.github/workflows/bound-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      index_sha: ${{ steps.capture.outputs.index_sha }}
    env:
      PYTHONPATH: src:.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install pytest==8.4.2 numpy==2.3.5 safetensors==0.6.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: CPU plan and source-bound regression controls
        run: |
          mkdir -p capture-evidence
          python -B scripts/phone_lab.py plan research/phone_queue/bound_snapshot_20261112.json > capture-evidence/CPU_PLAN.json
          cmp capture-evidence/CPU_PLAN.json research/bound_snapshot_20261112/COMPUTE_DECISION.json
          python -c 'from scripts.replay_bound_snapshot import check_source; check_source()'
          python -m pytest -q tests/test_bound_snapshot.py tests/test_stream_binding.py tests/test_state_ingress.py tests/test_csl125_memory_precision.py tests/test_csl125_r3.py tests/test_csl125_tool_model.py tests/test_research_probe_agnostic.py --junitxml=capture-evidence/TESTS.xml
      - name: Capture owned untrained fixtures and external index pin
        id: capture
        run: |
          python -B scripts/replay_bound_snapshot.py capture --output capture-evidence/snapshots
          echo "index_sha=$(sha256sum capture-evidence/snapshots/INDEX.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BOUND-SNAPSHOT-20261112-CAPTURE
          path: capture-evidence/
          retention-days: 90
  cold-replay:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      EXPECTED_INDEX_SHA: ${{ needs.capture.outputs.index_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 safetensors==0.6.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: BOUND-SNAPSHOT-20261112-CAPTURE
          path: original-capture
      - name: New runner, different seed and RoPE buffer; load saved bytes then predict
        run: |
          python -B scripts/phone_lab.py plan research/phone_queue/bound_snapshot_20261112.json > /tmp/bound-snapshot-replay-plan.json
          cmp /tmp/bound-snapshot-replay-plan.json research/bound_snapshot_20261112/COMPUTE_DECISION.json
          python -B scripts/replay_bound_snapshot.py replay --input original-capture/snapshots --expected-index-sha "$EXPECTED_INDEX_SHA" --output replay-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BOUND-SNAPSHOT-20261112-COLD-REPLAY
          path: replay-evidence/
          retention-days: 90
