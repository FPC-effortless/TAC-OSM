name: CED hardened router DEV-008 (NOT confirmatory)
on:
  push:
    branches:
      - research/ced-hardened-integration-dev-008-2026-10-13
    paths:
      - "src/tac_osm/development/ced_hardened_router.py"
      - "tests/test_ced_hardened_development.py"
      - ".github/workflows/ced-hardened-development.yml"
      - "docs/CED-HARDENED-DEV-008.md"
  pull_request:
    paths:
      - "src/tac_osm/development/ced_hardened_router.py"
      - "tests/test_ced_hardened_development.py"
      - ".github/workflows/ced-hardened-development.yml"
      - "docs/CED-HARDENED-DEV-008.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism-and-hardened-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test packages
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and lint new development code
        run: |
          python -m py_compile src/tac_osm/development/ced_hardened_router.py tests/test_ced_hardened_development.py
          ruff check --select F src/tac_osm/development/ced_hardened_router.py tests/test_ced_hardened_development.py
      - name: Focused CED loop integration tests
        run: python -m pytest tests/test_ced_hardened_development.py -q
      - name: Report current suite collection count
        run: python -m pytest --collect-only -q | tail -3
