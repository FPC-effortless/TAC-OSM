name: CED hardened router DEV-008 (NOT confirmatory)
on:
  push:
    branches:
      - research/ced-hardened-integration-dev-008-2026-10-13
    paths:
      - "src/tac_osm/development/ced_hardened_router.py"
      - "tests/test_ced_hardened_development.py"
      - "scripts/run_ced_hardened_dev.py"
      - ".github/workflows/ced-hardened-development.yml"
  pull_request:
    paths:
      - "src/tac_osm/development/ced_hardened_router.py"
      - "tests/test_ced_hardened_development.py"
      - "scripts/run_ced_hardened_dev.py"
      - ".github/workflows/ced-hardened-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism-and-hardened-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test packages
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and lint new development code
        run: |
          python -m py_compile src/tac_osm/development/ced_hardened_router.py tests/test_ced_hardened_development.py scripts/run_ced_hardened_dev.py
          ruff check --select F src/tac_osm/development/ced_hardened_router.py tests/test_ced_hardened_development.py scripts/run_ced_hardened_dev.py
      - name: Focused CED loop integration tests
        run: python -m pytest tests/test_ced_hardened_development.py -q
      - name: Report current suite collection count
        run: python -m pytest --collect-only -q | tail -3
      - name: Smoke synthetic decision training + real hardened loop
        run: python scripts/run_ced_hardened_dev.py --smoke --output artifacts/DEV-008-SMOKE
      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-008-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-008-SMOKE/
          if-no-files-found: warn

  development-grid:
    if: github.event_name == 'push'
    needs: mechanism-and-hardened-loop
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development CPU runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Matched shared/sparse full development experiment
        run: python scripts/run_ced_hardened_dev.py --output artifacts/DEV-008
      - name: Preserve source-linked rows and 6 checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-008-RAW-NOT-CONFIRMATORY
          path: artifacts/DEV-008/
          if-no-files-found: error
