name: DEV-032 gradient and integration engineering
on:
  pull_request:
    types: [opened]
    paths:
      - 'research/dev032/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          ruff check --select F src/tac_osm/development/gradient_diagnostics.py src/tac_osm/development/integration_test6.py scripts/*dev032.py tests/*dev032.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
          python scripts/run_test6_preflight_dev032.py --output /tmp/dev032-engineering.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-032-ENGINEERING-NOT-CAPABILITY
          path: /tmp/dev032-engineering.json
