name: MODEL01 frozen TAC original UCI CAL coverage buffers 90-94-96
on:
  push:
    branches:
      - research/model01-cal-buffered-coverage-2026-10-27
    paths:
      - 'specialist_models/model01_cal_coverage_buffer.py'
      - 'tests/test_model01_cal_coverage_buffer.py'
      - 'research/registrations/MODEL01-TAC-CAL-COVERAGE-BUFFER-001.md'
      - '.github/workflows/model01-cal-coverage-buffer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  genuine-source-cal-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CPU neural replay environment
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check 'numpy==2.2.6'
          python -m pip install --no-cache-dir --disable-pip-version-check 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Constructed mechanics only and original Git owned checkpoint identity
        run: python -m unittest discover -s tests -p test_model01_cal_coverage_buffer.py -v
      - name: Score all registered buffers; no model fit or candidate selection
        run: |
          set -euo pipefail
          SOURCE=research/source-evidence/MODEL01-TAC-CAL-COVERAGE-BUFFER-001-ORIGINAL.json
          if [ -e "$SOURCE" ]; then
            echo 'EXISTING_ORIGINAL_FROZEN_SOURCE_RECEIPT=TRUE (no rescore)'
          else
            python specialist_models/model01_cal_coverage_buffer.py --out "$SOURCE"
            python - <<'PY'
          import json
          x=json.load(open('research/source-evidence/MODEL01-TAC-CAL-COVERAGE-BUFFER-001-ORIGINAL.json'))
          assert x['study']=='MODEL01-TAC-CAL-COVERAGE-BUFFER-001'
          assert x['no_model_fitting'] and x['no_dev_based_candidate_selection']
          assert x['source_protected_tail_parsed'] is False
          assert x['independent_qualification'] is False
          assert x['all_prespecified_interval_central_masses']==[.9,.94,.96]
          assert len(x['runs'])==3
          for r in x['runs']:
              assert set(r['per_preset_level'])=={'90','94','96'}
              assert all(s['EXPOSED_DEV_report_only']['n']==1968 for s in r['per_preset_level'].values())
          print('ORIGINAL_REAL_SOURCE_CAL_BUFFERS_RUN=PASS_NO_FIT_NO_PROMOTION')
          print('FULL_PER_SEED_OUTCOMES='+json.dumps([{'seed':r['seed'],'levels':{name:d['EXPOSED_DEV_report_only'] for name,d in r['per_preset_level'].items()}} for r in x['runs']],sort_keys=True))
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$SOURCE"
            git commit -m 'research: preserve original CAL-buffered TAC interval results and source provenance'
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model01-original-frozen-native-cal-coverage-buffers
          path: research/source-evidence/MODEL01-TAC-CAL-COVERAGE-BUFFER-001-ORIGINAL.json
          if-no-files-found: warn
          retention-days: 14
