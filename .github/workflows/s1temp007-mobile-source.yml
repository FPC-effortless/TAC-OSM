name: S1TEMP007 Mobile Chair 2000-frame source-only FIT SHA lock
on:
  push:
    branches: [research/s1temp007-multiscale-state-2026-10-26]
    paths: ['research/parallel-six/S1TEMP007-MOBILE-001.marker']
permissions:
  contents: read
jobs:
  authentic-only-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
      - run: python scripts/s1temp007_mobile_chair_source_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1temp007-mobile-original-30-fits-source-lock
          path: research/diagnostics/s1temp007-mobile-chair-source-original/**
          if-no-files-found: warn
          retention-days: 90
