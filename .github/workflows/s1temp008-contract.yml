name: S1TEMP008 fixed state source entity-indexed associative kernel
on:
  push:
    branches: [research/s1temp008-source-entity-retention-2026-10-26]
    paths:
      - 'src/tac_osm/variants/s1temp008_entity_retention.py'
      - 'tests/test_s1temp008_entity_retention.py'
      - '.github/workflows/s1temp008-contract.yml'
  pull_request:
    paths:
      - 'src/tac_osm/variants/s1temp008_entity_retention.py'
      - 'tests/test_s1temp008_entity_retention.py'
permissions:
  contents: read
jobs:
  tensor-isolation-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1temp008_entity_retention -v
          PYTHONPATH=src:. python -m unittest tests.test_s1temp007_multiscale_memory -v
