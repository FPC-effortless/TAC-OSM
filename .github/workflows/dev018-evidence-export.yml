name: DEV-018 accessible evidence export
on:
  pull_request:
    paths:
      - ".github/workflows/dev018-evidence-export.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export-audited-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wait for frozen training and independent audit
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = 38802569971;
            for (let i = 0; i < 220; i++) {
              const {data:r} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
              if (r.status === 'completed') {
                if (r.conclusion !== 'success') throw new Error(`Training/audit did not succeed: ${r.conclusion}`);
                core.info(`Audited source ${r.head_sha}, run ${run_id}`);
                return;
              }
              if (i % 10 === 0) core.info(`Waiting for frozen run ${run_id}: ${r.status}`);
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Training still incomplete; no outcome exported');
      - uses: actions/download-artifact@v4
        with:
          name: DEV-018-COMPLETE-AUDITED-EVIDENCE-NOT-CONFIRMATORY
          run-id: 38802569971
          github-token: ${{ github.token }}
          path: evidence
      - name: Export audited tables and compact analysis through a verified text bundle
        shell: python
        run: |
          import base64,gzip,hashlib,json
          from pathlib import Path
          p=Path('evidence/analysis')
          result=json.loads((p/'analysis.json').read_text())
          result['by_seed']=[{k:r[k] for k in ('seed','regime','summaries','models')} for r in result['by_seed']]
          files={x.name:x.read_text() for x in p.glob('*.csv')}
          files['analysis.json']=json.dumps(result,indent=2)+'\n'
          packed=gzip.compress(json.dumps(files).encode(),mtime=0)
          encoded=base64.b64encode(packed).decode()
          size=16000
          chunks=[encoded[i:i+size] for i in range(0,len(encoded),size)]
          print('DEV018_EXPORT_SHA256 '+hashlib.sha256(packed).hexdigest())
          for i,chunk in enumerate(chunks):
              print(f'DEV018_EXPORT_CHUNK {i+1}/{len(chunks)} {chunk}')
          print('DEV018_EXPORT_FILES '+json.dumps({n:hashlib.sha256(s.encode()).hexdigest() for n,s in files.items()}))
