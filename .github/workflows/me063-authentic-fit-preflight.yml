name: ME063 authentic FIT preflight and software contracts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-fit-zero-step-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original source and PyTorch dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify causal horizon/finite gradients without fitting models
        run: PYTHONPATH=src:. python -m pytest -q tests/test_me063_regime.py
      - name: Read original real FIT only; certify raw FLOP/param preflight
        run: |
          PYTHONPATH=src:. python scripts/me063_prefit_original_fit.py \
            --source-cache "${{ runner.temp }}/me063-original-source-cache" \
            --output research/mathematical-engineering/me063/PREFLIGHT_MEASURED.json
      - name: Commit original measured evidence to source repo
        if: always()
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research/mathematical-engineering/me063/
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me063): original FIT-only resource preflight and software tests'
            git fetch origin "$PUSH_BRANCH"
            git rebase "origin/$PUSH_BRANCH"
            git push origin "HEAD:refs/heads/$PUSH_BRANCH"
          fi
