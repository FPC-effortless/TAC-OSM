name: DEV-044A reservoir scaling and recurrent controls (development)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/dev044/**'
      - 'scripts/*dev044.py'
      - 'tests/test_reservoir_scaling_dev044.py'
      - '.github/workflows/dev044-reservoir-scaling.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU environment
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Regress all invariants, source/test ledger
        run: |
          ruff check --select F scripts/run_reservoir_scaling_dev044.py scripts/audit_reservoir_scaling_dev044.py tests/test_reservoir_scaling_dev044.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Two-update smoke for all nine registered model candidates
        run: |
          python scripts/run_reservoir_scaling_dev044.py --seed 4401 --smoke --output artifacts/DEV044-smoke
          python - <<'PY'
          import json
          d=json.load(open("artifacts/DEV044-smoke/report.json"))
          assert d["smoke"] and len(d["arms"])==9
          assert all(d["arms"][a]["train"]["steps"]==2 for a in d["arms"])
          print("DEV044A 9-ARM SMOKE AND SOURCE LOCK PASSED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV044A-smoke-nonconfirmatory
          path: artifacts/DEV044-smoke/
          if-no-files-found: warn
  paired-seeds:
    needs: integrity-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [4401, 4402, 4403]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install registered CPU runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Nine arms with paired training cases, calibration-only model selection, untouched evaluation
        run: |
          python scripts/run_reservoir_scaling_dev044.py --seed ${{ matrix.seed }} --output artifacts/DEV044-seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV044A-RAW-seed${{ matrix.seed }}-development
          path: artifacts/DEV044-seed${{ matrix.seed }}/
          if-no-files-found: warn
  independent-audit:
    needs: paired-seeds
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV044A-RAW-seed*-development
          path: artifacts/evidence
      - name: Install independent CPU audit runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Recompute all public labels, policies, physical costs and calibration selection
        run: |
          python scripts/audit_reservoir_scaling_dev044.py \
            artifacts/evidence/DEV044A-RAW-seed4401-development \
            artifacts/evidence/DEV044A-RAW-seed4402-development \
            artifacts/evidence/DEV044A-RAW-seed4403-development \
            --output artifacts/evidence/analysis
      - uses: actions/upload-artifact@v4
        with:
          name: DEV044A-COMPLETE-AUDITED-DEVELOPMENT-EVIDENCE
          path: artifacts/evidence/
          if-no-files-found: error
      - name: Publish only after independent audit and archive success
        run: cat artifacts/evidence/analysis/analysis.json
