name: Integration-002 prospective noisy-alias diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/tac_osm/integration_002_benchmark.py"
      - "tests/test_integration_002_benchmark.py"
      - "scripts/diagnose_integration_002_noisy_alias.py"
      - ".github/workflows/integration-002-development.yml"

permissions:
  contents: read

jobs:
  development-baselines:
    name: Noisy alias (classical baselines; not confirmatory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test environment
        run: |
          python -m pip install --quiet -e . 'pytest>=8.0'
      - name: Verify latent alias secrecy and pair invariants
        run: python -m pytest tests/test_integration_002_benchmark.py -q
      - name: Measure exploratory dense baselines
        run: python scripts/diagnose_integration_002_noisy_alias.py
      - name: Preserve raw exploratory cells
        uses: actions/upload-artifact@v4
        with:
          name: INTEGRATION-002-DEV-NOT-CONFIRMATORY
          path: artifacts/INTEGRATION-002-DEV-NOISY-ALIAS-001.json
          if-no-files-found: error
