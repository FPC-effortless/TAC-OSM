name: PAR-TIME-003 original real source 5 trained TAC models + frozen replay
on:
  push:
    branches:
      - research/partime003-real-single-model-fit-2026-10-27
    paths:
      - '.github/workflows/partime003-original-genuine-fit.yml'
      - 'scripts/partime003_single_model_fit.py'
      - 'research/parallel-six/PAR-TIME-003-PROTOCOL.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: par-time-003-original-single-arm-frozen-source
  cancel-in-progress: false
jobs:
  genuine-physical-source-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only Torch
        run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fail closed if an original plan or checkpoint already exists
        run: |
          test ! -e research/parallel-six/PAR-TIME-003-FROZEN-PLAN.json
          test ! -e research/replay-bundles/PAR-TIME-003
          python -m py_compile scripts/partime003_single_model_fit.py
          python -m py_compile scripts/partime002_real_source.py
      - name: Restore original publisher source via immutable Git commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/partime003-real
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip > /tmp/partime003-real/PRSA2017_original.zip
          test "$(sha256sum /tmp/partime003-real/PRSA2017_original.zip | awk '{print $1}')" = d1b9261c54132f04c374f762f1e5e512af19f95c95fd6bfa1e8ac7e927e3b0b8
      - name: Construct deterministic original genuine-source plan only
        env:
          PYTHONPATH: '.:src'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m scripts.partime003_single_model_fit --mode plan \
            --source /tmp/partime003-real/PRSA2017_original.zip
      - name: Commit original sample plan BEFORE first AdamW update
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/partime003-real-single-model-fit-2026-10-27
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/parallel-six/PAR-TIME-003-FROZEN-PLAN.json
          git diff --cached --quiet && exit 1
          git commit -m 'research: freeze five real-source chronological sample schedules before any optimizer update'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Train only time-aware real-source model, FIVE original checkpoints
        env:
          PYTHONPATH: '.:src'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -m scripts.partime003_single_model_fit --mode fit \
            --source /tmp/partime003-real/PRSA2017_original.zip
      - name: Commit all original optimizer+RNG+weights BEFORE any DEV scoring
        shell: bash
        run: |
          set -euo pipefail
          test -s research/replay-bundles/PAR-TIME-003/TRAIN_RECEIPT.json
          test ! -e research/replay-bundles/PAR-TIME-003/DEV_RESULTS.json
          git add research/replay-bundles/PAR-TIME-003
          git diff --cached --quiet && exit 1
          git commit -m 'research: preserve five original real-source time-aware TAC checkpoint and optimizer originals before DEV'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Score genuine already-exposed May-Jun 2014 physical development without training
        env:
          PYTHONPATH: '.:src'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -m scripts.partime003_single_model_fit --mode eval \
            --source /tmp/partime003-real/PRSA2017_original.zip
      - name: Preserve all original full development forecasts, truth masks, and negative metrics
        shell: bash
        run: |
          set -euo pipefail
          test -s research/replay-bundles/PAR-TIME-003/DEV_RESULTS.json
          git add research/replay-bundles/PAR-TIME-003
          git diff --cached --quiet && exit 1
          git commit -m 'research: preserve original genuine 2014 exposed DEV full per-model forecasts and failures'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Cold independent clean checkout of original trained source models
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$GITHUB_REF_NAME" --single-branch \
            "https://github.com/$GITHUB_REPOSITORY.git" /tmp/partime003-clean
          cd /tmp/partime003-clean
          PYTHONPATH='.:src' python -m scripts.partime003_single_model_fit --mode replay \
            --source /tmp/partime003-real/PRSA2017_original.zip
      - name: Final honest research boundary
        run: |
          echo 'Five original true-source trained models, development-only vs persistence.'
          echo 'No matched time-blind architecture comparator or full training-FLOP parity.'
          echo 'No numerical 2015–2017 target access, independent holdout, policy or safety claims.'
