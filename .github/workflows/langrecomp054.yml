name: LANGRECOMP054 original trained TAC warmed scoped vs full recompute CPU
on:
  pull_request:
    paths:
      - 'scripts/langrecomp054_warmed_scoped.py'
      - 'tests/test_langrecomp054_warmed_scoped.py'
      - 'research/mathematical-engineering/langrecomp054/**'
      - 'research/phone_queue/langrecomp054.json'
      - '.github/workflows/langrecomp054.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-original-trained-checkpoint-warmed-backward:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Publisher original source and CPU planner, primitive scope/gradient fixtures
        run: |
          mkdir -p langrecomp054-evidence
          python scripts/phone_lab.py plan research/phone_queue/langrecomp054.json > langrecomp054-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langrecomp054/FAIR_COMPARISON.json --phase preflight > langrecomp054-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langrecomp054_warmed_scoped.py
      - name: Immutable genuine original trained checkpoint download
        run: |
          gh run download 40797105091 --repo FPC-effortless/TAC-OSM --name LANGLAYER040-CPU-state48_no_graph-seed1701 --dir langrecomp054-original/tac
      - name: Original authentic FIT next byte gradient parity, warmed three arm CPU and logical saves
        run: |
          PYTHONPATH=src:. python scripts/langrecomp054_warmed_scoped.py --original-dir langrecomp054-original/tac --output langrecomp054-evidence/RESULTS.json
          python - <<'PY'
          import json
          x=json.load(open('langrecomp054-evidence/RESULTS.json'))
          assert x['gpu_minutes']==0 and x['protected_TEST']=='NOT_ACCESSED' and x['new_optimizer_updates']==0
          assert x['cuda_peak_allocated']=='NOT_MEASURED_CPU_ONLY' and x['trained_model_parameters']==499623
          assert len(x['rows'])==2
          for row in x['rows']:
              assert row['max_parameter_gradient_abs_diff']<=3e-5
              assert row['max_forward_abs_diff']<=3e-5
              assert len(row['arms'])==3
              assert all(len(v['total_ms']['raw'])==5 for v in row['arms'].values())
          PY
      - name: Preserve genuine source evidence, complete or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGRECOMP054-original-trained-warm-autograd-cpu
          path: langrecomp054-evidence/
          retention-days: 90
          if-no-files-found: warn
