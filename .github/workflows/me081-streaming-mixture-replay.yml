name: ME081 native distributional state and original replay
on:
  pull_request:
    paths: ['src/tac_osm/variants/horizon_query_world.py', 'scripts/me081*', 'research/mathematical-engineering/me081/**', 'research/replay-bundles/ME081/**', 'tests/test_me081*', '.github/workflows/me081-streaming-mixture-replay.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python -m pytest -q tests/test_me081_horizon_query.py
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me081/FAIR_COMPARISON.json --phase preflight
      - name: Verify actual final weights and all guarded optimizer updates
        if: hashFiles('research/replay-bundles/ME081/FIT_INDEX.json') != ''
        run: |
          PYTHONPATH=src:. python scripts/me081_train_world.py finalize
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me081/FINAL_COMPARISON.json --phase final
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/me081-source
          key: me081-original-source-v1
      - name: Independent original model replay without training
        if: hashFiles('research/replay-bundles/ME081/ORIGINAL_SCORE_INDEX.json') != ''
        run: |
          PYTHONPATH=src:. python scripts/me081_train_world.py replay --cache "${{ runner.temp }}/me081-source"
          python - <<'PY'
          from pathlib import Path
          import json
          print('ME081_EXTERNAL_REPLAY='+json.dumps(json.loads(Path('research/replay-bundles/ME081/INDEPENDENT_REPLAY.json').read_text())))
          PY
      - name: Complete read-only numerical census (strict failure stays failed)
        if: always() && hashFiles('research/replay-bundles/ME081/ORIGINAL_SCORE_INDEX.json') != ''
        run: PYTHONPATH=src:. python scripts/me081_cross_cpu_audit.py --cache "${{ runner.temp }}/me081-source"
