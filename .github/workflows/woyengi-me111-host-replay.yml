name: Woyengi ME111 frozen-APK host replay (no physical qualification)

on:
  push:
    branches:
      - product/tac-neural-android-local-runtime-20261028
    paths:
      - .github/workflows/woyengi-me111-host-replay.yml

permissions:
  actions: read
  contents: read

jobs:
  woyengi-host-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Select latest successful ARM64 APK build on this branch
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          query = urllib.parse.urlencode({"branch": branch, "per_page": 100})
          url = "https://api.github.com/repos/" + repo + "/actions/workflows/model01-android-apk.yml/runs?" + query
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          runs = [
              run for run in data.get("workflow_runs", [])
              if run.get("event") == "push"
              and run.get("head_branch") == branch
              and run.get("conclusion") == "success"
          ]
          if not runs:
              raise SystemExit("No successful push-triggered frozen APK build found on " + branch)
          latest = max(runs, key=lambda run: run.get("run_number", 0))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("run_id=" + str(latest["id"]) + "\n")
              output.write("head_sha=" + latest["head_sha"] + "\n")
              output.write("run_url=" + latest["html_url"] + "\n")
          print("Selected APK build run " + str(latest["id"]) + " at " + latest["head_sha"])
          PY

      - name: Download the exact ARM64 APK from selected build
        uses: actions/download-artifact@v4
        with:
          name: tac-me111-android-arm64-phone-small-debug
          repository: FPC-effortless/TAC-OSM
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Checkout the reviewed Woyengi host bridge
        uses: actions/checkout@v4
        with:
          repository: FPC-effortless/Woyengi
          ref: 71bbd5cd32c6f103997ac551b0e80160e58632a3
          path: woyengi

      - name: Set up Node 24.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned host CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'onnxruntime==1.23.2'
          node --version
          python --version
          python -c 'import numpy, onnxruntime; print("NUMPY="+numpy.__version__); print("ONNXRUNTIME="+onnxruntime.__version__)'

      - name: Verify exact APK bytes and run the Woyengi host quickstart twice
        working-directory: woyengi
        env:
          APK: ${{ github.workspace }}/artifacts/me111-phone-arm64-debug.apk
        run: |
          set -euo pipefail
          mkdir -p ../host-replay-receipts
          printf 'build_run_id=%s\nbuild_head_sha=%s\nbuild_run_url=%s\n' '${{ steps.build.outputs.run_id }}' '${{ steps.build.outputs.head_sha }}' '${{ steps.build.outputs.run_url }}' > ../host-replay-receipts/build_run.txt
          sha256sum "$APK" | tee ../host-replay-receipts/apk.sha256
          printf '%s  %s\n' '917553ac4c0fc04ee5f4215164cb1844550effcb2d9076c2816d3e53c096da0f' "$APK" | sha256sum -c -
          PY="$(python -c 'import sys; print(sys.executable)')"
          node packages/predictive-sdk/examples/me111_host_quickstart.ts "$APK" "$PY" > ../host-replay-receipts/first.json
          node packages/predictive-sdk/examples/me111_host_quickstart.ts "$APK" "$PY" > ../host-replay-receipts/second.json
          cmp ../host-replay-receipts/first.json ../host-replay-receipts/second.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('../host-replay-receipts/first.json').read_text(encoding='utf-8'))
          assert receipt['schema']=='woyengi.me111-host-demonstration.v1'
          assert receipt['execution']=='HOST_ONNX_CPU'
          assert receipt['runtime']=='1.23.2'
          assert receipt['apkSha256']=='917553ac4c0fc04ee5f4215164cb1844550effcb2d9076c2816d3e53c096da0f'
          assert receipt['modelSha256']=='dd65519a9e4f3388966538af53119b56e9292b46a9209d63ad4927b87f0a176b'
          assert receipt['checkpointSha256']=='337b882e9a10631dc85700846ef2b15ca8908699499668186ad3a248dc108449'
          assert receipt['stateReplay']=='PASSED_ACROSS_TWO_LOCAL_RUNTIME_PROCESSES'
          assert receipt['physicalDeviceQualification']=='NOT_RUN'
          assert receipt['physicalNetworkTrace']=='NOT_RUN'
          assert receipt['cases']['unauthorizedSource']=='DENIED'
          assert receipt['cases']['remoteFallback']=='REJECTED'
          assert receipt['cases']['canonicalHistoryDuringPrediction']=='UNCHANGED'
          assert len(receipt['forecasts'])==2
          print('PASS: Woyengi host replay receipt schema, frozen identities, state replay and adversarial cases')
          PY
          bash packages/predictive-sdk/examples/verify_me111_host_replay.sh "$APK" "$PY" | tee ../host-replay-receipts/verify.log

      - name: Preserve constructed host replay receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woyengi-me111-host-replay-receipts
          path: host-replay-receipts/
          if-no-files-found: error
          retention-days: 14
