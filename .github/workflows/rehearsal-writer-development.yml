name: TAC-OSM writer rehearsal DEV-012 (NOT confirmatory)

on:
  pull_request:
    paths:
      - "src/tac_osm/development/rehearsal_writer.py"
      - "scripts/run_rehearsal_writer_dev.py"
      - "scripts/validate_rehearsal_writer_dev.py"
      - "tests/test_rehearsal_writer_development.py"
      - "docs/REHEARSAL-WRITER-DEV-012.md"
      - ".github/workflows/rehearsal-writer-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test environment and CPU torch
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and check unused symbols
        run: |
          python -m py_compile src/tac_osm/development/rehearsal_writer.py scripts/run_rehearsal_writer_dev.py scripts/validate_rehearsal_writer_dev.py tests/test_rehearsal_writer_development.py
          ruff check --select F src/tac_osm/development/rehearsal_writer.py scripts/run_rehearsal_writer_dev.py scripts/validate_rehearsal_writer_dev.py tests/test_rehearsal_writer_development.py
      - name: Mechanism and opposite-past no-leakage tests
        run: python -m pytest tests/test_rehearsal_writer_development.py -q
      - name: Check growing test suite provenance
        run: python scripts/sync_test_count.py --check
      - name: Training smoke and identical-checkpoint replay
        run: |
          python scripts/run_rehearsal_writer_dev.py --smoke --output artifacts/DEV-012-SMOKE
          python scripts/validate_rehearsal_writer_dev.py artifacts/DEV-012-SMOKE
      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-012-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-012-SMOKE/
          if-no-files-found: warn

  three-seed-writer-development:
    needs: rehearsal-mechanism
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install train and replay dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Train matched writer objectives and validate saved predictions
        run: |
          python scripts/run_rehearsal_writer_dev.py --output artifacts/DEV-012
          python scripts/validate_rehearsal_writer_dev.py artifacts/DEV-012
      - name: Retain all 15 checkpoints and raw evaluation data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-012-RAW-NOT-CONFIRMATORY
          path: artifacts/DEV-012/
          if-no-files-found: error
