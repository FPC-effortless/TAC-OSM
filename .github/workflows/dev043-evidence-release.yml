name: DEV-043 durable audited development evidence
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/dev043-evidence-release.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publish-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch exact audited original evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FPC-effortless/TAC-OSM
        run: |
          mkdir -p artifacts
          gh api repos/FPC-effortless/TAC-OSM/actions/artifacts/12091453567/zip > artifacts/DEV-043-audited-original.zip
          printf '%s  %s\n' \
            b0d075b337b33069bf0a098f8c146a1ee29fb86812c9d9dd03377bf50ad7b7f7 \
            artifacts/DEV-043-audited-original.zip > artifacts/SHA256SUMS
          sha256sum -c artifacts/SHA256SUMS
          python - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('artifacts/DEV-043-audited-original.zip') as z:
              assert z.testzip() is None
              files=z.namelist()
              assert 'analysis/analysis.json' in files
              p=json.loads(z.read('analysis/analysis.json'))
              assert p['status']=='AUDITED_ADAPTIVE_DEVELOPMENT_NOT_CONFIRMATORY'
              assert {q['seed'] for q in p['per_seed']}=={4101,4102,4103}
              print('VERIFIED original 3-seed fit + separate audit')
          PY
      - name: Publish GitHub prerelease with immutable-by-hash original archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FPC-effortless/TAC-OSM
        run: |
          cat > artifacts/RELEASE-NOTES.md <<'TXT'
          DEV-043: Audited adaptive developmental evidence (NOT confirmatory).
          Registered protocol: research/dev043/protocol.json in PR #199.
          Original DEV-043 fit source: e9d7658aa99685630e8e6b3046d6d588f5553702.
          Original DEV-043 training run: https://github.com/FPC-effortless/TAC-OSM/actions/runs/39006497054
          Corrected original-evidence audit: https://github.com/FPC-effortless/TAC-OSM/actions/runs/39007536121
          Important: The original fit run had a failed numerical audit at a too-strict floating point replay threshold; a separate independently rerun audit of UNCHANGED seed outputs passed with full downstream decision and physical replay and maximum probability drift 1.1920928955078125e-7.
          Study conclusion: 0%/10%/50% head refits and monotone Platt/temperature calibrators did not beat last-event baseline cost or raise mature hard accuracy above 50%; exact public-history reference cost/entity 0.510417, trained MTSK 0.552083.
          Contains ORIGINAL unchanged per-seed heads.pt/checkpoints and per-seed reports plus separate analysis. No new writer training. GitHub prerelease can be deleted and is not a DOI-backed independent archival store.
          TXT
          if gh release view dev043-audited-evidence-2026-10-17 >/dev/null 2>&1; then
            gh release download dev043-audited-evidence-2026-10-17 --pattern 'DEV-043-audited-original.zip' --dir artifacts/verification
            cmp artifacts/DEV-043-audited-original.zip artifacts/verification/DEV-043-audited-original.zip
            echo 'Existing release preserved; byte-identical evidence'
          else
            gh release create dev043-audited-evidence-2026-10-17 \
              --target e9d7658aa99685630e6270533985f7d46 \
              --prerelease --title 'DEV-043 audited head transfer (development)' \
              --notes-file artifacts/RELEASE-NOTES.md \
              artifacts/DEV-043-audited-original.zip artifacts/SHA256SUMS
          fi
          gh release view dev043-audited-evidence-2026-10-17 --json tagName,url,assets
