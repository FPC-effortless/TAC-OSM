name: DEV-049 reliability engineering checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/dev049/**'
      - 'scripts/*dev049.py'
      - 'src/tac_osm/development/reliability_gate.py'
      - 'tests/test_reliability_gate_dev049.py'
      - '.github/workflows/dev049-reliability.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU research environment
        run: |
          python -m pip install -e . pytest==9.1.1 numpy==2.3.5 ruff==0.17.1
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check code and full regression
        run: |
          python -m ruff check --select F scripts/run_reliability_dev049.py scripts/audit_reliability_dev049.py src/tac_osm/development/reliability_gate.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
