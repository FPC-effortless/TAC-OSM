name: NATIVELATENT003 exact native trained memory transport on genuine FIT

on:
  push:
    branches:
      - research/native-latent-diagnosis-2026-10-27
    paths:
      - scripts/native_latent_003_operator_audit.py
      - .github/workflows/native-latent-003.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native003-original-trained-memory-transport-no-fit
  cancel-in-progress: false

jobs:
  checkpoint-original-memory-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: CPU-only original-native-source dependencies
        run: |
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Require earlier read-only authentic-source diagnostic evidence
        run: |
          test -s research/mathematical-engineering/nativelatent001/RESULTS.json
          test -s research/mathematical-engineering/nativelatent001/LOCALIZATION.json
          test ! -e research/mathematical-engineering/nativelatent001/TRANSFER.json
      - name: Original checkpoint/native numerical affine-memory difference transport
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/native_latent_003_operator_audit.py \
            --output research/mathematical-engineering/nativelatent001/TRANSFER.json
      - name: Preserve tested derived evidence on isolated diagnosis branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/native-latent-diagnosis-2026-10-27
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/nativelatent001/TRANSFER.json
          git commit -m "research: preserve original native trained FP32 memory operator transport"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: No new model, action or test promotion
        run: echo "Read-only original FIT checks; full neural precision and new intelligence gains OPEN."
