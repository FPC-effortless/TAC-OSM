name: DEV-056 deadline and DEV-057 recorded evidence
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/dev056/**'
      - 'research/dev057/**'
      - 'src/tac_osm/development/public_memory_deadline.py'
      - 'src/tac_osm/development/acquisition_controls.py'
      - 'scripts/*dev056.py'
      - 'scripts/*dev057.py'
      - 'tests/test_public_memory_dev056.py'
      - 'tests/test_acquisition_controls_dev057.py'
      - '.github/workflows/dev056-057-evidence.yml'
permissions:
  contents: read
jobs:
  recorded-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/veritas
          ref: b21d829b62d3cab2811e746267ca305e110ed004
          path: .veritas-public-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the recorded CPU research environment
        run: |
          python -m pip install -e . -e .veritas-public-runtime pytest==9.1.1 numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check boundaries, exact masking, filtering and acquisition controls
        run: python -m pytest tests/test_public_memory_dev056.py tests/test_acquisition_controls_dev057.py tests/test_learned_stack_dev055.py -q
      - name: Verify archive hashes
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          for study in ('dev056','dev057'):
              root=pathlib.Path('research')/study
              index=json.loads((root/'evidence-index.json').read_text())
              assert hashlib.sha256((root/'evidence.tar.gz').read_bytes()).hexdigest()==index['sha256']
          PY
      - name: Restore all recorded artifacts without retraining
        run: |
          mkdir -p results
          tar -xzf research/dev056/evidence.tar.gz -C results
          tar -xzf research/dev057/evidence.tar.gz -C results
      - name: Replay every trained checkpoint and native physical trajectory
        run: python scripts/audit_public_memory_dev056.py --directory results/dev056-main --output results/dev056-ci-audit.json --veritas-root .veritas-public-runtime
      - name: Reproduce every acquisition-control cell
        run: python scripts/run_acquisition_controls_dev057.py --output results/dev057-main --audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV056-057-RECORDED-EVIDENCE-REPLAY
          path: |
            results/dev056-ci-audit.json
            results/dev057-main/audit.json
          if-no-files-found: warn
