name: S1MOTION006 read-only six original trained Coffee checkpoints
on:
  push:
    branches: [research/s1motion006-velocity-event-ablation-2026-10-26]
    paths: ['research/parallel-six/S1MOTION006-REPLAY-*.marker']
permissions:
  contents: read
  actions: read
jobs:
  original-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m py_compile scripts/s1motion006_original_cold_replay.py
      - run: |
          gh run download 40290076035 --repo FPC-effortless/TAC-OSM \
            --name s1motion006-original-first-real-coffee-6-trained-models \
            --dir /tmp/s1motion006-original-checkpoints
      - run: |
          FILE="$(find /tmp/s1motion006-original-checkpoints -name BEFORE-DEV-FREEZE.json -print -quit)"
          test -n "$FILE"
          PYTHONPATH=src:. python scripts/s1motion006_original_cold_replay.py \
            --original-dir "$(dirname "$FILE")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1motion006-original-six-verified-no-fit-replay
          path: research/diagnostics/s1motion006-cold-replay/**
          if-no-files-found: warn
          retention-days: 90
