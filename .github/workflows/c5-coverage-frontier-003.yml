name: C5 coverage frontier 003

on:
  push:
    branches: [research/c5-coverage-frontier-003]
    paths:
      - "src/tac_osm/**"
      - "tests/**"
      - "scripts/run_c5_coverage_frontier_003.py"
      - "docs/TACOSM-C5-COVERAGE-FRONTIER-003.md"
      - "contracts/TACOSM-C5-COVERAGE-FRONTIER-003.json"
      - ".github/workflows/c5-coverage-frontier-003.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: TACOSM-C5-COVERAGE-FRONTIER-003 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Preconditions
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest ruff
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
          python -m ruff check --select F821 scripts/run_c5_coverage_frontier_003.py
          python -m py_compile scripts/run_c5_coverage_frontier_003.py
      - name: Registered smoke
        run: |
          mkdir -p artifacts
          python scripts/run_c5_coverage_frontier_003.py --smoke > artifacts/TACOSM-C5-COVERAGE-FRONTIER-003.smoke.stdout.json
          cat artifacts/TACOSM-C5-COVERAGE-FRONTIER-003.smoke.stdout.json
      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-C5-COVERAGE-FRONTIER-003-smoke
          path: artifacts/
          if-no-files-found: error

  full:
    name: TACOSM-C5-COVERAGE-FRONTIER-003 full
    if: contains(github.event.head_commit.message, '[run-c5-frontier3-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Preconditions
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest ruff
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
          python -m ruff check --select F821 scripts/run_c5_coverage_frontier_003.py
          python -m py_compile scripts/run_c5_coverage_frontier_003.py
      - name: Full registered measurement
        run: |
          mkdir -p artifacts
          python scripts/run_c5_coverage_frontier_003.py > artifacts/TACOSM-C5-COVERAGE-FRONTIER-003.json
          cat artifacts/TACOSM-C5-COVERAGE-FRONTIER-003.json
      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-C5-COVERAGE-FRONTIER-003-full
          path: artifacts/TACOSM-C5-COVERAGE-FRONTIER-003.json
          if-no-files-found: error
