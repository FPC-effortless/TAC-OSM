name: ME054 actual stable physical TAC versus GRU real robot training
on:
  workflow_dispatch:
    inputs:
      allow_new_fits:
        description: Explicit opt-in; current live gates remain compulsory
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: me054-genuine-robot-physical-training-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  original-mathematical-and-source-preflight:
    # Retained historical lane; current live guards still reject incompatible new fits.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_new_fits == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATEN_CPU_CAPABILITY: avx2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned CPU-only source/architecture guard environment
        run: |
          python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact zero-error no-op, bounded recurrent memory, identity head and equal trainable parameters
        run: |
          python -m py_compile src/tac_osm/real_robot_me054_stable.py scripts/me054_train_real_stable_robot.py
          PYTHONPATH=src python -m pytest -q tests/test_me054_stable_robot_world_models.py
      - name: Enforce original actual robot source registration and equal 600 updates
        run: |
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me054/FAIR_COMPARISON.json --phase preflight
  actual-original-physical-world-model-training:
    # Retained historical lane; current live guards still reject incompatible new fits.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_new_fits == true }}
    needs: original-mathematical-and-source-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install original pinned PyTorch and genuine publisher source reader
        run: |
          python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Train FIVE real native TAC and FIVE real GRU physical world models, source-check every genuine FIT file first
        run: |
          set -o pipefail
          PYTHONPATH=src python -m scripts.me054_train_real_stable_robot --output results/me054 | tee me054-original-authentic-physics-training.log
      - name: Verify all genuinely trained model records and original source-matched budgets
        run: |
          python scripts/validate_research_parity.py --manifest results/me054/FAIR_COMPARISON_FINAL.json --phase final
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/me054/results.json').read_text())
          assert x['status']=='TEN_TRAINED_REAL_MODELS_AND_DEVELOPMENTAL_REAL_WORLD_SCORES_COMPLETE'
          assert len(x['actual_trained_checkpoints'])==10
          assert x['original_FIT_episode_count']==325
          assert x['all_original_checkpoints_frozen_before_heldout']
          assert x['original_TEST_already_exposed_so_independent_generalization_claim'] is False
          assert x['model_parameters']=={'native_tac':37985,'gru_world':38295}
          assert set(x['TEST_original_real_physical_predictions'])=={
              f'{arch}-s{seed}' for arch in ('native_tac','gru_world')
              for seed in (52001,52002,52003,52004,52005)}
          print('ME054_TEN_GENUINELY_TRAINED_PHYSICS_MODELS_AND_ACTUAL_ROBOT_SCORES_VERIFIED')
          PY
      - name: Archive model weights, original source SHA and genuine physical outcome scores, NEVER raw source observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me054-stable-original-robot-ten-trained-models-real-world-predictions
          path: |
            results/me054/results.json
            results/me054/FAIR_COMPARISON_FINAL.json
            results/me054/*-s*/
            me054-original-authentic-physics-training.log
          if-no-files-found: ignore
          retention-days: 90
