name: ME056 authentic concept-swarm CED vs GRU, real robot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/tac_osm/concept_swarm_ced.py
      - src/tac_osm/real_robot_me056_concept.py
      - scripts/me056_train_real_robot_concept.py
      - research/mathematical-engineering/me056/**
      - tests/test_me056_real_robot_concept.py
      - .github/workflows/me056-real-robot-concept.yml

permissions:
  contents: read

concurrency:
  group: me056-concept-real-robot
  cancel-in-progress: true

jobs:
  mechanistic-and-policy-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU torch and source/test reader
        run: |
          python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify original concept model, real robot adapter and research script importability
        run: |
          python -m py_compile src/tac_osm/concept_swarm_ced.py src/tac_osm/real_robot_me056_concept.py scripts/me056_train_real_robot_concept.py
          PYTHONPATH=src python -m pytest -q tests/test_concept_swarm_ced.py tests/test_me056_real_robot_concept.py
      - name: Enforce frozen parameter, real source, equal training/data budget registration
        run: |
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me056/FAIR_COMPARISON.json --phase preflight
          PYTHONPATH=src python - <<'PY'
          import json
          from tac_osm.real_robot_me056_concept import RealRobotConceptCED,MatchedStableRobotGRU,count_active,nearest_real_gru_width
          plan=json.load(open('research/mathematical-engineering/me056/FAIR_COMPARISON.json'))
          scale=[.03]*14
          found={'native_tac':count_active(RealRobotConceptCED(scale)),
                 'gru_world':count_active(MatchedStableRobotGRU(scale,44))}
          assert found==plan['parameter_counts'],(found,plan['parameter_counts'])
          survey=nearest_real_gru_width(scale)
          assert survey['gru_width']==44 and survey['relative_gap']<=.01,survey
          print('ME056_FROZEN_MODEL_CAPACITY',found,survey)
          PY

  original-robot-FIT-source-profile-and-real-training:
    needs: mechanistic-and-policy-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned original CPU source and model environment
        run: |
          python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Source-check original FIT; measure authentic update FLOPs; STOP if unmatched, else train five full concept CED and five full GRU world models
        run: |
          set -o pipefail
          PYTHONPATH=src python -m scripts.me056_train_real_robot_concept --output results/me056 | tee me056-genuine-original-robot-training.log
      - name: Audit original source-backed training receipts and frozen checkpoints
        run: |
          python scripts/validate_research_parity.py --manifest results/me056/FAIR_COMPARISON_FINAL.json --phase final
          python - <<'PY'
          import json
          x=json.load(open('results/me056/results.json'))
          assert x['study']=='ME056_CONCEPT_SWARM_CED_REAL_ORIGINAL_ROBOT'
          assert x['original_FIT_episode_count']==325
          assert len(x['actual_trained_checkpoints'])==10
          assert x['all_original_checkpoints_frozen_before_heldout']
          assert x['model_parameters']=={'native_tac':45822,'gru_world':45995}
          assert x['robot_TEST_already_seen_is_only_developmental']
          assert x['exact_whole_training_FLOP_parity_certified'] is False
          print('ME056_TEN_REAL_TRAINED_MODELS_ONLY_DEVELOPMENTAL_RESULTS')
          PY
      - name: Preserve original prefit stop receipt, actual real trained checkpoints and source-backed scores; NEVER raw publisher records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me056-original-robot-concept-ced-real-source-profile-and-trained-results
          path: |
            results/me056/ME056_REAL_PREFIT.json
            results/me056/results.json
            results/me056/FAIR_COMPARISON_FINAL.json
            results/me056/*-s*/
            me056-genuine-original-robot-training.log
          if-no-files-found: ignore
          retention-days: 90
