name: S1TEMP006 first original real H512 memory comparison
on:
  push:
    branches: [research/s1temp006-fixed-state-slow-memory-2026-10-26]
    paths: ['research/parallel-six/S1TEMP006-FIT-001.marker']
permissions:
  contents: read
jobs:
  original-long-history:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate fixed-state memory source, matched-parameter graph and optimizer
        run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1temp006_real_source_prefit -v
          PYTHONPATH=src:. python -m unittest tests.test_s1temp006_persistent_slow -v
      - name: Six original 1500-frame real fits and paired H128/H512 DEV after SHA freeze
        run: PYTHONPATH=src:. python -u scripts/s1temp006_real_long_history_fit.py
      - name: Freeze full original optimizer RNG model and source-linked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1temp006-original-real-512-history-6-checkpoints
          path: research/diagnostics/s1temp006-original/**
          if-no-files-found: warn
          retention-days: 90
