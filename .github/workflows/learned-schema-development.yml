name: DEV-017 learned schema, causal memory and cost (development only)
on:
  pull_request:
    paths:
      - "src/tac_osm/development/schema_maintenance.py"
      - "src/tac_osm/development/learned_schema_state.py"
      - "scripts/run_learned_schema_dev.py"
      - "scripts/audit_learned_schema_dev.py"
      - "tests/test_schema_maintenance_environment.py"
      - "tests/test_learned_schema_state.py"
      - "contracts/DEV-017.json"
      - ".github/workflows/learned-schema-development.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gates-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Source, all regression tests and canonical contract/count
        run: |
          ruff check --select F src/tac_osm/development/schema_maintenance.py src/tac_osm/development/learned_schema_state.py scripts/run_learned_schema_dev.py scripts/audit_learned_schema_dev.py tests/test_schema_maintenance_environment.py tests/test_learned_schema_state.py
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
      - name: Six-arm smoke with complete forecast and sensing/cost replay
        run: |
          python scripts/run_learned_schema_dev.py --seed 43 --smoke --output artifacts/DEV-017-SMOKE
          python scripts/run_learned_schema_dev.py --seed 43 --smoke --replay --output artifacts/DEV-017-SMOKE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-017-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-017-SMOKE/
          if-no-files-found: warn
  three-seed:
    needs: gates-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [43, 59, 71]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fixed matched updates, native forecasts and action-selected observations
        run: |
          python scripts/run_learned_schema_dev.py --seed ${{ matrix.seed }} --output artifacts/DEV-017-seed${{ matrix.seed }}
          python scripts/run_learned_schema_dev.py --seed ${{ matrix.seed }} --replay --output artifacts/DEV-017-seed${{ matrix.seed }}
      - name: Print compact seed evidence
        run: cat artifacts/DEV-017-seed${{ matrix.seed }}/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-017-RAW-seed${{ matrix.seed }}-NOT-CONFIRMATORY
          path: artifacts/DEV-017-seed${{ matrix.seed }}/
          if-no-files-found: warn
  independent-audit:
    needs: three-seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV-017-RAW-seed*-NOT-CONFIRMATORY
          path: artifacts/DEV-017-evidence
      - name: Recompute targets, physical costs, sensing choices and all scientific gates
        run: python scripts/audit_learned_schema_dev.py artifacts/DEV-017-evidence/DEV-017-RAW-seed43-NOT-CONFIRMATORY artifacts/DEV-017-evidence/DEV-017-RAW-seed59-NOT-CONFIRMATORY artifacts/DEV-017-evidence/DEV-017-RAW-seed71-NOT-CONFIRMATORY --output artifacts/DEV-017-evidence/analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-017-COMPLETE-AUDITED-EVIDENCE-NOT-CONFIRMATORY
          path: artifacts/DEV-017-evidence/
          if-no-files-found: error
