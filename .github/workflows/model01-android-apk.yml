name: Frozen Model01 and TAC ME111 offline Android APK (NO PHYSICAL DEVICE)
on:
  push:
    branches:
      - product/tac-neural-android-local-runtime-20261028
    paths:
      - 'mobile/android/model01/**'
      - 'tests/test_me111_android_contract.py'
      - 'tests/test_me111_android_state_codec.py'
      - 'scripts/create_me111_android_host_fixture.py'
      - 'scripts/verify_me111_256step_cpu.py'
      - 'scripts/create_me111_android_256step_fixture.py'
      - '.github/workflows/model01-android-apk.yml'
  pull_request:
    paths:
      - 'mobile/android/model01/**'
      - 'tests/test_me111_android_contract.py'
      - 'tests/test_me111_android_state_codec.py'
      - '.github/workflows/model01-android-apk.yml'
  workflow_dispatch:
# Cancel obsolete same-branch emulator builds to avoid repeated paid/CI CPU usage.
concurrency:
  group: me111-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frozen-original-models-offline-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pin original ME111 training/replay/source and validated ONNX exporter
        uses: actions/checkout@v4
        with:
          ref: 3fc2fbe8e4974491349caecd8d6171e738810b54
          path: pinned-me111
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned CPU no-fit ONNX export dependencies
        run: |
          pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy==2.3.5' 'onnx==1.19.1' 'onnxruntime==1.23.2'
      - name: Recreate frozen original 104663-parameter TAC ONNX and CPU state parity
        run: |
          PYTHONPATH=pinned-me111/src:pinned-me111 python pinned-me111/scripts/probe_me111_offline_onnx.py --out-dir /tmp/frozen-me111
          test -s /tmp/frozen-me111/ME111_ONE_STEP_EXPLORATORY.onnx
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path('/tmp/frozen-me111/ME111_ONE_STEP_EXPLORATORY.onnx')
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest=='dd65519a9e4f3388966538af53119b56e9292b46a9209d63ad4927b87f0a176b', digest
          print('FROZEN_ME111_SHA256=PASS')
          PY
          mkdir -p mobile/android/model01/sample-app/app/src/main/assets
          cp /tmp/frozen-me111/ME111_ONE_STEP_EXPLORATORY.onnx mobile/android/model01/sample-app/app/src/main/assets/tac_me111.onnx
      - name: Verify 256-event original PyTorch vs ONNX state/forecast parity
        run: |
          python scripts/verify_me111_256step_cpu.py \
            --source-root pinned-me111 \
            --onnx /tmp/frozen-me111/ME111_ONE_STEP_EXPLORATORY.onnx \
            --receipt /tmp/me111-256step-host-parity.json
      - name: Preserve full long-stream parity evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me111-256step-original-pytorch-onnx-cpu-diagnostic
          path: /tmp/me111-256step-host-parity.json
          if-no-files-found: warn
          retention-days: 14
      - name: Generate original PyTorch two-step constructed reference for Android JNI parity
        run: |
          python scripts/create_me111_android_host_fixture.py \
            --source-root pinned-me111 \
            --output mobile/android/model01/sample-app/app/src/main/assets/me111_reference_vectors.json
      - name: Generate 2-owner 256-event original PyTorch Android JNI oracle
        run: |
          python scripts/create_me111_android_256step_fixture.py \
            --source-root pinned-me111 \
            --output mobile/android/model01/sample-app/app/src/androidTest/assets/me111_256_reference_vectors.json
      - name: Verify host JVM input/state guards and SHA256 state codec negatives
        run: python -m unittest discover -s tests -p 'test_me111_android*.py' -v
      - name: Verify preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed
      - name: Install Android SDK platform/build tools (build only)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android APK with real ONNX Runtime AAR and frozen TAC bytes
        run: gradle -p mobile/android/model01/sample-app :app:assembleDebug --no-daemon
      - name: Compile Android instrumentation APK before starting emulator
        run: gradle -p mobile/android/model01/sample-app :app:assembleDebugAndroidTest --no-daemon
      - name: Verify merged Android permissions and packaged native graph/runtime
        run: |
          APK=mobile/android/model01/sample-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/me111-android-permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/me111-android-permissions.txt; then
            echo 'OFFLINE_APK_PERMISSION=FAIL'
            exit 2
          fi
          python - "$APK" <<'PY'
          import hashlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              graph=z.read('assets/tac_me111.onnx')
              digest=hashlib.sha256(graph).hexdigest()
              assert digest=='dd65519a9e4f3388966538af53119b56e9292b46a9209d63ad4927b87f0a176b',digest
              libs=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('/libonnxruntime.so')]
              assert libs, 'native ONNX runtime CPU library not packaged'
              print('PACKAGED_FROZEN_ONNX=SHA256_PASS; ONNX_NATIVE_ABIS='+repr(libs))
          PY
          echo 'APK_OFFLINE_STATIC_PACKAGE=PASS; AIRPLANE_MODE=NOT_RUN'
      - name: Preserve installable but unqualified debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tac-me111-android-local-cpu-unqualified-debug
          path: mobile/android/model01/sample-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Enable KVM acceleration on GitHub Linux runner
        run: |
          if [ ! -c /dev/kvm ]; then
            echo 'ANDROID_EMULATOR_KVM=BLOCKED_DEVICE_MISSING'
            exit 2
          fi
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
          # Emulator executable is installed LATER by android-emulator-runner;
          # invoking it here on a fresh runner caused an exit-127 infrastructure error.
          echo 'ANDROID_EMULATOR_KVM_DEVICE_PERMISSIONS=PASS_NOT_EMULATOR_BOOT_EVIDENCE'
      - name: Exercise actual Android ONNX JNI and local state on emulator only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 2048
          # Emulator tests only; physical benchmark class requires real hardware.
          # Only emulator tests; physical-only benchmarking remains explicitly excluded.
          script: |
            set -eu
            gradle -p mobile/android/model01/sample-app :app:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=org.tacosm.mobile.me111.Me111LocalRuntimeAndroidTest,org.tacosm.mobile.me111.Me111LongStreamAndroidTest
            APP=org.tacosm.mobile.model01.demo
            adb shell am instrument -w -e class org.tacosm.mobile.me111.Me111ProcessSeedAndroidTest "${APP}.test/androidx.test.runner.AndroidJUnitRunner" | tee /tmp/me111-process-seed.txt
            grep -q 'OK (1 test)' /tmp/me111-process-seed.txt
            adb shell am force-stop "$APP"
            adb shell am instrument -w -e class org.tacosm.mobile.me111.Me111ProcessRestoreAndroidTest "${APP}.test/androidx.test.runner.AndroidJUnitRunner" | tee /tmp/me111-process-restore.txt
            grep -q 'OK (1 test)' /tmp/me111-process-restore.txt
            echo 'ME111_ANDROID_PROCESS_RESTART=2_FRESH_INSTRUMENTATION_TESTS_PASS_NOT_PHYSICAL_PHONE'
      - name: Preserve Android instrumentation and emulator diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: me111-android-emulator-jni-test-evidence
          path: |
            mobile/android/model01/sample-app/app/build/outputs/androidTest-results/connected/**
            mobile/android/model01/sample-app/app/build/reports/androidTests/connected/**
            /tmp/me111-process-seed.txt
            /tmp/me111-process-restore.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Truthful hardware/science gate
        if: always()
        run: |
          echo 'PHYSICAL_ANDROID=NOT_RUN'
          echo 'ANDROID_REAL_DEVICE_ONNX_EXECUTION=NOT_RUN'
          echo 'ANDROID_EMULATOR_JNI=CHECK_STEP_CONCLUSION_NOT_PHYSICAL'
          echo 'AIRPLANE_MODE=NOT_RUN'
          echo 'P50_P95_RAM_ENERGY=NOT_RUN'
          echo 'RESTART_ON_PHONE=NOT_RUN'
          echo 'ME111_INDEPENDENT_SCIENTIFIC_GATE=FAIL_MIXED_TRADEOFF'
