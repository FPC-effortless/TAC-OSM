name: LANGMEMORY056 original-source fixed-byte key retention diagnostic
on:
  pull_request:
    paths:
      - 'scripts/langmemory056_key_priority.py'
      - 'tests/test_langmemory056_key_priority.py'
      - 'research/mathematical-engineering/langmemory056/**'
      - 'research/phone_queue/langmemory056.json'
      - '.github/workflows/langmemory056.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-key-residency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet numpy==2.3.5 pytest==8.4.2
      - name: Frozen original-source and compute gates, constructed causality tests
        run: |
          mkdir -p langmemory056-evidence
          python scripts/phone_lab.py plan research/phone_queue/langmemory056.json > langmemory056-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langmemory056/FAIR_COMPARISON.json --phase preflight > langmemory056-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langmemory056_key_priority.py
      - name: Original publisher FIT positions, priority vs original byte-matched controls
        run: |
          PYTHONPATH=src:. python scripts/langmemory056_key_priority.py --output langmemory056-evidence/RESULTS.json
          python - <<'PY'
          import json
          r=json.load(open('langmemory056-evidence/RESULTS.json'))
          assert r['training_updates']==0 and r['gpu_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          assert r['cohorts']['8192']['original_positions']==11784
          assert r['cohorts']['8192']['arms']['raw_1344']['correct']==4152
          assert r['cohorts']['8192']['arms']['k1_lru_1344']['correct']==2148
          assert all(all(a['queries']==row['original_positions'] for a in row['arms'].values()) for row in r['cohorts'].values())
          print({h:{k:{'correct':v['correct'],'covered':v['covered']}
                 for k,v in rows['arms'].items()}
                 for h,rows in r['cohorts'].items()})
          PY
      - name: Archive original-source run and failures without model promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGMEMORY056-authentic-FIT-key-priority-no-fit
          path: langmemory056-evidence/
          retention-days: 90
          if-no-files-found: warn
