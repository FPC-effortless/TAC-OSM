name: DEV-026 frozen checkpoint cross-evaluation (development)
on:
  pull_request:
    types: [opened]
    paths:
      - 'scripts/*dev026*'
      - 'tests/test_dev026_cross_eval.py'
      - 'development_protocols/DEV-026-FROZEN-CROSS-EVAL.json'
      - '.github/workflows/dev026-frozen-cross-eval.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet --timeout 60 --retries 3 -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet --timeout 60 --retries 3 torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          ruff check --select F scripts/*dev026* tests/test_dev026*.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
  diagonal-evaluation:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cohort: DEV023, regime: short, run_id: 38839933638, artifact: DEV-023-COMPLETE-AUDITED-NOT-CONFIRMATORY}
          - {cohort: DEV023, regime: long, run_id: 38839933638, artifact: DEV-023-COMPLETE-AUDITED-NOT-CONFIRMATORY}
          - {cohort: DEV024, regime: short, run_id: 38890378185, artifact: DEV-024-COMPLETE-AUDITED-NOT-CONFIRMATORY}
          - {cohort: DEV024, regime: long, run_id: 38890378185, artifact: DEV-024-COMPLETE-AUDITED-NOT-CONFIRMATORY}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet --timeout 60 --retries 3 -e . numpy==2.3.3
          python -m pip install --quiet --timeout 60 --retries 3 torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run_id }}
          name: ${{ matrix.artifact }}
          path: parents
      - run: python scripts/run_dev026_cross_eval.py --cohort ${{ matrix.cohort }} --regime ${{ matrix.regime }} --parents parents --output results --phase diagonal
      - if: success() || failure()
        run: python scripts/run_dev026_cross_eval.py --cohort ${{ matrix.cohort }} --regime ${{ matrix.regime }} --parents parents --output results --phase diagonal --replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-026-DIAGONAL-${{ matrix.cohort }}-${{ matrix.regime }}
          path: results/
          if-no-files-found: error
  diagonal-audit:
    needs: diagonal-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV-026-DIAGONAL-*
          path: diagonals
      - run: python scripts/audit_dev026_cross_eval.py diagonals/*/*/grid-* --diagonals-only --output diagonal_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-026-DIAGONALS-AUDITED
          path: diagonal_summary.json
  cross-evaluation:
    needs: diagonal-audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cohort: DEV023, regime: short, run_id: 38839933638, artifact: DEV-023-COMPLETE-AUDITED-NOT-CONFIRMATORY}
          - {cohort: DEV023, regime: long, run_id: 38839933638, artifact: DEV-023-COMPLETE-AUDITED-NOT-CONFIRMATORY}
          - {cohort: DEV024, regime: short, run_id: 38890378185, artifact: DEV-024-COMPLETE-AUDITED-NOT-CONFIRMATORY}
          - {cohort: DEV024, regime: long, run_id: 38890378185, artifact: DEV-024-COMPLETE-AUDITED-NOT-CONFIRMATORY}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet --timeout 60 --retries 3 -e . numpy==2.3.3
          python -m pip install --quiet --timeout 60 --retries 3 torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run_id }}
          name: ${{ matrix.artifact }}
          path: parents
      - uses: actions/download-artifact@v4
        with:
          name: DEV-026-DIAGONALS-AUDITED
          path: gate
      - run: python scripts/run_dev026_cross_eval.py --cohort ${{ matrix.cohort }} --regime ${{ matrix.regime }} --parents parents --output results --phase cross --certificate gate/diagonal_summary.json
      - run: python scripts/run_dev026_cross_eval.py --cohort ${{ matrix.cohort }} --regime ${{ matrix.regime }} --parents parents --output results --phase cross --certificate gate/diagonal_summary.json --replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-026-CROSS-${{ matrix.cohort }}-${{ matrix.regime }}
          path: results/
          if-no-files-found: error
  independent-audit:
    needs: cross-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV-026-*
          path: evidence
      - run: python scripts/audit_dev026_cross_eval.py evidence/*/*/grid-* --certificate evidence/DEV-026-DIAGONALS-AUDITED/diagonal_summary.json --output evidence/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-026-COMPLETE-AUDITED-NOT-CONFIRMATORY
          path: evidence/
