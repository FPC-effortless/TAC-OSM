name: Legacy AXON StructMeans SECA phase 2 provenance lane

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-only:
    name: Preserve historical lane without executing obsolete runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assert no obsolete measurement is executed
        run: |
          test ! -f scripts/run_axon_structmeans_seca_002.py
          echo "AXON/StructMeans/SECA phase-2 runner is not present on current master; historical lane remains provenance-only."
