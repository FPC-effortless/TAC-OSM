name: Research AXON StructMeans SECA phase 2

on:
  push:
    branches:
      - validation/operator-learning-phase2-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Full repository suite
        run: python -m pytest tests/ -q
      - name: Run AXON StructMeans SECA phase 2
        run: python scripts/run_axon_structmeans_seca_002.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-AXON-STRUCTMEANS-SECA-002
          path: artifacts/TACOSM-AXON-STRUCTMEANS-SECA-002.json
          if-no-files-found: error
