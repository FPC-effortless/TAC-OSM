name: ME066 independent once-frozen original real robot four-arm scoring and score replay
on:
  pull_request:
    paths:
      - 'scripts/me066_score_frozen.py'
      - 'scripts/me066_validate_numeric_replay.py'
      - '.github/workflows/me066-score-frozen.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: me066-once-only-new-untouched-task-original-real-outcome-scoring
  cancel-in-progress: false
jobs:
  frozen-original-four-arm-real-outcome-evaluation:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}",persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Fail closed unless all twenty original trained Git checkpoints were independently replayed
        run: |
          test -f research/mathematical-engineering/me066/TASK_LEVEL_SPLIT.json
          test -f research/mathematical-engineering/me066/FAIR_COMPARISON.json
          test -f research/replay-bundles/ME066/TRAINING_RESULT.json
          test -f research/replay-bundles/ME066/CLEAN_CHECKOUT_MODEL_REPLAY.json
          PYTHONPATH=src:. python scripts/me066_verify_repo_checkpoints.py
      - name: First original real CAL plus metadata-frozen unseen charger task scoring; no refit
        run: |
          if [ -f research/replay-bundles/ME066/REAL_WORLD_EVALUATION_SUMMARY.json ]; then
            echo 'This original real task is already scored; never overwrite first frozen output'
            test -f research/replay-bundles/ME066/ORIGINAL_SOURCE_CAL_SCORES.json
            test -f research/replay-bundles/ME066/ORIGINAL_UNTOUCHED_TASK_SCORES.json
          else
            PYTHONPATH=src:. python scripts/me066_score_frozen.py \
              --cache "${{ runner.temp }}/me066-frozen-original-publisher-data"
          fi
      - name: Commit first real original physical outcomes and full source/target score evidence to Git
        if: always()
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in research/replay-bundles/ME066/ORIGINAL_SOURCE_CAL_SCORES.json research/replay-bundles/ME066/ORIGINAL_UNTOUCHED_TASK_SCORES.json research/replay-bundles/ME066/REAL_WORLD_EVALUATION_SUMMARY.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me066): original real 20-model leave-one-task-out physical scores and honest scientific gate'
            for attempt in 1 2 3 4 5; do
              git fetch origin "$PUSH_BRANCH"
              git rebase "origin/$PUSH_BRANCH"
              if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
  independent-four-arm-original-real-score-reproduction:
    needs: frozen-original-four-arm-real-outcome-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}",clean: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Independently replay original 20 trained model weights and bytes without original source or target access
        run: PYTHONPATH=src:. python scripts/me066_verify_repo_checkpoints.py
      - name: Independently recompute all original publisher physical trajectories without weight training
        env: {ME066_RESULT_DIRECTORY: "${{ runner.temp }}/me066-computed-original-score-JSON"}
        run: |
          test -f research/replay-bundles/ME066/ORIGINAL_UNTOUCHED_TASK_SCORES.json
          test -f research/replay-bundles/ME066/ORIGINAL_SOURCE_CAL_SCORES.json
          test -f research/replay-bundles/ME066/REAL_WORLD_EVALUATION_SUMMARY.json
          PYTHONPATH=src:. python scripts/me066_score_frozen.py \
            --cache "${{ runner.temp }}/me066-independent-publisher-cache"
          PYTHONPATH=src:. python scripts/me066_validate_numeric_replay.py \
            --published research/replay-bundles/ME066 \
            --recomputed "${{ runner.temp }}/me066-computed-original-score-JSON" \
            --receipt research/replay-bundles/ME066/EVALUATION_REPLAY_RECEIPT.json
      - name: Commit strict identity and numeric tolerance replay to Git; preserve all negative results
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/replay-bundles/ME066/EVALUATION_REPLAY_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me066): independent original real four-arm physical score numerical replay'
            for attempt in 1 2 3 4 5; do
              git fetch origin "$PUSH_BRANCH"
              git rebase "origin/$PUSH_BRANCH"
              if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
