name: LANGCAP105-EVAL01 frozen held-out code scoring (zero training)
on:
  push:
    branches:
      - research/langcap105-eval01-heldout-2026-10-31
    paths:
      - 'research/langcap105_eval01/**'
      - '.github/workflows/langcap105-eval01.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: langcap105-eval01-${{ github.ref }}
  cancel-in-progress: false
env:
  EVALUATOR_COMMIT: ${{ github.sha }}
jobs:
  prepare-authentic-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.registration.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime for evaluator falsifiers
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.5'
      - name: Check frozen postfit registration and metric/cohort falsifiers
        id: registration
        run: |
          python -m unittest discover -s research/langcap105_eval01 -p 'test_eval.py' -v
          python - <<'PY'
          import sys,json,os
          sys.path.insert(0,'research/langcap105_eval01')
          from common import load_plan,REGISTRATION_COMMIT
          p=load_plan()
          rows=[{'scale':r['scale'],'arm':r['arm'],'seed':r['seed']} for r in p['checkpoint_locks']]
          rows.sort(key=lambda r:({'small':0,'medium':1}[r['scale']],r['arm'],r['seed']))
          assert len(rows)==18
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          print({'registration_commit':REGISTRATION_COMMIT,'planned_frozen_models':len(rows),'optimizer_updates':0})
          PY
      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: 60403a5409ff2c3f3b07dd2ca91a7a3e096839c7
          path: ci-input/cpython
          fetch-depth: 1
          persist-credentials: false
      - name: Reauthenticate original publisher files, licenses and disjoint groups
        run: python research/langcap103/source.py --source-dir ci-input/cpython --out ci-artifacts/eval01-source
      - uses: actions/upload-artifact@v4
        with:
          name: LANGCAP105-EVAL01-authentic-corpus
          path: ci-artifacts/eval01-source/
          if-no-files-found: error
          retention-days: 30
  frozen-evaluation:
    needs: prepare-authentic-corpus
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare-authentic-corpus.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU inference runtime
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.5'
      - uses: actions/download-artifact@v4
        with:
          name: LANGCAP105-EVAL01-authentic-corpus
          path: ci-input/corpus
      - name: Read only the original fixed trained artifact
        uses: actions/download-artifact@v4
        with:
          name: LANGCAP105-fit-${{ matrix.scale }}-${{ matrix.arm }}-${{ matrix.seed }}
          run-id: 41229365510
          github-token: ${{ github.token }}
          path: ci-input/checkpoint
      - name: Score original initialization, frozen final DEV and actually-seen FIT reference
        run: |
          python research/langcap105_eval01/evaluate.py \
            --source-receipt ci-input/corpus/SOURCE_RECEIPT.json --corpus ci-input/corpus/corpus.tar \
            --checkpoint ci-input/checkpoint/TRAINED.pt \
            --scale '${{ matrix.scale }}' --arm '${{ matrix.arm }}' --seed ${{ matrix.seed }} \
            --output ci-artifacts/eval01-result
      - name: Preserve all valid, partial and failed inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGCAP105-EVAL01-score-${{ matrix.scale }}-${{ matrix.arm }}-${{ matrix.seed }}
          path: ci-artifacts/eval01-result/
          if-no-files-found: warn
          retention-days: 90
  collect-all-seeds:
    needs: [prepare-authentic-corpus, frozen-evaluation]
    if: always() && needs.prepare-authentic-corpus.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5'
      - uses: actions/download-artifact@v4
        with:
          pattern: LANGCAP105-EVAL01-score-*
          path: ci-input/results
      - name: Retain original run identities and all individual results before aggregation
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,pathlib,shutil
          out=pathlib.Path('ci-artifacts/eval01-summary');out.mkdir(parents=True)
          shutil.copytree('ci-input/results',out/'individual-results')
          for name in ('EVAL_PROTOCOL.json','PHONE_PLAN.json','FIT_SOURCE_SMOKE.json'):
              shutil.copyfile(pathlib.Path('research/langcap105_eval01')/name,out/name)
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/artifacts?per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as f:a=json.load(f)['artifacts']
          info={'evaluation_run':int(os.environ['GITHUB_RUN_ID']),'evaluator_commit':os.environ['EVALUATOR_COMMIT'],
                'original_training_run':41229365510,'optimizer_updates':0,
                'artifacts':[{k:r.get(k) for k in ('id','name','digest','size_in_bytes','expires_at')} for r in a]}
          (out/'RUN_PROVENANCE.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
      - name: Require all eighteen fixed checkpoints and publish every seed with paired uncertainty
        run: >-
          python research/langcap105_eval01/aggregate.py --results ci-input/results
          --output ci-artifacts/eval01-summary/metrics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGCAP105-EVAL01-final-evidence
          path: ci-artifacts/eval01-summary/
          if-no-files-found: error
          retention-days: 90
