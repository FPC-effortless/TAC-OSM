name: S1TEMP006 persistent finite-state temporal memory contract
on:
  push:
    branches: [research/s1temp006-fixed-state-slow-memory-2026-10-26]
    paths:
      - 'src/tac_osm/variants/s1temp006_persistent_slow.py'
      - 'tests/test_s1temp006_persistent_slow.py'
      - '.github/workflows/s1temp006-contract.yml'
  pull_request:
    paths: ['src/tac_osm/variants/s1temp006_persistent_slow.py','tests/test_s1temp006_persistent_slow.py']
permissions:
  contents: read
jobs:
  software-mathematical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1temp006_persistent_slow -v
          PYTHONPATH=src:. python -m unittest tests.test_research_system1_adapter -v
