name: TAC-OSM no-fit architecture research observatory

# Continuous, no-fit architecture diagnostic regression gates.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    name: native-architecture-memory-gradient-evidence-falsifiers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install no-fit dependencies
        run: python -m pip install --quiet 'pytest>=8' 'numpy==2.3.3' 'torch'
      - name: Audit research observation mechanisms
        run: |
          mkdir -p ci-artifacts
          python -m pytest -q tests/test_research_observatory.py tests/test_research_probe_agnostic.py \
            --junitxml=ci-artifacts/observatory-tests.xml
      - name: Emit fixture-only architecture, memory, entity and runtime diagnostics
        run: |
          python scripts/run_research_observatory.py --fixture --entity-isolation --profile \
            --output ci-artifacts/observatory-fixture.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("ci-artifacts/observatory-fixture.json").read_text())
          assert r["source_provenance"] == "constructed_untrained_fixture_no_capability"
          assert r["gradient_conflicts"]["status"] == "NOT_RUN_NO_AUTHENTIC_SUPERVISED_LOSSES"
          assert r["architecture"]["total_trainable"] > 0
          assert r["memory"]["query_does_not_write_state"]
          assert r["entity_isolation"]["within_tolerance"]
          assert r["runtime"]["state_bytes_batch"] > 0
          PY
      - name: Publish downloadable diagnostic and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-no-fit-ci
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
