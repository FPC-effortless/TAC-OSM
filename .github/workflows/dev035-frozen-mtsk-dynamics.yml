name: DEV-035 frozen dynamics integrity only
on:
  pull_request:
    types: [opened]
    paths:
      - 'research/dev035/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          ruff check --select F src/tac_osm/development/mtsk_dynamics.py scripts/*dev035.py tests/*dev035.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
# Local frozen checkpoint traces are separately archived; this job does not rerun them.
