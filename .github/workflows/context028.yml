name: CONTEXT028 pinned full Lean formulation and learned tensor coverage
on:
  pull_request:
    paths:
      - 'research/mathematical-engineering/context028/**'
      - 'research/phone_queue/context028.json'
      - 'scripts/check_context028_formulation.py'
      - 'tests/test_context028_formulation.py'
      - '.github/workflows/context028.yml'
permissions:
  contents: read
jobs:
  source-formulation-no-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install pytest numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Router, metadata gates and all learned tensor declarations; no forward or fit
        run: |
          mkdir -p context028-results
          python scripts/phone_lab.py plan research/phone_queue/context028.json > context028-results/PLAN.txt
          cmp context028-results/PLAN.txt research/mathematical-engineering/context028/COMPUTE_DECISION.txt
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/context028/FAIR_COMPARISON.json --phase preflight > context028-results/PREFLIGHT.json
          PYTHONPATH=src python -m pytest -q tests/test_context028_formulation.py tests/test_research_probe_agnostic.py
          python scripts/check_context028_formulation.py --output context028-results/FORMULATION.json
          git diff --exit-code -- research/replay-bundles/LANGTRAIN025 research/source-bundles research/mathematical-engineering/context026/context_transition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CONTEXT028-pinned-full-formulation
          path: context028-results/
