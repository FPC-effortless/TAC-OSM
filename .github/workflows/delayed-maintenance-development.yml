name: DEV-016 delayed maintenance validity (no learned capability claim)
on:
  pull_request:
    paths:
      - "src/tac_osm/development/delayed_maintenance.py"
      - "scripts/run_delayed_maintenance_dev.py"
      - "src/tac_osm/development/temporal_maintenance_model.py"
      - "scripts/run_temporal_maintenance_dev.py"
      - "tests/test_delayed_maintenance_development.py"
      - "tests/test_temporal_maintenance_model.py"
      - "contracts/DEV-016.json"
      - ".github/workflows/delayed-maintenance-development.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mechanism and boundary gates
        run: python -m unittest discover -s tests -p 'test_delayed_maintenance_development.py' -v
      - name: Full validity grid and exact replay
        run: |
          python scripts/run_delayed_maintenance_dev.py
          python scripts/run_delayed_maintenance_dev.py --replay
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-016-BENCHMARK-VALIDITY-NOT-LEARNED
          path: artifacts/DEV-016-validity/
          if-no-files-found: error
  learned-smoke:
    needs: validity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU research runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Source and complete regression suite
        run: |
          python -m py_compile src/tac_osm/development/temporal_maintenance_model.py scripts/run_temporal_maintenance_dev.py
          ruff check --select F src/tac_osm/development/temporal_maintenance_model.py scripts/run_temporal_maintenance_dev.py tests/test_temporal_maintenance_model.py
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
      - name: Retrieve audited immutable DEV-013 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh api --header 'Accept: application/vnd.github+json' /repos/FPC-effortless/TAC-OSM/actions/artifacts/11836120110/zip > artifacts/parent/DEV-013.zip
          echo '880d56e177b78d44961a8fc75e6e0a4151ebe6eeb7a55ce81afaa6c358172d65  artifacts/parent/DEV-013.zip' | sha256sum -c -
      - name: Smoke four training arms and exact checkpoint replay
        run: |
          python scripts/run_temporal_maintenance_dev.py --seed 43 --smoke --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-016-SMOKE
          python scripts/run_temporal_maintenance_dev.py --seed 43 --smoke --replay --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-016-SMOKE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-016-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-016-SMOKE/
          if-no-files-found: warn
  learned-three-seed:
    needs: learned-smoke
    # The completed, audited full run is pinned to this training commit.
    # Later documentation/audit commits need regression and smoke, not another
    # full SGD run. Explicit workflow_dispatch can rerun the fixed experiment.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.sha == '1b62d49db358d1e703256cfc0ab8524d3b73d118'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [43, 59, 71]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Retrieve exact parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh api --header 'Accept: application/vnd.github+json' /repos/FPC-effortless/TAC-OSM/actions/artifacts/11836120110/zip > artifacts/parent/DEV-013.zip
          echo '880d56e177b78d44961a8fc75e6e0a4151ebe6eeb7a55ce81afaa6c358172d65  artifacts/parent/DEV-013.zip' | sha256sum -c -
      - name: Train and replay all four arms at the fixed budget
        run: |
          python scripts/run_temporal_maintenance_dev.py --seed ${{ matrix.seed }} --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-016-seed${{ matrix.seed }}
          python scripts/run_temporal_maintenance_dev.py --seed ${{ matrix.seed }} --replay --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-016-seed${{ matrix.seed }}
      - name: Print machine-readable seed summary
        run: cat artifacts/DEV-016-seed${{ matrix.seed }}/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-016-RAW-seed${{ matrix.seed }}-NOT-CONFIRMATORY
          path: artifacts/DEV-016-seed${{ matrix.seed }}/
          if-no-files-found: warn
