name: TAC 500K dual-timescale memory candidate tests
on:
  push:
    branches: [research/500k-dual-timescale-memory-graph007-2026-10-28]
  pull_request:
  workflow_dispatch:
jobs:
  graph007-numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Validate versioned modules and exact constructed contracts
        run: |
          python -m py_compile research/language/flow_500k/tac_wave_ced_500k_v3.py research/language/flow_500k/historical_500k_v3.py
          OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python -m unittest discover -s research/language/flow_500k -p 'test_memory_500k_v3.py' -v
