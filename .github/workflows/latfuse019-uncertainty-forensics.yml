name: LATFUSE019 frozen real-source 13-channel station Gaussian NLL source forensic

on:
  push:
    branches: [research/latfuse019-frozen-uncertainty-audit-2026-10-27]
    paths:
      - ".github/workflows/latfuse019-uncertainty-forensics.yml"
      - "scripts/latfuse019_frozen_uncertainty.py"
      - "research/mathematical-engineering/latfuse019/REGISTERED_UNCERTAINTY_AUDIT.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latfuse019-original-physical-H64-calibration-no-fit
  cancel-in-progress: false

jobs:
  original-recorded-source-NLL-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Original CPU-only PyTorch for immutable learned model source forensic
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Mandatory precommitted original source and checkpoint/no-fit registration
        run: |
          python -m py_compile scripts/latfuse019_frozen_uncertainty.py
          python scripts/validate_research_parity.py \
            --manifest research/mathematical-engineering/latfuse019/REGISTERED_UNCERTAINTY_AUDIT.json \
            --phase preflight
          test -s research/replay-bundles/LATFUSE018/RESULTS.json
          test -s research/mathematical-engineering/latfuse018/PLAN.json
          test ! -e research/mathematical-engineering/latfuse019/RESULTS.json
      - name: Recover source original authorized SHA from historical Git archive only, no protected numeric access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse019-source
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse019-source/PRSA2017_original.zip
      - name: Replay source-trained 4 SHA frozen checkpoints H64 all13 observed source channel NLL, station coverage and tails
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/latfuse019_frozen_uncertainty.py \
            --source /tmp/latfuse019-source/PRSA2017_original.zip \
            --output research/mathematical-engineering/latfuse019/RESULTS.json
      - name: Commit exact archived original source attribution, never model weights
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/latfuse019-frozen-uncertainty-audit-2026-10-27
          test -s research/mathematical-engineering/latfuse019/RESULTS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/latfuse019/RESULTS.json
          git diff --cached --quiet && exit 1
          git commit -m "research: preserve physical source channel/station uncertainty tail attribution from frozen original real checkpoints"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Methodological boundary
        run: |
          echo "Tail diagnostic only; zero training, zero recalibration; original source target only after neural output."
          echo "May-June2014 original source previously exposed, regional/site correlated; no protected2016–17 numeric."
