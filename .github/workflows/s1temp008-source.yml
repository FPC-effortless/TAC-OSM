name: S1TEMP008 original BPI17 multi-offer publisher metadata no source reads
on:
  push:
    branches: [research/s1temp008-source-entity-retention-2026-10-26]
    paths: ['research/parallel-six/S1TEMP008-SOURCE-001.marker']
permissions:
  contents: read
jobs:
  original-publisher-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Retrieve ONLY immutable original article metadata; do not download XES
        run: python -u scripts/s1temp008_publisher_metadata.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1temp008-original-bpi2017-publisher-metadata-only
          path: research/diagnostics/s1temp008-original-metadata/**
          retention-days: 90
          if-no-files-found: warn
