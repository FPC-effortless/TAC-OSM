name: Research PLM integrated E2E address diagnosis 002

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Focused tests
        run: python -m pytest tests/test_integrated_e2e_address.py -q

  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full repository suite
        run: python -m pytest tests/ -q
      - name: Run E2E-002 diagnostic
        run: python scripts/run_integrated_e2e_002.py
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-INTEGRATED-E2E-002
          path: artifacts/TACOSM-PLM-INTEGRATED-E2E-002.json
          if-no-files-found: error
