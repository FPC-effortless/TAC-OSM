name: Legacy superseded PLM integrated multimodal E2E-002

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  audit-only:
    name: E2E-002 supersession check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify supersession
        run: |
          grep -q '"status":"superseded"' contracts/TACOSM-PLM-INTEGRATED-E2E-002.json || grep -q '"status": "superseded"' contracts/TACOSM-PLM-INTEGRATED-E2E-002.json
          grep -q 'TACOSM-PLM-INTEGRATED-E2E-003' contracts/TACOSM-PLM-INTEGRATED-E2E-002.json
          echo "E2E-002 is development/provenance-only. No confirmatory measurement is executed."
