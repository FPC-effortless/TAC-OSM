name: Research PLM integrated multimodal end-to-end 002

on:
  push:
    branches:
      - research/plm-integrated-e2e-002-corrected
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: E2E-002 smoke and integrity gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest numpy==2.3.3 "ruff==0.13.0"
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Static undefined-name gate
        run: |
          ruff check --select F821             scripts/run_integrated_e2e_002.py             scripts/validate_integrated_e2e_002.py             src/tac_osm/integrated_e2e.py
      - name: Syntax/bytecode gate
        run: python -m compileall -q src scripts
      - name: Contract validation
        run: |
          PYTHONPATH=src python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-PLM-INTEGRATED-E2E-002")
          assert c.check_consistency() == []
          c.require_levels((3,))
          c.require_seeds((0,1,2,3,4))
          c.require_steps(300)
          c.require_eval_steps(400)
          c.require_arms(["integrated","no_memory","shuffle_image","text_only","image_only","audio_only"])
          print("E2E-002 contract PASS")
          PY
      - name: Focused leakage and benchmark tests
        run: PYTHONPATH=src python -m pytest tests/test_integrated_e2e_002.py tests/test_integrated_e2e.py tests/test_integrated_e2e_contract.py -q
      - name: Full repository tests
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: Smoke runner
        run: PYTHONPATH=src python scripts/run_integrated_e2e_002.py --smoke

  confirmatory:
    name: E2E-002 full confirmatory measurement
    needs: smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest numpy==2.3.3 "ruff==0.13.0"
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Static undefined-name gate
        run: |
          ruff check --select F821             scripts/run_integrated_e2e_002.py             scripts/validate_integrated_e2e_002.py             src/tac_osm/integrated_e2e.py
      - name: Syntax/bytecode gate
        run: python -m compileall -q src scripts
      - name: Contract validation
        run: |
          PYTHONPATH=src python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-PLM-INTEGRATED-E2E-002")
          assert c.check_consistency() == []
          c.require_levels((3,))
          c.require_seeds((0,1,2,3,4))
          c.require_steps(300)
          c.require_eval_steps(400)
          c.require_arms(["integrated","no_memory","shuffle_image","text_only","image_only","audio_only"])
          PY
      - name: Full repository tests
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: Full corrected benchmark
        env:
          PYTHONPATH: src
        run: python scripts/run_integrated_e2e_002.py
      - name: Independent result validation
        env:
          PYTHONPATH: src
        run: python scripts/validate_integrated_e2e_002.py artifacts/TACOSM-PLM-INTEGRATED-E2E-002.json
      - name: Upload scientific artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-INTEGRATED-E2E-002
          path: artifacts/TACOSM-PLM-INTEGRATED-E2E-002.json
          if-no-files-found: error
