name: TAC-OSM all original robot FIT trajectories source qualification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/audit_full_real_robot_fit.py
      - scripts/check_real_robot_reward_readiness.py
      - tests/test_real_robot_reward_readiness.py
      - src/tac_osm/research_reward_runner.py
      - tests/test_full_real_robot_fit_audit.py
      - research/real-robot-full-fit-capability-gate-2026-10-22.md
      - docs/TACOSM-BASELINE-001.md
      - .github/workflows/full-real-robot-fit-source-qualification.yml
permissions:
  contents: read
concurrency:
  group: original-robot-all-FIT-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  real-source-mathematical-safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install software-only test dependency
        run: python -m pip install 'pytest==9.1.1'
      - name: Validate entire-training-cohort receipt logic and factual real-target mask
        run: |
          python -m py_compile scripts/audit_full_real_robot_fit.py
          PYTHONPATH=src python -m pytest -q tests/test_full_real_robot_fit_audit.py tests/test_real_robot_reward_readiness.py
  original-real-physical-training-source:
    needs: real-source-mathematical-safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install only original parquet reader (NO PyTorch or model fitting)
        run: python -m pip install 'pyarrow==21.0.0'
      - name: Audit each of the 325 original FIT real physical-action episode parquets
        run: |
          set -o pipefail
          python -m scripts.audit_full_real_robot_fit --private-cache /tmp/tac-real-robot-original-FIT-only --receipt results/all-original-real-robot-FIT-only-receipt.json | tee original-robot-FIT-audit.log
      - name: Require complete real original FIT acquisition, source hashes and zero leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/all-original-real-robot-FIT-only-receipt.json').read_text())
          assert r['schema_version']=='tac-osm.real-robot-full-FIT.v1'
          assert r['frozen_publisher_revision']=='9290f5a96dc91ea58256e81d9ce2dd9621890b51'
          assert len(r['original_FIT_source_file_checksums'])==325
          assert len({x['original_episode_index'] for x in r['original_FIT_source_file_checksums']})==325
          assert all(len(x['source_parquet_SHA256'])==64 for x in r['original_FIT_source_file_checksums'])
          assert r['real_FIT_target_support']['source_original_FIT_episode_count']==325
          assert r['real_FIT_target_support']['real_FIT_physical_frames']>5000
          assert r['real_FIT_target_support']['horizon_support']['256']['real_observed_state_action_next_state_pairs']>0
          assert not r['real_DEV_TEST_parquets_ever_opened']
          assert not r['architecture_parity_preflight_qualified']
          assert not r['model_capability_qualified']
          assert r['training_models_fitted']==r['optimizer_steps']==0
          assert not r['full_DEV_TEST_physical_source_qualified']
          print('ORIGINAL_FULL_325_REAL_ROBOT_FIT_SOURCE_QUALIFIED_NOT_A_MODEL_RESULT')
          PY
      - name: Independently flag reward readiness unavailable from actual physical FIT source
        run: |
          python scripts/check_real_robot_reward_readiness.py \
            --fit-receipt results/all-original-real-robot-FIT-only-receipt.json \
            --output results/real-robot-reward-readiness-blocker.json
          python - <<'PY'
          from pathlib import Path
          import json
          evidence = json.loads(Path("results/real-robot-reward-readiness-blocker.json").read_text())
          assert evidence["status"] == "BLOCKED_NO_INDEPENDENT_REAL_REWARD_OR_TASK_GOAL"
          assert evidence["reward_checkpoint_promotion_eligible"] is False
          assert evidence["model_training_authorized_by_reward_integrity"] is False
          assert evidence["verified_fit_episodes"] == 325
          assert evidence["independent_reward_evaluator"] == "UNAVAILABLE"
          assert evidence["verified_external_task_goal"] == "UNAVAILABLE"
          print("ORIGINAL_REAL_FIT_SOURCE_VALID_REWARD_PROMOTION_BLOCKED")
          PY
      - name: Archive only FIT original hashes, real source counts and stage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-325-original-robot-FIT-source-hash-and-support-evidence
          path: |
            results/all-original-real-robot-FIT-only-receipt.json
            original-robot-FIT-audit.log
            results/real-robot-reward-readiness-blocker.json
          if-no-files-found: ignore
          retention-days: 90
