name: GRAPH016 causal online Bayesian source-forecast aggregation (math only)
on:
  push:
    branches: [research/graph016-causal-bayes-experts-2026-10-28]
  pull_request:
    paths:
      - 'research/language/flow_500k/graph016_online_expert_mix.py'
      - 'research/language/flow_500k/test_graph016_online_expert_mix.py'
      - 'research/language/flow_500k/GRAPH016_*'
      - '.github/workflows/research-graph016-online-mixture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-regret-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed NumPy for numerical diagnostics
        run: python -m pip install numpy==2.3.5
      - name: Verify causal update, normalized laws, logK regret and owner separation
        working-directory: research/language/flow_500k
        run: |
          python -m py_compile graph016_online_expert_mix.py test_graph016_online_expert_mix.py
          python -m unittest -v test_graph016_online_expert_mix.py
      - name: Explicit source and research claims
        run: |
          echo "GRAPH016 CI is constructed mathematics only, NOT authentic real-data checkpoint replay."
          echo "GRAPH016 first-open Python primary capability gain: FAIL; do not promote."
          echo "REPO_REPLAY=BLOCKED; FULL_FLOP_PARITY=UNKNOWN; INDEPENDENT_GAIN=NOT_ESTABLISHED."
