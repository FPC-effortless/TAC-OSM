name: LATFUSE012 original physical-source oracle key/values, write magnitude, untrained rank falsifiers

on:
  push:
    branches:
      - research/latfuse012-oracle-recovery-2026-10-27
    paths:
      - "scripts/latfuse012_original_source_oracle.py"
      - "tests/test_latfuse012_source_oracle_math.py"
      - "research/mathematical-engineering/latfuse012/REGISTERED_ORACLE.json"
      - ".github/workflows/latfuse012-original-source-oracle.yml"
      - "docs/TACOSM-BASELINE-001.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latfuse012-original-source-oracle-read-only
  cancel-in-progress: false

jobs:
  exact-observed-source-trained-vs-untrained-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install original source-only CPU FP32 and pytest
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Preregistration/source/old-model checks BEFORE opening FIT source
        run: |
          python -m py_compile scripts/latfuse012_original_source_oracle.py
          python scripts/validate_research_parity.py \
            --manifest research/mathematical-engineering/latfuse012/REGISTERED_ORACLE.json \
            --phase preflight
          python scripts/validate_research_parity.py \
            --manifest research/replay-bundles/LATFUSE008/POSTFIT_PARITY.json \
            --phase final
          python scripts/sync_test_count.py --check
          test ! -e research/mathematical-engineering/latfuse012/RESULTS.json
          test -s research/replay-bundles/LATFUSE008/RESULTS.json
      - name: Local matrix read and episode bootstrap guards (no synthetic capability evidence)
        env:
          PYTHONPATH: ".:src"
        run: |
          python -m pytest -q \
            tests/test_latfuse012_source_oracle_math.py \
            tests/test_latfuse011_memory_falsifiers.py \
            tests/test_latfuse008_noassoc_control.py
      - name: Restore authorized original physical observations from immutable Git source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse012-original
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse012-original/PRSA2017_original.zip
      - name: 24 real paired source events, trained and initial checkpoints, oracle vs wrong keys and true residual writes
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/latfuse012_original_source_oracle.py \
            --source /tmp/latfuse012-original/PRSA2017_original.zip \
            --output research/mathematical-engineering/latfuse012/RESULTS.json
      - name: Freeze complete original real source result only in draft research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/latfuse012-oracle-recovery-2026-10-27
          test -s research/mathematical-engineering/latfuse012/RESULTS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/latfuse012/RESULTS.json
          git diff --cached --quiet && exit 1
          git commit -m "research: preserve real source oracle-memory retrieval, write residual and untrained-score attribution"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: No source-claim promotion
        run: |
          echo "Oracle key and writer value privileged DIAGNOSTIC ONLY, not deployed as query."
          echo "FIT source exposed; event episodes and stations serially correlated, no independent capability qualification."
          echo "No original trained weights or optimizer changed; real2015 DEV/protected2016-17 unopened."
