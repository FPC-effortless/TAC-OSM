name: TAOPILOT003 independent original-checkout DEV checkpoint verification

on:
  push:
    branches:
      - 'research/tao003-real-language-pilot-2026-10-30'
    paths:
      - '.github/workflows/taopilot003-eval.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taopilot003-independent-replay
  cancel-in-progress: false

jobs:
  verify-models-after-git-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Wait for independent checkpoint-preservation Git commit
        run: |
          set -euo pipefail
          verified=0
          for i in $(seq 1 150); do
            git fetch --quiet origin \
              'refs/heads/research/tao003-real-language-pilot-2026-10-30:refs/remotes/origin/research/tao003-real-language-pilot-2026-10-30'
            if git cat-file -e \
              'refs/remotes/origin/research/tao003-real-language-pilot-2026-10-30:research/evidence/taopilot003/seed1701/FIT_MATRIX.json' 2>/dev/null; then
              verified=1
              break
            fi
            sleep 20
          done
          test "$verified" = 1 || { echo 'NO_GIT_BACKED_ORIGINAL_CHECKPOINTS: FAIL_CLOSED'; exit 1; }
          git checkout -B research/tao003-real-language-pilot-2026-10-30 \
            refs/remotes/origin/research/tao003-real-language-pilot-2026-10-30
          for arm in adamw muon adamuon normuon pre_ns; do
            test -s "research/evidence/taopilot003/seed1701/$arm/MODEL.pt"
          done
          echo 'INDEPENDENT_GIT_CHECKOUT_ALL_FIVE_ORIGINALS_PRESENT'
      - name: Install read-only scoring dependencies
        run: |
          python -m pip install --quiet numpy==2.3.3 torch pytest
      - name: Restore original model/optimizer and score frozen previously-exposed publisher DEV
        run: |
          python scripts/tao003_pilot.py evaluate --directory research/evidence/taopilot003/seed1701
          python scripts/validate_research_parity.py \
            --manifest research/evidence/taopilot003/seed1701/FINAL_COMPARISON.json \
            --phase final
      - name: Preserve independent read-only DEV scoring and final gate in Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/evidence/taopilot003/seed1701/DEV_RESULTS.json
          git add -f research/evidence/taopilot003/seed1701/FINAL_COMPARISON.json
          git diff --cached --quiet && { echo 'No DEV results produced'; exit 1; } || true
          git commit -m "evidence(taopilot003): independent Git-checkout publisher DEV replay"
          git push origin HEAD:research/tao003-real-language-pilot-2026-10-30
