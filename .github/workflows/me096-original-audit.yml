name: ME096 original budget audit (no training)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/mathematical-engineering/me096/**'
      - 'research/replay-bundles/ME096/**'
      - 'scripts/audit_shared_evidence_originals.py'
      - '.github/workflows/me096-original-audit.yml'
permissions:
  contents: read
jobs:
  original-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me096/FAIR_COMPARISON.json --phase preflight
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me096/POSTFIT.json --phase final
      - run: python scripts/audit_shared_evidence_originals.py me096
