name: TAC-OSM finite-state CED DEV-010 (NOT confirmatory)
on:
  pull_request:
    paths:
      - "src/tac_osm/development/finite_ced_memory.py"
      - "tests/test_finite_ced_development.py"
      - "scripts/run_finite_ced_dev.py"
      - "scripts/validate_finite_ced_dev.py"
      - ".github/workflows/finite-ced-development.yml"
      - "docs/FINITE-CED-DEV-010.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-memory-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and lint
        run: |
          python -m py_compile src/tac_osm/development/finite_ced_memory.py scripts/run_finite_ced_dev.py scripts/validate_finite_ced_dev.py tests/test_finite_ced_development.py
          ruff check --select F src/tac_osm/development/finite_ced_memory.py scripts/run_finite_ced_dev.py scripts/validate_finite_ced_dev.py tests/test_finite_ced_development.py
      - name: New finite memory tests
        run: python -m pytest tests/test_finite_ced_development.py -q
      - name: Suite integrity
        run: python scripts/sync_test_count.py --check
      - name: Mechanism smoke with checkpoint replay
        run: |
          python scripts/run_finite_ced_dev.py --smoke --output artifacts/DEV-010-SMOKE
          python scripts/validate_finite_ced_dev.py artifacts/DEV-010-SMOKE
      - name: Save smoke controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-010-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-010-SMOKE/
          if-no-files-found: warn

  three-seed-finite-memory:
    needs: finite-memory-mechanism
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Train native and CED finite-memory models; evaluate dense/sparse
        run: |
          python scripts/run_finite_ced_dev.py --output artifacts/DEV-010
          python scripts/validate_finite_ced_dev.py artifacts/DEV-010
      - name: Keep checkpoints and every diagnostic row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-010-RAW-NOT-CONFIRMATORY
          path: artifacts/DEV-010/
          if-no-files-found: error
