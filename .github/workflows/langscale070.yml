name: LANGSCALE070 authentic language TAC 250K 500K 1M FFN scaling
on:
  pull_request:
    paths:
      - 'scripts/langscale070_cpu_fit.py'
      - 'scripts/langscale070_aggregate.py'
      - 'research/mathematical-engineering/langscale070/**'
      - 'research/phone_queue/langscale070.json'
      - 'scripts/validate_research_parity.py'
      - 'tests/test_langscale070.py'
      - '.github/workflows/langscale070.yml'
permissions:
  contents: read
  actions: read

jobs:
  authentic-source-fits:
    if: github.head_ref == 'research/langscale070-ffn-capacity-2026-10-29'
    strategy:
      fail-fast: false
      matrix:
        tier: [p250k,p500k,p1000k]
        seed: [1701,1702,1703]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned CPU torch numpy pytest
        run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Hard source/size/compute planner and preregistration gate
        run: |
          mkdir -p langscale070-results
          PYTHONPATH=src:. python scripts/phone_lab.py plan research/phone_queue/langscale070.json > langscale070-results/PLAN.json
          PYTHONPATH=src:. python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langscale070/FAIR_COMPARISON.json --phase preflight > langscale070-results/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langscale070.py
          PYTHONPATH=src:. python - <<'PY'
          from scripts.langscale070_cpu_fit import model_source_preflight, model_for, ARMS
          from scripts.langlayer035_sampling import fit_sources,schedule_receipt
          from scripts.validate_research_parity import check_model_parameter_target,ParityError
          model_source_preflight()
          assert tuple(sorted(ARMS.values()))==(250133,499623,1000239)
          for tier,count in ARMS.items():
              m=model_for(tier)
              assert m.parameter_count()==count
          try: check_model_parameter_target(499623,499623)
          except ParityError: pass
          else: raise AssertionError('global model budget accidentally relaxed')
          fit=fit_sources()
          assert len(fit)==14
          for seed in (1701,1702,1703):
              r=schedule_receipt(fit,seed,steps=160)
              assert r['examples_seen']==1280 and r['next_byte_targets_seen']==163840
          PY
      - name: 160 real publisher FIT updates, original full optimizer and RNG checkpoint
        run: |
          PYTHONPATH=src:. python scripts/langscale070_cpu_fit.py \
            --arm ${{ matrix.tier }} --seed ${{ matrix.seed }} --steps 160 \
            --out "langscale070-results/${{ matrix.tier }}_seed${{ matrix.seed }}"
      - name: Check source receipt and immutable trained checkpoint full cold replay
        run: |
          python - <<'PY'
          import glob,json,hashlib
          p=glob.glob('langscale070-results/*/FIT_AND_EXPOSED_DEV_RECEIPT.json')
          assert len(p)==1
          r=json.load(open(p[0]))
          counts={'p250k':250133,'p500k':499623,'p1000k':1000239}
          assert r['study']=='LANGSCALE070' and r['arm'] in counts and r['seed'] in (1701,1702,1703)
          assert r['updates']==160 and r['target_bytes_seen']==163840
          assert r['parameters']=={'trainable':counts[r['arm']],'deployed':counts[r['arm']]}
          assert r['checkpoint_reloaded_identical_scored_DEV'] is True
          assert r['DEV_EXPOSED_4096_ONLY']['n']==4096
          assert r['scale_axis']=='FFN_WIDTH_ONLY' and r['upper_state_width']==48
          assert r['matched_training_FLOPs']=='NOT_MATCHED_BY_DESIGN_PARAMETER_SCALING'
          assert r['GPU_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          cp=glob.glob('langscale070-results/*/*.pt')
          assert len(cp)==1 and hashlib.sha256(open(cp[0],'rb').read()).hexdigest()==r['checkpoint_sha256']
          PY
      - name: Archive each fitted model checkpoint, optimizer, RNG and original source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGSCALE070-FIT-${{ matrix.tier }}-seed${{ matrix.seed }}
          path: langscale070-results/
          retention-days: 90
          if-no-files-found: warn

  all-seed-source-verified-summary:
    needs: authentic-source-fits
    # The seed matrix is branch-scoped; never request absent artifacts on another PR.
    # Keep always() on the original branch so actual training failures remain visible.
    if: always() && github.head_ref == 'research/langscale070-ffn-capacity-2026-10-29'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve all nine authentic training receipts, preserve incompletes
        run: |
          mkdir -p scaling-raw scaling-aggregate
          gh run download "${{ github.run_id }}" -R FPC-effortless/TAC-OSM \
            --pattern 'LANGSCALE070-FIT-*' --dir scaling-raw
      - name: Verify all checkpoints and source schedules; show only honest exploratory metrics
        run: |
          PYTHONPATH=src:. python scripts/langscale070_aggregate.py \
            --results scaling-raw --output scaling-aggregate/RESULTS.json
          python - <<'PY'
          import json,os
          r=json.load(open('scaling-aggregate/RESULTS.json'))
          assert r['fitted_checkpoints']==9 and r['all_source_schedules_paired']
          assert r['training_FLOP_parity']=='NOT_MATCHED_BY_DESIGN'
          assert r['protected_TEST']=='NOT_ACCESSED' and r['gpu_minutes']==0
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              print('# LANGSCALE070 authentic source 250K / 500K / 1M capacity pilot',file=f)
              print('FFN WIDTH ONLY; same original 160 update source schedule; NOT matched training FLOPs or a universal scaling law.',file=f)
              print('| Tier | Trainables | Original exposed DEV NLL | Top1 | CPU process seconds |',file=f)
              print('|---|---:|---:|---:|---:|',file=f)
              for key,v in r['metrics'].items():
                  print(f"| {key} | {v['trainable_parameters']} | {v['nll_mean']:.6f} | {v['top1_mean']:.4%} | {v['cpu_process_seconds_mean']:.1f} |",file=f)
              print('No architecture superiority, TEST, whole math proof, new mobile streaming or independent real-world qualification.',file=f)
          PY
      - name: Save full positive, negative or missing run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGSCALE070-SOURCE-VERIFIED-SCALING-SUMMARY
          path: scaling-aggregate/
          retention-days: 90
          if-no-files-found: warn
