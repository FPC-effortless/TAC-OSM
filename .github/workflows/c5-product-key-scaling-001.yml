name: C5 product-key state scaling

on:
  push:
    branches: [research/c5-product-key-scaling-001]
    paths:
      - "src/tac_osm/**"
      - "tests/**"
      - "scripts/run_c5_product_key_scaling_001.py"
      - "docs/TACOSM-C5-PRODUCT-KEY-SCALING-001.md"
      - "contracts/TACOSM-C5-PRODUCT-KEY-SCALING-001.json"
      - ".github/workflows/c5-product-key-scaling-001.yml"
  workflow_dispatch:
  pull_request:
    branches: [research/c5-product-key-scaling-001]

permissions:
  contents: read

jobs:
  scaling:
    name: TACOSM-C5-PRODUCT-KEY-SCALING-001
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Preconditions
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest ruff
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
          python -m ruff check --select F821 scripts/run_c5_product_key_scaling_001.py
          python -m py_compile scripts/run_c5_product_key_scaling_001.py
      - name: Smoke measurement
        run: |
          mkdir -p artifacts
          python scripts/run_c5_product_key_scaling_001.py --smoke > artifacts/TACOSM-C5-PRODUCT-KEY-SCALING-001.smoke.stdout.json
          cat artifacts/TACOSM-C5-PRODUCT-KEY-SCALING-001.smoke.stdout.json
      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-C5-PRODUCT-KEY-SCALING-001-smoke
          path: artifacts/
          if-no-files-found: error
