name: ME066 authentic original robot four-arm paired FIT training and checkpoint audit
on:
  pull_request:
    paths:
      - 'research/mathematical-engineering/me066/TRAINING_PERMISSION.json'
      - 'scripts/me066_train_original_fit.py'
      - '.github/workflows/me066-original-training.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: me066-original-paired-four-arm-fits-once
  cancel-in-progress: false
jobs:
  original-four-arm-real-fit-training:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      fitted: ${{ steps.run_fit.outputs.fitted }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - id: run_fit
        name: Only after original Git registration, storage proof, and new source permission
        env: {ME066_FIT_CACHE: "${{ runner.temp }}/me066-original-only"}
        run: |
          if [ ! -f research/mathematical-engineering/me066/TRAINING_PERMISSION.json ]; then
            echo 'No original source-fit permission receipt; pretraining-only branch, no fits started'
            echo 'fitted=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f research/replay-bundles/ME066/TRAINING_RESULT.json ]; then
            echo 'Original ME066 checkpoints already fitted: NEVER retrain'
            echo 'fitted=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me066/FAIR_COMPARISON.json --phase preflight
          PYTHONPATH=src:. python scripts/me066_train_original_fit.py
          python scripts/validate_research_parity.py --manifest research/replay-bundles/ME066/FAIR_COMPARISON_FINAL.json --phase final
          echo 'fitted=true' >> "$GITHUB_OUTPUT"
      - name: Preserve original trained model, optimizer, RNG bytes and any failed partial attempts
        if: always()
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f research/replay-bundles/ME066/
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me066): preserve real five-task four-arm original weights optimizer RNG and source receipts'
            for attempt in 1 2 3 4 5; do
              git fetch origin "$PUSH_BRANCH"
              git rebase "origin/$PUSH_BRANCH"
              if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
  independent-original-trained-model-git-byte-load:
    needs: original-four-arm-real-fit-training
    if: needs.original-four-arm-real-fit-training.outputs.fitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.head_ref || github.ref_name }}"
          clean: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify 20 original Git-committed trained weights and optimizer/RNG restore with zero heldout reads
        run: PYTHONPATH=src:. python scripts/me066_verify_repo_checkpoints.py
      - name: Preserve independent original weights and model restoration result in Git
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/replay-bundles/ME066/CLEAN_CHECKOUT_MODEL_REPLAY.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me066): independent complete four-arm original checkpoint model restore'
            for attempt in 1 2 3 4 5; do
              git fetch origin "$PUSH_BRANCH"
              git rebase "origin/$PUSH_BRANCH"
              if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
