name: ME070 authentic BPI2012 practical ngram fit, Git-owned originals and replay
on:
  pull_request:
    paths:
      - 'scripts/me070_ngram_real_workflow.py'
      - 'tests/test_me070_source_and_diagnostics.py'
      - '.github/workflows/me070-practical-ngram-fit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-authentic-model-and-replay:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned original source dependencies
        run: python -m pip install numpy==2.3.5 pytest==9.1.1
      - name: Test observed-prefix reference mathematics (fixtures not capability results)
        run: PYTHONPATH=src:. python -m pytest -q tests/test_me070_source_and_diagnostics.py
      - name: Real FIT-only model, commit exact parameter-count state before any TEST scoring
        env:
          PYTHONPATH: src:.
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f research/replay-bundles/ME070/practical-ngrams/FIT_NGRAM_STATE.json ]; then
            python scripts/me070_ngram_real_workflow.py --phase fit --cache /tmp/me070-practical-real-source
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/replay-bundles/ME070/practical-ngrams/FIT_NGRAM_STATE.json
            git commit -m "research(ME070): original real FIT ngram state frozen before TEST"
            git push origin "HEAD:$BRANCH"
          else
            echo "Original model state already in Git: not refitting."
          fi
      - name: Independent clean-clone restore, historical EXPOSED scoring and commit
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$BRANCH" "https://github.com/$GITHUB_REPOSITORY.git" /tmp/me070-clean-model
          cd /tmp/me070-clean-model
          test -s research/replay-bundles/ME070/practical-ngrams/FIT_NGRAM_STATE.json
          if [ ! -f research/replay-bundles/ME070/practical-ngrams/EXPOSED_ORIGINAL_SCORES.json ]; then
            PYTHONPATH=src:. python scripts/me070_ngram_real_workflow.py --phase score --cache /tmp/me070-practical-real-source
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/replay-bundles/ME070/practical-ngrams/EXPOSED_ORIGINAL_SCORES.json
            git commit -m "research(ME070): archive original exposed BPI2012 practical ngram scores"
            # push with in-repo GitHub Actions token; never modify unrelated branches
            git -c http.extraheader="AUTHORIZATION: basic $(printf "x-access-token:%s" "$GH_PUSH_TOKEN" | base64 -w0)" push origin "HEAD:$BRANCH"
          fi
      - name: Second clean clone independently replay and validate original state and scores
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$BRANCH" "https://github.com/$GITHUB_REPOSITORY.git" /tmp/me070-independent-replay
          cd /tmp/me070-independent-replay
          PYTHONPATH=src:. python scripts/me070_ngram_real_workflow.py --phase replay --cache /tmp/me070-practical-real-source
          echo "ME070_PRACTICAL_REFERENCE_REPO_REPLAY=PASS"
          echo "ME070_NATIVE_TAC_MEMORY_ADVANTAGE=NOT_MEASURED"
