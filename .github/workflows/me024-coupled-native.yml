name: ME024 coupled native mathematical and causal checks
on:
  pull_request:
    paths:
      - src/tac_osm/coupled_native.py
      - scripts/me024_*.py
      - tests/test_coupled_native.py
      - research/mathematical-engineering/me024/**
      - .github/workflows/me024-coupled-native.yml
permissions:
  contents: read
jobs:
  mathematics-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Coupled Jacobian, RMS derivatives, causality, streaming and full regression
        run: python -m pytest -q
