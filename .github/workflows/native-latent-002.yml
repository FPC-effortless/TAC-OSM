name: NATIVELATENT002 native source encoder/key and memory retention localization

on:
  push:
    branches:
      - research/native-latent-diagnosis-2026-10-27
    paths:
      - scripts/native_latent_002_localization.py
      - .github/workflows/native-latent-002.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native002-latent-diagnosis-one-time
  cancel-in-progress: false

jobs:
  original-trained-source-only-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU original-operator dependencies
        run: |
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fail closed on missing first diagnosis or original FIT source
        run: |
          test -s research/mathematical-engineering/nativelatent001/RESULTS.json
          test -f research/source-bundles/ME100/PRSA2017_original.zip
          test ! -e research/mathematical-engineering/nativelatent001/LOCALIZATION.json
      - name: Measure original FIT encoder-vs-key geometry and 1-to-128-step memory survival
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/native_latent_002_localization.py \
            --output research/mathematical-engineering/nativelatent001/LOCALIZATION.json
      - name: Preserve read-only report on isolated diagnosis branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/native-latent-diagnosis-2026-10-27
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/nativelatent001/LOCALIZATION.json
          git commit -m "research: preserve native input-encoder vs write-key memory localization"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Evidence classification
        run: echo "Original checkpoint local source analysis only, not trained result, no labels/protected cohort or new optimizer."
