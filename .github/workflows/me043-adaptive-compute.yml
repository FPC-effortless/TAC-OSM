name: ME043 compute-adaptive native architecture and original models
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/tac_osm/me043*.py
      - scripts/me043*.py
      - tests/test_me043*.py
      - research/mathematical-engineering/me043/**
      - research/model-artifacts/me043*/**
      - .github/workflows/me043-adaptive-compute.yml
permissions:
  contents: read
concurrency:
  group: me043-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-models-and-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original pinned numerical environment
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Numerical contracts and complete regression suite
        run: |
          python -m pytest -q
          python scripts/sync_test_count.py --check
      - name: Restore actual original archives, verify every hash and optimizer state
        run: |
          python scripts/me043_artifacts.py verify research/model-artifacts/me043 restored-me043
          python scripts/me043_artifacts.py verify research/model-artifacts/me043b restored-me043b
          python scripts/me043_artifacts.py metrics restored-me043
          python scripts/me043_artifacts.py metrics restored-me043b
      - name: Exact replay of every original model on publisher-authenticated historical DEV
        run: |
          python -m scripts.me043_train_adaptive --out restored-me043 --replay
          python -m scripts.me043b_train_scheduled --out restored-me043b --replay
      - name: Preserve all original trained weights and evidence for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me043-160-original-trained-models-and-evidence
          path: |
            research/model-artifacts/me043*/**
            restored-me043/replay.json
            restored-me043/metric-audit.json
            restored-me043b/replay.json
            restored-me043b/metric-audit.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
