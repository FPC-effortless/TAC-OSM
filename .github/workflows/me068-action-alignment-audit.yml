name: ME068 original real robot FIT-only action joint timing audit
on:
  pull_request:
    paths:
      - 'scripts/me068_original_fit_action_alignment.py'
      - 'research/mathematical-engineering/me068/FAIR_COMPARISON.json'
      - '.github/workflows/me068-action-alignment-audit.yml'
  workflow_dispatch:
    inputs:
      allow_new_fits:
        description: Explicit opt-in; current live gates remain compulsory
        type: boolean
        default: false
permissions: {contents: write}
concurrency:
  group: me068-source-only-causal-action-timing-audit
  cancel-in-progress: false
jobs:
  original-only-action-timing:
    # Retained historical lane; current live guards still reject incompatible new fits.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_new_fits == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Compulsory real research noncomparative governance before original source FIT only
        run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me068/FAIR_COMPARISON.json --phase preflight
      - name: Verify causal joint-state/command alignment on original 160 real FIT episodes only; zero model updates
        run: |
          if [ -f research/mathematical-engineering/me068/SOURCE_FIT_ACTION_ALIGNMENT.json ]; then
            echo 'Original FIT-only action timing evidence already published; do not overwrite'
          else
            PYTHONPATH=src:. python scripts/me068_original_fit_action_alignment.py \
              --cache "${{ runner.temp }}/me068-real-FIT-only-robot-source"
          fi
      - name: Retain original actual observation/action FIT audit in Git even on negative results
        if: always()
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          set -e
          if [ -f research/mathematical-engineering/me068/SOURCE_FIT_ACTION_ALIGNMENT.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f research/mathematical-engineering/me068/SOURCE_FIT_ACTION_ALIGNMENT.json
            if ! git diff --cached --quiet; then
              git commit -m 'evidence(me068): actual original FIT-only measured robot action/state temporal alignment'
              for attempt in 1 2 3 4 5; do
                git fetch origin "$PUSH_BRANCH"
                git rebase "origin/$PUSH_BRANCH"
                if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
                if [ "$attempt" -eq 5 ]; then exit 1; fi
              done
            fi
          fi
