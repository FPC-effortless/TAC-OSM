name: ME048 real randomized action conditioned learning and outcome value
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/tac_osm/me048_real_action_outcomes.py
      - scripts/me048_train_real_action.py
      - tests/test_me048_real_action_outcomes.py
      - research/mathematical-engineering/me048/**
      - docs/TACOSM-BASELINE-001.md
      - .github/workflows/me048-real-action-outcomes.yml
permissions:
  contents: read
concurrency:
  group: me048-real-randomized-action-learning
  cancel-in-progress: true
jobs:
  numerical-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install same original numerical dependencies
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile numerical action-intelligence model and verify original logged-label-only math
        run: |
          python -m py_compile src/tac_osm/me048_real_action_outcomes.py scripts/me048_train_real_action.py
          python -m scripts.me048_train_real_action --self-test
          python -m pytest -q tests/test_me048_real_action_outcomes.py
      - name: Run complete original TAC regression suite with frozen baseline
        run: |
          python -m pytest -q
          python scripts/sync_test_count.py --check
  original-randomized-trial-fits-and-independent-replay:
    needs: numerical-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned real-model numerical environment
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Download SHA-pinned original noncommercial Criteo trial, train real models, then score unopened trial outcomes
        run: |
          set -o pipefail
          python -m scripts.me048_train_real_action --out results/me048 | tee me048-actual-treatment-models.log
      - name: Independently replay all six original logged-intervention models and score arrays
        run: |
          set -o pipefail
          python -m scripts.me048_train_real_action --out results/me048 --replay | tee me048-original-replay.log
      - name: Enforce original randomized data and controlled test evaluation receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tac_osm.me048_real_action_outcomes import ARMS
          r=json.loads(Path("results/me048/results.json").read_text())
          assert r["study"]=="ME048_AUTHENTIC_RANDOMIZED_ACTION_OUTCOMES" and r["complete"]
          assert r["original_corrected_archive_sha256"]=="2716e1bf0fd157a93b5bf86924d9088419dfbac2022c6cd90030220634f616dc"
          assert r["all_six_source_model_checkpoints_frozen_before_evaluation"]
          assert r["sealed_test_parsed"]
          assert not r["actual_time_order_or_per_user_ids_present"]
          assert len(r["models"])==6
          assert {(x["arm"],x["seed"]) for x in r["models"]}=={
             (a,s) for a in ARMS for s in (48001,48002)}
          assert all(x["trained_on_real_randomized_treatment"]
                and x["original_fit_update_count"] if False else x["real_record_exposures"]==800*256
                for x in r["models"])
          assert r["selection"]["conditional_propensity_not_verified"]
          assert not r["selection"]["strict_action_superiority_qualified"]
          assert r["selection"]["no_promotion_or_merge"]
          assert r["licensed_research_only"]
          print("ME048_ORIGINAL_RANDOMIZED_REAL_TREATMENT_LEARNER_AND_POLICY_AUDIT_PASS")
          PY
      - name: Publish trained weights, outcomes metrics and negative gates — exclude noncommercial raw Criteo dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me048-authentic-corrected-randomized-action-TAC-GRU-context
          path: |
            results/me048/
            !results/me048/source-private-NOT-ARTIFACT/
            !results/me048/source-private-NOT-ARTIFACT/**
            me048-actual-treatment-models.log
            me048-original-replay.log
          retention-days: 90
          if-no-files-found: ignore
