name: DEV-034 local MTSK integrity and smoke only
on:
  pull_request:
    types: [opened]
    paths:
      - 'research/dev034/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          ruff check --select F src/tac_osm/development/local_mtsk.py scripts/*dev034.py tests/*dev034.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
          for arm in mtsk_global_tied mtsk_global_multi mtsk_local_tied mtsk_local_multi masked_local schema41; do
            python scripts/run_local_mtsk_dev034.py --arm "$arm" --smoke --output /tmp/dev034-smoke
          done
          python scripts/audit_local_mtsk_dev034.py --input /tmp/dev034-smoke --smoke --output /tmp/dev034-smoke-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-034-INTEGRITY-SMOKE-NOT-TRAINED-PILOT
          path: |
            /tmp/dev034-smoke
            /tmp/dev034-smoke-audit.json
