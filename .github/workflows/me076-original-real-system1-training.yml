name: ME076 authentic one-step System1 train, original Git weights and independent replay
on:
  push:
    branches: [research/me075-system1-native-gated-delta-2026-10-23]
    paths:
      - "scripts/me076_train_system1_real.py"
      - "research/mathematical-engineering/me076/FAIR_COMPARISON.json"
      - "tests/test_me076_real_training_contract.py"
      - ".github/workflows/me076-original-real-system1-training.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: me076-original-real-one-step-system1
  cancel-in-progress: false
jobs:
  real-registered-original-training:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify registered source, no-leakage unit contracts and exact live 100k model
        run: |
          PYTHONPATH=src:. python -m pytest -q tests/test_me075_system1_and_gated_delta.py tests/test_me076_real_training_contract.py
          python -m py_compile scripts/me076_train_system1_real.py
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me076/FAIR_COMPARISON.json --phase preflight
      - name: Cache only original publicly licensed source parquet files
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/me076-pinned-publisher-source
          key: me076-bodenai-public-five-tasks-original-fit-v1
      - name: Fit five truly original authentic real robot models and preserve all original scores
        run: PYTHONPATH=src:. python scripts/me076_train_system1_real.py fit --cache "${{ runner.temp }}/me076-pinned-publisher-source"
      - name: Commit ALL five original real model/optimizer/RNG weights and original raw real source scores
        if: success()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/mathematical-engineering/me076/SOURCE_QUALIFICATION.json
          git add -f research/mathematical-engineering/me076/RESULTS.json
          git add -f research/replay-bundles/ME076
          git commit -m 'research(me076): preserve original real System1 fits and full per-case forecasts'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
  independent-clean-checkout-original-replay:
    needs: real-registered-original-training
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/me075-system1-native-gated-delta-2026-10-23
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/me076-pinned-publisher-source
          key: me076-bodenai-public-five-tasks-original-fit-v1
      - name: Replay exact Git-owned original five weights and recompute per-case real scores with zero optimizer updates
        run: PYTHONPATH=src:. python scripts/me076_train_system1_real.py replay --cache "${{ runner.temp }}/me076-pinned-publisher-source"
      - name: Independently publish zero-refit original replay audit in Git
        env:
          TARGET_BRANCH: research/me075-system1-native-gated-delta-2026-10-23
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/replay-bundles/ME076/INDEPENDENT_ORIGINAL_REAL_REPLAY.json
          git commit -m 'audit(me076): independent clean-checkout replay of five real original fits'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
