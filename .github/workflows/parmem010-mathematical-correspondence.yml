name: PAR-MEM-010 independent mathematical correspondence (no fit)
on:
  push:
    branches: [research/parmem010-formal-verification]
    paths:
      - '.github/workflows/parmem010-mathematical-correspondence.yml'
      - 'scripts/verify_parmem010_math.py'
      - 'src/tac_osm/variants/*parallel*py'
      - 'research/parallel-six/PAR-MEM-010-*'
      - 'research/pnds-variant-math-links.json'
  pull_request:
    paths:
      - '.github/workflows/parmem010-mathematical-correspondence.yml'
      - 'scripts/verify_parmem010_math.py'
      - 'research/parallel-six/PAR-MEM-010-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward-backward-and-state-correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/pnds-lean
          ref: a7af5758bbb1ee90da006a0a61416d4061f23e64
          path: pnds-math
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Check exact equations, receipt pins and reciprocal study contract
        run: |
          python pnds-math/scripts/validate_parmem010_math.py --tac-root .
          cd pnds-math
          python -m unittest discover -s tests -p 'test_source_aligned*math.py' -v
      - name: Recompute source forward, gradient and byte-identity checks
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s tests -p 'test_source_aligned_parallel_world.py' -v
          python -m unittest discover -s tests -p 'test_parallel_time_age_world.py' -v
          python scripts/verify_parmem010_math.py --pnds-root pnds-math --output /tmp/parmem010-math.json
      - uses: actions/upload-artifact@v4
        with:
          name: parmem010-numerical-correspondence
          path: /tmp/parmem010-math.json
