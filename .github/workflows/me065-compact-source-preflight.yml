name: ME065 source-only authentic compact world model preflight
on:
  pull_request:
    paths:
      - 'src/tac_osm/me065_micro_world_controls.py'
      - 'tests/test_me065_micro_world_controls.py'
      - 'scripts/me065_prefit_original_fit.py'
      - '.github/workflows/me065-compact-source-preflight.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: me065-original-five-task-source-preflight
  cancel-in-progress: false
jobs:
  real-fit-untrained-comparator-preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0' 'pytest==8.4.2'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Execute numerical API and safety contract tests (not capability evidence)
        run: PYTHONPATH=src:. python -m pytest tests/test_me065_micro_world_controls.py -q
      - name: Profile original five-task FIT-only param/FLOPs and gradients
        run: |
          PYTHONPATH=src:. python scripts/me065_prefit_original_fit.py \
            --source-cache "${{ runner.temp }}/me065-original-FIT-cache" \
            --output research/mathematical-engineering/me065/PREFLIGHT_MEASURED.json
      - name: Preserve measured original FIT preflight even on failed parity
        if: always()
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          test -n "$PUSH_BRANCH"
          if [ -f research/mathematical-engineering/me065/PREFLIGHT_MEASURED.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f research/mathematical-engineering/me065/PREFLIGHT_MEASURED.json
            if ! git diff --cached --quiet; then
              git commit -m 'evidence(me065): original real FIT four-arm numeric preflight; never train on failed parity'
              for attempt in 1 2 3 4 5; do
                git fetch origin "$PUSH_BRANCH"
                git rebase "origin/$PUSH_BRANCH"
                if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
                if [ "$attempt" -eq 5 ]; then exit 1; fi
              done
            fi
          fi
