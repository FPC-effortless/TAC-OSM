name: TAC parallel temporal order and age - NO FIT
on:
  pull_request:
    paths:
      - 'src/tac_osm/variants/parallel_time_age_world.py'
      - 'tests/test_parallel_time_age_world.py'
      - '.github/workflows/parallel-time-age-nofit.yml'
      - 'research/parallel-six/PAR-TIME-001*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nofit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependency
        run: python -m pip install --quiet torch
      - name: Compile and test timestamped chronological graph
        run: |
          python -m py_compile src/tac_osm/variants/parallel_time_age_world.py
          PYTHONPATH=src:. python -m unittest discover -s tests -p 'test_parallel_time_age_world.py' -v
          PYTHONPATH=src:. python -m unittest discover -s tests -p 'test_parallel_residual_world.py' -v
