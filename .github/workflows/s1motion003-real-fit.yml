name: S1MOTION003 original frozen real tape System1 fit
# Exactly ONE original push marker, not automatically on any research edit.
on:
  push:
    branches:
      - research/s1motion003-tape-preregister-2026-10-26
    paths:
      - research/parallel-six/S1MOTION003-FIT-001.marker
permissions:
  contents: read
jobs:
  original-three-seed-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source readers and CPU neural runtime
        run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Engineer no-leakage, equal exposure and controlled anchor tests
        run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1motion003_real_tape -v
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_system1_velocity_anchored.py -v
      - name: Fit original authentic three-seed TAC and same-anchor GRU, freeze before DEV
        run: |
          PYTHONPATH=src:. python scripts/s1motion003_real_tape_fit.py
      - name: Preserve every original FIT, optimizer and first DEV score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1motion003-original-real-tape-frozen-scores
          path: research/diagnostics/s1motion003-original/**
          if-no-files-found: warn
          retention-days: 90
