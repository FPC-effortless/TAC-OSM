name: ME101 original sensor model replay (no training)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/me101*'
      - 'src/tac_osm/variants/belief_sensor_world.py'
      - 'tests/test_belief_sensor_world.py'
      - 'research/mathematical-engineering/me101/**'
      - 'research/replay-bundles/ME101/**'
      - '.github/workflows/me101-belief-sensor.yml'
permissions:
  contents: read
jobs:
  original-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pytest
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me101/FAIR_COMPARISON.json --phase preflight
      - run: PYTHONPATH=src:. python -m pytest tests/test_belief_sensor_world.py -q
      - run: |
          set -e
          if test -f research/replay-bundles/ME101/RESULTS.json; then
            python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me101/POSTFIT.json --phase final
            PYTHONPATH=src:. python scripts/me101_belief_sensor.py replay
            PYTHONPATH=src:. python scripts/me101_fitted_graph_audit.py
            python scripts/validate_capability_progress.py research/mathematical-engineering/me101/CAPABILITY_SCORECARD.json
          else
            echo 'ME101_REPLAY=BLOCKED original trained portfolio not yet available'
          fi
