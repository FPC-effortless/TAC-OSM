name: ME062 selective forecast and Woyengi envelope contracts
on:
  pull_request:
    paths:
      - 'src/tac_osm/real_robot_me062_selective.py'
      - 'src/tac_osm/woyengi_forecast_contract.py'
      - 'tests/test_me062_selective.py'
      - 'tests/test_woyengi_forecast_contract.py'
      - 'research/mathematical-engineering/me062/**'
      - '.github/workflows/me062-selective-contract.yml'
  workflow_dispatch:
jobs:
  software-contracts-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pytest pyarrow
      - run: python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python -m pytest -q tests/test_me062_selective.py tests/test_woyengi_forecast_contract.py
      - run: python -m compileall -q src/tac_osm/real_robot_me062_selective.py src/tac_osm/woyengi_forecast_contract.py
