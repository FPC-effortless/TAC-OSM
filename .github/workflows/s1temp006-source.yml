name: S1TEMP006 1500-frame real coffee-new FIT-only source eligibility
on:
  push:
    branches: [research/s1temp006-fixed-state-slow-memory-2026-10-26]
    paths: ['research/parallel-six/S1TEMP006-SOURCE-*.marker']
permissions:
  contents: read
jobs:
  immutable-publisher-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
      - run: python scripts/s1temp006_long_real_source_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1temp006-source-only-original
          path: research/diagnostics/s1temp006-source-original/**
          if-no-files-found: warn
          retention-days: 90
