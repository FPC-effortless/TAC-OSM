name: ME004 real MetroPT model-first TAC comparison
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/me004_native_real_forecast.py
      - research/mathematical-engineering/me004/PROTOCOL.md
      - .github/workflows/me004-real-model.yml
permissions:
  contents: read
concurrency:
  group: me004-original-source-fits
  cancel-in-progress: true
jobs:
  software-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and test recurrence before data access
        run: |
          python -m py_compile scripts/me004_native_real_forecast.py
          python scripts/me004_native_real_forecast.py --self-test
  original-train-and-score:
    needs: software-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU numerical dependencies
        run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Train six fixed original models on real UCI MetroPT observations
        run: |
          python scripts/me004_native_real_forecast.py --out results/me004 | tee results-original.log
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('results/me004')
          r=json.loads((root/'results.json').read_text())
          assert r['study']=='ME004' and len(r['fits'])==6
          assert r['official_future_test_unopened'] is True
          assert r['source']['future_after_day25_not_read'] is True
          assert not r['architecture_promoted'] and not r['commercial_qualified']
          assert set((f['model'],f['seed']) for f in r['fits']) == {
            (m,s) for m in ('gru','tac_identity','tac_two_timescale') for s in (240401,240402)}
          assert len(list((root/'checkpoints').glob('*.pt')))==6
          print('Complete real-input fixed original training matrix archived')
          PY
      - name: Archive raw original evidence even on negative results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: me004-original-real-tac-models
          path: |
            results/me004/source.json
            results/me004/results.json
            results/me004/checkpoints/*.pt
            results-original.log
          if-no-files-found: ignore
          retention-days: 90
