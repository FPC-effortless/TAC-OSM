name: DIAGKEY002 oracle and frozen original 100k recurrent memory ladder - NO training
on:
  pull_request:
    paths:
      - 'scripts/diagkey002_no_fit_mechanism.py'
      - 'tests/test_diagkey002_no_fit_oracle.py'
      - 'research/mathematical-engineering/diagkey002/**'
      - '.github/workflows/diagkey002-no-fit-ladder.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: diagkey002-no-fit-memory-oracle-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  original-no-fit-keyed-mechanism-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pytest==8.4.2'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify original synthetic-only diagnostic and original memory arithmetic without fitting
        run: |
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/diagkey002/FAIR_COMPARISON.json --phase preflight
          PYTHONPATH=src:. python -m pytest -q tests/test_diagkey002_no_fit_oracle.py
      - name: Score exact onehot delta write mask, unfiltered interference, query overwrite and original frozen 20 models on 0-256 ladder
        run: |
          set -eu
          if [ -f research/replay-bundles/DIAGKEY002/ORACLE_AND_FROZEN_LADDER.json ]; then
            echo "original no-fit diagnostic already exists and must remain immutable"
          else
            PYTHONPATH=src:. python scripts/diagkey002_no_fit_mechanism.py --mode all
          fi
      - name: Generate compact actual five-seed ladder, oracle and gradient summary tied to full original SHA
        run: PYTHONPATH=src:. python scripts/diagkey002_compact_summary.py
      - name: Inspect actual original native write admission, distractor interference, read-key alignment and query-time write in five frozen models
        run: |
          if [ -f research/replay-bundles/DIAGKEY002/ACTUAL_LEARNED_WRITE_READ_GATES.json ]; then
            echo 'Already original Git-owned learned gate evidence; do not overwrite'
          else
            PYTHONPATH=src:. python scripts/diagkey002_gate_trace.py
          fi
      - name: Commit actual measured negative and positive software-only outcomes, never research superiority
        if: always()
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          if [ -f research/replay-bundles/DIAGKEY002/ORACLE_AND_FROZEN_LADDER.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f research/replay-bundles/DIAGKEY002/ORACLE_AND_FROZEN_LADDER.json research/replay-bundles/DIAGKEY002/COMPACT_AUDITED_RESULTS.json research/replay-bundles/DIAGKEY002/ACTUAL_LEARNED_WRITE_READ_GATES.json
            if ! git diff --cached --quiet; then
              git commit -m 'evidence(diagkey002): original no-fit synthetic write/read oracle and frozen model ladder; real-world claims forbidden'
              for attempt in 1 2 3 4 5 6 7 8; do
                git fetch origin "$PUSH_BRANCH"
                git rebase "origin/$PUSH_BRANCH"
                if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
                if [ "$attempt" -eq 8 ]; then exit 1; fi
              done
            fi
          fi
