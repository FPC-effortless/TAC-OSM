name: S1TEMP007 first ORIGINAL real Mobile Chair H1024 training and first DEV
on:
  push:
    branches: [research/s1temp007-multiscale-state-2026-10-26]
    paths: ['research/parallel-six/S1TEMP007-FIT-001.marker']
permissions:
  contents: read
jobs:
  first-original-source-locked-3way:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Zero training before registered source-contract tests
        run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1temp007_mobile_prefit -v
          PYTHONPATH=src:. python -m unittest tests.test_s1temp007_multiscale_memory -v
      - name: Original all nine source-trained model and optimizer states then first DEV
        run: PYTHONPATH=src:. python -u scripts/s1temp007_original_mobile_h1024_fit.py
      - name: Archive original all nine immutable SHA and first original source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1temp007-9-original-mobile-real-first-score-and-weights
          path: research/diagnostics/s1temp007-original/**
          if-no-files-found: warn
          retention-days: 90
