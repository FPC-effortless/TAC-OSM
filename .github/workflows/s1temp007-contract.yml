name: S1TEMP007 four-timescale 16D parallel/stream contract
on:
  push:
    branches: [research/s1temp007-multiscale-state-2026-10-26]
    paths:
      - 'src/tac_osm/variants/s1temp006_persistent_slow.py'
      - 'tests/test_s1temp007_multiscale_memory.py'
      - '.github/workflows/s1temp007-contract.yml'
  pull_request:
    paths:
      - 'src/tac_osm/variants/s1temp006_persistent_slow.py'
      - 'tests/test_s1temp007_multiscale_memory.py'
permissions:
  contents: read
jobs:
  matched-state-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1temp007_multiscale_memory -v
          PYTHONPATH=src:. python -m unittest tests.test_s1temp006_persistent_slow -v
          PYTHONPATH=src:. python -m unittest tests.test_research_s1temp006_adapter -v
