name: ME052 actual real-robot TAC-versus-GRU five-seed training and heldout scoring
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - research/mathematical-engineering/me052/**
      - scripts/me052_train_real_robot.py
      - scripts/me052_source_checks.py
      - scripts/validate_research_parity.py
      - tests/test_me052_original_robot_training_contract.py
      - .github/workflows/me052-real-robot-train.yml
permissions:
  contents: read
concurrency:
  group: me052-original-real-train-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  genuine-data-and-training-budget-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATEN_CPU_CAPABILITY: avx2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact pinned original CPU training dependencies
        run: |
          python -m pip install 'pytest==9.1.1' 'pyarrow==21.0.0' 'numpy==2.3.5'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify five-seed active-parameter/input and optimization contracts
        run: |
          python -m py_compile scripts/me052_train_real_robot.py scripts/me052_source_checks.py
          PYTHONPATH=src python -m pytest -q tests/test_me052_original_robot_training_contract.py
      - name: Register original published source, episode partitions and matched budgets before first fitting
        run: |
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me052/FAIR_COMPARISON.json --phase preflight
  actual-original-robot-model-fit:
    needs: genuine-data-and-training-budget-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned authentic-data model-training dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: FIT ten original TAC/GRU models on authentic actual robot observations, then score untouched original test episodes
        run: |
          set -o pipefail
          PYTHONPATH=src python -m scripts.me052_train_real_robot --output results/me052 | tee me052-original-trained-fits.log
      - name: Audit actual paired model samples, parameters, frozen weights and registered training budgets
        run: |
          python scripts/validate_research_parity.py --manifest results/me052/FAIR_COMPARISON_FINAL.json --phase final
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('results/me052/results.json').read_text())
          assert r['status']=='COMPLETE_ORIGINAL_GENUINE_TRAIN_AND_EVAL'
          assert len(r['actual_completed_training_models'])==10
          assert r['all_frozen_original_models_before_heldout_opening']
          assert r['dev_test_parquet_opened_ONLY_AFTER_all_weights_frozen']
          assert r['training_budget']['optimizer_updates_per_model']==80
          assert r['original_train_episode_count']==325
          assert set(r['TEST_ORIGINAL_REAL_MODEL_SCORES'])=={
            f'{arm}-s{seed}' for arm in ('native_tac','gru_world')
            for seed in (52001,52002,52003,52004,52005)}
          assert r['actual_parameter_data_training_budget_audit']['status'].startswith('PASS_OWNER')
          print('ME052_COMPLETED_TEN_GENUINE_REAL_WORLD_TRAINED_MODELS_AND_HELDOUT_SCORES')
          PY
      - name: Preserve trained original weights/optimizers and real heldout aggregate results, NEVER robot source frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me052-ten-original-real-robot-tac-gru-models-and-heldout-evidence
          path: |
            results/me052/results.json
            results/me052/FAIR_COMPARISON_FINAL.json
            results/me052/*-s*/
            me052-original-trained-fits.log
          if-no-files-found: ignore
          retention-days: 90
