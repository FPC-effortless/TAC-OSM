name: TAC-LANG-FORMAL-004 source-exact numerical contracts (no model fit)
on:
  push:
    branches: [research/tac-lang-formal-004-2026-10-27]
    paths:
      - 'research/language/formal-004/**'
      - '.github/workflows/tac-language-formal-004.yml'
  pull_request:
    paths:
      - 'research/language/formal-004/**'
      - '.github/workflows/tac-language-formal-004.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-geometry-and-numerical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only Torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Recheck immutable language source, causal stream and scan gradients
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        working-directory: research/language/formal-004
        run: |
          python -m py_compile verify_original_archive.py
          python -m unittest -v test_language_contract.py test_fullgraph_correspondence.py test_language_finite_difference.py test_language_nonlinear_derivatives.py test_language_tensor_rounding.py
