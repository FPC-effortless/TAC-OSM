name: ME108 original role-model replay (no training)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/tac_osm/role_optimizer.py'
      - 'scripts/me108*'
      - 'tests/test_role_optimizer.py'
      - 'tests/test_me108_role_training.py'
      - 'research/mathematical-engineering/me108-role-trained-2026-10-26/**'
      - 'research/replay-bundles/ME108/**'
      - '.github/workflows/me108-role-trained.yml'
permissions:
  contents: read
jobs:
  original-model-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.3.5 pytest
      - run: PYTHONPATH=src:. pytest -q tests/test_role_optimizer.py tests/test_me108_role_training.py
      - run: |
          set -e
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me108-role-trained-2026-10-26/FAIR_COMPARISON.json --phase preflight
          if test -f research/replay-bundles/ME108/RESULTS.json; then
            PYTHONPATH=src:. python scripts/me108_fitted_audit.py replay
            PYTHONPATH=src:. python scripts/me108_input_audit.py replay
            PYTHONPATH=src:. python scripts/me108_role_training.py replay
            PYTHONPATH=src:. python scripts/me108_summary.py
          else
            echo 'Original five-model scores not yet available; no training or new scoring performed.'
          fi
