name: ME064 authentic multitask and heldout metadata preregistration
on:
  pull_request:
    paths:
      - 'scripts/me064_register_tasks.py'
      - '.github/workflows/me064-task-registration.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  original-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publisher metadata only (no physical trajectories or outcomes)
        run: |
          PYTHONPATH=src:. python scripts/me064_register_tasks.py --cache "${{ runner.temp }}/me064-meta"
      - name: Commit metadata/task-selection receipt before FIT and unseen task are opened
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -e
          python - <<'PY'
          import json
          r=json.load(open('research/mathematical-engineering/me064/TASK_LEVEL_SPLIT.json'))
          assert r['holdout_task'] not in r['training_tasks'] and len(r['training_tasks'])==5
          assert r['training_episode_count']==160 and r['cal_episode_count']==40
          assert all(r[f'{part}_trajectory_files_opened']==0 for part in ('train','calibration','holdout'))
          print('ME064_NO_PHYSICAL_TARGET_OUTCOMES_OPENED',r['holdout_task'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/mathematical-engineering/me064/TASK_LEVEL_SPLIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(me064): freeze real FIT/CAL task-level cohorts and truly untouched task'
            for attempt in 1 2 3 4 5; do
              git fetch origin "$PUSH_BRANCH"
              git rebase "origin/$PUSH_BRANCH"
              if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
