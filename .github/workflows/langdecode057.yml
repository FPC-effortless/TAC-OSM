name: LANGDECODE057 original trained TAC batched validation CPU
on:
  pull_request:
    paths:
      - 'scripts/langdecode057_benchmark.py'
      - 'scripts/langdecode057_validation.py'
      - 'tests/test_langdecode057_validation.py'
      - 'research/mathematical-engineering/langdecode057/**'
      - 'research/phone_queue/langdecode057.json'
      - '.github/workflows/langdecode057.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-trained-causal-cpu-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Legitimate FIT source, no-fit phone plan, numerical and source owner fixture tests
        run: |
          mkdir -p langdecode057-evidence
          python scripts/phone_lab.py plan research/phone_queue/langdecode057.json > langdecode057-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langdecode057/FAIR_COMPARISON.json --phase preflight > langdecode057-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langdecode057_validation.py tests/test_langstream043.py tests/test_research_probe_agnostic.py
      - name: Retrieve original trained checkpoint with strict checksum and source provenance
        run: |
          gh run download 40797105091 --repo FPC-effortless/TAC-OSM --name LANGLAYER040-CPU-state48_no_graph-seed1701 --dir langdecode057-original/tac
      - name: Original trained unchanged graph batched validation parity and CPU cost
        run: |
          PYTHONPATH=src:. python scripts/langdecode057_benchmark.py --tac-dir langdecode057-original/tac --output langdecode057-evidence/RESULTS.json
          python - <<'PY'
          import json
          r=json.load(open('langdecode057-evidence/RESULTS.json'))
          assert r['training_updates']==0 and r['gpu_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          assert r['checkpoint_unchanged'] and len(r['results'])==2
          for row in r['results']:
              assert row['checks']['bitwise_original_incremental_logits_and_all_states']
              assert row['checks']['snapshot_bidirectional_bitwise_continuation']
              assert row['checks']['state_tensor_bytes']==3904
          PY
      - name: Archive original trained CPU outcome and failed checks without overwriting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGDECODE057-original-trained-tac-batched-validation
          path: langdecode057-evidence/
          retention-days: 90
          if-no-files-found: warn
