name: Frozen content-model historical query specificity (internal CPU research)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-query-study:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'research/frozen-content-time-specificity-2026-10-27'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fd201207cb76b30470f64e1fc1baecf9de44560d
          path: original-content-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU-only research and engineering tools
        run: |
          python -m pip install --quiet pytest numpy==2.3.3 ruff
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test scoring falsifiers and actual original graph with constructed inputs only
        env:
          PYTHONPATH: .:src
          TAC_OSM_CONTENT_QUERY_SOURCE: ${{ github.workspace }}/original-content-code
        run: |
          python -m ruff check --select E9,F63,F7,F82 scripts/audit_content_query_specificity.py src/tac_osm/historical_query_metrics.py tests/test_historical_query_metrics.py
          python -m pytest -q tests/test_historical_query_metrics.py
      - name: Preregistered CPU route and scientific scope
        run: |
          mkdir -p ci-artifacts/history-query015
          python scripts/phone_lab.py plan research/phone_queue/history-query015.json > ci-artifacts/history-query015/COMPUTE_DECISION.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/history_query015/FAIR_COMPARISON.json --phase preflight
      - name: Original licensed source archive only, no unrelated bundle members
        run: |
          python - <<'PY'
          import hashlib, io, json, urllib.request, zipfile
          from pathlib import Path
          receipt = json.loads(Path('research/mathematical-engineering/history_audit014/PUBLIC_SOURCE_RECEIPT.json').read_text())
          with urllib.request.urlopen(receipt['download_url'], timeout=90) as response:
              bundle = response.read()
          with zipfile.ZipFile(io.BytesIO(bundle)) as z:
              data = z.read(receipt['extracted_member'])
          assert hashlib.sha256(data).hexdigest() == receipt['archive_sha256']
          Path('/tmp/history-query015-original.zip').write_bytes(data)
          PY
      - name: Evaluate frozen original content models, never fit or promote
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python scripts/audit_content_query_specificity.py --execute --implementation-root original-content-code --source /tmp/history-query015-original.zip --output ci-artifacts/history-query015/RESULTS.json
      - name: Fresh-process source/checkpoint replay must be byte-identical
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python scripts/audit_content_query_specificity.py --execute --implementation-root original-content-code --source /tmp/history-query015-original.zip --output ci-artifacts/history-query015/REPLAY.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('ci-artifacts/history-query015')
          a,b = (root/'RESULTS.json').read_bytes(),(root/'REPLAY.json').read_bytes()
          assert a == b, 'original source/checkpoint replay differs'
          r = json.loads(a)
          assert r['evaluation_completed'] and not r['scientific_qualification']
          (root/'REPLAY_RECEIPT.json').write_text(json.dumps({'status':'PASS_BYTE_IDENTICAL_REPLAY','results_sha256':hashlib.sha256(a).hexdigest(),'evidence_level':'internally_measured_not_independently_qualified'},indent=2)+'\n')
          print('registered_all_seed_gate_pass',r['audit']['registered_all_seed_gate_pass'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-query015-internal-source-results
          path: ci-artifacts/history-query015/
          if-no-files-found: warn
          retention-days: 30
