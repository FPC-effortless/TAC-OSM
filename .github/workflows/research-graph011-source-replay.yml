name: GRAPH011 source checkpoint replay and memory/latency receipts
on:
  push:
    branches: [research/graph011-source-replay-space-time-2026-10-28]
  pull_request:
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Existing GRAPH009/010 numerical contracts and sparse replay
        run: |
          set -euo pipefail
          python -m py_compile research/language/flow_500k/source_checkpoint_replay_v7.py research/language/flow_500k/bench_source_checkpoint_replay_v7.py
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m unittest discover -s research/language/flow_500k -p 'test_calibrated_retrieval_v5.py' -v
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m unittest discover -s research/language/flow_500k -p 'test_learned_query_v6.py' -v
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m unittest discover -s research/language/flow_500k -p 'test_query_hybrid_v6.py' -v
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m unittest discover -s research/language/flow_500k -p 'test_source_checkpoint_replay_v7.py' -v
      - name: Genuine checked-in Python source read-only memory and replay receipts
        run: |
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python research/language/flow_500k/bench_source_checkpoint_replay_v7.py | tee /tmp/graph011_replay_real_source.json
          python -m json.tool /tmp/graph011_replay_real_source.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph011-real-source-space-time-receipts
          path: /tmp/graph011_replay_real_source.json
