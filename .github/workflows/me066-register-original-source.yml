name: ME066 prospective original real FIT/source-only four-arm registration
on:
  pull_request:
    paths:
      - 'scripts/me066_register_real_fit.py'
      - '.github/workflows/me066-register-original-source.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: me066-register-unseen-target-metadata-only
  cancel-in-progress: false
jobs:
  register-before-first-fit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}",persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Original FIT-only prospective registration; publisher target metadata only
        run: |
          if [ -f research/mathematical-engineering/me066/FAIR_COMPARISON.json ]; then
            echo 'ME066 preregistered: refuse to rewrite prospective target'
            python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me066/FAIR_COMPARISON.json --phase preflight
          else
            PYTHONPATH=src:. python scripts/me066_register_real_fit.py --source-cache "${{ runner.temp }}/me066-original-fit-only"
            python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me066/FAIR_COMPARISON.json --phase preflight
          fi
      - name: Commit metadata target selection and genuine resource registration BEFORE any fits
        if: always()
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in research/mathematical-engineering/me066/TASK_LEVEL_SPLIT.json research/mathematical-engineering/me066/FAIR_COMPARISON.json; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me066): freeze four-arm original FIT plan and new untouched task using metadata only'
            for attempt in 1 2 3 4 5; do
              git fetch origin "$PUSH_BRANCH"
              git rebase "origin/$PUSH_BRANCH"
              if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
