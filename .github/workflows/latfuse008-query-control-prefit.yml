name: LATFUSE008 genuine event-query versus fast-slow control 100k/FP32 nofit parity

on:
  push:
    branches: [research/latfuse008-matched-historic-query-control-2026-10-27]
    paths:
      - "src/tac_osm/latent_fusion_008_nonassoc_control.py"
      - "tests/test_latfuse008_noassoc_control.py"
      - "scripts/latfuse008_query_control_prefit.py"
      - "research/mathematical-engineering/latfuse008/NOFIT_REGISTRATION.json"
      - ".github/workflows/latfuse008-query-control-prefit.yml"
      - "docs/TACOSM-BASELINE-001.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latfuse008-original-frozen-query-compare-prefit
  cancel-in-progress: false

jobs:
  original-source-two-arm-no-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU FP32 PyTorch and true-source unit checks
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Enforce nofit preregistration original fixture/test baseline and source
        run: |
          python -m py_compile scripts/latfuse008_query_control_prefit.py \
            src/tac_osm/latent_fusion_008_nonassoc_control.py
          python scripts/validate_research_parity.py \
            --manifest research/mathematical-engineering/latfuse008/NOFIT_REGISTRATION.json \
            --phase preflight
          python scripts/sync_test_count.py --check
          test ! -e research/mathematical-engineering/latfuse008/NOFIT_RESULTS.json
      - name: Paired state and real historical-query matrix invariance plus gradients
        env:
          PYTHONPATH: ".:src"
        run: |
          python -m pytest -q tests/test_latfuse008_noassoc_control.py \
            tests/test_latent_fusion_007_historic_query.py \
            tests/test_latent_fusion_004_factorial.py
      - name: Original physical licensed historical source exact SHA and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse008-genuine
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse008-genuine/PRSA2017_original.zip
      - name: Original event/control true-source 88 observed steps with identical source objectives and cost profile
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/latfuse008_query_control_prefit.py \
            --source /tmp/latfuse008-genuine/PRSA2017_original.zip \
            --output research/mathematical-engineering/latfuse008/NOFIT_RESULTS.json
      - name: Preserve evidence, prohibit nofit model mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/latfuse008-matched-historic-query-control-2026-10-27
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/latfuse008/NOFIT_RESULTS.json
          git diff --cached --quiet && exit 1
          git commit -m "research: preserve true-source matched historical-query/no-association gradient and partial FLOP receipts"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Honest qualification boundary
        run: |
          echo "No model fitting, source originals unchanged. Full training forward+AD+optimizer FLOPs still unverified."
          echo "No fair architecture advantage or source-factual retrieval claim from the nofit model."
