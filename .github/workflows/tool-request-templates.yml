name: Request-only template audit - source evidence, no model
on:
  pull_request:
    paths:
      - 'src/tac_osm/request_template_audit.py'
      - 'scripts/audit_tool_request_templates.py'
      - 'tests/test_request_template_audit.py'
      - 'research/tool_template_20261113/**'
      - '.github/workflows/tool-request-templates.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install pytest==8.4.2 jsonschema==4.26.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen CPU plan, source-only and model-independent probe controls
        run: |
          mkdir -p template-evidence
          python -B scripts/phone_lab.py plan research/phone_queue/tool_template_20261113.json > template-evidence/CPU_PLAN.txt
          cmp template-evidence/CPU_PLAN.txt research/tool_template_20261113/COMPUTE_DECISION.json
          python -m pytest -q tests/test_request_template_audit.py tests/test_jsonl_byte_lineage.py tests/test_research_probe_agnostic.py --junitxml=template-evidence/TESTS.xml
      - name: Verify permanent original source receipts without model execution
        run: python -B research/tool_template_20261113/verify_saved_evidence.py
      - name: Reuse original publisher TRAIN acquisition only
        run: gh run download 42262433533 --repo FPC-effortless/TAC-OSM --name csl125-training-data --dir original-source
      - name: Audit requests against unchanged original frozen lineage
        run: |
          python -B scripts/audit_tool_request_templates.py --publisher-dir original-source/publisher --output template-evidence/audit
          cmp template-evidence/audit/RESULTS.json research/tool_template_20261113/LOCAL_RESULTS.json
          git diff --exit-code -- src/tac_osm/csl125_training_data.py research/evidence/tool_lineage_20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TOOL-TEMPLATE-20261113
          path: template-evidence/
          retention-days: 90
