name: Integrated memory DEV successor (NOT confirmatory)

on:
  workflow_dispatch:
    inputs:
      run_legacy_pilot:
        description: Explicitly retrain the legacy INTEGRATED-MEMORY-DEV-003 pilot
        type: boolean
        default: false
  pull_request:
    # Research training is explicit after the opening checkpoint.
    # Documentation pushes must not retrain the legacy development pilot.
    types: [opened, synchronize, reopened]
    paths:
      - "src/tac_osm/development/**"
      - "tests/test_integrated_memory_development.py"
      - "scripts/run_integrated_memory_dev.py"
      - "scripts/validate_integrated_memory_dev.py"
      - ".github/workflows/integrated-memory-development.yml"

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned public Veritas runtime
        uses: actions/checkout@v4
        with:
          repository: FPC-effortless/veritas
          ref: b21d829b62d3cab2811e746267ca305e110ed004
          path: .veritas-public-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU research environment
        run: |
          python -m pip install --quiet -e . -e .veritas-public-runtime pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Full suite including mechanism, gradient, causal and dispatch checks
        run: |
          ruff check --select E9,F63,F7,F82 src/tac_osm/development tests/test_integrated_memory_development.py scripts/run_integrated_memory_dev.py scripts/validate_integrated_memory_dev.py
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
      - name: Fixed-budget development pilot
        if: github.event_name == 'workflow_dispatch' && inputs.run_legacy_pilot
        run: python scripts/run_integrated_memory_dev.py
      - name: Reload checkpoints and replay all predictions and work traces
        if: github.event_name == 'workflow_dispatch' && inputs.run_legacy_pilot
        run: python scripts/validate_integrated_memory_dev.py artifacts/INTEGRATED-MEMORY-DEV-003
      - name: Preserve weights and complete per-episode evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_legacy_pilot
        uses: actions/upload-artifact@v4
        with:
          name: INTEGRATED-MEMORY-DEV-003-NOT-CONFIRMATORY
          path: artifacts/INTEGRATED-MEMORY-DEV-003/
          if-no-files-found: error
