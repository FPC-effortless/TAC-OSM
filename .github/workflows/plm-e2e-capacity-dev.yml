name: Research PLM E2E capacity development

on:
  push:
    branches:
      - research/plm-e2e-dev-capacity-2026-10-06
    paths:
      - contracts/TACOSM-PLM-INTEGRATED-E2E-CAPACITY-DEV-001.json
      - src/tac_osm/integrated_e2e_005.py
      - src/tac_osm/integrated_e2e_005_benchmark.py
      - scripts/run_integrated_e2e_005.py
      - scripts/run_plm_e2e_capacity_dev.py
      - tests/test_integrated_e2e_005.py
      - .github/workflows/plm-e2e-capacity-dev.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development:
    name: Paired capacity development benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest numpy==2.3.3 torch
          python -m pip install --quiet "ruff==0.13.0"
      - name: Static gate
        run: ruff check --select F821 src/tac_osm/integrated_e2e_005.py scripts/run_integrated_e2e_005.py scripts/run_plm_e2e_capacity_dev.py
      - name: Integrity tests
        run: python -m pytest tests/test_integrated_e2e_005.py -q
      - name: Development benchmark
        run: python scripts/run_plm_e2e_capacity_dev.py
      - name: Upload development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-INTEGRATED-E2E-CAPACITY-DEV-001
          path: artifacts/TACOSM-PLM-INTEGRATED-E2E-CAPACITY-DEV-001.json
          if-no-files-found: error

# Development only. This lane may select architecture/hyperparameters from
# the registered development split, but it never authorizes a confirmatory claim.
