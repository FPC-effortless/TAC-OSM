name: LATFUSE003 read-only original-trained head diversity and memory use audit

on:
  push:
    branches:
      - research/latfuse003-multihead-selective-2026-10-27
    paths:
      - "scripts/latfuse003_trained_head_diagnostic.py"
      - ".github/workflows/latfuse003-readonly-head-diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: latfuse003-original-trained-readonly-head-diagnostics
  cancel-in-progress: false

jobs:
  frozen-trained-real-source-input-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: CPU-only PyTorch read-only diagnosis
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Strict original source and immutable pretrained checkpoint preconditions
        run: |
          test -s research/replay-bundles/LATFUSE003/RESULTS.json
          test -s research/replay-bundles/LATFUSE003/POSTFIT_PARITY.json
          test ! -e research/mathematical-engineering/latfuse003/TRAINED_HEAD_DIAGNOSTIC.json
          python scripts/validate_research_parity.py \
            --manifest research/replay-bundles/LATFUSE003/POSTFIT_PARITY.json \
            --phase final
      - name: Authenticate original 12-station sensor zip via historical source git SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse003-head-source
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse003-head-source/PRSA2017_original.zip
      - name: Original checkpoints trained source-key and head-routing diagnostic
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/latfuse003_trained_head_diagnostic.py \
            --source /tmp/latfuse003-head-source/PRSA2017_original.zip \
            --output research/mathematical-engineering/latfuse003/TRAINED_HEAD_DIAGNOSTIC.json
      - name: Preserve actual source-conditioned read-only diagnostic and original models untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/latfuse003-multihead-selective-2026-10-27
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/latfuse003/TRAINED_HEAD_DIAGNOSTIC.json
          git diff --cached --quiet && exit 1
          git commit -m "research: retain original trained source head routing and key alias diagnostics"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Scientific limits
        run: |
          echo "Only original FIT source inputs; no outcomes or optimizer, no protected 2016-2017."
          echo "Head diversity in FIT is not exact recall, causal/decision utility or proof of all-channel calibration."
