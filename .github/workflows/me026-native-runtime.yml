name: ME026 native runtime mathematical and regression checks
on:
  pull_request:
    paths:
      - src/tac_osm/native_forecast_runtime.py
      - scripts/me026_*.py
      - scripts/me025_recorded_audit.py
      - tests/test_native_forecast_runtime.py
      - research/mathematical-engineering/me026/**
      - .github/workflows/me026-native-runtime.yml
permissions:
  contents: read
jobs:
  mathematics-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Active-head leakage falsifier, affine segments, streaming and full regression
        run: python -m pytest -q
