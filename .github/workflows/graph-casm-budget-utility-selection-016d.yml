name: Research G-CASM budget utility selection 016D

on:
  push:
    branches:
      - research/graph-casm-budget-utility-selection-016d
    paths:
      - contracts/TACOSM-GRAPH-CASM-BUDGET-UTILITY-SELECTION-016D.json
      - docs/AUDIT-TACOSM-GRAPH-CASM-BUDGET-UTILITY-SELECTION-016D.md
      - scripts/run_graph_casm_budget_utility_selection_016d.py
      - scripts/run_graph_casm_structured_action_probe_015.py
      - src/tac_osm/trace_capability.py
      - tests/test_trace_capability.py
      - .github/workflows/graph-casm-budget-utility-selection-016d.yml
      - docs/TACOSM-BASELINE-001.md
      - tests/test_integrity.py
  pull_request:
    branches:
      - research/graph-casm-structured-action-probe-015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: G-CASM-016D smoke/preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/cdl-attention-experiment
          ref: c31554413301e3c9d3e6b3f8c8c6be572a74a748
          path: third_party/cdl-attention-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -e . pytest torch
      - name: Contract validation
        run: |
          python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-GRAPH-CASM-BUDGET-UTILITY-SELECTION-016D")
          assert c.check_consistency() == []
          assert c.primary_endpoint() == "budget_capped_utility_delta_m512_b8"
          PY
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: Focused tests
        run: python -m pytest tests/test_trace_capability.py -q
      - name: Smoke measurement
        run: python scripts/run_graph_casm_budget_utility_selection_016d.py --smoke
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-GRAPH-CASM-BUDGET-UTILITY-SELECTION-016D-smoke
          path: artifacts/TACOSM-GRAPH-CASM-BUDGET-UTILITY-SELECTION-016D.json
          if-no-files-found: ignore

  full:
    name: G-CASM-016D full confirmatory measurement
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(toJSON(github.event.commits), '[run-graph-casm-budget-utility-selection-016D-full]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/cdl-attention-experiment
          ref: c31554413301e3c9d3e6b3f8c8c6be572a74a748
          path: third_party/cdl-attention-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -e . pytest torch
      - name: Contract validation
        run: |
          python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-GRAPH-CASM-BUDGET-UTILITY-SELECTION-016D")
          assert c.check_consistency() == []
          c.require_levels((32,64,128,256,512))
          c.require_seeds((0,1,2,3,4))
          c.require_steps(1)
          c.require_eval_steps(32)
          c.require_arms(["information_per_work","budget_utility_per_work"])
          PY
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: Focused tests
        run: python -m pytest tests/test_trace_capability.py -q
      - name: Full measurement
        run: python scripts/run_graph_casm_budget_utility_selection_016d.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-GRAPH-CASM-BUDGET-UTILITY-SELECTION-016D
          path: artifacts/TACOSM-GRAPH-CASM-BUDGET-UTILITY-SELECTION-016D.json
          if-no-files-found: error

# Confirmatory run is marker/manual triggered after implementation audit.
# [run-graph-casm-budget-utility-selection-016D-full]
