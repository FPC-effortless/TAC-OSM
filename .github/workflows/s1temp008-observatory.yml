name: S1TEMP008 actual native source-indexed generic Observatory tests
on:
  push:
    branches: [research/s1temp008-source-entity-retention-2026-10-26]
    paths:
      - 'src/tac_osm/research_s1temp008_adapter.py'
      - 'tests/test_research_s1temp008_adapter.py'
      - '.github/workflows/s1temp008-observatory.yml'
  pull_request:
    paths:
      - 'src/tac_osm/research_s1temp008_adapter.py'
      - 'tests/test_research_s1temp008_adapter.py'
permissions:
  contents: read
jobs:
  actual-source-name-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          PYTHONPATH=src:. python -m unittest tests.test_research_s1temp008_adapter -v
          PYTHONPATH=src:. python -m unittest tests.test_s1temp008_native_entity_model -v
