name: Research C5 persistent relational full loop

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Full repository suite
        run: python -m pytest tests/ -q
      - name: Run persistent relational full loop
        run: python scripts/run_c5_persistent_relational_loop_001.py
      - name: Upload persistent relational artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-C5-PERSISTENT-RELATIONAL-LOOP-001
          path: artifacts/TACOSM-C5-PERSISTENT-RELATIONAL-LOOP-001.json
          if-no-files-found: error
