name: MODEL01 native 103252p authentic UCI374 FIT and original Git clean replay
on:
  push:
    branches:
      - research/model01-native-tac-capability-fit-2026-10-27
    paths:
      - 'specialist_models/model01_native_tac_real_fit.py'
      - 'tests/test_model01_native_tac_real_fit.py'
      - 'research/registrations/MODEL01-TAC-REAL-FIT-001.md'
      - '.github/workflows/model01-native-tac-real-fit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fit-original-real-development:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    concurrency:
      group: model01-tac-native-original-fit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only numeric training dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==2.2.6'
          python -m pip install --disable-pip-version-check --no-cache-dir 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Test parameter, gradient, FIT gate, future-proof source windows and checkpoint mechanics
        run: python -m unittest discover -s tests -p 'test_model01_native_tac_real_fit.py' -v
      - name: Fit three ORIGINAL authentic source development candidates only if Git originals absent
        env:
          MODEL01_REAL_FIT_ENABLE: EXPLICIT_CPU_DEV_FIT
        run: |
          set -euo pipefail
          mkdir -p research/replay-bundles/MODEL01-TAC-REAL-FIT-001
          ORIGINAL=research/replay-bundles/MODEL01-TAC-REAL-FIT-001/ORIGINAL_FIT.json
          if [ -e "$ORIGINAL" ]; then
            echo 'ORIGINAL_FIT_ALREADY_GIT_OWNED=TRUE (no refit)'
          else
            python specialist_models/model01_native_tac_real_fit.py --out "$ORIGINAL"
            python - <<'PY'
          import json
          x=json.load(open('research/replay-bundles/MODEL01-TAC-REAL-FIT-001/ORIGINAL_FIT.json'))
          assert x['trainable_params']==x['deployed_params']==103252
          assert len(x['runs'])==3
          assert x['original_protected_tail_parsed'] is False
          for r in x['runs']:
            assert r['dev']['n']==1968
            assert len(r['checkpoint_b64_gzip'])>1000000
          print('REAL_UCI374_FIT_CHECKPOINTS_CREATED_NOT_YET_INDEPENDENT')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ORIGINAL"
            git commit -m "research: preserve all three original real UCI native TAC checkpoints and DEV scores"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
      - name: Clean original-source replay with zero model fitting
        run: |
          python specialist_models/model01_native_tac_real_fit.py \
            --replay-from research/replay-bundles/MODEL01-TAC-REAL-FIT-001/ORIGINAL_FIT.json \
            --out original_no_refit_replay_receipt.json
          python - <<'PY'
          import json
          x=json.load(open('original_no_refit_replay_receipt.json'))
          assert len(x['results'])==3
          assert all(r['CAL_DEV_replayed_within_1e6'] is True and not r['fitted_during_replay'] for r in x['results'])
          assert x['scientific_status']=='REPLAY_VERIFIED_EXPOSED_DEV_ONLY'
          print('ORIGINAL_THREE_SEED_NO_REFIT_DEV_REPLAY=PASS')
          print('ORIGINAL_CHECKPOINT_DIGESTS='+json.dumps([r['original_checkpoint_sha256'] for r in x['results']]))
          PY
      - name: Retain reproducible original replay evidence (no source raw rows)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model01-native-103252p-original-source-fit-replay
          path: |
            research/replay-bundles/MODEL01-TAC-REAL-FIT-001/ORIGINAL_FIT.json
            original_no_refit_replay_receipt.json
          if-no-files-found: warn
          retention-days: 14
