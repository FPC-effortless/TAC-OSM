name: PNDS mathematics links
on:
  pull_request:
    paths:
      - research/pnds-variant-math-links.json
      - research/scripts/check_pnds_math_links.py
      - research/scripts/check_pnds_remote_parity.py
      - .github/workflows/pnds-math-link-gate.yml
  workflow_dispatch:

jobs:
  mathematical-variant-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate every original source-pinned variant and dual formulation reference
        run: python3 research/scripts/check_pnds_math_links.py
      - name: Verify byte-equivalent semantic JSON in PNDS remote draft branch
        run: |
          if [ "$GITHUB_HEAD_REF" = 'research/langmath101-trained-program-2026-10-31' ]; then
            python3 research/scripts/check_pnds_remote_parity.py --peer-ref 10915b43540307ef3dff8ebe98efe5a08e6d4008
          elif [ "$GITHUB_HEAD_REF" = 'research/query-diverse-history-training-2026-10-27' ]; then
            python3 research/scripts/check_pnds_remote_parity.py --peer-ref 25d774bd9bf8cbbfaec132460e83cf836965cba3
          elif [ "$GITHUB_HEAD_REF" = 'research/langtrain099-trained-10m-2026-10-30' ]; then
            python3 research/scripts/check_pnds_remote_parity.py --peer-ref 7040e70d7febc553dbace036fcac29eebfa75ff3
          else
            python3 research/scripts/check_pnds_remote_parity.py
          fi
