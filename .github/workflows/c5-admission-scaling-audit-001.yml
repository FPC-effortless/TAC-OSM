name: Research C5 admission scaling audit

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Full repository suite
        run: python -m pytest tests/ -q
      - name: Run C5 admission/scaling audit
        run: python scripts/run_c5_admission_scaling_audit_001.py
      - name: Upload C5 admission/scaling artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-C5-ADMISSION-SCALING-AUDIT-001
          path: artifacts/TACOSM-C5-ADMISSION-SCALING-AUDIT-001.json
          if-no-files-found: error
