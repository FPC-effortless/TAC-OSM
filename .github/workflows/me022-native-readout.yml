name: ME022 native readout mathematical preflight
on:
  pull_request:
    paths:
      - scripts/me022_native_readout.py
      - scripts/me022_replay.py
      - scripts/me022_summarize.py
      - research/mathematical-engineering/me022/**
      - .github/workflows/me022-native-readout.yml
permissions:
  contents: read
jobs:
  preflight-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the executed CPU numerical environment
        run: |
          python -m pip install 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Algebra, capacity and gradients only; no data download or fitting
        run: python -m scripts.me022_native_readout --self-test
      - name: Repository regression suite
        run: python -m pytest -q
