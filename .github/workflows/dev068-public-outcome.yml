name: Recorded public-outcome control
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/dev068-public-outcome/**'
      - 'src/tac_osm/development/public_outcome.py'
      - 'scripts/*public_outcome_dev068.py'
      - 'scripts/diagnose_world_interface_dev068.py'
      - 'tests/test_public_outcome_dev068.py'
      - '.github/workflows/dev068-public-outcome.yml'
permissions:
  contents: read
jobs:
  strict-public-outcome-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 100
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/veritas
          ref: b21d829b62d3cab2811e746267ca305e110ed004
          path: .veritas-public-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e . -e .veritas-public-runtime numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python scripts/restore_public_outcome_dev068.py
          python scripts/audit_public_outcome_dev068.py --directory results/dev068-main --output results/dev068-remote-audit.json --exports results/dev068-remote-agents --veritas .veritas-public-runtime --reconstruct-data
          python scripts/analyze_public_outcome_dev068.py --directory results/dev068-main --output results/dev068-remote-statistics.json
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from audit_identity_dev0615 import compare
          r=Path('results/dev068-main')
          assert not (r/'TEST-OPENED.json').exists()
          audit=json.load(open('results/dev068-remote-audit.json'))
          assert audit['status']=='COMPLETE' and audit['checkpoints']==88
          assert audit['reconstructed_datasets']==2 and audit['native_actions']==4114
          assert audit['portable_decisions']==29 and audit['telemetry']['max_abs']<=1e-8
          compare(json.load(open('results/dev068-remote-statistics.json')),json.load(open('research/dev068-public-outcome/statistics.json')),{'values':0,'max_abs':0.})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev068-restored-negative-matrix
          path: |
            results/dev068-remote-*.json
            results/dev068-remote-agents/**
          if-no-files-found: ignore
