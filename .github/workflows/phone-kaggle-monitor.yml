name: Phone Research Lab • Kaggle status to Issues

# Poll status only. No spending GPU minutes, new submission or downloads.
on:
  schedule:
    - cron: '47 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: phone-lab-kaggle-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Kaggle state without leaking credentials
        env:
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ci-artifacts/kaggle-monitor
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Kaggle credentials not configured; no remote progress can be asserted" >> "$GITHUB_STEP_SUMMARY"
            echo '{"state":"UNCONFIGURED_NOT_SUBMITTED"}' > ci-artifacts/kaggle-monitor/unconfigured.json
            python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from phone_lab import update_issue
          update_issue(
              os.environ["GITHUB_REPOSITORY"], 473,
              "<!-- tac-osm-phone-lab-status -->\n### Kaggle dual-T4 research status\n\n"
              "**Status: UNCONFIGURED — no remote job submitted.**\n\n"
              "The Kaggle owner token, account name and protected execution "
              "approval are required before GPU use. There is no scientific "
              "result to evaluate.\n",
              os.environ["GH_TOKEN"])
          PY
            exit 0
          fi
          python -m pip install --quiet kaggle
          python scripts/monitor_phone_kaggle.py \
            --proposal research/phone_queue/kaggle-dual-t4-smoke.json \
            --username "$KAGGLE_USERNAME" --out ci-artifacts/kaggle-monitor \
            --post-issue
      - name: Archive read-only remote status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-phone-status
          path: ci-artifacts/kaggle-monitor/
          retention-days: 14
          if-no-files-found: warn
