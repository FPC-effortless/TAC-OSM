name: ME001B real SCANIA native TAC train-internal study
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/me001b_real_native_tac.py
      - research/mathematical-engineering/me001b/PROTOCOL.md
      - .github/workflows/me001b-native-scania.yml
permissions:
  contents: read
concurrency:
  group: me001b-real-frozen-protocol
  cancel-in-progress: true
jobs:
  property-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical CPU dependencies
        run: |
          python -m pip install numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify native source and mathematical contracts, without datasets
        run: |
          python -m py_compile scripts/me001b_real_native_tac.py
          python -m scripts.me001b_real_native_tac --property-only
  original-train-internal-real:
    needs: property-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU training dependencies
        run: |
          python -m pip install numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fit original nine models only against authentic publisher TRAIN records
        run: |
          python -m scripts.me001b_real_native_tac --output results/me001b | tee original-log.txt
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("results/me001b")
          d=json.loads((r/"results.json").read_text())
          assert d["study"] == "ME001B"
          assert d["kind"] == "TRAIN_INTERNAL_EXPLORATORY_REAL"
          assert not d["official_validation_read"] and not d["official_test_read"]
          assert not d["entity_discovery_tested"] and not d["decision_utility_tested"] and not d["promoted"]
          assert d["source"]["test_entries_read"] is False
          assert d["source"]["publisher_validation_entries_read"] is False
          assert d["cohort"]["original_train_vehicle_count"] == 23550
          assert len(d["fits"]) == 9
          assert set((x["model"],x["seed"]) for x in d["fits"]) == {
            (m,s) for m in ("linear_history","global_gru","native_tac_assembly")
                  for s in (119001,119002,119003)
          }
          assert len(list((r/"checkpoints").glob("*.pt"))) == 9
          assert all(x["sha256"] for x in d["fits"])
          print("ME001B recorded real source, fit evidence and no-promotion checks passed.")
          PY
      - name: Archive immutable original evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me001b-original-scania-train-internal
          path: |
            results/me001b/source.json
            results/me001b/results.json
            results/me001b/checkpoints/*.pt
            original-log.txt
          if-no-files-found: ignore
          retention-days: 90
