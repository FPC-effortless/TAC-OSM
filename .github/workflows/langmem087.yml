name: LANGMEM087 stage A unchanged duration and old-slow attribution
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/mathematical-engineering/langmem087/**'
      - 'research/phone_queue/langmem087*'
      - 'scripts/langmem087*'
      - 'tests/test_langmem087.py'
      - '.github/workflows/langmem087.yml'
permissions:
  contents: read
  actions: read
jobs:
  registered-launch:
    if: github.head_ref == 'research/langmem087-duration-old-slow-controls-2026-10-30' && github.event.pull_request.head.repo.full_name == 'FPC-effortless/TAC-OSM'
    runs-on: ubuntu-24.04
    outputs:
      launch: ${{ steps.launch.outputs.launch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: launch
        shell: bash
        run: |
          if [[ "$(git log -1 --format=%s)" == "LANGMEM087-TRAIN:"* ]]; then
            echo 'launch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'launch=false' >> "$GITHUB_OUTPUT"
            echo 'No new training or DEV access on report/bridge/test updates.'
          fi
  continue640:
    needs: registered-launch
    if: needs.registered-launch.outputs.launch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [1701,1702,1703]
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact original CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Preflight source controls and planner before continuation
        run: |
          mkdir -p evidence087
          PYTHONPATH=src:. python scripts/phone_lab.py plan research/phone_queue/langmem087-continue640.json > evidence087/PLAN.json
          PYTHONPATH=src:. python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langmem087/FAIR_COMPARISON.json --phase preflight > evidence087/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langmem087.py tests/test_langmem086.py tests/test_research_probe_agnostic.py
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/FPC-effortless/pnds-lean/PNDS087_PIN/foundation/v1/langmem087_historical.py --output /tmp/langmem087_historical.py
          PYTHONPATH=src:. python scripts/langmem087_math_parity.py --reference /tmp/langmem087_historical.py > evidence087/PNDS087_PARITY.json
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/FPC-effortless/pnds-lean/0fd3c5006326a98107de2d02c63a6107226615b9/foundation/v1/langmem086_autonomous.py --output /tmp/langmem086_autonomous.py
          PYTHONPATH=src:. python scripts/langmem086_math_parity.py --reference /tmp/langmem086_autonomous.py > evidence087/PNDS086_PARITY.json
      - name: Restore original sealed160 optimizer and continue unchanged to640, no new DEV present
        run: |
          gh run download 40979123121 -R FPC-effortless/TAC-OSM --name 'LANGMEM086-TRAINED-seed${{ matrix.seed }}' --dir original086
          PYTHONPATH=src:. python scripts/langmem087_run.py continue --seed ${{ matrix.seed }} --trained original086/TRAINED --steps 640 --output evidence087/TRAINED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGMEM087-640-seed${{ matrix.seed }}
          path: evidence087/
          retention-days: 90
          if-no-files-found: warn
  continue1280:
    needs: [registered-launch,continue640]
    if: needs.registered-launch.outputs.launch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [1701,1702,1703]
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore sealed640 optimizer and continue unchanged to1280
        run: |
          mkdir -p evidence087
          PYTHONPATH=src:. python scripts/phone_lab.py plan research/phone_queue/langmem087-continue1280.json > evidence087/PLAN.json
          gh run download '${{ github.run_id }}' -R FPC-effortless/TAC-OSM --name 'LANGMEM087-640-seed${{ matrix.seed }}' --dir parent640
          PYTHONPATH=src:. python scripts/langmem087_run.py continue --seed ${{ matrix.seed }} --trained parent640/TRAINED --steps 1280 --output evidence087/TRAINED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGMEM087-1280-seed${{ matrix.seed }}
          path: evidence087/
          retention-days: 90
          if-no-files-found: warn
  first-new-documents:
    needs: [registered-launch,continue1280]
    if: needs.registered-launch.outputs.launch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [1701,1702,1703]
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: All seed fits finished before FIRST087 raw DEV acquisition
        run: |
          PYTHONPATH=src:. python scripts/phone_lab.py plan research/phone_queue/langmem087-evaluate.json
          mkdir -p new-rust087
          curl --fail --silent --show-error --location --retry 2 https://raw.githubusercontent.com/rust-lang/book/2771df165f092a4fbb9f46b5b2e7450f19010adb/src/ch07-01-packages-and-crates.md --output new-rust087/ch07-01-packages-and-crates.md
          curl --fail --silent --show-error --location --retry 2 https://raw.githubusercontent.com/rust-lang/book/2771df165f092a4fbb9f46b5b2e7450f19010adb/src/ch09-01-unrecoverable-errors-with-panic.md --output new-rust087/ch09-01-unrecoverable-errors-with-panic.md
      - name: Same cohort at all three immutable durations, no fitting in this job
        run: |
          gh run download 40979123121 -R FPC-effortless/TAC-OSM --name 'LANGMEM086-TRAINED-seed${{ matrix.seed }}' --dir evaluated/step160
          gh run download '${{ github.run_id }}' -R FPC-effortless/TAC-OSM --name 'LANGMEM087-640-seed${{ matrix.seed }}' --dir evaluated/step640
          gh run download '${{ github.run_id }}' -R FPC-effortless/TAC-OSM --name 'LANGMEM087-1280-seed${{ matrix.seed }}' --dir evaluated/step1280
          PYTHONPATH=src:. python scripts/langmem087_run.py evaluate --seed ${{ matrix.seed }} --trained evaluated/step160/TRAINED --documents new-rust087 --output evaluated/step160/EVAL_RECEIPT087.json
          PYTHONPATH=src:. python scripts/langmem087_run.py evaluate --seed ${{ matrix.seed }} --trained evaluated/step640/TRAINED --documents new-rust087 --output evaluated/step640/EVAL_RECEIPT.json
          PYTHONPATH=src:. python scripts/langmem087_run.py evaluate --seed ${{ matrix.seed }} --trained evaluated/step1280/TRAINED --documents new-rust087 --output evaluated/step1280/EVAL_RECEIPT.json
          rm evaluated/step160/EVAL_RECEIPT.json
          mv evaluated/step160/EVAL_RECEIPT087.json evaluated/step160/EVAL_RECEIPT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGMEM087-EVAL-seed${{ matrix.seed }}
          path: evaluated/
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    needs: [registered-launch,first-new-documents]
    if: always() && needs.registered-launch.outputs.launch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Strict original artifact aggregation, no fit or source DEV text
        run: |
          gh run download '${{ github.run_id }}' -R FPC-effortless/TAC-OSM --pattern 'LANGMEM087-EVAL-seed*' --dir raw087
          python scripts/langmem087_aggregate.py --results raw087 --output aggregate087/RESULTS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGMEM087-DURATION-AGGREGATE
          path: aggregate087/
          retention-days: 90
