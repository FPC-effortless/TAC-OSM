name: ME077 original real selective-state replay (never retrain)
on:
  pull_request:
    paths: ['scripts/me077*', 'src/tac_osm/variants/selective_physical.py', 'research/mathematical-engineering/me077/**', 'research/replay-bundles/ME077/**', '.github/workflows/me077-selective-real-replay.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python -m pytest -q tests/test_me077_selective_physical.py tests/test_capability_progress_truth_gate.py
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me077/FAIR_COMPARISON.json --phase preflight
      - name: Verify original guarded fit receipts
        if: hashFiles('research/replay-bundles/ME077/FIT_INDEX.json') != ''
        run: PYTHONPATH=src:. python scripts/me077_selective_physical.py finalize
      - name: Final parameter gate
        if: hashFiles('research/replay-bundles/ME077/FIT_INDEX.json') != ''
        run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me077/FINAL_COMPARISON.json --phase final
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/me077-source
          key: me077-original-bodenai-source-v1
      - name: Independently restore and score original real models
        if: hashFiles('research/replay-bundles/ME077/ORIGINAL_SUMMARY.json') != ''
        run: PYTHONPATH=src:. python scripts/me077_selective_physical.py replay --cache "${{ runner.temp }}/me077-source"
      - name: Preserve replay receipt in authorized job log (no fitting)
        if: hashFiles('research/replay-bundles/ME077/ORIGINAL_SUMMARY.json') != ''
        run: |
          python - <<'PYLOG'
          import json
          from pathlib import Path
          print('ME077_EXTERNAL_REPLAY=' + json.dumps(json.loads(Path('research/replay-bundles/ME077/INDEPENDENT_REPLAY.json').read_text()), sort_keys=True))
          PYLOG
      - name: Validate declared capability limits
        if: hashFiles('research/mathematical-engineering/me077/CAPABILITY_SCORECARD.json') != ''
        run: python scripts/validate_capability_progress.py research/mathematical-engineering/me077/CAPABILITY_SCORECARD.json
