name: ESWAM012 real fitted multiagent predictive world-model comparison
on:
  pull_request:
    paths:
      - "src/tac_osm/variants/eswam012_multiagent.py"
      - "scripts/eswam012_train_original_multiagent.py"
      - ".github/workflows/eswam012-authentic-multiagent-training.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eswam012-authentic-256-history-research
  cancel-in-progress: false
jobs:
  real-fitted-matched-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eswam012-real-multiagent-learned-dynamics-2026-10-24
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install single shared real-model training environment
        run: |
          python -m pip install 'numpy==2.3.5'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Strict original model parameter and graph tests BEFORE data or fit
        run: |
          python -m py_compile scripts/eswam012_train_original_multiagent.py src/tac_osm/variants/eswam012_multiagent.py
          PYTHONPATH=src:. python scripts/eswam012_train_original_multiagent.py preflight
      - name: Cache verified publisher-original licensed source OUTSIDE Git
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/interaction_TC_original.zip
          key: eswam012-interaction-tc-publisher-original-sha9aa7810
      - name: Certify original source SHA256 unchanged
        run: |
          if test ! -f "${{ runner.temp }}/interaction_TC_original.zip"; then
            curl --fail --location --retry 3 --silent --show-error               -o "${{ runner.temp }}/interaction_TC_original.zip"               "https://huggingface.co/datasets/INTERACTION-dataset/INTERACTION-dataset/resolve/3587152b529f26649ada0838a308eeaf77f5bdc2/INTERACTION-Dataset-TC-v1_0.zip"
          fi
          printf '9aa78102006dc8d8a64675cf64eba5264085cfb1c006b1f4d0e856d94e657aec  %s\n' "${{ runner.temp }}/interaction_TC_original.zip" | sha256sum --check
      - name: Factual FIT and previously exposed DEV strict same-source eligibility before optimizer
        run: |
          PYTHONPATH=src:. python scripts/eswam012_train_original_multiagent.py source-summary             --archive "${{ runner.temp }}/interaction_TC_original.zip"
      - name: Fit FIVE genuine observed-history model families for TWO seeds and evaluate true real futures
        run: |
          PYTHONPATH=src:. python -u scripts/eswam012_train_original_multiagent.py fit             --archive "${{ runner.temp }}/interaction_TC_original.zip"             --out research/replay-bundles/ESWAM012
      - name: Preserve all actual fitted original real checkpoints and per-case scores as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eswam012-ten-original-real-trained-models
          path: research/replay-bundles/ESWAM012/
          retention-days: 90
      - name: Freeze every fitted real weight, optimizer/RNG and original per-case source output in Git
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/replay-bundles/ESWAM012
          git commit -m 'research(eswam012): freeze all ten original real fitted models and observed outcomes'
          git push origin HEAD:refs/heads/research/eswam012-real-multiagent-learned-dynamics-2026-10-24
