name: PLM top-down memory isolation 001
on:
  pull_request:
  push:
    branches: ["research/plm-topdown-memory-isolation-001"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirmatory:
    name: confirmatory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned measurement dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "numpy==2.3.3" pytest
      - name: Contract validation
        run: PYTHONPATH=src python -c "from tac_osm.contract import validate; p=validate(); print('all experiment contracts valid') if not p else (print('\n'.join(p)), exit(1))"
      - name: Unified research preflight
        run: python scripts/research_gate.py
      - name: Focused tests
        run: PYTHONPATH=src python -m pytest tests/test_plm_topdown_memory_isolation_001.py tests/test_research_governance.py -q
      - name: Full repository tests
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: Measurement
        run: |
          mkdir -p /tmp/memory-isolation-results
          PYTHONPATH=src python scripts/measure_plm_topdown_memory_isolation_001.py             --commit "$(git rev-parse HEAD)"             --output /tmp/memory-isolation-results/result.json
      - name: Post-run invariant validation
        run: PYTHONPATH=src python scripts/validate_plm_topdown_memory_isolation_001.py /tmp/memory-isolation-results/result.json
      - name: Independent recomputation
        run: PYTHONPATH=src python scripts/analyze_plm_topdown_memory_isolation_001.py /tmp/memory-isolation-results/result.json
      - name: Upload measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-TDBU-MEMORY-ISOLATION-001
          path: /tmp/memory-isolation-results/result.json
