name: ME053 diagnose real robot belief instability without model retraining
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/me053_frozen_real_feedback_forensics.py
      - .github/workflows/me053-original-real-dev-feedback-forensics.yml
      - research/mathematical-engineering/me053/**
permissions:
  contents: read
  actions: read
concurrency:
  group: me053-original-DEV-diagnostic-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  real-model-frozen-DEV-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Use original exact PyTorch and publisher Parquet evaluation environment
        run: |
          python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Restore ten frozen original genuinely trained world-model checkpoints (NO FIT)
        uses: actions/download-artifact@v4
        with:
          name: me052-ten-original-real-robot-tac-gru-models-and-heldout-evidence
          run-id: 39714369920
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Run original DEV-only real trajectory stability / feedback forensics without updating any weights
        run: |
          set -o pipefail
          python -m py_compile scripts/me053_frozen_real_feedback_forensics.py
          PYTHONPATH=src python -m scripts.me053_frozen_real_feedback_forensics --root results/me052 --receipt results/me053/original-real-dev-feedback-forensics.json | tee me053-authentic-real-DEV-diagnostics.log
      - name: Require original DEV evidence and all feedback comparison modes, no training
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,math
          x=json.loads(Path('results/me053/original-real-dev-feedback-forensics.json').read_text())
          assert x['status']=='ORIGINAL_REAL_DEV_DIAGNOSTIC_COMPLETE__ZERO_TRAINING'
          assert x['model_optimizer_updates']==0 and x['actual_model_fits']==0
          assert x['original_TEST_trajectories_not_opened']
          assert len(x['selected_original_DEV_IDs'])==12
          assert set(x['scores'])=={'native_tac','gru_world'}
          for m in x['scores'].values():
              assert set(m)=={'52001','52003'}
              for scores in m.values():
                  assert set(scores)=={'full_original_feedback','physical_only','no_feedback'}
                  for a in scores.values():
                      assert math.isfinite(a['original_DEV_physical_MAE'])
                      assert a['original_DEV_physical_MAE']>=0
          print('ME053_ORIGINAL_FROZEN_MODEL_REAL_DEV_DIAGNOSTIC_COMPLETE')
          PY
      - name: Preserve original source-hashed DEV diagnostic WITHOUT source frames or new trained checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me053-original-12-DEV-robot-episodes-TAC-GRU-bounded-feedback-forensic-report
          path: |
            results/me053/original-real-dev-feedback-forensics.json
            me053-authentic-real-DEV-diagnostics.log
          if-no-files-found: ignore
          retention-days: 90
