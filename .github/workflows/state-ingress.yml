name: Restored memory-state contract - no fit
on:
  pull_request:
    paths:
      - 'src/tac_osm/state_ingress.py'
      - 'tests/test_state_ingress.py'
      - 'research/state_ingress_20261110/**'
      - '.github/workflows/state-ingress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install pytest==8.4.2 numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen source and CPU plan
        run: |
          mkdir -p ingress-evidence
          python -B scripts/phone_lab.py plan research/phone_queue/state_ingress_20261110.json > ingress-evidence/CPU_PLAN.json
          cmp ingress-evidence/CPU_PLAN.json research/state_ingress_20261110/COMPUTE_DECISION.json
          python - <<'PY'
          import hashlib,json,pathlib
          p=json.load(open('research/state_ingress_20261110/PROTOCOL.json'))
          assert all(hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h for f,h in p['source_pins'].items())
          print('Original learned source/precision/copy pins unchanged')
          PY
      - name: Ingress negative controls, actual state/AD, inherited source checks
        run: |
          PYTHONPATH=src:. python -m pytest -q tests/test_state_ingress.py tests/test_csl125_memory_precision.py tests/test_csl125_r3.py tests/test_csl125_tool_model.py tests/test_research_probe_agnostic.py --junitxml=ingress-evidence/TESTS.xml
      - name: Record exact current source and scope
        if: always()
        run: |
          git rev-parse HEAD > ingress-evidence/COMMIT.txt
          sha256sum src/tac_osm/state_ingress.py research/state_ingress_20261110/reference.py > ingress-evidence/SOURCE_SHA256.txt
          cp research/state_ingress_20261110/PROTOCOL.json ingress-evidence/
      - name: Verify original saved evidence without model execution
        if: hashFiles('research/evidence/state_ingress_20261110/verify_saved.py') != ''
        run: python -B research/evidence/state_ingress_20261110/verify_saved.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STATE-INGRESS-20261110-engineering
          path: ingress-evidence/
          retention-days: 90
