name: S1MOTION004 no-fit integrity and real runner preflight
on:
  push:
    branches: [research/s1motion004-point-gradient-isolation-2026-10-26]
    paths:
      - 'scripts/s1motion004_real_towel_fit.py'
      - 'tests/test_s1motion004_real_fit_contract.py'
      - '.github/workflows/s1motion004-prefit.yml'
  pull_request:
    paths:
      - 'scripts/s1motion004_real_towel_fit.py'
      - 'tests/test_s1motion004_real_fit_contract.py'
      - '.github/workflows/s1motion004-prefit.yml'
permissions:
  contents: read
jobs:
  source-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m py_compile scripts/s1motion004_real_towel_fit.py
          PYTHONPATH=src:. python -m unittest tests.test_s1motion004_real_fit_contract -v
          PYTHONPATH=src:. python -m unittest tests.test_s1motion004_gradient_routes -v
