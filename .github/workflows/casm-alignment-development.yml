name: TAC-OSM CASM aligned historical supervision DEV-013 (NOT confirmatory)

on:
  pull_request:
    paths:
      - "src/tac_osm/development/casm_readout_alignment.py"
      - "tests/test_casm_alignment_development.py"
      - "scripts/run_casm_alignment_dev.py"
      - "scripts/validate_casm_alignment_dev.py"
      - "docs/CASM-ALIGNMENT-DEV-013.md"
      - ".github/workflows/casm-alignment-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  casm-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU training/test dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and lint new research files
        run: |
          python -m py_compile src/tac_osm/development/casm_readout_alignment.py scripts/run_casm_alignment_dev.py scripts/validate_casm_alignment_dev.py tests/test_casm_alignment_development.py
          ruff check --select F src/tac_osm/development/casm_readout_alignment.py scripts/run_casm_alignment_dev.py scripts/validate_casm_alignment_dev.py tests/test_casm_alignment_development.py
      - name: Validate CASM native parity and no-oracle gradient controls
        run: python -m pytest tests/test_casm_alignment_development.py -q
      - name: Verify existing suite size without changing frozen results
        run: python scripts/sync_test_count.py --check
      - name: Development smoke with saved checkpoint replay
        run: |
          python scripts/run_casm_alignment_dev.py --smoke --output artifacts/DEV-013-SMOKE
          python scripts/validate_casm_alignment_dev.py artifacts/DEV-013-SMOKE
      - name: Archive smoke evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-013-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-013-SMOKE/
          if-no-files-found: warn

  three-seed-development:
    needs: casm-mechanism
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU train/replay environment
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Train and validate CASM aligned supervision variants
        run: |
          python scripts/run_casm_alignment_dev.py --output artifacts/DEV-013
          python scripts/validate_casm_alignment_dev.py artifacts/DEV-013
      - name: Preserve all 15 checkpoints and exact raw episode rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-013-RAW-NOT-CONFIRMATORY
          path: artifacts/DEV-013/
          if-no-files-found: error
