name: TAC-OSM CASM action-rule transfer DEV-014 (NOT confirmatory)
on:
  pull_request:
    paths:
      - "src/tac_osm/development/casm_action_transfer.py"
      - "scripts/run_casm_action_transfer_dev.py"
      - "scripts/validate_casm_action_transfer_dev.py"
      - "tests/test_casm_action_transfer_development.py"
      - ".github/workflows/casm-action-transfer-development.yml"
      - "docs/CASM-ACTION-TRANSFER-DEV-014.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  casm-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU testing dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and lint
        run: |
          python -m py_compile src/tac_osm/development/casm_action_transfer.py scripts/run_casm_action_transfer_dev.py scripts/validate_casm_action_transfer_dev.py tests/test_casm_action_transfer_development.py
          ruff check --select F src/tac_osm/development/casm_action_transfer.py scripts/run_casm_action_transfer_dev.py scripts/validate_casm_action_transfer_dev.py tests/test_casm_action_transfer_development.py
      - name: CASM action-rule and leak-control unit tests
        run: python -m pytest tests/test_casm_action_transfer_development.py -q
      - name: Test-suite provenance integrity
        run: python scripts/sync_test_count.py --check
      - name: Download immutable DEV-013 archived parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh api --header 'Accept: application/vnd.github+json' \
            /repos/FPC-effortless/TAC-OSM/actions/artifacts/11836120110/zip \
            > artifacts/parent/DEV-013.zip
          echo "880d56e177b78d44961a8fc75e6e0a4151ebe6eeb7a55ce81afaa6c358172d65  artifacts/parent/DEV-013.zip" | sha256sum -c -
      - name: Smoke training and replay with pinned frozen memory
        run: |
          python scripts/run_casm_action_transfer_dev.py --smoke --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-014-SMOKE
          python scripts/validate_casm_action_transfer_dev.py --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-014-SMOKE
      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-014-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-014-SMOKE/
          if-no-files-found: warn

  three-seed-action-transfer:
    needs: casm-mechanism
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore exact DEV-013 parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh api --header 'Accept: application/vnd.github+json' \
            /repos/FPC-effortless/TAC-OSM/actions/artifacts/11836120110/zip \
            > artifacts/parent/DEV-013.zip
          echo "880d56e177b78d44961a8fc75e6e0a4151ebe6eeb7a55ce81afaa6c358172d65  artifacts/parent/DEV-013.zip" | sha256sum -c -
      - name: Run paired oracle/frozen retrieval sparse/dense CASM experiment
        run: |
          python scripts/run_casm_action_transfer_dev.py --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-014
          python scripts/validate_casm_action_transfer_dev.py --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-014
      - name: Archive all 12 adapters and every registered evaluation row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-014-RAW-NOT-CONFIRMATORY
          path: artifacts/DEV-014/
          if-no-files-found: error
