name: System1 velocity-anchored residual engineering tests (no fit)
on:
  push:
    branches:
      - research/system1-velocity-anchored-2026-10-26
    paths:
      - 'src/tac_osm/variants/system1_velocity_anchored.py'
      - 'tests/test_system1_velocity_anchored.py'
      - '.github/workflows/system1-velocity-bound-contract.yml'
  pull_request:
    paths:
      - 'src/tac_osm/variants/system1_velocity_anchored.py'
      - 'tests/test_system1_velocity_anchored.py'
      - '.github/workflows/system1-velocity-bound-contract.yml'
permissions:
  contents: read
jobs:
  bounded-innovation-no-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch
        run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify no-fit source-causal velocity residual, batch/stream, gradient, state bytes
        run: |
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_system1_velocity_anchored.py -v
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_system1_parallel.py -v
