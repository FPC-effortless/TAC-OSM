name: LANGMEM084 source value key and overwrite factorial
on:
  pull_request:
    paths:
      - 'scripts/langmem084*'
      - 'tests/test_langmem084.py'
      - 'research/mathematical-engineering/langmem084/**'
      - 'research/phone_queue/langmem084.json'
      - '.github/workflows/langmem084.yml'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.head_ref == 'research/langmem084-value-key-interference-2026-10-29'
    strategy:
      fail-fast: false
      matrix:
        seed: [1701,1702,1703]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned original CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Registered nofit compute and engineering gates
        run: |
          mkdir -p factor084-evidence
          PYTHONPATH=src:. python scripts/phone_lab.py plan research/phone_queue/langmem084.json > factor084-evidence/PLAN.json
          PYTHONPATH=src:. python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langmem084/FAIR_COMPARISON.json --phase preflight > factor084-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langmem084.py tests/test_research_probe_agnostic.py
      - name: Pinned partial PNDS operator source parity
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/FPC-effortless/pnds-lean/6a7d4566458ca6cc71d4cc920391f08eb6aed5e2/foundation/v1/langmem084_write_read.py --output /tmp/langmem084_write_read.py
          PYTHONPATH=src:. python scripts/langmem084_math_parity.py --reference /tmp/langmem084_write_read.py > factor084-evidence/PNDS_OPERATOR_PARITY.json
      - name: Original trained checkpoints and source receipts read only
        run: |
          mkdir -p original-dual-ckpt original078-verified
          gh run download 40890642312 -R FPC-effortless/TAC-OSM --name "LANGMEM078-FIT-dual-seed${{ matrix.seed }}" --dir original-dual-ckpt
          gh run download 40890642312 -R FPC-effortless/TAC-OSM --name LANGMEM078-SOURCE-PAIRED-AGGREGATE --dir original078-verified
      - name: Previously exposed083 publisher sources with immutable SHA and blob checks
        run: |
          mkdir -p exposed084
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/python/cpython/60403a5409ff2c3f3b07dd2ca91a7a3e096839c7/Doc/howto/regex.rst --output exposed084/regex.rst
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/python/cpython/60403a5409ff2c3f3b07dd2ca91a7a3e096839c7/Doc/howto/argparse.rst --output exposed084/argparse.rst
      - name: Actual source eight-arm deterministic mechanism evaluation
        run: |
          PYTHONPATH=src:. python scripts/langmem084_factorial.py --seed ${{ matrix.seed }} --checkpoint-dir original-dual-ckpt --original-aggregate original078-verified/RESULTS.json --documents exposed084 --output factor084-evidence/FACTORIAL_RESULTS.json
      - name: Preserve all positive negative and unknown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGMEM084-FACTORIAL-seed${{ matrix.seed }}
          path: factor084-evidence/
          retention-days: 90
  aggregate:
    needs: recover
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Strict original-source three-seed aggregate
        run: |
          gh run download "${{ github.run_id }}" -R FPC-effortless/TAC-OSM --pattern 'LANGMEM084-FACTORIAL-seed*' --dir factor-raw
          python scripts/langmem084_aggregate.py --results factor-raw --output factor-aggregate/RESULTS.json
          python - <<'PY'
          import json,os
          r=json.load(open('factor-aggregate/RESULTS.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              print('# LANGMEM084 no-fit mechanism diagnostic, not independently qualified',file=f)
              print('All eight banks256B; shared original producer4160B and evaluator keys remain outside bank.',file=f)
              print('| Arm | Age8 correct / uniform wrong | Age32 | Age128 | Age256 |',file=f)
              print('|---|---|---|---|---|',file=f)
              for arm,m in r['metrics'].items():
                  cells=[f"{m[a]['correct']:.2%} / {m[a]['wrong_uniform_correct']:.2%}" for a in ('8','32','128','256')]
                  print('| '+arm+' | '+' | '.join(cells)+' |',file=f)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGMEM084-SOURCE-VERIFIED-AGGREGATE
          path: factor-aggregate/
          retention-days: 90
