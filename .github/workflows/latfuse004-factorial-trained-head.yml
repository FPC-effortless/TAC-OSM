name: LATFUSE004 original trained 2x2 FIT-only head utilization and key-interference audit

on:
  push:
    branches: [research/latfuse004-factorial-routing-capacity-2026-10-27]
    paths:
      - "scripts/latfuse004_factorial_trained_head_diagnostic.py"
      - ".github/workflows/latfuse004-factorial-trained-head.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: LATFUSE004-HEAD-READONLY-ORIGINAL-EIGHT
  cancel-in-progress: false

jobs:
  nofit-true-source-original-trained-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: CPU dependencies only
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check original eight real FIT model weights, postfit receipts and no earlier analysis overwrite
        run: |
          test -s research/replay-bundles/LATFUSE004/RESULTS.json
          test -s research/replay-bundles/LATFUSE004/POSTFIT_PARITY.json
          test ! -e research/mathematical-engineering/latfuse004/TRAINED_HEAD_DIAGNOSTIC.json
          python scripts/validate_research_parity.py \
            --manifest research/replay-bundles/LATFUSE004/POSTFIT_PARITY.json --phase final
      - name: Retrieve original licensed observations from exact source-owned commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse004-diagnostic-source
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse004-diagnostic-source/PRSA2017_original.zip
      - name: Source-real-head usage collision and readout reliance for every original fitted arm
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/latfuse004_factorial_trained_head_diagnostic.py \
            --source /tmp/latfuse004-diagnostic-source/PRSA2017_original.zip \
            --output research/mathematical-engineering/latfuse004/TRAINED_HEAD_DIAGNOSTIC.json
      - name: Publish frozen original read-only result on isolated draft branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/latfuse004-factorial-routing-capacity-2026-10-27
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/latfuse004/TRAINED_HEAD_DIAGNOSTIC.json
          git diff --cached --quiet && exit 1
          git commit -m "research: preserve eight original trained FIT head-utilization/key-collision diagnostics"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: No new capability promotion
        run: |
          echo "No new fit, no original checkpoint mutation, no numeric source DEV/TEST touched."
          echo "Head routing entropy and source angular collision do not establish true event recall or architecture superiority."
