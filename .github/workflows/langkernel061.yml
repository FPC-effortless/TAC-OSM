name: LANGKERNEL061 original ordinal code vectorization CPU microbenchmark
on:
  pull_request:
    paths:
      - 'scripts/langkernel061_vector_ordinal.py'
      - 'tests/test_langkernel061_vector_ordinal.py'
      - 'research/mathematical-engineering/langkernel061/**'
      - 'research/phone_queue/langkernel061.json'
      - '.github/workflows/langkernel061.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-ordinal-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen no-fit prerequisites and mathematical identity tests
        run: |
          mkdir -p langkernel061-evidence
          python scripts/phone_lab.py plan research/phone_queue/langkernel061.json > langkernel061-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langkernel061/FAIR_COMPARISON.json --phase preflight > langkernel061-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langkernel061_vector_ordinal.py
      - name: Compare original vs vectorized source operator clock and finite precision
        run: |
          PYTHONPATH=src:. python scripts/langkernel061_vector_ordinal.py --output langkernel061-evidence/RESULTS.json
          python - <<'PY'
          import json
          r=json.load(open('langkernel061-evidence/RESULTS.json'))
          assert r['training_updates']==0 and r['gpu_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          assert r['original_decoder_modified'] is False
          assert {x['clock'] for x in r['cpu']}=={128,512,8192}
          assert set(r['cpu'][0]['arms'])=={'original_two_calls','vectorized_two_calls','vectorized_pair'}
          for row in r['cpu']:
              for arm in row['arms'].values():
                  assert arm['cpu_unprofiled']['samples']==448
          PY
      - name: Retain original full CPU operator evidence even when hypothesis fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGKERNEL061-original-ordinal-CPU-identity-and-speed
          path: langkernel061-evidence/
          retention-days: 90
          if-no-files-found: warn
