name: Learned Physics E2E 001

on:
  push:
    branches:
      - research/learned-physics-e2e-001-2026-10-07
    paths:
      - contracts/TACOSM-PLM-LEARNED-PHYSICS-E2E-001.json
      - src/tac_osm/learned_physics_e2e.py
      - src/tac_osm/learned_physics_e2e_benchmark.py
      - scripts/run_learned_physics_e2e_001.py
      - scripts/validate_learned_physics_e2e_001.py
      - tests/test_learned_physics_e2e_001.py
      - docs/TACOSM-PLM-LEARNED-PHYSICS-E2E-001.md
      - .github/workflows/learned-physics-e2e-001.yml
  workflow_dispatch:

concurrency:
  group: learned-physics-e2e-001
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest torch numpy==2.3.3 ruff==0.13.0
      - name: Static gate
        run: |
          ruff check --select F821 \
            src/tac_osm/learned_physics_e2e.py \
            src/tac_osm/learned_physics_e2e_benchmark.py \
            scripts/run_learned_physics_e2e_001.py \
            scripts/validate_learned_physics_e2e_001.py \
            tests/test_learned_physics_e2e_001.py
      - name: Focused tests
        run: python -m pytest tests/test_learned_physics_e2e_001.py -q
      - name: Contract gate
        run: |
          python - <<'PY'
          import json
          x=json.load(open("contracts/TACOSM-PLM-LEARNED-PHYSICS-E2E-001.json"))
          assert x["status"]=="pre-registered"
          assert x["protocol"]["hidden_dim"]==64
          assert x["protocol"]["history_length"]==6
          assert x["physics_prior"]["allowed_information"]
          assert x["physics_prior"]["forbidden_information"]
          assert len(x["seeds"])==5
          assert x["protocol"]["benchmark_generator_version"]=="learned-physics-e2e-v2-no-object-order-audio"
          import subprocess
          import hashlib
          digest=hashlib.sha256(open("src/tac_osm/learned_physics_e2e_benchmark.py","rb").read()).hexdigest()
          assert digest==x["protocol"]["benchmark_generator_sha256"], digest
          print("contract gate: PASS")
          PY
      - name: Smoke
        run: python scripts/run_learned_physics_e2e_001.py --smoke
      - name: Measurement
        run: python scripts/run_learned_physics_e2e_001.py
      - name: Independent artifact gate
        run: |
          python scripts/validate_learned_physics_e2e_001.py \
            artifacts/TACOSM-PLM-LEARNED-PHYSICS-E2E-001.json
      - name: Upload scientific artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-LEARNED-PHYSICS-E2E-001
          path: artifacts/TACOSM-PLM-LEARNED-PHYSICS-E2E-001.json
          if-no-files-found: error
