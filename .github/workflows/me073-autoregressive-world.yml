name: ME073 native autoregressive trajectory capability
on:
  pull_request:
    paths:
      - 'src/tac_osm/workflow_me073.py'
      - 'scripts/me073_*.py'
      - 'tests/test_me073_*.py'
      - 'research/mathematical-engineering/me073/**'
      - 'research/replay-bundles/ME073/**'
      - '.github/workflows/me073-autoregressive-world.yml'
  workflow_dispatch:
jobs:
  native-futures-and-real-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pytest==9.1.1
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. pytest -q tests/test_me073_autoregressive_world.py
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me073/FAIR_COMPARISON.json --phase preflight
      - name: Restore original models and recompute generated trajectories and factual suffix scores
        run: |
          if [ -f research/replay-bundles/ME073/ORIGINAL_SCORES.json ]; then
            python scripts/validate_research_parity.py --manifest research/replay-bundles/ME073/FINAL_REGISTRATION.json --phase final
            PYTHONPATH=src:. python scripts/me073_autoregressive_world.py --phase replay --cache /tmp/me073-source
          fi
