name: TAC 500K stream state numerical qualification
on:
  push:
    branches: [research/scale-500k-wave-language-2026-10-28]
  pull_request:
  workflow_dispatch:
jobs:
  stream-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only numerical dependency
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Verify full versus carried state, gradients, masks and causal prefix
        run: |
          OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python -m unittest discover -s research/language/flow_500k -p 'test_streaming_v2.py' -v
