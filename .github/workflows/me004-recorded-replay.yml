name: ME004 independent real model replay and runnable inference
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/me004_replay.py
      - scripts/me004_predict.py
      - .github/workflows/me004-recorded-replay.yml
permissions:
  contents: read
  actions: read
jobs:
  replay-six-frozen-models:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU numerical dependencies
        run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Restore original six trained real-model checkpoints
        uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39357593422
          name: me004-original-real-tac-models
          github-token: ${{ github.token }}
          path: .
      - name: Replay source and exact validation scores without fitting
        run: |
          python -m scripts.me004_replay --original results/me004 --output results/me004-audit | tee me004-replay.log
          python - <<'PY'
          import json
          d=json.load(open('results/me004-audit/replay.json'))
          assert d['fits_replayed']==6 and d['zero_refits']
          assert d['metrics_reproduced'] and d['source_reproducible']
          assert not d['read_future_after_day25'] and not d['architecture_promoted']
          PY
      - name: Load trained TAC checkpoint and produce an inference response
        run: |
          python - <<'PY'
          import json
          from scripts.me004_native_real_forecast import FEATURES,HIST
          from scripts.me004_predict import forecast
          report=json.load(open('results/me004/results.json'))
          mean=report['cohort']['mean_train_only']
          records=[{k:float(v) for k,v in zip(FEATURES,mean)} for _ in range(HIST)]
          json.dump(records,open('me004-software-input.json','w'))
          result=forecast('results/me004/results.json',
             'results/me004/checkpoints/tac_two_timescale-240401.pt','me004-software-input.json')
          assert len(result['predictions'])==2
          assert not result['independent_future_evaluation_passed']
          assert result['not_authorized_for_repair_actions_or_commercial_deployment']
          json.dump(result,open('me004-software-inference.json','w'),indent=2)
          print('Original frozen experimental TAC checkpoint loaded and ran inference successfully')
          PY
      - name: Preserve full replay evidence and software inference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me004-independent-real-replay
          path: |
            results/me004-audit/replay.json
            me004-replay.log
            me004-software-inference.json
          if-no-files-found: ignore
          retention-days: 90
