name: Owner-approved fixed local binding diagnostic
on:
  push:
    branches: [research/local-binding-owner-fixed-20261103]
    paths: [research/local_binding_owner_fixed_20261103/RUN_REQUEST.json]
permissions:
  contents: read
concurrency:
  group: local-binding-owner-fixed-default-20261103
  cancel-in-progress: false
jobs:
  fixed-default:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'run owner-approved fixed binding diagnostic 20261103 v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Reconstruct and verify exact source, fixtures, exception and CPU plan
        run: |
          python -B research/local_binding_owner_fixed_20261103/bootstrap.py
          python -B research/local_binding_owner_fixed_20261103/test_scope.py
      - name: Restore pinned CPU runtime
        run: |
          python -m venv research/training-cost-results-audit-20261103/torch213-env
          research/training-cost-results-audit-20261103/torch213-env/bin/python -m pip --isolated install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.13.0+cpu Jinja2==3.1.6 MarkupSafe==3.0.3 filelock==4.2.4 fsspec==2026.9.0 mpmath==1.3.0 networkx==3.7 pip==25.0.1 setuptools==78.1.0 sympy==1.14.0 typing_extensions==4.16.0
          research/training-cost-results-audit-20261103/torch213-env/bin/python -I -B research/local_binding_owner_fixed_20261103/runtime_check.py
      - name: Execute the single released bounded matrix
        run: python -I -B research/local_binding_owner_fixed_20261103/wrapper/outer.py research/local_binding_owner_fixed_20261103/RUN_REQUEST.json
      - name: Preserve all completed and failed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-binding-owner-fixed-default-${{ github.run_id }}
          path: |
            research/local_binding_owner_fixed_20261103/runs/fixed/default/
            research/local_binding_owner_fixed_20261103/PREFLIGHT_SOURCE.json
            research/local_binding_owner_fixed_20261103/PREFLIGHT_PLAN.json
            research/local_binding_owner_fixed_20261103/PREFLIGHT_RUNTIME.json
          retention-days: 90
