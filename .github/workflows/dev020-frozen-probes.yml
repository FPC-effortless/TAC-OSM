name: DEV-020 frozen state and readout probes (development)
on:
  pull_request:
    paths:
      - "scripts/run_dev020_state_probes.py"
      - "scripts/audit_dev020_state_probes.py"
      - "tests/test_dev020_state_probes.py"
      - ".github/workflows/dev020-frozen-probes.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU test environment
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax, test-count provenance, regression suite
        run: |
          ruff check --select F scripts/run_dev020_state_probes.py scripts/audit_dev020_state_probes.py tests/test_dev020_state_probes.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Untrained tiny diagnostic smoke (not an outcome)
        run: python scripts/run_dev020_state_probes.py --seed 43 --regime short --smoke --output artifacts/DEV-020-smoke
  frozen-seed:
    needs: integrity-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [43, 59, 71]
        regime: [short, long]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU research runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch immutable, audited DEV-018 checkpoint and original predictions
        uses: actions/download-artifact@v4
        with:
          name: DEV-018-RAW-${{ matrix.regime }}-${{ matrix.seed }}-NOT-CONFIRMATORY
          run-id: 38802569971
          github-token: ${{ github.token }}
          path: frozen
      - name: Trace prefixes and fit only disjoint-domain diagnostic probes
        run: |
          python scripts/run_dev020_state_probes.py --seed ${{ matrix.seed }} --regime ${{ matrix.regime }} --frozen frozen --output artifacts/DEV-020-${{ matrix.regime }}-${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-020-PROBES-${{ matrix.regime }}-${{ matrix.seed }}-NOT-CONFIRMATORY
          path: artifacts/DEV-020-${{ matrix.regime }}-${{ matrix.seed }}/
          if-no-files-found: warn
  independent-audit:
    needs: frozen-seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV-020-PROBES-*-NOT-CONFIRMATORY
          path: artifacts/DEV-020-all
      - name: Recompute diagnostic consistency and frozen decision flags without torch
        run: |
          python scripts/audit_dev020_state_probes.py artifacts/DEV-020-all/DEV-020-PROBES-*-NOT-CONFIRMATORY/analysis.json --output artifacts/DEV-020-all/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-020-COMPLETE-AUDITED-DIAGNOSTIC-NOT-CONFIRMATORY
          path: artifacts/DEV-020-all/
          if-no-files-found: error
