name: Research G-CASM evidence family 016A

on:
  push:
    branches:
      - research/graph-casm-evidence-family-016a
    paths:
      - contracts/TACOSM-GRAPH-CASM-EVIDENCE-FAMILY-016A.json
      - docs/AUDIT-TACOSM-GRAPH-CASM-EVIDENCE-FAMILY-016A.md
      - scripts/run_graph_casm_evidence_family_016a.py
      - scripts/run_graph_casm_selective_010.py
      - src/tac_osm/evidence_family.py
      - tests/test_evidence_family.py
      - .github/workflows/graph-casm-evidence-family-016a.yml
  pull_request:
    branches:
      - research/graph-casm-structured-action-probe-015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: G-CASM-016A smoke/preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/cdl-attention-experiment
          ref: c31554413301e3c9d3e6b3f8c8c6be572a74a748
          path: third_party/cdl-attention-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -e . pytest torch
      - name: Contract validation
        run: |
          python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-GRAPH-CASM-EVIDENCE-FAMILY-016A")
          assert c.check_consistency() == []
          print(c.primary_endpoint())
          PY
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: 016A focused tests
        run: python -m pytest tests/test_evidence_family.py -q
      - name: Smoke measurement
        run: python scripts/run_graph_casm_evidence_family_016a.py --smoke
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-GRAPH-CASM-EVIDENCE-FAMILY-016A-smoke
          path: artifacts/TACOSM-GRAPH-CASM-EVIDENCE-FAMILY-016A.json
          if-no-files-found: ignore

  full:
    name: G-CASM-016A full confirmatory measurement
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(toJSON(github.event.commits), '[run-graph-casm-evidence-family-016A-full]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/cdl-attention-experiment
          ref: c31554413301e3c9d3e6b3f8c8c6be572a74a748
          path: third_party/cdl-attention-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -e . pytest torch
      - name: Contract validation
        run: |
          python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-GRAPH-CASM-EVIDENCE-FAMILY-016A")
          assert c.check_consistency() == []
          c.require_levels((32,64,128,256,512))
          c.require_seeds((0,1,2,3,4))
          c.require_steps(1)
          c.require_eval_steps(32)
          c.require_arms(["scalar_output","paired_output","quad_output","activation_trace_ceiling"])
          PY
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: 016A focused tests
        run: python -m pytest tests/test_evidence_family.py -q
      - name: Full measurement
        run: python scripts/run_graph_casm_evidence_family_016a.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-GRAPH-CASM-EVIDENCE-FAMILY-016A
          path: artifacts/TACOSM-GRAPH-CASM-EVIDENCE-FAMILY-016A.json
          if-no-files-found: error

# Full measurement is marker/manual triggered only after implementation audit.
# [run-graph-casm-evidence-family-016A-full]
