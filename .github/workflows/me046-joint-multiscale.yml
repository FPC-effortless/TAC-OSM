name: ME046 genuine joint multiscale TAC GRU and tied-loop architecture training
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/tac_osm/me046_joint_multiscale.py
      - scripts/me046_train_joint_forecast.py
      - tests/test_me046_joint_multiscale.py
      - research/mathematical-engineering/me046/**
      - docs/TACOSM-BASELINE-001.md
      - .github/workflows/me046-joint-multiscale.yml
permissions:
  contents: read
concurrency:
  group: me046-real-joint-multiscale
  cancel-in-progress: true
jobs:
  numerical-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original pinned CPU numerical dependencies
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Complete model syntax and native stability preflight
        run: |
          python -m py_compile src/tac_osm/me046_joint_multiscale.py scripts/me046_train_joint_forecast.py
          python -m scripts.me046_train_joint_forecast --self-test
      - name: All earlier and new original research regression tests
        run: |
          python -m pytest -q
          python scripts/sync_test_count.py --check
  genuine-full-model-fits-and-replay:
    needs: numerical-and-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 116
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original pinned AVX2 numerical environment
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Train 96 authentic jointly optimized context GRU native and tied-loop complete models
        run: |
          set -o pipefail
          python -m scripts.me046_train_joint_forecast --out results/me046 | tee me046-original-fit.log
      - name: Verify all original trained weights optimizer receipts and bit-exact real development forecasts
        run: |
          set -o pipefail
          python -m scripts.me046_train_joint_forecast --out results/me046 --replay | tee me046-original-replay.log
      - name: Enforce exact declared authentic datasets budgets and negative outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tac_osm.me046_joint_multiscale import ARMS
          r=json.loads(Path("results/me046/results.json").read_text())
          assert r["completed"] and r["study"]=="ME046_REAL_JOINT_MULTISCALE_TIED_REFINEMENT"
          assert r["original_AVX512_cross_ISA_exactness_failure_retained"]
          assert r["untouched_final_test_numeric_rows_read"]==0
          assert r["experimental_context_datasets_not_fresh"]
          assert set(r["domains"])=={"etth1","tetouan"}
          for domain,d in r["domains"].items():
              assert d["provenance"]["numeric_future_rows_parsed"]==0
              assert len(d["parents"])==4 and len(d["common_contexts"])==4
              assert len(d["fits"])==48
              assert {(a["horizon"],a["seed"],a["arm"],a["lane"]) for a in d["fits"]}=={
                  (h,s,a,l) for h in (96,720) for s in (46001,46002)
                  for a in ARMS for l in ("exposure","cpu")}
              assert all(v["real_FIT_updates"]==800 for v in d["fits"] if v["lane"]=="exposure")
              assert all(v["real_FIT_updates"]>=1 and v["metric"]["primary_MSE"]>=0 and
                         v["batch_one_latency"]["median_full_forecast_CPU_ms"]>0 for v in d["fits"])
          assert len(r["selection"]["registered_engineering_gates"])==5
          assert r["selection"]["all_evidence_from_reused_development"]
          assert r["selection"]["no_model_promoted_or_merged"]
          assert r["selection"]["sealed_new_task_native_stop_not_tested"]
          print("ME046_96_REAL_MODEL_FITS_ALL_REGISTERED_GATES_RECORDED")
          PY
      - name: Archive full original checkpoints and failures, raw forecasts and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me046-authentic-joint-multiscale-six-architectures-96-checkpoints
          path: |
            results/me046/
            me046-original-fit.log
            me046-original-replay.log
          retention-days: 90
          if-no-files-found: ignore
