name: HYBGEOM092 frozen 091 checkpoint tied-output decomposition
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/mathematical-engineering/hybgeom092/**'
      - 'research/phone_queue/hybgeom092.json'
      - '.github/workflows/hybgeom092.yml'
permissions:
  contents: read
jobs:
  algebra-and-frozen-original-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Phone lab and prospective no-fit gate
        run: |
          python scripts/phone_lab.py plan research/phone_queue/hybgeom092.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/hybgeom092/FAIR_COMPARISON.json --phase preflight
      - name: Algebra, future poison and gradients, then exact original checkpoint replay
        run: |
          PYTHONPATH=src:. python -m pytest -q research/mathematical-engineering/hybgeom092/test_math092.py research/mathematical-engineering/hybgeom091/test_model091.py tests/test_research_probe_agnostic.py
          python research/mathematical-engineering/hybgeom092/replay092.py --output /tmp/HYBGEOM092_RESULTS.json
          echo 'PYTHON_RESULT_LOG_BEGIN'
          python - <<'PY'
          import json
          d=json.load(open('/tmp/HYBGEOM092_RESULTS.json'))
          print(json.dumps({k:{'nll':round(v['mean_nll'],8),'delta_vs_original':round(v['paired']['original']['mean'],8),'delta_vs_fixed_core':round(v['paired']['fixed_core_only']['mean'],8)} for k,v in d['summary'].items()},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HYBGEOM092-ORIGINAL-FROZEN-10CHECKPOINTS
          path: /tmp/HYBGEOM092_RESULTS.json
          retention-days: 90
