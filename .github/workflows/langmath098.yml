name: LANGMATH098 contextual associative TAC mathematics
on:
  pull_request:
    paths:
      - 'research/mathematical-engineering/langmath098/**'
      - 'tests/test_langmath098.py'
      - '.github/workflows/langmath098.yml'
      - 'research/phone_queue/langmath098-no-fit.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pytest>=8,<9'
      - run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/phone_lab.py plan research/phone_queue/langmath098-no-fit.json
      - name: Full reference, causal state, sequential/scan and gradient correspondence
        run: python -m pytest -q tests/test_langmath098.py tests/test_research_probe_agnostic.py
