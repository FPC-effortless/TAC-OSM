name: LATFUSE001 no-fit mathematical operator and CI regression

on:
  pull_request:
    paths:
      - "src/tac_osm/latent_fusion_001.py"
      - "tests/test_latent_fusion_001.py"
      - "research/mathematical-engineering/latfuse001/**"
      - ".github/workflows/latent-fusion-001.yml"
  push:
    branches:
      - "research/latfuse001-unified-latent-2026-10-26"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nofit-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU-only engineering reference dependencies
        run: |
          python -m pip install --quiet pytest torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run no-fit source-operator regression tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_latent_fusion_001.py
      - name: Disclose scientific boundaries
        run: |
          echo "ONLY constructed mathematical/engineering fixtures are tested."
          echo "No trained checkpoint, genuine real-data outcome, cross-repo Lean/refinement, or scientific superiority is established."
