name: Research PLM corrected C5 state admission 006
on:
  pull_request:
    branches:
      - research/unified-plm-clm-final-2026-10-01
  push:
    branches:
      - research/plm-representation-interface-007
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: python -m pip install --quiet -e . pytest
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: State admission tests
        run: python -m pytest tests/test_plm_c5_state_admission.py -q
      - name: Run corrected state admission
        run: python scripts/run_plm_c5_state_admission_006.py
      - name: Upload state admission artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-C5-STATE-ADMISSION-006
          path: artifacts/TACOSM-PLM-C5-STATE-ADMISSION-006.json
          if-no-files-found: error
