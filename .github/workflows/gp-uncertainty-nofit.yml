name: GP-UNC-001 six-family mathematical and source-time no-fit diagnostics
on:
  push:
    branches: [research/gp-unc-001-six-family-nofit-2026-10-27]
    paths:
      - 'src/tac_osm/gp_uncertainty_nofit.py'
      - 'tests/test_gp_uncertainty_nofit.py'
      - 'tests/test_gp_uncertainty_numpy.py'
      - 'tests/test_gp_sparse_nofit.py'
      - 'src/tac_osm/gp_sparse_nofit.py'
      - 'src/tac_osm/gp_rankone_nofit.py'
      - 'scripts/benchmark_gp_rankone_nofit.py'
      - 'src/tac_osm/gp_prequential_nofit.py'
      - 'src/tac_osm/gp_event_boundary_nofit.py'
      - 'tests/test_gp_event_boundary_nofit.py'
      - 'tests/test_gp_prequential_nofit.py'
      - 'tests/test_gp_rankone_nofit.py'
      - 'research/mathematical-engineering/gp-unc-001/**'
      - '.github/workflows/gp-uncertainty-nofit.yml'
  pull_request:
    paths:
      - 'src/tac_osm/gp_uncertainty_nofit.py'
      - 'tests/test_gp_uncertainty_nofit.py'
      - 'tests/test_gp_uncertainty_numpy.py'
      - 'tests/test_gp_sparse_nofit.py'
      - 'src/tac_osm/gp_sparse_nofit.py'
      - 'src/tac_osm/gp_rankone_nofit.py'
      - 'scripts/benchmark_gp_rankone_nofit.py'
      - 'src/tac_osm/gp_prequential_nofit.py'
      - 'src/tac_osm/gp_event_boundary_nofit.py'
      - 'tests/test_gp_event_boundary_nofit.py'
      - 'tests/test_gp_prequential_nofit.py'
      - 'tests/test_gp_rankone_nofit.py'
      - 'research/mathematical-engineering/gp-unc-001/**'
      - '.github/workflows/gp-uncertainty-nofit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nofit-math:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic GP, conformal and causal boundary fixtures (no fit)
        run: python -m unittest discover -s tests -p test_gp_uncertainty_nofit.py -v
      - name: Install numerical reference library (no neural training)
        run: python -m pip install --quiet numpy==2.3.3
      - name: Check 72 independent double-precision GP posterior references
        run: python -m unittest discover -s tests -p test_gp_uncertainty_numpy.py -v
      - name: Check bounded inducing-process residual filter and causal update preflight
        run: python -m unittest discover -s tests -p test_gp_sparse_nofit.py -v
      - name: Compare rank-one O(m^2) Bayesian updates to O(m^3) exact precision reference
        run: python -m unittest discover -s tests -p test_gp_rankone_nofit.py -v
      - name: Measure fixture-only CPU rank-one versus precision reference, verifying output parity
        run: python scripts/benchmark_gp_rankone_nofit.py > gp_rankone_cpu_constructed.json
      - name: Archive unqualified constructed timing receipt
        uses: actions/upload-artifact@v4
        with:
          name: gp-rankone-constructed-cpu
          path: gp_rankone_cpu_constructed.json
          retention-days: 14
      - name: Falsify chronological delayed-label and per-entity prequential leakage
        run: python -m unittest discover -s tests -p test_gp_prequential_nofit.py -v
      - name: Reject truth-bearing issue events and premature feedback in a streaming replay
        run: python -m unittest discover -s tests -p test_gp_event_boundary_nofit.py -v
      - name: Enforce scientific no-fit study receipt
        run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/gp-unc-001/REGISTERED_NOFIT.json --phase preflight
      - name: Compile mathematical reference
        run: python -m py_compile src/tac_osm/gp_uncertainty_nofit.py src/tac_osm/gp_sparse_nofit.py src/tac_osm/gp_rankone_nofit.py src/tac_osm/gp_prequential_nofit.py src/tac_osm/gp_event_boundary_nofit.py scripts/benchmark_gp_rankone_nofit.py tests/test_gp_event_boundary_nofit.py tests/test_gp_prequential_nofit.py tests/test_gp_rankone_nofit.py tests/test_gp_uncertainty_nofit.py tests/test_gp_sparse_nofit.py
