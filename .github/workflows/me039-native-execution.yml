name: ME039 native execution and original model delivery
on:
  pull_request:
    paths:
      - src/tac_osm/me039*.py
      - scripts/me039*.py
      - scripts/verify_research_archive.py
      - tests/test_me039*.py
      - research/mathematical-engineering/me039/**
      - research/model-artifacts/**
      - .github/workflows/me039-native-execution.yml
permissions:
  contents: read
concurrency:
  group: me039-checks-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  checks-and-model-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
      - run: python scripts/sync_test_count.py --check
      - name: Verify original model bytes and every indexed payload
        run: python scripts/verify_research_archive.py research/model-artifacts/me038-native-inference-models.tar.gz 3bb753071dcc544919437aecf54eedd015da13e89aa61c6e15ae508d1e8c6d04
      - name: Verify all original ME039 numerical record archives
        run: |
          python - <<'PYCODE'
          import json,subprocess,sys
          for row in json.load(open('research/model-artifacts/me039-archives.json'))['archives']:
              subprocess.run([sys.executable,'scripts/verify_research_archive.py',row['path'],row['sha256']],check=True)
          PYCODE
      - name: Repository-owned download of original research models
        uses: actions/upload-artifact@v4
        with:
          name: original-native-models-and-me039-records
          path: |
            research/model-artifacts/*.tar.gz
            research/model-artifacts/*.json
            research/model-artifacts/README.md
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
