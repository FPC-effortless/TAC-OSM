name: Research Persistence-002 intervening writes

on:
  pull_request:
    branches: [master]
    paths:
      - "contracts/TACOSM-PLM-PERSISTENCE-002.json"
      - "src/tac_osm/persistence_002.py"
      - "src/tac_osm/persistence_002_benchmark.py"
      - "scripts/run_persistence_002.py"
      - "scripts/validate_persistence_002.py"
      - "tests/test_persistence_002.py"
      - "docs/TACOSM-PLM-PERSISTENCE-002.md"
      - ".github/workflows/persistence-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest torch numpy==2.3.3 ruff==0.13.0
      - name: Frozen contract gate
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-PLM-PERSISTENCE-002")
          assert c.check_consistency() == [], c.check_consistency()
          assert c.status == "pre-registered"
          assert c.seeds == (0,1,2,3,4)
          assert c.h_levels == (1,2,4,8,16)
          assert c.steps == 600
          assert c.eval_steps == 300
          assert len(c.arms) == 5
          print("PASS: frozen contract")
          PY
      - name: Paired history and learned-write tests
        run: python -m pytest -q tests/test_persistence_002.py
      - name: Strict lint
        run: |
          python -m ruff check src/tac_osm/persistence_002.py \
            src/tac_osm/persistence_002_benchmark.py \
            scripts/run_persistence_002.py \
            scripts/validate_persistence_002.py \
            tests/test_persistence_002.py

  measurement:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --quiet -e . torch numpy==2.3.3
      - name: Five-seed confirmatory measurement
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python scripts/run_persistence_002.py
      - name: Independent artifact validation
        run: python scripts/validate_persistence_002.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TACOSM-PLM-PERSISTENCE-002
          path: artifacts/TACOSM-PLM-PERSISTENCE-002.json
          if-no-files-found: warn
