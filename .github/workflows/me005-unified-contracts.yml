name: ME005 unified native TAC mathematical contracts
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/me005_unified_native_tac.py'
      - 'tests/test_me005_unified_native.py'
      - '.github/workflows/me005-unified-contracts.yml'
permissions:
  contents: read
jobs:
  unit-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed CPU numerical environment
        run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate mathematical and actual training-interface contracts
        run: |
          python -m py_compile scripts/me005_unified_native_tac.py tests/test_me005_unified_native.py
          python -m unittest tests.test_me005_unified_native -v
