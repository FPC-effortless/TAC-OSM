name: SEQ006 long-history update-learning pilots
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/seq-transfer-006/**'
      - 'scripts/run_seq_transfer_006.py'
      - 'tests/test_seq_transfer_006.py'
      - '.github/workflows/seq006-updates.yml'
concurrency:
  group: seq006-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke-and-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/run_seq_transfer_006.py
            tests/test_seq_transfer_006.py
            research/seq-transfer-006/PROTOCOL.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible CPU dependencies
        run: |
          python -m pip install numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check exact replay and held-out isolation
        run: python -m unittest discover -s tests -p test_seq_transfer_006.py -v
      - name: Run short 3-model training smoke
        run: |
          python scripts/run_seq_transfer_006.py --stage smoke --output results/seq006
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/seq006/smoke.json').read_text())
          assert p['status']=='SOFTWARE_SMOKE_ONLY'
          assert len(p['fits'])==3 and p['test_opened'] is False
          assert p['test_evaluations']==0 and all(x['updates']==2 for x in p['fits'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq006-software-smoke
          path: results/seq006/smoke.json
          if-no-files-found: ignore
  validation-only-pilots:
    needs: smoke-and-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/run_seq_transfer_006.py
            research/seq-transfer-006/PROTOCOL.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch
        run: |
          python -m pip install numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Train all six fixed-budget pilot models, no test exposure
        run: |
          python scripts/run_seq_transfer_006.py --stage pilot --output results/seq006
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('results/seq006')
          d=json.loads((base/'pilot.json').read_text())
          assert d['status']=='VALIDATION_PILOTS_ONLY'
          assert d['test_opened'] is False and d['test_evaluations']==0
          assert len(d['fits'])==6 and {x['seed'] for x in d['fits']}=={690610,690611}
          assert all(x['updates']==400 and x.get('sha256') for x in d['fits'])
          assert len(list((base/'checkpoints').glob('*.pt')))==6
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq006-original-validation-pilots
          path: |
            results/seq006/pilot.json
            results/seq006/checkpoints/*.pt
          if-no-files-found: ignore
