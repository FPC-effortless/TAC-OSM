name: S1TEMP007 source-trusted mobile H1024 experiment preflight
on:
  push:
    branches: [research/s1temp007-multiscale-state-2026-10-26]
    paths:
      - 'scripts/s1temp007_original_mobile_h1024_fit.py'
      - 'tests/test_s1temp007_mobile_prefit.py'
      - '.github/workflows/s1temp007-prefit.yml'
  pull_request:
    paths:
      - 'scripts/s1temp007_original_mobile_h1024_fit.py'
      - 'tests/test_s1temp007_mobile_prefit.py'
permissions:
  contents: read
jobs:
  original-no-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m py_compile scripts/s1temp007_original_mobile_h1024_fit.py
          PYTHONPATH=src:. python -m unittest tests.test_s1temp007_mobile_prefit -v
          PYTHONPATH=src:. python -m unittest tests.test_s1temp007_multiscale_memory -v
