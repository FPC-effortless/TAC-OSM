name: LANGFAST095 source-equivalent original TAC no-fit CPU benchmark
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/mathematical-engineering/langfast095/**'
      - 'research/phone_queue/langfast095.json'
      - '.github/workflows/langfast095.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      benchmark: ${{ steps.route.outputs.benchmark }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: route
        shell: bash
        run: |
          if [[ -s research/mathematical-engineering/langfast095/BENCHMARK_RESULTS.json ]]; then
            echo 'benchmark=false' >> "$GITHUB_OUTPUT"
          else
            echo 'benchmark=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install pytest==8.4.2 numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Internal no-fit plan, real owner/source parity and native gradient tests
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/phone_lab.py plan research/phone_queue/langfast095.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langfast095/FAIR_COMPARISON.json --phase preflight
          PYTHONPATH=src:. python -m pytest -q research/mathematical-engineering/langfast095/test_langfast095.py tests/test_research_probe_agnostic.py
  benchmark:
    needs: preflight
    if: needs.preflight.outputs.benchmark == 'true' && github.event.pull_request.head.repo.full_name == 'FPC-effortless/TAC-OSM'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Original source attested checkpoint no-fit bitwise replay and paired process CPU timing
        run: |
          python research/mathematical-engineering/langfast095/bench095.py --output research/mathematical-engineering/langfast095/BENCHMARK_RESULTS.json
      - uses: actions/upload-artifact@v4
        with:
          name: LANGFAST095-original-no-fit-cpu-receipt
          path: research/mathematical-engineering/langfast095/BENCHMARK_RESULTS.json
          retention-days: 90
      - name: Archive original real-source no-fit measurement on unmerged draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/mathematical-engineering/langfast095/BENCHMARK_RESULTS.json
          git commit -m 'LANGFAST095: preserve original-source 3-seed native bitwise replay and CPU timing'
          git push origin "HEAD:${{ github.head_ref }}"
  independent-replay:
    needs: preflight
    if: needs.preflight.outputs.benchmark == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Fresh checkout numerical and archived source integrity rerun; timing may legitimately differ
        run: |
          python research/mathematical-engineering/langfast095/bench095.py --output /tmp/LANGFAST095_REPLAY.json
          python - <<'PY'
          import json
          original=json.load(open('research/mathematical-engineering/langfast095/BENCHMARK_RESULTS.json'))
          replay=json.load(open('/tmp/LANGFAST095_REPLAY.json'))
          for name in ('study','original_tac_source_blob','real_document_git_blob','original_historical_checkpoint_count','original_model_seed_rows','bitwise_predictions_and_all_native_states','trained_new_models','gpu_minutes','protected_TEST'):
              assert original[name]==replay[name], name
          print('LANGFAST095 original-sources+checkpoints+all persistent native state and logit parity: PASS')
          PY
