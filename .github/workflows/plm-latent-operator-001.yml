name: Research PLM latent operator induction 001

on:
  pull_request:
    branches: [master]
    paths:
      - "contracts/TACOSM-PLM-LATENT-OPERATOR-001.json"
      - "src/tac_osm/latent_operator_001.py"
      - "src/tac_osm/latent_operator_001_benchmark.py"
      - "scripts/run_plm_latent_operator_001.py"
      - "scripts/validate_plm_latent_operator_001.py"
      - "tests/test_plm_latent_operator_001.py"
      - ".github/workflows/plm-latent-operator-001.yml"
  push:
    branches:
      - research/plm-latent-operator-001-2026-10-07
    paths:
      - "contracts/TACOSM-PLM-LATENT-OPERATOR-001.json"
      - "src/tac_osm/latent_operator_001.py"
      - "src/tac_osm/latent_operator_001_benchmark.py"
      - "scripts/run_plm_latent_operator_001.py"
      - "scripts/validate_plm_latent_operator_001.py"
      - "tests/test_plm_latent_operator_001.py"
      - ".github/workflows/plm-latent-operator-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr_integrity:
    name: Latent operator PR integrity smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest torch numpy==2.3.3 ruff==0.13.0
      - name: Static gate
        run: |
          ruff check --select F821             src/tac_osm/latent_operator_001.py             src/tac_osm/latent_operator_001_benchmark.py             scripts/run_plm_latent_operator_001.py             scripts/validate_plm_latent_operator_001.py             tests/test_plm_latent_operator_001.py
      - name: Focused tests
        run: |
          python -m pytest             tests/test_contract.py             tests/test_plm_latent_operator_001.py             tests/test_integrated_e2e_008.py -q
      - name: Contract gate
        run: |
          python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-PLM-LATENT-OPERATOR-001")
          assert c.check_consistency() == []
          assert c.h_levels == (3,)
          assert c.seeds == (0,1,2,3,4)
          assert c.steps == 300
          assert c.eval_steps == 600
          assert [a.name for a in c.arms] == [
              "normal_latent_operator","oracle_operator",
              "shuffle_support_labels","no_memory"
          ]
          assert c.primary_endpoint() == "heldout_q2_accuracy"
          print("PASS: latent-operator contract")
          PY
      - name: Smoke
        run: python scripts/run_plm_latent_operator_001.py --smoke

  confirmatory:
    name: Latent operator confirmatory measurement
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest torch numpy==2.3.3 ruff==0.13.0
      - name: Static gate
        run: |
          ruff check --select F821             src/tac_osm/latent_operator_001.py             src/tac_osm/latent_operator_001_benchmark.py             scripts/run_plm_latent_operator_001.py             scripts/validate_plm_latent_operator_001.py             tests/test_plm_latent_operator_001.py
      - name: Focused tests
        run: |
          python -m pytest             tests/test_contract.py             tests/test_plm_latent_operator_001.py             tests/test_integrated_e2e_008.py -q
      - name: Contract gate
        run: |
          python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-PLM-LATENT-OPERATOR-001")
          assert c.check_consistency() == []
          print("PASS: latent-operator contract")
          PY
      - name: Smoke
        run: python scripts/run_plm_latent_operator_001.py --smoke
      - name: Confirmatory measurement
        run: python scripts/run_plm_latent_operator_001.py
      - name: Independent result validation
        run: |
          python scripts/validate_plm_latent_operator_001.py             artifacts/TACOSM-PLM-LATENT-OPERATOR-001.json
      - name: Upload scientific artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-LATENT-OPERATOR-001
          path: artifacts/TACOSM-PLM-LATENT-OPERATOR-001.json
          if-no-files-found: error
