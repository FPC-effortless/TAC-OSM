name: TAC-OSM fused frontier 003

on:
  push:
    branches:
      - research/fused-tacosm-frontier-003
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test suite
        run: pytest -q
      - name: Registered frontier 003 run
        run: |
          mkdir -p artifacts
          python scripts/run_fused_frontier_003.py > artifacts/TACOSM-FUSED-FRONTIER-003.stdout.json
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-FUSED-FRONTIER-003
          path: artifacts/
