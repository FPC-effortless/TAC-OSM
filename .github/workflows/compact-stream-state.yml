name: Compact carried-state ownership - no fit
on:
  pull_request:
    paths:
      - 'src/tac_osm/compact_stream_state.py'
      - 'scripts/audit_compact_stream_state.py'
      - 'tests/test_compact_stream_state.py'
      - 'research/compact_state_20261108/**'
      - '.github/workflows/compact-stream-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install pytest==8.4.2 numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Preregistered CPU route and original-source controls
        run: |
          mkdir -p compact-state-evidence
          python -B scripts/phone_lab.py plan research/phone_queue/compact_state_20261108.json > compact-state-evidence/CPU_PLAN.json
          cmp compact-state-evidence/CPU_PLAN.json research/compact_state_20261108/COMPUTE_DECISION.json
          PYTHONPATH=src:. python -m pytest -q tests/test_compact_stream_state.py tests/test_csl001.py tests/test_csl125.py tests/test_csl125_r1.py tests/test_csl125_r2.py tests/test_research_probe_agnostic.py --junitxml=compact-state-evidence/TESTS.xml
      - name: All original default exits - storage, outputs and copy cost
        # Freeze the resource experiment; later evidence-only commits run tests.
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.sha == 'c719ab06accec92c7f9028fcb293df21e8202542'
        run: |
          set -o pipefail
          python -B scripts/audit_compact_stream_state.py --output compact-state-evidence/RESULTS.json | tee compact-state-evidence/AUDIT.log
          git diff --exit-code -- src/tac_osm/csl001.py src/tac_osm/csl125.py src/tac_osm/csl125_r1.py src/tac_osm/csl125_r2.py
      - name: Verify saved hosted measurements without model execution
        if: hashFiles('research/evidence/compact_state_20261108/verify_saved.py') != ''
        run: python -B research/evidence/compact_state_20261108/verify_saved.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: COMPACT-STATE-20261108-engineering
          path: compact-state-evidence/
          retention-days: 90
