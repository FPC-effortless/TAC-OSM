name: DEV-036 bounded MTSK integrity and smoke only
on:
  pull_request:
    types: [opened]
    paths:
      - 'research/dev036/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          ruff check --select F src/tac_osm/development/bounded_mtsk.py scripts/*dev036.py tests/*dev036.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
          python scripts/run_bounded_mtsk_dev036.py --arm unbounded_local_multi_fp64 --smoke --pilot /tmp/unused --output /tmp/dev036-smoke
          python scripts/run_bounded_mtsk_dev036.py --arm bounded_local_multi_fp64 --smoke --pilot /tmp/unused --output /tmp/dev036-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-036-INTEGRITY-SMOKE-NOT-FULL-PILOT
          path: /tmp/dev036-smoke
