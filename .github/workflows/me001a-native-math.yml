name: ME001A native mathematical property checks
on:
  pull_request:
    paths:
      - 'scripts/me001a_native_entity_set_reference.py'
      - '.github/workflows/me001a-native-math.yml'
      - 'research/mathematical-engineering/me001a/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  property-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run ten-seed engineering-only probes
        run: |
          python scripts/me001a_native_entity_set_reference.py | tee me001a-results.json
          python - <<'PY'
          import json
          x=json.load(open('me001a-results.json'))
          assert len(x['checks']) == 10
          assert x['status'] == 'engineering diagnostics only'
          PY
      - name: Archive exact software-property evidence
        uses: actions/upload-artifact@v4
        with:
          name: me001a-property-checks
          path: me001a-results.json
