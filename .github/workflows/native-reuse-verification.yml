name: Native TAC reusable computation verification (no fit)
on:
  pull_request:
    paths: ['src/tac_osm/variants/reusable_execution.py', 'tests/test_reusable_execution.py', 'scripts/*reusable_execution.py', 'research/computation-reuse/**', '.github/workflows/native-reuse-verification.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify values, gradients, cache ordering and invalidation
        run: PYTHONPATH=src:. python -m pytest tests/test_reusable_execution.py -q
      - name: Verify unchanged original model identity and live training receipts
        run: PYTHONPATH=src:. python scripts/me080_finalize_originals.py
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tac-reuse-source
          key: tac-reuse-original-source-v1
      - name: Verify all five models on every original real query without timing or fitting
        run: PYTHONPATH=src:. python scripts/verify_reusable_execution.py --cache "${{ runner.temp }}/tac-reuse-source"
