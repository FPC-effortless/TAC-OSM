name: ME095 causal visual-native original replay (no training)
on:
  pull_request:
    paths: ['src/tac_osm/variants/context_filter_execution.py', 'src/tac_osm/variants/context_filter_cache.py', 'tests/test_context_filter_execution.py', 'src/tac_osm/variants/context_filter_world.py', 'tests/test_context_filter_world.py', 'tests/test_me095_context.py', 'src/tac_osm/variants/median_anchored_world.py', 'src/tac_osm/variants/median_anchored_distribution.py', 'src/tac_osm/variants/median_anchored_execution.py', 'tests/test_median_anchored_world.py', 'tests/test_median_anchored_execution.py', 'src/tac_osm/variants/robust_visual_world.py', 'src/tac_osm/variants/robust_visual_execution.py', 'src/tac_osm/variants/multimode_distribution.py', 'tests/test_multimode_distribution.py', 'tests/test_robust_visual_world.py', 'tests/test_robust_visual_execution.py', 'src/tac_osm/gradient_surgery.py', 'tests/test_gradient_surgery.py', 'src/tac_osm/variants/visual_execution.py', 'tests/test_visual_execution.py', 'research/source-bundles/ME091/**', 'src/tac_osm/variants/visual_world.py', 'scripts/me095*', 'tests/test_visual_world.py', 'research/context-filter-search/**', 'research/mathematical-engineering/me095/**', 'research/replay-bundles/ME095/**', '.github/workflows/me095-context-filter-replay.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python -m pytest tests/test_context_filter_execution.py tests/test_context_filter_world.py tests/test_me095_context.py tests/test_median_anchored_world.py tests/test_median_anchored_execution.py tests/test_multimode_distribution.py tests/test_robust_visual_world.py tests/test_robust_visual_execution.py tests/test_gradient_surgery.py tests/test_visual_world.py tests/test_visual_execution.py tests/test_clock_value_world.py tests/test_clock_value_execution.py -q
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me095/FAIR_COMPARISON.json --phase preflight
      - name: Validate every original whole model and actual optimizer receipt
        if: hashFiles('research/replay-bundles/ME095/FIT_INDEX.json') != ''
        run: |
          PYTHONPATH=src:. python scripts/me095_train_world.py finalize --study me095
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me095/FINAL_COMPARISON.json --phase final
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clock-value-source
          key: clock-value-original-source-v1
      - uses: actions/cache@v4
        with:
          path: /tmp/me091-visual-source
          key: me091-pinned-gray32-overhead-v1
      - name: Verify and restore Git-owned exact observed image pixels
        if: hashFiles('research/replay-bundles/ME095/ORIGINAL_SCORE_INDEX.json') != ''
        run: python scripts/me091_restore_pixels.py
      - name: Strict original visual forecast replay without fitting
        if: hashFiles('research/replay-bundles/ME095/ORIGINAL_SCORE_INDEX.json') != ''
        run: PYTHONPATH=src:. python scripts/me095_train_world.py replay --study me095 --cache "${{ runner.temp }}/clock-value-source"
      - name: Full original numerical census
        if: always() && hashFiles('research/replay-bundles/ME095/ORIGINAL_SCORE_INDEX.json') != ''
        run: PYTHONPATH=src:. python scripts/me095_cross_cpu_audit.py --study me095 --cache "${{ runner.temp }}/clock-value-source"
      - name: Restore complete context, clock and state execution views
        if: hashFiles('research/mathematical-engineering/me095/COMPLETE_EXECUTION_AUDIT.json') != '' && hashFiles('research/replay-bundles/ME095/ORIGINAL_SCORE_INDEX.json') != ''
        run: PYTHONPATH=src:. python scripts/me095_execution.py --verify --cache "${{ runner.temp }}/clock-value-source"
