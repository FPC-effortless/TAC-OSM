name: LANGDECODE066 original source cap clock parity and cache integrity
on:
  pull_request:
    paths:
      - 'scripts/langdecode066_source_boundary.py'
      - 'tests/test_langdecode066_source_boundary.py'
      - 'research/mathematical-engineering/langdecode066/**'
      - 'research/phone_queue/langdecode066.json'
      - '.github/workflows/langdecode066.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-clock-falsifiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Source-locked no-fit CPU planner and parity preflight
        run: |
          mkdir -p langdecode066-evidence
          python scripts/phone_lab.py plan research/phone_queue/langdecode066.json > langdecode066-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langdecode066/FAIR_COMPARISON.json --phase preflight > langdecode066-evidence/PREFLIGHT.json
      - name: Original PyTorch source direct finite-clock/state/local-gradient checks
        run: |
          PYTHONPATH=src:. python -m pytest -q tests/test_langdecode066_source_boundary.py tests/test_langdecode064_cached_cap.py
          PYTHONPATH=src:. python scripts/langdecode066_source_boundary.py --output langdecode066-evidence/RESULTS.json
          python - <<'PY'
          import json
          r=json.load(open('langdecode066-evidence/RESULTS.json'))
          assert r["status"]=="NUMERICAL_RANGE_PASS_ENGINE_CACHE_INTEGRITY_OPEN"
          assert r["gpu_minutes"]==0 and r["protected_TEST"]=="NOT_ACCESSED"
          assert r["original_checkpoint"]=="NOT_LOADED"
          assert len(r["rows"])==2
          for row in r["rows"]:
              assert row["checked_positions"]==65536+17
              assert row["bitwise_original_position_and_state"]
              assert row["position_linear_weight_gradient_bitwise"]
              assert row["max_abs_original_position_error"]==0
              assert row["integrity_status"]=="OPEN_MUTABLE_ENGINE_CACHE_UNTRACKED"
          PY
      - name: Retain original positive and negative findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGDECODE066-constructed-original-source-boundary
          path: langdecode066-evidence/
          retention-days: 90
          if-no-files-found: warn
