name: ME089 native clock-value-parallel original replay (no training)
on:
  pull_request:
    paths: ['src/tac_osm/variants/clock_value_world.py', 'scripts/me089*', 'tests/test_clock_value_world.py', 'tests/test_clock_value_execution.py', 'src/tac_osm/variants/clock_value_execution.py', 'research/raw-router-search/**', 'src/tac_osm/variants/raw_router_world.py', 'src/tac_osm/variants/implicit_quantile.py', 'tests/test_raw_router_world.py', 'research/mathematical-engineering/me089/**', 'research/replay-bundles/ME089/**', '.github/workflows/me089-raw-router-replay.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python -m pytest tests/test_raw_router_world.py tests/test_clock_value_world.py tests/test_clock_value_execution.py -q
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me089/FAIR_COMPARISON.json --phase preflight
      - name: Validate every original whole model and actual optimizer receipt
        if: hashFiles('research/replay-bundles/ME089/FIT_INDEX.json') != ''
        run: |
          PYTHONPATH=src:. python scripts/me089_train_world.py finalize --study me089
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me089/FINAL_COMPARISON.json --phase final
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clock-value-source
          key: clock-value-original-source-v1
      - name: Strict original reference replay without fitting
        if: hashFiles('research/replay-bundles/ME089/ORIGINAL_SCORE_INDEX.json') != ''
        run: PYTHONPATH=src:. python scripts/me089_train_world.py replay --study me089 --cache "${{ runner.temp }}/clock-value-source"
      - name: Full numerical census; strict failures remain failed
        if: always() && hashFiles('research/replay-bundles/ME089/ORIGINAL_SCORE_INDEX.json') != ''
        run: PYTHONPATH=src:. python scripts/me089_cross_cpu_audit.py --study me089 --cache "${{ runner.temp }}/clock-value-source"
      - name: Restore original raw-router compiled input-to-quantiles programs
        if: hashFiles('research/mathematical-engineering/me089/COMPILED_GRAPH_AUDIT.json') != '' && hashFiles('research/replay-bundles/ME089/ORIGINAL_SCORE_INDEX.json') != ''
        run: PYTHONPATH=src:. python scripts/me089_compiled_verify.py --study me089 --cache "${{ runner.temp }}/clock-value-source"
