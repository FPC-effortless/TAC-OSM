name: DEV-023 coordinate isolation and local aging (development)
on:
  pull_request:
    # Later scientific executions use explicit dispatch; documentation edits
    # must not silently launch another 60-cell training matrix.
    types: [opened]
    paths:
      - "src/tac_osm/development/entity_aging.py"
      - "scripts/*dev023*"
      - "tests/test_dev023_entity_aging.py"
      - "contracts/DEV-023.json"
      - ".github/workflows/dev023-entity-aging.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU tests
        timeout-minutes: 8
        run: |
          python -m pip install --quiet --timeout 60 --retries 3 -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet --timeout 60 --retries 3 torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint, provenance and regression suite
        run: |
          ruff check --select F src/tac_osm/development/entity_aging.py scripts/*dev023* tests/test_dev023_entity_aging.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Two-step intervention smoke and exact replay (not findings)
        run: |
          for arm in native_global masked_global native_local masked_local schema41 memoryless; do
            python scripts/run_dev023_entity_aging.py --seed 43 --regime short --arm "$arm" --smoke --output "artifacts/smoke-$arm"
            python scripts/run_dev023_entity_aging.py --seed 43 --regime short --arm "$arm" --smoke --replay --output "artifacts/smoke-$arm"
          done
  trained-cell:
    needs: integrity-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [43, 59, 71, 89, 107]
        regime: [short, long]
        arm: [native_global, masked_global, native_local, masked_local, schema41, memoryless]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU research runtime
        timeout-minutes: 8
        run: |
          python -m pip install --quiet --timeout 60 --retries 3 -e . numpy==2.3.3
          python -m pip install --quiet --timeout 60 --retries 3 torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Matched from-scratch training and held-out physical evaluation
        run: python scripts/run_dev023_entity_aging.py --seed ${{ matrix.seed }} --regime ${{ matrix.regime }} --arm ${{ matrix.arm }} --output artifacts/cell
      - name: Separate-process exact checkpoint prediction, action and cost replay
        run: python scripts/run_dev023_entity_aging.py --seed ${{ matrix.seed }} --regime ${{ matrix.regime }} --arm ${{ matrix.arm }} --replay --output artifacts/cell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-023-RAW-${{ matrix.regime }}-${{ matrix.seed }}-${{ matrix.arm }}-NOT-CONFIRMATORY
          path: artifacts/cell/
          if-no-files-found: warn
  independent-audit:
    needs: trained-cell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV-023-RAW-*-NOT-CONFIRMATORY
          path: artifacts/all
      - name: Independent stdlib history, prediction, action and physical-cost audit
        run: python scripts/audit_dev023_entity_aging.py artifacts/all/DEV-023-RAW-*-NOT-CONFIRMATORY --output artifacts/all/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-023-COMPLETE-AUDITED-NOT-CONFIRMATORY
          path: artifacts/all/
          if-no-files-found: error
