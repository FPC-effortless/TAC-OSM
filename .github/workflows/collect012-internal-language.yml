name: COLLECT012 internal next-byte learnability

on:
  push:
    branches: [research/collect012-internal-language-2026-11-02]
    paths: [research/collect012/LAUNCH_REQUEST.json]

permissions:
  contents: read

concurrency:
  group: collect012-internal-fixed-recipe
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/collect011
            research/collect012
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore exact public FIT/DEV and validate the registered launch
        working-directory: research/collect012
        run: |
          python -m collect012.restore_data
          python -m collect012.verify_launch > results/REMOTE_PREFLIGHT.json
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python -m unittest collect012.test_prefit -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect012-prefit-${{ github.run_id }}
          path: research/collect012/results/
          retention-days: 90

  fit:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [attention, phase_p, hybrid_hard_p]
        seed: [12001, 12002, 12003]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/collect011
            research/collect012
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore and enforce the exact source/registration
        working-directory: research/collect012
        run: |
          python -m collect012.restore_data
          python -m collect012.verify_launch
      - name: Execute the complete preregistered internal fit
        working-directory: research/collect012
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m collect012.train --arm '${{ matrix.arm }}' --seed '${{ matrix.seed }}' --device cpu --output 'results/${{ matrix.arm }}_${{ matrix.seed }}'
      - name: Fresh-process checkpoint and exposed-DEV diagnostics
        working-directory: research/collect012
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m collect012.evaluate --run 'results/${{ matrix.arm }}_${{ matrix.seed }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect012-${{ matrix.arm }}-${{ matrix.seed }}-${{ github.run_id }}
          path: research/collect012/results/${{ matrix.arm }}_${{ matrix.seed }}/
          retention-days: 90
