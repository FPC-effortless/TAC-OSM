name: ME074 exposed genuine BPI2012 all-case baselines and native memory diagnostic
on:
  pull_request:
    paths:
      - 'scripts/me074_exposed_real_baselines.py'
      - 'scripts/me074_exposed_memory_lesions.py'
      - 'tests/test_me074_no_fit_memory_fixture.py'
      - 'research/mathematical-engineering/me074/**'
      - '.github/workflows/me074-exposed-real-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: me074-original-exposed-report-no-fit
  cancel-in-progress: false
jobs:
  authentic-source-and-memory-analysis:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0' 'pytest==8.4.2'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Register no-fit synthetic fixture as mechanism-unit evidence, NOT capability
        run: |
          PYTHONPATH=src:. python -m pytest -q tests/test_me074_no_fit_memory_fixture.py
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me074/FAIR_COMPARISON.json --phase preflight
      - name: Score legitimate original FIT ngrams versus immutable ME073 free-run output on exposed real REPORT
        run: |
          if [ -f research/replay-bundles/ME074/REAL_DEV_END_AWARE_BASELINE.json ]; then
            echo 'Already Git-frozen original exposed baseline; do not regenerate'
          else
            PYTHONPATH=src:. python scripts/me074_exposed_real_baselines.py --cache "${{ runner.temp }}/me074-original-BPI2012-only"
          fi
      - name: Frozen trained ME073 native memory sensitivity on same originally exposed case IDs
        run: |
          if [ -f research/replay-bundles/ME074/EXPOSED_MEMORY_LESIONS.json ]; then
            echo 'Already Git-frozen real memory sensitivity; do not regenerate'
          else
            PYTHONPATH=src:. python scripts/me074_exposed_memory_lesions.py --cache "${{ runner.temp }}/me074-original-BPI2012-only"
          fi
      - name: Commit real negative and positive diagnostics as historical evidence
        if: always()
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -e
          for f in research/replay-bundles/ME074/REAL_DEV_END_AWARE_BASELINE.json research/replay-bundles/ME074/EXPOSED_MEMORY_LESIONS.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'evidence(me074): original exposed real BPI2012 full-EOR baselines and frozen native memory lesions'
            for attempt in 1 2 3 4 5; do
              git fetch origin "$PUSH_BRANCH"
              git rebase "origin/$PUSH_BRANCH"
              if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
