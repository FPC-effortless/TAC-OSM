name: LANGMEM086 trained100k autonomous compact dual clipped TAC
on:
  pull_request:
    paths:
      - 'research/mathematical-engineering/langmem086/**'
      - 'research/phone_queue/langmem086.json'
      - 'scripts/langmem086*'
      - 'tests/test_langmem086.py'
      - '.github/workflows/langmem086.yml'
permissions:
  contents: read
  actions: read
jobs:
  trained-before-new-documents:
    if: github.head_ref == 'research/langmem086-trained-autonomous-dual-clipped-2026-10-30'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [1701,1702,1703]
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Source/gates and actual-model constructed checks before any optimizer
        run: |
          mkdir -p evidence086
          PYTHONPATH=src:. python scripts/phone_lab.py plan research/phone_queue/langmem086.json > evidence086/PLAN.json
          PYTHONPATH=src:. python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langmem086/FAIR_COMPARISON.json --phase preflight > evidence086/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langmem086.py tests/test_research_probe_agnostic.py
      - name: FIT only - new100521p model optimizer RNG and replay seal, no Rust content present
        run: |
          PYTHONPATH=src:. python scripts/langmem086_run.py train --seed ${{ matrix.seed }} --output evidence086/TRAINED
      - name: Only AFTER trained checkpoint seal acquire new Git-pinned Rust documents
        run: |
          mkdir -p new-rust086
          curl --fail --silent --show-error --location --retry 2 https://raw.githubusercontent.com/rust-lang/book/2771df165f092a4fbb9f46b5b2e7450f19010adb/src/ch06-01-defining-an-enum.md --output new-rust086/ch06-01-defining-an-enum.md
          curl --fail --silent --show-error --location --retry 2 https://raw.githubusercontent.com/rust-lang/book/2771df165f092a4fbb9f46b5b2e7450f19010adb/src/ch10-01-syntax.md --output new-rust086/ch10-01-syntax.md
      - name: First new-source actual next-byte evaluation, automatic query and read controls
        run: |
          PYTHONPATH=src:. python scripts/langmem086_run.py evaluate --seed ${{ matrix.seed }} --trained evidence086/TRAINED --documents new-rust086 --output evidence086/EVAL_RECEIPT.json
      - name: Preserve full original model optimizer RNG and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGMEM086-TRAINED-seed${{ matrix.seed }}
          path: evidence086/
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    needs: trained-before-new-documents
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Strict original three-seed source/training/nextbyte aggregate
        run: |
          gh run download "${{ github.run_id }}" -R FPC-effortless/TAC-OSM --pattern 'LANGMEM086-TRAINED-seed*' --dir raw086
          python scripts/langmem086_aggregate.py --results raw086 --output aggregate086/RESULTS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGMEM086-NEW-SOURCE-AGGREGATE
          path: aggregate086/
          retention-days: 90
