name: LATFUSE012 synthetic-only frozen fixed delay512 write-count sweep

on:
  push:
    branches:
      - research/latfuse012-fixed-delay-write-count-2026-10-27
    paths:
      - ".github/workflows/latfuse012-synthetic-fixed-write-count.yml"
      - "scripts/latfuse012_synthetic_fixed_delay_writes.py"
      - "research/mathematical-engineering/latfuse012/SYNTHETIC_DISTRACTOR_REGISTRATION.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latfuse012-synthetic-only-original-fixed-delay
  cancel-in-progress: false

jobs:
  fixed-time-memory-write-count-diagnostic-no-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: CPU torch only, NEVER download original real UCI source
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Enforce explicitly synthetic only and unchanged original checkpoint registration
        run: |
          python -m py_compile scripts/latfuse012_synthetic_fixed_delay_writes.py
          test -s research/replay-bundles/LATFUSE011-SYNTHETIC/RESULTS.json
          test ! -e research/mathematical-engineering/latfuse012/SYNTHETIC_WRITE_COUNT_RESULTS.json
          python - <<'PY'
          import json
          j=json.load(open("research/mathematical-engineering/latfuse012/SYNTHETIC_DISTRACTOR_REGISTRATION.json"))
          assert j["schema_version"]=="tac-osm.synthetic-diagnostic.v1"
          assert j["no_real_world_claim"] is True and j["synthetic_only"] is True
          assert j["original_source_archive_used"] is False and j["protected_source_used"] is False
          assert j["no_new_model_fits"] is True
          assert j["intervening_write_counts"]==[0,8,32,128,512]
          PY
      - name: Original trained synthetic checkpoints, identical512 step source-free pairs and varying only memory write count
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/latfuse012_synthetic_fixed_delay_writes.py \
            --output research/mathematical-engineering/latfuse012/SYNTHETIC_WRITE_COUNT_RESULTS.json
      - name: Archive exactly labelled synthetic-only nofit results, never merge into real primary evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/latfuse012-fixed-delay-write-count-2026-10-27
          test -s research/mathematical-engineering/latfuse012/SYNTHETIC_WRITE_COUNT_RESULTS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/latfuse012/SYNTHETIC_WRITE_COUNT_RESULTS.json
          git diff --cached --quiet && exit 1
          git commit -m "research: preserve source-free fixed512-time vs number-of-intervening-memory-writes counterfactual controls"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Original scientific boundary
        run: |
          echo "SYNTHETIC ONLY, not primary authentic source evidence or validated real-world memory skill."
          echo "Intervening memory-write suppressions are OOD; alpha retained too. No trained model changed."
