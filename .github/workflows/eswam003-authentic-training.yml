name: ESWAM003 authentic motion-selective physical training and independent replay
on:
  pull_request:
    paths:
      - "scripts/eswam003_train_real.py"
      - "src/tac_osm/variants/selective_exchange_world.py"
      - "tests/test_selective_exchange_world.py"
      - "research/mathematical-engineering/eswam003/FAIR_COMPARISON.json"
      - ".github/workflows/eswam003-authentic-training.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eswam003-original-five-real-fits
  cancel-in-progress: false
jobs:
  original-authentic-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eswam003-selective-dynamics-2026-10-23
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned scientific dependencies
        run: |
          python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate source timing and all active model weights before fitting
        run: |
          python -m py_compile scripts/eswam003_train_real.py src/tac_osm/variants/selective_exchange_world.py
          PYTHONPATH=src:. python -m pytest -q tests/test_selective_exchange_world.py
          PYTHONPATH=src:. python scripts/eswam003_train_real.py preflight
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/eswam003/FAIR_COMPARISON.json --phase preflight
          python scripts/audit_training_budget.py
      - name: Cache already authorized original public real robot source
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/me076-pinned-publisher-source
          key: me076-bodenai-public-five-tasks-original-fit-v1
      - name: Train five original guarded real models and evaluate actual source transitions
        run: PYTHONPATH=src:. python scripts/eswam003_train_real.py fit --cache "${{ runner.temp }}/me076-pinned-publisher-source"
      - name: Permanently preserve all original checkpoint and per-case score bytes
        if: success()
        env:
          TARGET_BRANCH: research/eswam003-selective-dynamics-2026-10-23
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/mathematical-engineering/eswam003/SOURCE_QUALIFICATION.json
          git add -f research/mathematical-engineering/eswam003/RESULTS.json
          git add -f research/replay-bundles/ESWAM003
          git commit -m 'research(eswam003): freeze five original real model weights, labels and scores'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
  independent-original-replay:
    needs: original-authentic-fit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eswam003-selective-dynamics-2026-10-23
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/me076-pinned-publisher-source
          key: me076-bodenai-public-five-tasks-original-fit-v1
      - name: Restore original five published checkpoints and verify per-case original real scores
        run: PYTHONPATH=src:. python scripts/eswam003_train_real.py replay --cache "${{ runner.temp }}/me076-pinned-publisher-source"
      - name: Preserve independent replay receipt
        env:
          TARGET_BRANCH: research/eswam003-selective-dynamics-2026-10-23
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/replay-bundles/ESWAM003/INDEPENDENT_ORIGINAL_REAL_REPLAY.json
          git commit -m 'audit(eswam003): independent zero-fit replay of five real checkpoints'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
