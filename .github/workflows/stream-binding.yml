name: Caller-pinned stream/model binding - no fit
on:
  pull_request:
    paths:
      - 'src/tac_osm/stream_binding.py'
      - 'tests/test_stream_binding.py'
      - 'research/stream_binding_20261111/**'
      - '.github/workflows/stream-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install pytest==8.4.2 numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen inherited source and CPU route
        run: |
          mkdir -p binding-evidence
          python -B scripts/phone_lab.py plan research/phone_queue/stream_binding_20261111.json > binding-evidence/CPU_PLAN.json
          cmp binding-evidence/CPU_PLAN.json research/stream_binding_20261111/COMPUTE_DECISION.json
          python - <<'PY'
          import hashlib,json,pathlib
          p=json.load(open('research/stream_binding_20261111/PROTOCOL.json'))
          assert all(hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h for f,h in p['source_pins'].items())
          print('Inherited model, precision, ingress and copy source pins unchanged')
          PY
      - name: Pinned receipt, source model/state identity and AD controls
        run: |
          PYTHONPATH=src:. python -m pytest -q tests/test_stream_binding.py tests/test_state_ingress.py tests/test_csl125_memory_precision.py tests/test_csl125_r3.py tests/test_csl125_tool_model.py tests/test_research_probe_agnostic.py --junitxml=binding-evidence/TESTS.xml
      - name: Exact source and no-fit scope
        if: always()
        run: |
          git rev-parse HEAD > binding-evidence/COMMIT.txt
          sha256sum src/tac_osm/stream_binding.py tests/test_stream_binding.py > binding-evidence/SOURCE_SHA256.txt
          cp research/stream_binding_20261111/PROTOCOL.json binding-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STREAM-BINDING-20261111-engineering
          path: binding-evidence/
          retention-days: 90
