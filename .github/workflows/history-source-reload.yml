name: Original history source-reload invariance and key observability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-audit:
    if: github.head_ref == 'research/source-reloaded-history-audit-2026-10-27' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/source-reloaded-history-audit-2026-10-27')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fd201207cb76b30470f64e1fc1baecf9de44560d
          path: original-content-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse immutable source evidence only when scientific files are unchanged
        id: scope
        run: |
          git fetch --depth=1 origin b472476dabd7bb7648ec8e0af653896d1382a0f0
          if git diff --quiet b472476dabd7bb7648ec8e0af653896d1382a0f0 HEAD -- src scripts/audit_history_source_reload.py scripts/original_history_trace.py scripts/validate_research_parity.py scripts/phone_lab.py research/mathematical-engineering/history_source017/FAIR_COMPARISON.json research/mathematical-engineering/history_source017/PREREGISTRATION.md research/phone_queue/history-source017.json research/mathematical-engineering/history_query016/FROZEN_PLAN.json research/replay-bundles/HISTORY-QUERY016/ && [ -f research/mathematical-engineering/history_source017/ORIGINAL_RESULTS.json.gz ]; then
            python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          p=Path('research/mathematical-engineering/history_source017')
          data=(p/'ORIGINAL_RESULTS.json.gz').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='f99e042a2054a49c4f7b795addc381b255820f4216f2b3435274b7566aa38ecb'
          raw=gzip.decompress(data)
          assert hashlib.sha256(raw).hexdigest()=='bfe78a170573430c8a6e14c9024c759385f7eec97ee17db80a138b4b695b5d93'
          r=json.loads(raw)
          assert r['all_exercised_end_to_end_invariance_checks_pass']
          assert r['training_steps']==0 and not r['protected_TEST']
          print('NO_NEW_SOURCE_EXECUTION: unchanged scientific code, cohort and checkpoints; reused exact source audit40502062403')
          PY
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pinned CPU execution profile and engineering tools
        run: |
          python -m pip install --quiet pytest cryptography numpy==2.3.3 ruff
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import torch
          assert str(torch.__version__) == '2.14.1+cpu'
          assert torch.backends.cpu.get_cpu_capability() == 'AVX2'
          PY
      - name: Source-mutation falsifiers, actual original graph fixtures and generic probe contract
        env:
          PYTHONPATH: .:src
          TAC_OSM_CONTENT_QUERY_SOURCE: ${{ github.workspace }}/original-content-code
        run: |
          python -m ruff check --select E9,F63,F7,F82 scripts/audit_history_source_reload.py src/tac_osm/history_source_controls.py src/tac_osm/history_source_probe.py tests/test_history_source_controls.py
          python -m pytest -q tests/test_history_source_controls.py tests/test_research_probe_agnostic.py
      - name: Preregistration and CPU compute route
        run: |
          mkdir -p ci-artifacts/history-source017
          python scripts/phone_lab.py plan research/phone_queue/history-source017.json > ci-artifacts/history-source017/COMPUTE_DECISION.txt
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/history_source017/FAIR_COMPARISON.json --phase preflight
      - name: Verified publisher archive, original member only
        if: steps.scope.outputs.needed == 'true'
        run: |
          python - <<'PY'
          import hashlib,io,json,urllib.request,zipfile
          from pathlib import Path
          r=json.loads(Path('research/mathematical-engineering/history_audit014/PUBLIC_SOURCE_RECEIPT.json').read_text())
          with urllib.request.urlopen(r['download_url'],timeout=90) as response:
              data=response.read()
          assert hashlib.sha256(data).hexdigest()==r['download_bundle_sha256']
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              original=z.read(r['extracted_member'])
          assert hashlib.sha256(original).hexdigest()==r['archive_sha256']
          Path('/tmp/history-source017-original.zip').write_bytes(original)
          PY
      - name: Actual source reload, future-only controls and native writer/read trace
        if: steps.scope.outputs.needed == 'true'
        run: |
          python scripts/audit_history_source_reload.py --implementation-root original-content-code --source /tmp/history-source017-original.zip --output ci-artifacts/history-source017/first
      - name: Fresh-process exact source-control/checkpoint audit replay
        if: steps.scope.outputs.needed == 'true'
        run: |
          python scripts/audit_history_source_reload.py --implementation-root original-content-code --source /tmp/history-source017-original.zip --output ci-artifacts/history-source017/replay
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('ci-artifacts/history-source017')
          a=(p/'first/RESULTS.json').read_bytes();b=(p/'replay/RESULTS.json').read_bytes()
          assert a==b,'source-reloaded audit replay changed'
          r=json.loads(a)
          assert r['all_exercised_end_to_end_invariance_checks_pass']
          assert r['training_steps']==0 and not r['protected_TEST']
          (p/'REPLAY_RECEIPT.json').write_text(json.dumps({'status':'PASS_EXACT_SOURCE_RELOADED_AUDIT_REPLAY','results_sha256':hashlib.sha256(a).hexdigest(),'capability_evidence':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-source017-source-audit
          path: ci-artifacts/history-source017/
          retention-days: 30
          if-no-files-found: warn
