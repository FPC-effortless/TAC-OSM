name: ME057 authentic FIT source and prospective parity-v3 qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/validate_research_parity.py'
      - 'scripts/me057_audit_original_fit.py'
      - 'tests/test_research_parity_gate.py'
      - 'tests/test_me057_source_audit.py'
      - 'research/mathematical-engineering/me057/**'
      - '.github/workflows/me057-authentic-source-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: me057-fit-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-parity-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source reader and test environment
        run: python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
      - name: Validate parity schema and authentic-data audit software contracts
        run: |
          python -m py_compile scripts/me057_audit_original_fit.py scripts/validate_research_parity.py
          PYTHONPATH=src:. python -m pytest -q tests/test_research_parity_gate.py tests/test_me057_source_audit.py
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me057/FAIR_COMPARISON.json --phase preflight

  audit-all-original-fit-episodes:
    needs: source-and-parity-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-only reader without model training
        run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - name: Audit pinned publisher metadata and every original FIT parquet, without opening DEV or TEST trajectories
        run: |
          set -o pipefail
          PYTHONPATH=src:. python -m scripts.me057_audit_original_fit \
            --frozen research/me055-independent-robot-task-source.json \
            --cache results/me057/private-original-FIT \
            --output results/me057/FIT_SOURCE_RECEIPT.json \
            | tee results-me057-FIT-audit.log
      - name: Preserve source hashes and original-source audit trace, not publisher data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me057-authentic-FIT-qualification-receipt
          path: |
            results/me057/FIT_SOURCE_RECEIPT.json
            results-me057-FIT-audit.log
          if-no-files-found: ignore
          retention-days: 90
