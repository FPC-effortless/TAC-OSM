name: LANGSCALE001 memory reallocation engineering checks (NO FIT)
on:
  pull_request:
    paths:
      - 'research/langscale001/**'
      - 'research/phone_queue/langscale001*.json'
      - 'research/mathematical-engineering/langscale001-*/**'
      - '.github/workflows/langscale001-nofit.yml'
permissions:
  contents: read
concurrency:
  group: langscale001-nofit-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Source plan, full equations and architecture-neutral adapters; no dataset or optimizer
        run: |
          mkdir -p ci-artifacts/langscale001
          python scripts/phone_lab.py plan research/phone_queue/langscale001-nofit.json > ci-artifacts/langscale001/PLAN.log
          python research/langscale001/verify.py --out ci-artifacts/langscale001/SOURCE_TESTS.json
          python research/langscale001/check_probes.py --out ci-artifacts/langscale001/ADAPTER_TESTS.json
          python -m pytest -q tests/test_research_probe_agnostic.py
      - name: Audit partial profiler coverage and report blocked training honestly
        run: |
          python research/langscale001/profile_compute.py --out ci-artifacts/langscale001/PARTIAL_PROFILE.json
          python research/langscale001/readiness.py --out ci-artifacts/langscale001/READINESS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGSCALE001-NOFIT-source-and-gate-evidence
          path: ci-artifacts/langscale001/
          if-no-files-found: error
          retention-days: 90
