name: S1RET008 real-drive Observatory regression and anticheat
on:
  push:
    branches: [research/s1ret008-entity-source-admission-2026-10-26]
    paths:
      - 'src/tac_osm/research_s1ret008_adapter.py'
      - 'tests/test_research_s1ret008_adapter.py'
      - 'src/tac_osm/variants/s1ret008_backblaze_source.py'
      - 'tests/test_s1ret008_backblaze_source.py'
      - '.github/workflows/s1ret008-observatory.yml'
  pull_request:
    paths:
      - 'src/tac_osm/research_s1ret008_adapter.py'
      - 'tests/test_research_s1ret008_adapter.py'
permissions:
  contents: read
jobs:
  real-source-contract-no-training:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy<2'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1ret008_backblaze_source -v
          PYTHONPATH=src:. python -m unittest tests.test_research_s1ret008_adapter -v
          PYTHONPATH=src:. python -m unittest tests.test_s1ret008_source_entity -v
