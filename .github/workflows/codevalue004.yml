name: CODEVALUE004 source and constructed preflight only
on:
  pull_request:
    paths:
      - 'research/commercial-value/codevalue004/**'
      - 'research/mathematical-engineering/codevalue004/**'
      - 'research/kaggle_workloads/codevalue004.py'
      - 'research/phone_queue/codevalue004-generalization-t4x2.json'
      - 'scripts/validate_research_parity.py'
      - '.github/workflows/codevalue004.yml'
permissions:
  contents: read
jobs:
  no-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pytest==8.4.2
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Constructed source checks, no publisher reads or optimizer fits
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -m pytest -q research/commercial-value/codevalue004/test_codevalue004.py tests/test_research_parity_gate.py tests/test_research_probe_agnostic.py
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/codevalue004/FAIR_COMPARISON.json --phase preflight
          python scripts/phone_lab.py plan research/phone_queue/codevalue004-generalization-t4x2.json
