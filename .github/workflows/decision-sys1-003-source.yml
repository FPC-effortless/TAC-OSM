name: DECISION-SYS1-003 TRAIN source audit
on:
  push:
    branches: [research/decision-sys1-003-source-ssm-2026-11-06]
    paths:
      - scripts/acquire_decision_sys1_train_003.py
      - .github/workflows/decision-sys1-003-source.yml
permissions:
  contents: read
concurrency:
  group: decision-sys1-003-source
  cancel-in-progress: false
jobs:
  source-only:
    if: github.repository == 'FPC-effortless/TAC-OSM'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned CPU audit dependencies
        run: |
          python -m pip install numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Acquire two checksum-pinned TRAIN files; no model or holdouts
        env:
          PYTHONPATH: src
        run: |
          python scripts/acquire_decision_sys1_train_003.py --data-dir "$RUNNER_TEMP/decision-sys1-train" --output artifacts/decision-sys1-003
      - name: Preserve receipts, never raw source or holdouts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decision-sys1-003-source-${{ github.sha }}
          path: artifacts/decision-sys1-003/
          if-no-files-found: warn
          retention-days: 30
