name: TAC-OSM end-to-end PLM-to-CASM bridge DEV-015 (NOT confirmatory)
on:
  pull_request:
    paths:
      - "src/tac_osm/development/plm_casm_bridge.py"
      - "scripts/run_plm_casm_bridge_dev.py"
      - "scripts/validate_plm_casm_bridge_dev.py"
      - "tests/test_plm_casm_bridge_development.py"
      - "docs/PLM-CASM-BRIDGE-DEV-015.md"
      - ".github/workflows/plm-casm-bridge-development.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bridge-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU regression runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax and unused-symbol checks
        run: |
          python -m py_compile src/tac_osm/development/plm_casm_bridge.py scripts/run_plm_casm_bridge_dev.py scripts/validate_plm_casm_bridge_dev.py tests/test_plm_casm_bridge_development.py
          ruff check --select F src/tac_osm/development/plm_casm_bridge.py scripts/run_plm_casm_bridge_dev.py scripts/validate_plm_casm_bridge_dev.py tests/test_plm_casm_bridge_development.py
      - name: Finite state and task gradient regression tests
        run: python -m pytest tests/test_plm_casm_bridge_development.py -q
      - name: Existing suite count integrity
        run: python scripts/sync_test_count.py --check
      - name: Retrieve exact DEV-013 frozen base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh api --header 'Accept: application/vnd.github+json' \
            /repos/FPC-effortless/TAC-OSM/actions/artifacts/11836120110/zip \
            > artifacts/parent/DEV-013.zip
          echo "880d56e177b78d44961a8fc75e6e0a4151ebe6eeb7a55ce81afaa6c358172d65  artifacts/parent/DEV-013.zip" | sha256sum -c -
      - name: Smoke training and replay with in/out-family check
        run: |
          python scripts/run_plm_casm_bridge_dev.py --smoke --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-015-SMOKE
          python scripts/validate_plm_casm_bridge_dev.py --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-015-SMOKE
      - name: Preserve mechanism and smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-015-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-015-SMOKE/
          if-no-files-found: warn

  three-seed-bridge:
    needs: bridge-mechanism
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download audited and immutable parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh api --header 'Accept: application/vnd.github+json' \
            /repos/FPC-effortless/TAC-OSM/actions/artifacts/11836120110/zip \
            > artifacts/parent/DEV-013.zip
          echo "880d56e177b78d44961a8fc75e6e0a4151ebe6eeb7a55ce81afaa6c358172d65  artifacts/parent/DEV-013.zip" | sha256sum -c -
      - name: Train five equal-initialization arms and audit exact replay
        run: |
          python scripts/run_plm_casm_bridge_dev.py --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-015
          python scripts/validate_plm_casm_bridge_dev.py --parent artifacts/parent/DEV-013.zip --output artifacts/DEV-015
      - name: Preserve all 15 trained checkpoints and 4,800 episode rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-015-RAW-NOT-CONFIRMATORY
          path: artifacts/DEV-015/
          if-no-files-found: error
