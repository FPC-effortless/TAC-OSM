name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/sync_test_count.py"
      - "docs/TACOSM-BASELINE-001.md"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gates:
    name: Pre-model gates (interface, representability, benchmark validity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # These gates are the only tests that must pass before any model is
      # trained. A failure here invalidates every learned-arm measurement
      # that follows, so they run first and alone.
      - name: Pre-model gates
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest "ruff==0.13.0"
          ruff check --select F821 src scripts
          python -m compileall -q src scripts
          PYTHONPATH=src python -m pytest tests/ -q

      - name: Interface importability
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          import tac_osm
          assert len(tac_osm.__all__) == 19, tac_osm.__all__
          print('interface symbols:', len(tac_osm.__all__))
          "

      # The frozen baseline's provenance row records the current test count
      # alongside the frozen one. It rots on every commit that adds a test,
      # and a stale count is exactly the failure this repository's integrity
      # gates exist for: a number that looks trustworthy and is not. The
      # runner is where the suite's real size lives, so the check runs here
      # rather than relying on a developer remembering to run the script.
      - name: Baseline provenance is current
        run: PYTHONPATH=src python scripts/sync_test_count.py --check
