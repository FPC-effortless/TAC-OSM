name: Memory bottleneck diagnostics DEV-004 (NOT confirmatory)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "development_protocols/MEMORY-DIAGNOSTICS-DEV-004.json"
      - "src/tac_osm/development/memory_diagnostics.py"
      - "scripts/run_memory_diagnostics_dev.py"
      - "scripts/validate_memory_diagnostics_dev.py"
      - "tests/test_memory_diagnostics_development.py"
      - ".github/workflows/memory-diagnostics-development.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU research dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Full integrity suite before any measurement
        run: |
          ruff check --select F src/tac_osm/development/memory_diagnostics.py scripts/run_memory_diagnostics_dev.py scripts/validate_memory_diagnostics_dev.py tests/test_memory_diagnostics_development.py
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
      - name: Retrieve immutable parent experiment checkpoints
        uses: actions/download-artifact@v5
        with:
          name: INTEGRATED-MEMORY-DEV-003-NOT-CONFIRMATORY
          run-id: 38175865759
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-evidence/
      - name: Run all frozen-model diagnostics and preserve probe checkpoints
        run: python scripts/run_memory_diagnostics_dev.py --parent parent-evidence
      - name: Replay every diagnostic result from parent and probe weights
        run: python scripts/validate_memory_diagnostics_dev.py artifacts/MEMORY-DIAGNOSTICS-DEV-004
      - name: Preserve raw evidence including negative findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MEMORY-DIAGNOSTICS-DEV-004-NOT-CONFIRMATORY
          path: artifacts/MEMORY-DIAGNOSTICS-DEV-004/
          if-no-files-found: error
