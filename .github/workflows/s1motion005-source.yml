name: S1MOTION005 source-only real episode audit (no fit)
on:
  push:
    branches: [research/s1motion005-gradient-budget-2026-10-26]
    paths: ['research/parallel-six/S1MOTION005-SOURCE-*.marker']
permissions:
  contents: read
jobs:
  original-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
      - name: Audit FIT episode files only, publisher revision/clock/identity
        run: python scripts/s1motion005_source_audit.py
      - name: Retain original source receipts (no model)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1motion005-source-only-revision-lock
          path: research/diagnostics/s1motion005-source-original.json
          if-no-files-found: warn
          retention-days: 90
