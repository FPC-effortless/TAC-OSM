name: LATFUSE013 genuine frozen PM2.5 content decoding oracle/wrong/random/nuisance gates

on:
  push:
    branches:
      - research/latfuse013-source-pm25-decodability-2026-10-27
    paths:
      - ".github/workflows/latfuse013-real-content-probe.yml"
      - "scripts/latfuse013_real_pm25_content_probe.py"
      - "research/mathematical-engineering/latfuse013/REGISTERED_REAL_CONTENT_PROBE.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: LATFUSE013-ORIGINAL-SOURCE-ONLY-FROZEN-READ
  cancel-in-progress: false

jobs:
  real-source-content-decoding-sidecars:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: CPU original source PyTorch only (no new TAC training)
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze genuine-source original metric selection and registered source archive before sidecar fit
        run: |
          set -e
          python -m py_compile scripts/latfuse013_real_pm25_content_probe.py
          python scripts/validate_research_parity.py \
            --manifest research/mathematical-engineering/latfuse013/REGISTERED_REAL_CONTENT_PROBE.json \
            --phase preflight
          python scripts/validate_research_parity.py \
            --manifest research/replay-bundles/LATFUSE008/POSTFIT_PARITY.json \
            --phase final
          test -s research/replay-bundles/LATFUSE008/RESULTS.json
          test ! -e research/mathematical-engineering/latfuse013/RESULTS.json
      - name: Restore original source-owned legally archived physical UCI501 observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse013-real
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse013-real/PRSA2017_original.zip
      - name: Frozen original SHA models, authentic PM2.5 continuous content versus wrong/random memory reads
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/latfuse013_real_pm25_content_probe.py \
            --source /tmp/latfuse013-real/PRSA2017_original.zip \
            --output research/mathematical-engineering/latfuse013/RESULTS.json
      - name: Commit sidecar-only real-source evidence on unmerged research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/latfuse013-source-pm25-decodability-2026-10-27
          test -s research/mathematical-engineering/latfuse013/RESULTS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/latfuse013/RESULTS.json
          git diff --cached --quiet && exit 1
          git commit -m "research: preserve original PM2.5 logged-content oracle/read control linear decodability evidence"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Avoid unsupported model/world-memory capability promotion
        run: |
          echo "Frozen original 99,390 param TAC models untouched. External fit adds ridge weights, NOT native retrieval."
          echo "FIT-era original May-June was exposed to prior work. Protected2016–17 numbers never parsed."
          echo "Source-real linear decodability is a LOWER bound, not whole-model event recall or causal source action evidence."
