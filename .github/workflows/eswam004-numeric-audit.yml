name: ESWAM004 original five real checkpoints strict replay audit, zero fits
# All original models and separate numeric audit are Git-owned.
# Finished study; no automatic fitting or retesting on further commits.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-numeric-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eswam004-causal-kinetic-evidence-2026-10-23
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/me076-pinned-publisher-source
          key: me076-bodenai-public-five-tasks-original-fit-v1
      - name: Read-only verify every frozen per-case output against same genuine robot source
        run: PYTHONPATH=src:. python scripts/eswam004_numeric_replay_audit.py --cache "${{ runner.temp }}/me076-pinned-publisher-source"
      - name: Commit immutable audit summary, never refit or modify originals
        env:
          TARGET_BRANCH: research/eswam004-causal-kinetic-evidence-2026-10-23
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/replay-bundles/ESWAM004/CROSS_CPU_REPLAY_AUDIT.json
          git commit -m 'audit(eswam004): freeze independent strict numeric exceptions from original real checkpoints'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
