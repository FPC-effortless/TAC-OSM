name: Research C5 composition and budget audit

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Full repository suite
        run: python -m pytest tests/ -q
      - name: Run composition and budget audit
        run: python scripts/run_c5_composition_budget_audit_fast_001.py
      - name: Upload composition and budget artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-C5-COMPOSITION-BUDGET-AUDIT-001
          path: artifacts/TACOSM-C5-COMPOSITION-BUDGET-AUDIT-001.json
          if-no-files-found: error
