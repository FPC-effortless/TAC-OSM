name: Fresh maintenance forecasts and learned belief integrity
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/real-maint-002/**'
      - 'research/dev063-belief-integrity/**'
      - 'research/commercial/ACTIVE-GOAL.md'
      - 'research/commercial/goal-state.json'
      - 'src/tac_osm/development/residual_forecast.py'
      - 'src/tac_osm/development/belief_bottleneck.py'
      - 'scripts/*real_maintenance_002.py'
      - 'scripts/*residual_forecast_002.py'
      - 'scripts/*belief_dev063.py'
      - 'scripts/diagnose_opened_forecasts.py'
      - 'tests/test_residual_forecast_002.py'
      - 'tests/test_semantic_bottleneck.py'
      - '.github/workflows/real-maint-002-belief-integrity.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/veritas
          ref: b21d829b62d3cab2811e746267ca305e110ed004
          path: .veritas-public-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e . -e .veritas-public-runtime pytest==9.1.1 numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q
          python scripts/sync_test_count.py --check
  strict-forecast-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e . numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check every fitted source/weight and keep B unopened
        run: |
          python scripts/restore_real_maintenance_002.py
          test ! -f results/real-maint-002-main/_datasets/sealed-b.pt
          python scripts/audit_real_maintenance_002.py --directory results/real-maint-002-main --output results/real-maint-002-remote-audit.json --exports results/real-maint-002-remote-export
          python scripts/analyze_real_maintenance_002.py --directory results/real-maint-002-main --output results/real-maint-002-remote-statistics.json
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          from audit_identity_dev0615 import compare
          compare(json.load(open('results/real-maint-002-remote-statistics.json')),json.load(open('research/real-maint-002/statistics.json')),{'values':0,'max_abs':0.})
          PY
      - name: Preserve exact negative outcomes and remote diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-maint-002-recorded-replay
          path: |
            results/real-maint-002-remote-*.json
            results/real-maint-002-remote-export/**
          if-no-files-found: ignore
  strict-belief-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 100
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/veritas
          ref: b21d829b62d3cab2811e746267ca305e110ed004
          path: .veritas-public-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e . -e .veritas-public-runtime numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore all seeds and check strict decisions, native actions and portable inference
        run: |
          python scripts/restore_belief_dev063.py
          python scripts/audit_belief_dev063.py --directory results/dev063-main --output results/dev063-remote-audit.json --exports results/dev063-remote-export --veritas .veritas-public-runtime
          python scripts/intervene_belief_dev063.py --directory results/dev063-main --output results/dev063-remote-interventions.json --details results/dev063-remote-interventions.jsonl.gz
          python scripts/analyze_belief_dev063.py --directory results/dev063-main --output results/dev063-remote-statistics.json
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          from audit_identity_dev0615 import compare
          compare(json.load(open('results/dev063-remote-statistics.json')),json.load(open('research/dev063-belief-integrity/statistics.json')),{'values':0,'max_abs':0.})
          a=json.load(open('results/dev063-remote-interventions.json'))
          b=json.load(open('research/dev063-belief-integrity/interventions.json'))
          for key in ('status','checkpoints','cells','queries','by_arm','by_seed'):
              compare(a[key],b[key],{'values':0,'max_abs':0.})
          PY
      - name: Retain remote failures and numerical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev063-recorded-replay
          path: |
            results/dev063-remote-*.json
            results/dev063-remote-*.jsonl.gz
            results/dev063-remote-export/**
          if-no-files-found: ignore
