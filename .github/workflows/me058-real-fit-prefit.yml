name: ME058 authentic FIT causal prefit and scientific-resource audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/me058_profile_original_fit.py'
      - 'scripts/me056_profile_paired_execution.py'
      - 'tests/test_me058_real_fit_prefit.py'
      - 'research/mathematical-engineering/me058/**'
      - '.github/workflows/me058-real-fit-prefit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: me058-original-fit-profile
  cancel-in-progress: true

jobs:
  preflight-unit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real-source reader and CPU torch
        run: |
          python -m pip install 'pytest==9.1.1' 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.9.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate source, schedules and frozen noncomparative registration
        run: |
          python -m py_compile scripts/me058_profile_original_fit.py
          PYTHONPATH=src:. python -m pytest -q tests/test_me058_real_fit_prefit.py tests/test_me056_execution_profile.py tests/test_me056_boundary_tac.py tests/test_research_parity_gate.py
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me058/FAIR_COMPARISON.json --phase preflight

  original-FIT-causal-parity-profile:
    needs: preflight-unit-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only actual source and profiler environment
        run: |
          python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.9.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Hash-check all 228 FIT originals, preregister deterministic seed orders, measure two fully causal genuine update FLOP profiles
        run: |
          set -o pipefail
          PYTHONPATH=src:. python -m scripts.me058_profile_original_fit \
            --cache results/me058/private-original-FIT \
            --registration research/me055-independent-robot-task-source.json \
            --output results/me058/ME058_ORIGINAL_FIT_PREFIT.json \
            | tee me058-original-FIT-profile.log
      - name: Preserve failure receipts, original input hashes and measured FLOP parity without raw publisher records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me058-genuine-original-FIT-parity-prefit
          path: |
            results/me058/ME058_ORIGINAL_FIT_PREFIT.json
            me058-original-FIT-profile.log
          if-no-files-found: ignore
          retention-days: 90
