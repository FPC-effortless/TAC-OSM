name: TAC six parallel portfolio contract (no fit)
on:
  pull_request:
    paths:
      - 'research/parallel-six/**'
      - 'src/tac_osm/variants/**'
      - 'tests/test_parallel_six_contract.py'
      - '.github/workflows/parallel-six-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src:. python -m unittest discover -s tests -p 'test_parallel_six_contract.py' -v
