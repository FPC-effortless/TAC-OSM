name: PLM full learned SwiLA E2E-001

on:
  push:
    branches:
      - research/plm-full-learned-swila-001-2026-10-07
  workflow_dispatch:
    inputs:
      run_full:
        description: "Run the full five-seed capability measurement"
        required: false
        default: true
        type: boolean

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest torch numpy==2.3.3 ruff==0.13.0
      - name: Static lint
        run: python -m ruff check src/tac_osm/plm_full_learned.py src/tac_osm/plm_full_benchmark.py scripts/run_plm_full_learned_swila_001.py tests/test_plm_full_learned_swila.py
      - name: Focused integrity tests
        run: python -m pytest -q tests/test_plm_full_learned_swila.py

  measurement:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_full == true)
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . torch numpy==2.3.3
      - name: Full five-seed measurement
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python scripts/run_plm_full_learned_swila_001.py
      - name: Independent artifact checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/TACOSM-PLM-FULL-LEARNED-SWILA-001.json")
          r=json.loads(p.read_text())
          assert r["experiment_id"] == "TACOSM-PLM-FULL-LEARNED-SWILA-001"
          assert len(r["evaluation"]) == 5
          assert all(v == 0 for v in r["integrity"]["train_eval_overlap"].values())
          assert r["integrity"]["distinct_eval_fingerprints"]
          assert r["model"]["parameter_count"] > 0
          print("independent checks passed")
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-FULL-LEARNED-SWILA-001
          path: artifacts/TACOSM-PLM-FULL-LEARNED-SWILA-001.json
