name: DEV-022 trained retention prediction and cost (development)
on:
  pull_request:
    # Later scientific executions use explicit dispatch; documentation edits
    # must not silently launch another 60-cell training matrix.
    types: [opened]
    paths:
      - "src/tac_osm/development/retention_controls.py"
      - "scripts/*dev022*"
      - "tests/test_dev022_retention.py"
      - "contracts/DEV-022.json"
      - ".github/workflows/dev022-retention.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU tests
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint, provenance and regression suite
        run: |
          ruff check --select F src/tac_osm/development/retention_controls.py scripts/*dev022* tests/test_dev022_retention.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Two-step intervention smoke and exact replay (not findings)
        run: |
          for arm in native no_decay no_erase neither entity entity_no_decay aligned aligned_no_decay schema41 memoryless; do
            python scripts/run_dev022_retention.py --seed 43 --regime short --arm "$arm" --smoke --output "artifacts/smoke-$arm"
            python scripts/run_dev022_retention.py --seed 43 --regime short --arm "$arm" --smoke --replay --output "artifacts/smoke-$arm"
          done
  trained-cell:
    needs: integrity-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [43, 59, 71]
        regime: [short, long]
        arm: [native, no_decay, no_erase, neither, entity, entity_no_decay, aligned, aligned_no_decay, schema41, memoryless]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU research runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Matched from-scratch training and held-out physical evaluation
        run: python scripts/run_dev022_retention.py --seed ${{ matrix.seed }} --regime ${{ matrix.regime }} --arm ${{ matrix.arm }} --output artifacts/cell
      - name: Separate-process exact checkpoint prediction, action and cost replay
        run: python scripts/run_dev022_retention.py --seed ${{ matrix.seed }} --regime ${{ matrix.regime }} --arm ${{ matrix.arm }} --replay --output artifacts/cell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-022-RAW-${{ matrix.regime }}-${{ matrix.seed }}-${{ matrix.arm }}-NOT-CONFIRMATORY
          path: artifacts/cell/
          if-no-files-found: warn
  independent-audit:
    needs: trained-cell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV-022-RAW-*-NOT-CONFIRMATORY
          path: artifacts/all
      - name: Independent stdlib history, prediction, action and physical-cost audit
        run: python scripts/audit_dev022_retention.py artifacts/all/DEV-022-RAW-*-NOT-CONFIRMATORY --output artifacts/all/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-022-COMPLETE-AUDITED-NOT-CONFIRMATORY
          path: artifacts/all/
          if-no-files-found: error
