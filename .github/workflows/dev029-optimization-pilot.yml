name: DEV-029 validation-only optimization pilot and integration wiring
on:
  pull_request:
    types: [opened]
    paths:
      - 'research/dev029/**'
      - 'src/tac_osm/development/optimization_program.py'
      - 'scripts/*dev029.py'
      - 'tests/*dev029.py'
      - '.github/workflows/dev029-optimization-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Regression and integration wiring
        run: |
          ruff check --select F src/tac_osm/development/optimization_program.py scripts/*dev029.py tests/*dev029.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
          mkdir -p integration
          python scripts/check_integration_dev029.py --output integration/wiring.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-029-INTEGRATION-WIRING-NOT-CAPABILITY
          path: integration/
  balanced-pilot:
    needs: integrity-integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        arm: [native, masked_local, schema41, gru768, delta768, event_table]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/run_optimization_pilot_dev029.py --arm ${{ matrix.arm }} --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-029-PILOT-${{ matrix.arm }}-VALIDATION-ONLY
          path: results/
          if-no-files-found: error
  independent-audit:
    needs: balanced-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV-029-PILOT-*
          merge-multiple: true
          path: evidence
      - run: python scripts/audit_optimization_pilot_dev029.py --input evidence --output evidence/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-029-AUDITED-PILOT-VALIDATION-ONLY
          path: evidence/
