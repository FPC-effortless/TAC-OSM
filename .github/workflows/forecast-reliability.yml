name: Forecast reliability source-time contract (constructed only)
on:
  push:
    branches:
      - product/sensor-forecast-reliability-2026-10-27
  pull_request:
    paths:
      - 'specialist_models/forecast_reliability.py'
      - 'tests/test_forecast_reliability.py'
      - 'docs/FORECAST_RELIABILITY.md'
      - '.github/workflows/forecast-reliability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reliability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run constructed causal-time and coverage tests (NOT a trained forecast)
        run: python -m unittest discover -s tests -p 'test_forecast_reliability.py' -v
      - name: Verify syntax
        run: python -m py_compile specialist_models/forecast_reliability.py tests/test_forecast_reliability.py
