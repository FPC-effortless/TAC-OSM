name: ME005 authentic-data unified native TAC adapter training
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/me005_unified_native_tac.py'
      - 'scripts/me005_train_real_adapter.py'
      - 'research/mathematical-engineering/me005/REAL_TRAIN_PROTOCOL.md'
      - '.github/workflows/me005-real-adapter.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: me005-original-frozen-adapter-fits
  cancel-in-progress: true
jobs:
  preflight:
    # Original four real-adapter fits succeeded in run 39377990208.
    # Never repeat this explored validation fit on subsequent PR edits.
    if: github.event.pull_request.head.sha == '6d9788cf78d9c5540072388dad055e32b4412264'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed CPU libraries
        run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Mathematical/software gates before reading real source
        run: |
          python -m py_compile scripts/me005_unified_native_tac.py scripts/me005_train_real_adapter.py
          python -m unittest discover -s tests -p 'test_me005_unified_native.py' -v
  train-authentic-unchanged-source:
    if: github.event.pull_request.head.sha == '6d9788cf78d9c5540072388dad055e32b4412264'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU libraries
        run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Restore frozen original trained native TAC checkpoints
        uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39357593422
          name: me004-original-real-tac-models
          github-token: ${{ github.token }}
          path: .
      - name: Train only FOUR new research adapters; NEVER refit original base
        run: |
          python -m scripts.me005_train_real_adapter --original results/me004 --out results/me005 | tee me005-original.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/me005/results.json').read_text())
          assert d['study']=='ME005' and len(d['fits'])==4
          assert d['pretrained_original_refits']==0 and not d['future_reserved_test_read']
          assert not d['real_action_outcome_training'] and not d['architecture_promoted']
          assert set((f['arm'],f['seed']) for f in d['fits'])=={
             (a,s) for a in ('residual_only','unified_all') for s in (505001,505002)}
          assert len(list(Path('results/me005/checkpoints').glob('*.pt')))==4
          assert all(f['checkpoint_sha256'] for f in d['fits'])
          print('All original authentic exploratory scores archived with no promotion')
          PY
      - name: Preserve every result, including negative findings and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me005-original-four-real-adapters
          path: |
            results/me005/results.json
            results/me005/checkpoints/*.pt
            me005-original.log
          if-no-files-found: ignore
          retention-days: 90
