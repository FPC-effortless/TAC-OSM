name: S1OBS001 forensic real FIT Observatory (original checkpoint, NO TRAIN)
on:
  push:
    branches: [research/s1obs001-checkpoint-forensics-2026-10-26]
    paths:
      - research/parallel-six/S1OBS001-RUN-*.marker
permissions:
  contents: read
  actions: read
jobs:
  original-real-fit-model-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source readers and PyTorch CPU
        run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Independent generic observatory adapter and original model invariants
        run: |
          PYTHONPATH=src:. python -m unittest tests.test_research_system1_adapter -v
          PYTHONPATH=src:. python -m unittest tests.test_s1motion005_real_source_fit -v
      - name: Download ORIGINAL SHA-pinned S1MOTION005 trained 15-model checkpoint artifact
        run: |
          gh run download 40283616062 --repo FPC-effortless/TAC-OSM \
            --name s1motion005-original-15-checkpoint-real-first-score \
            --dir /tmp/s1obs001-first-original
      - name: Inspect real original FIT source windows and original frozen models
        run: |
          MANIFEST="$(find /tmp/s1obs001-first-original -name BEFORE-DEV-ALL-FROZEN.json -print -quit)"
          test -n "$MANIFEST"
          PYTHONPATH=src:. python scripts/s1obs001_frozen_fit_diagnose.py \
            --original-dir "$(dirname "$MANIFEST")"
      - name: Preserve fully detailed generic model forensics and anticheat receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1obs001-first-full-system1-FIT-checkpoint-diagnostics
          path: research/diagnostics/s1obs001-frozen-FIT/**
          if-no-files-found: warn
          retention-days: 90
