name: Frozen PLM information probes DEV-011 (NOT confirmatory)

on:
  pull_request:
    paths:
      - "scripts/run_frozen_plm_probes_dev.py"
      - "scripts/validate_frozen_plm_probes_dev.py"
      - "tests/test_frozen_plm_probes_development.py"
      - ".github/workflows/frozen-plm-probes-development.yml"
      - "docs/FROZEN-PLM-PROBES-DEV-011.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-writer-mechanisms:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and CPU runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check syntax and unused imports
        run: |
          python -m py_compile scripts/run_frozen_plm_probes_dev.py scripts/validate_frozen_plm_probes_dev.py tests/test_frozen_plm_probes_development.py
          ruff check --select F scripts/run_frozen_plm_probes_dev.py scripts/validate_frozen_plm_probes_dev.py tests/test_frozen_plm_probes_development.py
      - name: Verify frozen-state mechanism contracts
        run: python -m pytest tests/test_frozen_plm_probes_development.py -q
      - name: Check all live suite tests counted
        run: python scripts/sync_test_count.py --check
      - name: Retrieve exact DEV-010 experimental checkpoint archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh api --header 'Accept: application/vnd.github+json' \
            /repos/FPC-effortless/TAC-OSM/actions/artifacts/11795975699/zip \
            > artifacts/parent/DEV-010.zip
          echo "a15685af62122a876c9d990fd877c060c22e41f2d81d80bd47f2426ab558fc56  artifacts/parent/DEV-010.zip" | sha256sum -c -
      - name: DEV-011 smoke training and saved probe replay
        run: |
          python scripts/run_frozen_plm_probes_dev.py --smoke --parent artifacts/parent/DEV-010.zip --output artifacts/DEV-011-SMOKE
          python scripts/validate_frozen_plm_probes_dev.py --parent artifacts/parent/DEV-010.zip --output artifacts/DEV-011-SMOKE
      - name: Archive smoke evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-011-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-011-SMOKE/
          if-no-files-found: warn

  three-seed-probes:
    needs: frozen-writer-mechanisms
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Retrieve immutable DEV-010 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/parent
          gh api --header 'Accept: application/vnd.github+json' \
            /repos/FPC-effortless/TAC-OSM/actions/artifacts/11795975699/zip \
            > artifacts/parent/DEV-010.zip
          echo "a15685af62122a876c9d990fd877c060c22e41f2d81d80bd47f2426ab558fc56  artifacts/parent/DEV-010.zip" | sha256sum -c -
      - name: Train and evaluate 27 frozen-state probes
        run: |
          python scripts/run_frozen_plm_probes_dev.py --parent artifacts/parent/DEV-010.zip --output artifacts/DEV-011
          python scripts/validate_frozen_plm_probes_dev.py --parent artifacts/parent/DEV-010.zip --output artifacts/DEV-011
      - name: Preserve 27 probe checkpoints and all evaluator rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-011-RAW-NOT-CONFIRMATORY
          path: artifacts/DEV-011/
          if-no-files-found: error
