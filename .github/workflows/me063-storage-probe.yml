name: ME063 real repo checkpoint byte storage proof (UNTRAINED)
on:
  pull_request:
    paths:
      - 'scripts/me063_storage_probe.py'
      - '.github/workflows/me063-storage-probe.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  git-checkpoint-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python scripts/me063_storage_probe.py --write
      - name: Commit original checkpoint bytes, not external artifacts
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/replay-bundles/ME063/UNTRAINED_STORAGE_PROBE.pt research/replay-bundles/ME063/STORAGE_PROBE_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me063): original untrained checkpoint byte Git storage route'
            git fetch origin "$PUSH_BRANCH"
            git rebase "origin/$PUSH_BRANCH"
            git push origin "HEAD:refs/heads/$PUSH_BRANCH"
          fi
  independent-clean-checkout:
    needs: git-checkpoint-bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}", clean: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python scripts/me063_storage_probe.py --check
