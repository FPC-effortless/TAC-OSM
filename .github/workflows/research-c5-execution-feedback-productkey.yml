name: Legacy invalidated C5 execution-feedback product-key bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-only:
    name: Preserve historical lane without executing invalid experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assert no legacy measurement is executed
        run: |
          test ! -f scripts/run_c5_execution_feedback_productkey_001.py
          echo "PR55 product-key lane is provenance-only; missing historical runner is intentional."
