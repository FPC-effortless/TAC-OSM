name: Research C5 execution-feedback product-key bridge

on:
  pull_request:
    branches: [master]
    paths:
      - contracts/TACOSM-C5-EXECUTION-FEEDBACK-PRODUCTKEY-001.json
      - docs/TACOSM-C5-EXECUTION-FEEDBACK-PRODUCTKEY-001*
      - scripts/run_c5_execution_feedback_productkey_001.py
      - tests/test_c5_execution_feedback_productkey.py
      - .github/workflows/research-c5-execution-feedback-productkey.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-execution-feedback-productkey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    if: ${{ hashFiles('scripts/run_c5_execution_feedback_productkey_001.py') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Full repository suite
        run: python -m pytest tests/ -q
      - name: Run C5 execution-feedback product-key study
        run: python scripts/run_c5_execution_feedback_productkey_001.py
      - name: Upload C5 bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-C5-EXECUTION-FEEDBACK-PRODUCTKEY-001
          path: artifacts/TACOSM-C5-EXECUTION-FEEDBACK-PRODUCTKEY-001.json
          if-no-files-found: error
