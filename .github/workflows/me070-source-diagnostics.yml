name: ME070 real workflow score diagnostics and source gate
on:
  pull_request:
    paths:
      - 'scripts/me070_*.py'
      - 'tests/test_me070_*.py'
      - 'research/mathematical-engineering/me070/**'
      - '.github/workflows/me070-source-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-original-data-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install software fixture test runner (no model training)
        run: python -m pip install pytest==9.1.1
      - name: Test source counting and paired score mathematics (software fixtures only)
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_me070_source_and_diagnostics.py
      - name: Analyze preserved ME069 authentic case-level predictions (exposed-test diagnostic only)
        run: |
          test -s research/replay-bundles/ME069/REAL_EVALUATION.json
          python scripts/me070_audit_me069.py \
            --input research/replay-bundles/ME069/REAL_EVALUATION.json \
            --output /tmp/me070-original-score-diagnostic.json
          test -s /tmp/me070-original-score-diagnostic.json
      - name: Disclose missing authentic long-history source and prohibited inference
        run: |
          echo 'ME070 LONG_HISTORY_SOURCE=NOT_YET_VERIFIED: source must be provided from licensed original file.'
          echo 'ME070 NEW_TRAINING=NOT_STARTED; NEW_64_OR_256_HISTORY_MEMORY_RESULT=NOT_ESTABLISHED.'
          echo 'ME070 SCIENTIFIC_PROMOTION=BLOCKED until source/parity/replay gates pass.'
      - name: Preserve original-score posthoc audit for inspection (not new model proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me070-retrospective-diagnostics
          path: /tmp/me070-original-score-diagnostic.json
          if-no-files-found: ignore
