name: Research PLM integrated multimodal E2E 006

on:
  push:
    branches:
      - research/plm-e2e-006-confirmatory-2026-10-06
    paths:
      - contracts/TACOSM-PLM-INTEGRATED-E2E-006.json
      - src/tac_osm/integrated_e2e_005.py
      - src/tac_osm/integrated_e2e_006_benchmark.py
      - scripts/run_integrated_e2e_005.py
      - scripts/run_integrated_e2e_006.py
      - scripts/validate_integrated_e2e_006.py
      - tests/test_integrated_e2e_005.py
      - .github/workflows/integrated-e2e-006.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: E2E-006 smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest numpy==2.3.3 torch
      - name: Unit tests
        run: python -m pytest tests/test_integrated_e2e_005.py -q
      - name: Smoke
        run: python scripts/run_integrated_e2e_006.py --smoke
        env:
          PYTHONWARNINGS: "error"

  confirmatory:
    name: E2E-006 confirmatory functional measurement
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest numpy==2.3.3 torch
          python -m pip install --quiet "ruff==0.13.0"
      - name: Static gate
        run: ruff check --select F821 src/tac_osm/integrated_e2e_005.py src/tac_osm/integrated_e2e_006_benchmark.py scripts/run_integrated_e2e_005.py scripts/run_integrated_e2e_006.py scripts/validate_integrated_e2e_006.py
      - name: Full test suite
        run: python -m pytest tests/test_integrated_e2e_005.py -q
      - name: Contract gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("contracts/TACOSM-PLM-INTEGRATED-E2E-006.json")
          x=json.loads(p.read_text())
          assert x["status"]=="pre-registered"
          assert x["primary_endpoint"]["threshold"]==0.80
          assert x["protocol"]["hidden_dim"]==64
          assert len(x["heldout"])==8
          print("PASS: E2E-006 contract")
          PY
      - name: Full measurement
        run: python scripts/run_integrated_e2e_006.py
      - name: Independent result validation
        run: python scripts/validate_integrated_e2e_006.py artifacts/TACOSM-PLM-INTEGRATED-E2E-006.json
      - name: Upload scientific artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-INTEGRATED-E2E-006
          path: artifacts/TACOSM-PLM-INTEGRATED-E2E-006.json
          if-no-files-found: error
