name: ME010F original frozen future event-mixture comparison
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/me010_future.py'
      - '.github/workflows/me010-future.yml'
      - 'research/mathematical-engineering/me010/PROTOCOL.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: me010f-first-genuine-april6-13
  cancel-in-progress: true
jobs:
  first-frozen-future-test:
    # Full result first archived in cancelled run 39386665512 and reproduced byte-identically
    # in successful 39386728877 at this SHA; never re-expose April6-13 after notes.
    if: github.event.pull_request.head.sha == '75165b80f572377e86984444e67ff2452e3237f1'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical scoring dependencies
        run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile mathematical model and evaluator before future source access
        run: |
          python -m py_compile scripts/me010_event_dynamics.py scripts/me010_future.py
          python -m scripts.me010_train_real_events --self-test
      - uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39382850579
          name: me008-original-native1000
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39382074165
          name: me007-original-gru41-controls
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39384177806
          name: me009-original-real-reliability
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39386385479
          name: me010-original-event-vs-direct
          github-token: ${{ github.token }}
          path: .
      - name: First April6-13 authentic future observation exposure with zero fitting
        run: |
          python -m scripts.me010_future | tee me010f-original.log
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('results/me010f/results.json').read_text())
          assert d['study']=='ME010F_EVENT_MIXTURE_FROZEN_FIRST_EXPOSURE'
          assert d['period_start']=='2020-04-06' and d['period_end_exclusive']=='2020-04-13'
          assert d['future_optimizer_updates']==0
          assert d['cohort']['future_week_examples']>=500
          assert not d['future_after_end_read'] and not d['model_promoted']
          assert len(d['fits'])==16
          assert {x['model'] for x in d['fits']}=={
              'persistence','native_tac1000','gru41_1000',
              'me009_reliability','me010_mixture','me010_direct'}
          assert sum(x['model']=='me010_mixture' for x in d['fits'])==3
          assert sum(x['model']=='me010_direct' for x in d['fits'])==3
          PY
      - name: Preserve all original future outcomes, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me010f-original-event-dynamics-future
          path: |
            results/me010f/results.json
            me010f-original.log
          if-no-files-found: ignore
          retention-days: 90
