name: DEV-052 noisy Veritas frozen-policy transfer (development)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/dev052/**'
      - 'src/tac_osm/development/noisy_veritas_transfer.py'
      - 'scripts/*dev052.py'
      - 'tests/test_noisy_veritas_dev052.py'
      - '.github/workflows/dev052-noisy-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/veritas
          ref: b21d829b62d3cab2811e746267ca305e110ed004
          path: .veritas-public-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin native Veritas runtime and PyTorch CPU
        run: |
          python -m pip install --quiet -e . -e .veritas-public-runtime pytest==9.1.1 numpy==2.3.5 ruff==0.17.1
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate new OOD simulator, Bayes planner and entire regression suite
        run: |
          ruff check --select F src/tac_osm/development/noisy_veritas_transfer.py scripts/run_noisy_veritas_dev052.py scripts/audit_noisy_veritas_dev052.py tests/test_noisy_veritas_dev052.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Download original audited DEV-051 model bytes unchanged
        uses: actions/download-artifact@v4
        with:
          name: DEV051-COMPLETE-AUDITED-DEVELOPMENT-EVIDENCE
          run-id: 39045522413
          github-token: ${{ github.token }}
          path: artifacts/dev051
      - name: New OOD two-world preflight with original frozen policy
        run: |
          python scripts/run_noisy_veritas_dev052.py --seed 7101 --smoke \
            --dev051 artifacts/dev051 --veritas-root .veritas-public-runtime \
            --output artifacts/dev052-smoke
          python - <<'PY'
          import json
          d=json.load(open('artifacts/dev052-smoke/report.json'))
          assert d['smoke'] and len(d['evaluation'])==7
          assert d['dev051_checkpoint']['original_gate']==0.0
          assert d['evaluation']['all_three']['summary']['residual_faults']==0
          print('DEV052 FROZEN-POLICY STRESS PREFLIGHT PASSED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV052-smoke-only
          path: artifacts/dev052-smoke/
          if-no-files-found: warn
  frozen-seeds:
    needs: integrity-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [7101,7102,7103]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/veritas
          ref: b21d829b62d3cab2811e746267ca305e110ed004
          path: .veritas-public-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load prior original DEV051 audited weights without training
        uses: actions/download-artifact@v4
        with:
          name: DEV051-COMPLETE-AUDITED-DEVELOPMENT-EVIDENCE
          run-id: 39045522413
          github-token: ${{ github.token }}
          path: artifacts/dev051
      - name: Install pinned native runtime and CPU
        run: |
          python -m pip install --quiet -e . -e .veritas-public-runtime numpy==2.3.5
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Score seven frozen/explicit policies on fresh noisy repair worlds
        run: |
          python scripts/run_noisy_veritas_dev052.py --seed ${{ matrix.seed }} \
            --dev051 artifacts/dev051 --veritas-root .veritas-public-runtime \
            --output artifacts/dev052-seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV052-RAW-seed${{ matrix.seed }}-development
          path: artifacts/dev052-seed${{ matrix.seed }}/
          if-no-files-found: warn
  independent-audit:
    needs: frozen-seeds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/veritas
          ref: b21d829b62d3cab2811e746267ca305e110ed004
          path: .veritas-public-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV052-RAW-seed*-development
          path: artifacts/evidence
      - uses: actions/download-artifact@v4
        with:
          name: DEV051-COMPLETE-AUDITED-DEVELOPMENT-EVIDENCE
          run-id: 39045522413
          github-token: ${{ github.token }}
          path: artifacts/dev051
      - name: Independent native runtime dependencies
        run: |
          python -m pip install --quiet -e . -e .veritas-public-runtime numpy==2.3.5
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Independently reproduce all policy actions and verifier outcomes
        run: |
          python scripts/audit_noisy_veritas_dev052.py \
            artifacts/evidence/DEV052-RAW-seed7101-development \
            artifacts/evidence/DEV052-RAW-seed7102-development \
            artifacts/evidence/DEV052-RAW-seed7103-development \
            --dev051 artifacts/dev051 --output artifacts/evidence/analysis
      - uses: actions/upload-artifact@v4
        with:
          name: DEV052-COMPLETE-AUDITED-TRANSFER-DEVELOPMENT
          path: artifacts/evidence/
          if-no-files-found: error
      - name: Show findings only after independent replay/archive passed
        run: cat artifacts/evidence/analysis/analysis.json
