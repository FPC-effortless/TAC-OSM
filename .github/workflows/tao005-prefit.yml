name: TAO005 five-seed source-model NO-FIT preflight

on:
  push:
    branches: ['research/tao004-optimizer-lr-selection-2026-10-30']
    paths: ['.github/workflows/tao005-prefit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-real-source-and-optimizer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet numpy==2.3.3 torch pytest
      - name: Source/model/optimizer tests with NO new FIT or DEV reads
        run: |
          python -m pytest -q \
            tests/test_optimizer_tao.py \
            tests/test_tao004_tune.py \
            tests/test_tao005_five_seed.py
          python scripts/validate_research_parity.py \
            --manifest research/mathematical-engineering/taofinal005/FAIR_COMPARISON.json \
            --phase preflight
