name: ME071 persistent native event capability
on:
  pull_request:
    paths:
      - 'src/tac_osm/workflow_me071.py'
      - 'scripts/me071_*.py'
      - 'tests/test_me071_*.py'
      - 'research/mathematical-engineering/me071/**'
      - 'research/replay-bundles/ME071/**'
      - '.github/workflows/me071-persistent-workflow.yml'
  workflow_dispatch:
jobs:
  native-model-and-real-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pytest==9.1.1
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. pytest -q tests/test_me071_persistent_workflow.py
      - name: Audit pinned originals and replay original code with optimizer updates blocked
        run: |
          python scripts/verify_frozen_replay.py --all
          python scripts/replay_frozen_research.py --study me071 --cache /tmp/me071-source
