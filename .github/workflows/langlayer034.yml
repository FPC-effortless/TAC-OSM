name: LANGLAYER034 layered causal residual graph no-fit
on:
  pull_request:
    paths:
      - 'research/mathematical-engineering/langlayer034/**'
      - 'research/phone_queue/langlayer034.json'
      - 'tests/test_langlayer034.py'
      - '.github/workflows/langlayer034.yml'
permissions:
  contents: read
jobs:
  no-fit-layered-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU PyTorch
        run: |
          python -m pip install pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Source-only plan and no-fit parity
        run: |
          mkdir -p langlayer034-results
          python scripts/phone_lab.py plan research/phone_queue/langlayer034.json | tee langlayer034-results/PLAN.txt
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langlayer034/FAIR_COMPARISON.json --phase preflight | tee langlayer034-results/PREFLIGHT.json
      - name: Actual parent source plus layered graph causality and gradients
        run: |
          PYTHONPATH=src python -m pytest -q tests/test_langlayer034.py | tee langlayer034-results/PYTEST.txt
          git diff --exit-code -- research/replay-bundles/LANGTRAIN025 research/source-bundles research/mathematical-engineering/context026/context_transition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGLAYER034-no-fit-graph
          path: langlayer034-results/
