name: Parallel TAC residual FFN - no fit
on:
  pull_request:
    paths:
      - 'src/tac_osm/variants/parallel_residual_world.py'
      - 'tests/test_parallel_residual_world.py'
      - '.github/workflows/parallel-residual-nofit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-no-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tensor-test dependency
        run: python -m pip install --quiet torch
      - name: Run constructed numerical and gradient checks only
        run: |
          python -m py_compile src/tac_osm/variants/parallel_residual_world.py
          PYTHONPATH=src:. python -m unittest discover -s tests -p 'test_parallel_residual_world.py' -v
