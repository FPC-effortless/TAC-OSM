name: Research PLM integrated E2E corrected temporal 003
# Scientific protocol is unchanged; comment-only event marker after master baseline correction.

on:
  pull_request:
    branches: [master]
    paths:
      - "src/tac_osm/integrated_e2e_address.py"
      - "src/tac_osm/integrated_e2e_benchmark.py"
      - "scripts/run_integrated_e2e_003.py"
      - "scripts/aggregate_integrated_e2e_003.py"
      - "tests/test_integrated_e2e_benchmark.py"
      - "tests/test_integrated_e2e_003_contract.py"
      - "contracts/TACOSM-PLM-INTEGRATED-E2E-003.json"
      - "docs/TACOSM-PLM-INTEGRATED-E2E-003.md"
      - "docs/AUDIT-TACOSM-PLM-INTEGRATED-E2E-003.md"
      - ".github/workflows/integrated-e2e-003.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full repository and benchmark tests
        run: python -m pytest tests/ -q

  arm:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        arm: [explicit_write, explicit_read, explicit_both]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run registered arm
        env:
          E2E003_ARM: ${{ matrix.arm }}
        run: |
          python scripts/run_integrated_e2e_003.py             --arm "$E2E003_ARM"             --output "artifacts/TACOSM-PLM-INTEGRATED-E2E-003-$E2E003_ARM.json"
      - name: Upload arm artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-INTEGRATED-E2E-003-${{ matrix.arm }}
          path: artifacts/TACOSM-PLM-INTEGRATED-E2E-003-${{ matrix.arm }}.json
          if-no-files-found: error

  aggregate:
    needs: arm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download arm artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/arms
          pattern: TACOSM-PLM-INTEGRATED-E2E-003-*
          merge-multiple: false
      - name: Normalize artifact paths
        run: |
          mkdir -p artifacts
          for arm in explicit_write explicit_read explicit_both; do
            cp "artifacts/arms/TACOSM-PLM-INTEGRATED-E2E-003-$arm/TACOSM-PLM-INTEGRATED-E2E-003-$arm.json"                "artifacts/TACOSM-PLM-INTEGRATED-E2E-003-$arm.json"
          done
      - name: Aggregate result
        run: python scripts/aggregate_integrated_e2e_003.py
      - name: Independent aggregate validation
        run: python scripts/validate_integrated_e2e_003.py artifacts/TACOSM-PLM-INTEGRATED-E2E-003-COMBINED.json
      - name: Upload combined result
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-INTEGRATED-E2E-003-COMBINED
          path: artifacts/TACOSM-PLM-INTEGRATED-E2E-003-COMBINED.json
          if-no-files-found: error
