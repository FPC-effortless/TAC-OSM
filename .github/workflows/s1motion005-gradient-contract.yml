name: S1MOTION005 bounded-aux gradient kernel contract (NO FIT)
on:
  push:
    branches: [research/s1motion005-gradient-budget-2026-10-26]
    paths:
      - 'src/tac_osm/variants/s1motion005_gradient_budget.py'
      - 'tests/test_s1motion005_gradient_budget.py'
      - '.github/workflows/s1motion005-gradient-contract.yml'
  pull_request:
    paths:
      - 'src/tac_osm/variants/s1motion005_gradient_budget.py'
      - 'tests/test_s1motion005_gradient_budget.py'
      - '.github/workflows/s1motion005-gradient-contract.yml'
permissions:
  contents: read
jobs:
  no-fit-gradient-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify source-independent projection, actual AdamW finite step and memory accounting
        run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1motion005_gradient_budget -v
          PYTHONPATH=src:. python -m unittest tests.test_s1motion004_gradient_routes -v
