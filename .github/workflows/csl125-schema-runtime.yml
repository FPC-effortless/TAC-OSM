name: CSL125 schema-aware runtime qualification (no fit)
on:
  pull_request:
    paths:
      - 'src/tac_osm/csl125_tool_schema.py'
      - 'src/tac_osm/csl125_tool_runtime.py'
      - 'tests/test_csl125_schema_runtime.py'
      - 'tests/test_csl125_schema_edges.py'
      - 'scripts/bench_csl125_schema_runtime.py'
      - 'scripts/diagnose_csl125_gradient_precision.py'
      - 'research/csl125_schema_runtime/**'
      - 'research/phone_queue/csl125_r4_schema_runtime_20261106.json'
      - '.github/workflows/csl125-schema-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csl125-schema-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  schema-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute routing (does not authorize fitting)
        run: |
          mkdir -p ci-artifacts/csl125-schema
          python scripts/phone_lab.py plan research/phone_queue/csl125_r4_schema_runtime_20261106.json > ci-artifacts/csl125-schema/COMPUTE_DECISION.json
      - name: CPU-only pinned backend
        run: |
          python -m pip install --quiet torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'pytest>=8,<9' numpy==2.3.3 jsonschema==4.26.0 xgrammar==0.2.8
          python -c "import importlib.metadata as m; assert m.version('xgrammar') == '0.2.8'; print('XGrammar',m.version('xgrammar'))"
      - name: Schema masks, target parity, original R4 and last-byte source parity
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_csl125_schema_runtime.py tests/test_csl125_schema_edges.py tests/test_csl125_tool_protocol.py tests/test_csl125_tool_model.py tests/test_csl125_tool_review.py tests/test_csl125_tool_eval.py tests/test_csl125_tool_capacity.py tests/test_csl125_r3.py --junitxml=ci-artifacts/csl125-schema/tests.xml | tee ci-artifacts/csl125-schema/TESTS.log
      - name: Same-weight bounded CPU serving screen
        run: |
          set -euo pipefail
          python scripts/bench_csl125_schema_runtime.py | tee ci-artifacts/csl125-schema/BENCHMARK.log
      - name: Inherited numerical failure attribution (not production qualification)
        run: |
          set -euo pipefail
          python scripts/diagnose_csl125_gradient_precision.py | tee ci-artifacts/csl125-schema/GRADIENT_PRECISION.log
      - name: Environment and source evidence
        if: always()
        run: |
          git rev-parse HEAD > ci-artifacts/csl125-schema/COMMIT.txt
          python -m pip freeze > ci-artifacts/csl125-schema/ENVIRONMENT.txt
          sha256sum src/tac_osm/csl125_tool_schema.py src/tac_osm/csl125_tool_runtime.py tests/test_csl125_schema_runtime.py tests/test_csl125_schema_edges.py scripts/bench_csl125_schema_runtime.py scripts/diagnose_csl125_gradient_precision.py > ci-artifacts/csl125-schema/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csl125-schema-runtime-no-fit
          path: ci-artifacts/csl125-schema/
