name: REP-003 semantic program routing

on:
  push:
    branches: [research/rep003-semantic-program-routing]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_semantic_program_rep003.py"
      - "docs/TACOSM-SEMANTIC-PROGRAM-REP-003.md"
      - ".github/workflows/rep003.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rep003:
    name: TACOSM-SEMANTIC-PROGRAM-REP-003
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Preconditions
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
          if git diff --name-only origin/master...HEAD | grep -E 'C5-001|C5-002|C5-003'; then
            echo "Frozen C5 evidence changed; REP-003 is invalid."
            exit 1
          fi
      - name: Run preregistered diagnostic
        run: |
          mkdir -p artifacts
          python scripts/run_semantic_program_rep003.py > artifacts/REP-003.stdout.json
          cat artifacts/REP-003.stdout.json
      - name: Upload REP-003 result
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-SEMANTIC-PROGRAM-REP-003
          path: artifacts/
          if-no-files-found: error