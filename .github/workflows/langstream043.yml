name: LANGSTREAM043 original-checkpoint incremental parity and decode
on:
  pull_request:
    paths:
      - 'research/mathematical-engineering/langstream043/**'
      - 'research/phone_queue/langstream043.json'
      - 'scripts/langstream043_benchmark.py'
      - 'tests/test_langstream043.py'
      - '.github/workflows/langstream043.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-state-and-speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Preregistered plan, inference-state checks and original checkpoints
        run: |
          set -o pipefail
          mkdir -p langstream043-evidence
          python scripts/phone_lab.py plan research/phone_queue/langstream043.json > langstream043-evidence/PLAN.txt
          cmp langstream043-evidence/PLAN.txt research/mathematical-engineering/langstream043/COMPUTE_DECISION.txt
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langstream043/FAIR_COMPARISON.json --phase preflight > langstream043-evidence/PREFLIGHT.json
          PYTHONPATH=src python -m pytest -q tests/test_langstream043.py tests/test_research_probe_agnostic.py
          PYTHONPATH=src:. python scripts/langstream043_benchmark.py --output-dir langstream043-work | tee langstream043-evidence/EXECUTION.log
          cp langstream043-work/RESULTS.json langstream043-work/PARITY.jsonl langstream043-work/inference-state.pt langstream043-evidence/
          git diff --exit-code -- research/source-bundles research/replay-bundles research/mathematical-engineering/context026 research/mathematical-engineering/langlayer040
      - name: Preserve partial numerical failures
        if: always()
        run: |
          mkdir -p langstream043-evidence
          for item in RESULTS.json PARITY.jsonl inference-state.pt; do
            if test -f "langstream043-work/$item"; then cp "langstream043-work/$item" langstream043-evidence/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGSTREAM043-original-state-and-speed-evidence
          path: langstream043-evidence/
          retention-days: 90
