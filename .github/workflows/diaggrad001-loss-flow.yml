name: DIAGGRAD001 frozen gradient-flow replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diaggrad001_loss_flow.py'
      - 'scripts/diaggrad001_replay.py'
      - 'tests/test_diaggrad001_loss_flow.py'
      - 'tests/test_diaggrad001_replay.py'
      - 'research/mathematical-engineering/diaggrad001/**'
      - 'research/replay-bundles/DIAGGRAD001/**'
      - '.github/workflows/diaggrad001-loss-flow.yml'
permissions:
  contents: read
jobs:
  frozen-fit-gradient-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.3.5 pytest
      - run: PYTHONPATH=src:. pytest -q tests/test_diaggrad001_loss_flow.py tests/test_diaggrad001_replay.py
      - run: PYTHONPATH=src:. python scripts/diaggrad001_replay.py
