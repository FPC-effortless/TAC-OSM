name: S1MOTION005 real source runner preflight (NO FIT)
on:
  push:
    branches: [research/s1motion005-gradient-budget-2026-10-26]
    paths:
      - 'scripts/s1motion005_real_screwdriver_fit.py'
      - 'tests/test_s1motion005_real_source_fit.py'
      - 'research/parallel-six/S1MOTION005-SOURCE-LOCK.json'
      - '.github/workflows/s1motion005-prefit.yml'
  pull_request:
    paths:
      - 'scripts/s1motion005_real_screwdriver_fit.py'
      - 'tests/test_s1motion005_real_source_fit.py'
      - '.github/workflows/s1motion005-prefit.yml'
permissions:
  contents: read
jobs:
  no-source-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m py_compile scripts/s1motion005_real_screwdriver_fit.py
          PYTHONPATH=src:. python -m unittest tests.test_s1motion005_real_source_fit -v
          PYTHONPATH=src:. python -m unittest tests.test_s1motion005_gradient_budget -v
