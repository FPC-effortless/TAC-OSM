name: LATFUSE010 real event write-key value gradients and learned historical read alignment

on:
  push:
    branches: [research/latfuse010-real-event-key-value-attribution-2026-10-27]
    paths:
      - "scripts/latfuse010_real_event_writer_attribution.py"
      - "research/mathematical-engineering/latfuse010/REGISTERED_ATTRIBUTION.json"
      - ".github/workflows/latfuse010-source-event-write-read.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latfuse010-real-event-original-writer-readonly
  cancel-in-progress: false

jobs:
  original-model-event-write-read-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Original CPU FP32 PyTorch and unchanged source guard tests
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Preflight source-readonly no-fit original trained provenance and source budget
        run: |
          set -euo pipefail
          python -m py_compile scripts/latfuse010_real_event_writer_attribution.py
          python scripts/validate_research_parity.py \
            --manifest research/mathematical-engineering/latfuse010/REGISTERED_ATTRIBUTION.json \
            --phase preflight
          python scripts/sync_test_count.py --check
          python scripts/validate_research_parity.py \
            --manifest research/replay-bundles/LATFUSE008/POSTFIT_PARITY.json \
            --phase final
          test -s research/replay-bundles/LATFUSE008/RESULTS.json
          test ! -e research/mathematical-engineering/latfuse010/RESULTS.json
      - name: Reassert original source-authorization and source query nonassoc separation
        env:
          PYTHONPATH: ".:src"
        run: |
          python -m pytest -q \
            tests/test_latfuse008_noassoc_control.py \
            tests/test_latent_fusion_007_historic_query.py
      - name: Recover exact original physical observed UCI501 source with no protected numerical parsing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse010-physical
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse010-physical/PRSA2017_original.zip
      - name: Original 4 SHA-checkpoint x 4 real-source lag: writer gradients/read query and single-event matrix change lesion
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/latfuse010_real_event_writer_attribution.py \
            --source /tmp/latfuse010-physical/PRSA2017_original.zip \
            --output research/mathematical-engineering/latfuse010/RESULTS.json
      - name: Persist original true-source diagnostics on original isolated draft research branch ONLY
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/latfuse010-real-event-key-value-attribution-2026-10-27
          test -s research/mathematical-engineering/latfuse010/RESULTS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/latfuse010/RESULTS.json
          git diff --cached --quiet && exit 1
          git commit -m "research: preserve source-real event write-key/value activation gradient and single-step event matrix lesion"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Scientific scope
        run: |
          echo "Original weights and optimizer untouched, no new fits or historical oracle read keys."
          echo "Source event write activation gradients NOT model parameter optimizer gradients."
          echo "Local event-write lesion is model-state contrast, not physical counterfactual."
          echo "No 2015 source numeric or protected2016-17 numeric parsing."
