name: MODEL01-UCI235-TRANSFER-001 independent household target-shift stress
on:
  push:
    branches:
      - research/model01-independent-household-transfer-2026-10-27
    paths:
      - 'specialist_models/model01_uci235_transfer_stress.py'
      - 'tests/test_model01_uci235_transfer_stress.py'
      - 'research/registrations/MODEL01-UCI235-TRANSFER-001.md'
      - '.github/workflows/model01-independent-household-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-external-source-target-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test constructed archive, no-tail parsing, absent data and metric contract
        run: python -m unittest discover -s tests -p 'test_model01_uci235_transfer_stress.py' -v
      - name: Evaluate frozen original ridge on genuine other-household source (not same task)
        run: python specialist_models/model01_uci235_transfer_stress.py --out uci235_transfer_stress.json
      - name: Print claim-limited original-source receipt
        run: cat uci235_transfer_stress.json
      - uses: actions/upload-artifact@v4
        with:
          name: uci235-original-cross-source-different-target-stress
          path: uci235_transfer_stress.json
          if-no-files-found: error
          retention-days: 14
