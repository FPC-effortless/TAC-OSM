name: ME067 original robot frozen fast slow associative memory lesion diagnostic
on:
  pull_request:
    paths:
      - 'scripts/me067_frozen_real_memory_ablation.py'
      - 'research/mathematical-engineering/me067/FAIR_COMPARISON.json'
      - '.github/workflows/me067-frozen-memory-diagnostic.yml'
  workflow_dispatch:
    inputs:
      allow_new_fits:
        description: Explicit opt-in; current live gates remain compulsory
        type: boolean
        default: false
permissions: {contents: write}
concurrency:
  group: me067-original-exposed-source-only-memory-ablation
  cancel-in-progress: false
jobs:
  original-frozen-robot-memory-diagnostics:
    # Retained historical lane; current live guards still reject incompatible new fits.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_new_fits == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate prior Git trained checkpoint replay and noncomparative diagnostic registration
        run: |
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me067/FAIR_COMPARISON.json --phase preflight
          test -f research/replay-bundles/ME066/EVALUATION_REPLAY_RECEIPT.json
          test -f research/replay-bundles/ME066/CLEAN_CHECKOUT_MODEL_REPLAY.json
          test -f research/replay-bundles/ME066/ORIGINAL_SOURCE_CAL_SCORES.json
          test -f research/replay-bundles/ME066/ORIGINAL_UNTOUCHED_TASK_SCORES.json
          PYTHONPATH=src:. python scripts/me066_verify_repo_checkpoints.py
      - name: Score frozen physical memory lesions on previously exposed original robot records; no fits or new target
        run: |
          if [ -f research/replay-bundles/ME067/ME067_ABLATION_SUMMARY.json ]; then
            echo 'Original ME067 diagnosis already committed; NEVER overwrite this source result'
          else
            PYTHONPATH=src:. python scripts/me067_frozen_real_memory_ablation.py \
              --cache "${{ runner.temp }}/me067-already-exposed-original-publisher"
          fi
      - name: Preserve all original diagnostic evidence in TAC Git, even negative
        if: always()
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          set -e
          if [ -f research/replay-bundles/ME067/ME067_ABLATION_SUMMARY.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f research/replay-bundles/ME067/ME067_ABLATION_SUMMARY.json
            if ! git diff --cached --quiet; then
              git commit -m 'evidence(me067): original frozen robot memory lesion CAL and exposed target results'
              for attempt in 1 2 3 4 5; do
                git fetch origin "$PUSH_BRANCH"
                git rebase "origin/$PUSH_BRANCH"
                if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
                if [ "$attempt" -eq 5 ]; then exit 1; fi
              done
            fi
          fi
