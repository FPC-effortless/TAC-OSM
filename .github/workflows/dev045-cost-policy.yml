name: DEV-045 cost-conditioned policy interface (engineering)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/tac_osm/development/decision_cost_policy.py'
      - 'tests/test_decision_cost_policy_dev045.py'
      - 'research/dev045/**'
      - '.github/workflows/dev045-cost-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-interface-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU runtime and regression dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate all full repository contracts and DEV-045 safety gates
        run: |
          ruff check --select F src/tac_osm/development/decision_cost_policy.py tests/test_decision_cost_policy_dev045.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Confirm cost-sensitive training gradients without simulator labels at inference
        run: |
          python - <<'PY'
          import torch
          from tac_osm.development.decision_cost_policy import select_actions,expected_decision_regret,Decision
          pred=torch.nn.Parameter(torch.tensor([[[2.,.5,5.]]]))
          oracle=torch.tensor([[[4.,1.,.1]]])
          loss=expected_decision_regret(pred,oracle)
          loss.backward()
          assert pred.grad is not None and torch.isfinite(pred.grad).all()
          assert select_actions(torch.tensor([[.9]]),torch.tensor([[0.]])).action.item()==Decision.SERVICE
          print('DEV-045 COST-ACTION INTERFACE CONTRACT PASSED (engineering only)')
          PY
