name: Recorded measured thermal forecasts
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/real-maint-003/**'
      - 'src/tac_osm/development/thermal_forecast.py'
      - 'scripts/*real_maintenance_003.py'
      - 'scripts/runtime_thermal_forecast_003.py'
      - 'tests/test_thermal*.py'
      - '.github/workflows/real-maint-003.yml'
permissions:
  contents: read
jobs:
  strict-thermal-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e . numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python scripts/restore_real_maintenance_003.py
          python scripts/audit_real_maintenance_003.py --directory results/real003-main --output results/real003-remote-audit.json --exports results/real003-remote-forecasters
          python scripts/analyze_real_maintenance_003.py --directory results/real003-main --output results/real003-remote-statistics.json
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from audit_identity_dev0615 import compare
          audit=json.load(open('results/real003-remote-audit.json'))
          assert audit['status']=='COMPLETE' and audit['checkpoints']==88 and audit['references']==8
          assert audit['portable_predictions']==8 and audit['telemetry']['max_abs']<=1e-8
          compare(json.load(open('results/real003-remote-statistics.json')),json.load(open('research/real-maint-003/statistics.json')),{'values':0,'max_abs':0.})
          exports=list(Path('results/real003-remote-forecasters').glob('*/metadata.json'))
          assert len(exports)==4
          for path in exports:
              metadata=json.loads(path.read_text())
              assert metadata['temperature_unit']=='degF'
              assert metadata['input_units']==['degF']*11+['W']
              output=json.loads((path.parent/'demo-output.jsonl').read_text().splitlines()[0])
              assert 'temperature_F' in output and 'temperature_C' not in output
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real003-restored-forecasts
          path: |
            results/real003-remote-*.json
            results/real003-remote-forecasters/**
          if-no-files-found: ignore
