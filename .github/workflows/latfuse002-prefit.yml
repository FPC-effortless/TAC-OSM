name: LATFUSE002 preserved-FP32 state real-source zero-fit preflight

on:
  push:
    branches:
      - research/latfuse002-fixed-state-training-2026-10-26
    paths:
      - "src/tac_osm/latent_fusion_002.py"
      - "scripts/latfuse002_real_fit.py"
      - "research/mathematical-engineering/latfuse002/FAIR_COMPARISON.json"
      - "tests/test_latent_fusion_002.py"
      - ".github/workflows/latfuse002-prefit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-fit-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: CPU-only dependencies
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests of identical recurrent FP32 state, rates and source graph
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_latent_fusion_001.py tests/test_latent_fusion_002.py
      - name: Confirm provenance of live historical test count
        run: python scripts/sync_test_count.py --check
      - name: Prospective original real-data single-model training preflight manifest
        run: |
          python scripts/validate_research_parity.py \
            --manifest research/mathematical-engineering/latfuse002/FAIR_COMPARISON.json \
            --phase preflight
      - name: Obtain original licensed archive from source-pinned prior research without modifying current branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse002-original
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse002-original/PRSA2017_original.zip
      - name: Independent real-source FIT-only graph and original-gradient preflight
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONPATH: src
        run: |
          python scripts/latfuse002_real_fit.py --mode prefit \
            --source /tmp/latfuse002-original/PRSA2017_original.zip
      - name: Fail-closed outcome of this no-fit job
        run: |
          echo "PRE-FIT ENGINEERING ONLY; no optimizer updates or protected 2016-2017 numeric source access."
          echo "NOT evidence of qualified real-world prediction, full source anti-cheat, or matched architecture superiority."
