name: S1MOTION004 source-causal gradient-route contracts (NO FIT)
on:
  push:
    branches:
      - research/s1motion004-point-gradient-isolation-2026-10-26
    paths:
      - 'src/tac_osm/variants/s1motion004_gradient_routes.py'
      - 'tests/test_s1motion004_gradient_routes.py'
      - '.github/workflows/s1motion004-gradient-contract.yml'
  pull_request:
    paths:
      - 'src/tac_osm/variants/s1motion004_gradient_routes.py'
      - 'tests/test_s1motion004_gradient_routes.py'
      - '.github/workflows/s1motion004-gradient-contract.yml'
permissions:
  contents: read
jobs:
  engineering-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Inspect true backward graph isolation, numeric forward and causal streaming
        run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1motion004_gradient_routes -v
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_system1_velocity_anchored.py -v
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_system1_parallel.py -v
