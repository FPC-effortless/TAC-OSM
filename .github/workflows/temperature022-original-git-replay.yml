name: TEMP022 original Git preservation and gated internal replay
on:
  pull_request:
    paths:
      - 'src/tac_osm/original_archive_shards.py'
      - 'scripts/original_language_archive.py'
      - 'scripts/replay_temp021_from_git.py'
      - 'tests/test_original_archive_shards.py'
      - 'tests/test_temperature021_finite_replay.py'
      - 'research/mathematical-engineering/temperature021/**'
      - 'research/mathematical-engineering/temperature022/**'
      - 'research/phone_queue/temperature022*.json'
      - 'research/replay-bundles/TEMP021/**'
      - '.github/workflows/temperature022-original-git-replay.yml'
permissions:
  contents: read
jobs:
  preservation-and-conditional-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Original numerical profile, CPU only
        run: |
          python -m pip install pytest numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Reproduce engineering plan and run constructed regressions
        run: |
          mkdir -p temp022-results
          python scripts/phone_lab.py plan research/phone_queue/temperature022.json > temp022-results/ENGINEERING_PLAN.json
          cmp temp022-results/ENGINEERING_PLAN.json research/mathematical-engineering/temperature022/COMPUTE_DECISION.json
          python -m pytest -q tests/test_original_archive_shards.py tests/test_temperature021_finite_replay.py tests/test_research_probe_agnostic.py
          python -m unittest discover -s research/mathematical-engineering/temperature021 -p test_original_500k_calibration.py -v
      - name: Original Git replay if complete; explicit BLOCKED otherwise
        run: |
          set +e
          python scripts/replay_temp021_from_git.py --output temp022-results
          replay_exit=$?
          set -e
          if [ "$replay_exit" -ne 0 ] && [ "$replay_exit" -ne 2 ]; then exit "$replay_exit"; fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('temp022-results/STATUS.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Original Git model replay: **'+r['REPO_COLD_REPLAY']+'**\n\n'+r.get('reason','Internal numerical replication only; NOT independently qualified.'))
          print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temperature022-preservation-and-replay-status
          path: temp022-results/
