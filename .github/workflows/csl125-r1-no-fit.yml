name: CSL125-R1 source-owned no-fit CPU engineering
on:
  pull_request:
    branches:
      - research/csl125-ladder-125m-2026-11-05
    paths:
      - 'src/tac_osm/csl125_r1*'
      - 'tests/test_csl125_r1*'
      - '.github/workflows/csl125-r1-no-fit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-no-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test-only dependencies
        run: python -m pip install --quiet 'pytest>=8,<9' 'numpy==2.3.3' torch
      - name: Run CSL source and generic adapter falsifiers (NO FIT)
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest -q \
            tests/test_csl001.py tests/test_csl001_math.py \
            tests/test_csl125.py tests/test_csl125_math.py \
            tests/test_csl125_r1.py tests/test_csl125_r1_probe.py \
            tests/test_research_probe_agnostic.py
      - name: Verify complete parameter budget without learned updates
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from tac_osm.csl125_r1 import CSL125R1, CSL125R1Config
          with __import__('torch').device('meta'):
              model=CSL125R1(CSL125R1Config())
          n=sum(p.numel() for p in model.parameters())
          assert n==123699534 and n<=125000000, n
          print({'stage':'NO_FIT_META_CONSTRUCTION','parameters':n,'optimizer_steps':0})
          PY
