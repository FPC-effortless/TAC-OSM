name: TAC-OSM fused bio-inspired research

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fused-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest
      - name: Unit and integrity gates
        run: PYTHONPATH=src python -m pytest tests/test_fusion.py -q
      - name: Select suite
        id: inputs
        shell: bash
        run: |
          SUITE=$(jq -r '.inputs.suite // "smoke"' "$GITHUB_EVENT_PATH")
          STEPS=$(jq -r '.inputs.steps // "24"' "$GITHUB_EVENT_PATH")
          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"
          echo "steps=$STEPS" >> "$GITHUB_OUTPUT"
      - name: Run fused research
        run: |
          PYTHONPATH=src python scripts/run_fused_research.py \
            --suite "${{ steps.inputs.outputs.suite }}" \
            --steps "${{ steps.inputs.outputs.steps }}" \
            --output "fused-${{ steps.inputs.outputs.suite }}.json"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tacosm-fused-${{ github.run_id }}
          path: fused-*.json
