name: TAC-OSM fused bio-inspired research

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      suite:
        description: "Ablation suite"
        required: true
        default: "component"
        type: choice
        options:
          - smoke
          - component
          - memory
          - coordination
          - priming
          - specialization
          - halting
          - verification
          - fact_state
          - integrity
          - lesion
          - all
      steps:
        description: "Steps per arm"
        required: true
        default: "24"
        type: string
      seeds:
        description: "Comma-separated seeds"
        required: true
        default: "0,1,2,3,4"
        type: string

permissions:
  contents: read

jobs:
  fused-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest
      - name: Cheap preflight
        run: |
          PYTHONPATH=src python -m compileall -q src tests scripts
          PYTHONPATH=src python - <<'PY'
          from tac_osm.fusion.ablation import full_config
          from tac_osm.fusion.builder import build_fused_model
          build_fused_model(full_config(0), n_steps=1)
          print("fused builder smoke: PASS")
          PY
      - name: Unit and integrity gates
        run: PYTHONPATH=src python -m pytest tests/test_fusion.py -q
      - name: Select suite
        id: inputs
        shell: bash
        run: |
          SUITE=$(jq -r '.inputs.suite // "smoke"' "$GITHUB_EVENT_PATH")
          STEPS=$(jq -r '.inputs.steps // "24"' "$GITHUB_EVENT_PATH")
          SEEDS=$(jq -r '.inputs.seeds // "0,1,2,3,4"' "$GITHUB_EVENT_PATH")
          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"
          echo "steps=$STEPS" >> "$GITHUB_OUTPUT"
          echo "seeds=$SEEDS" >> "$GITHUB_OUTPUT"
      - name: Run fused research
        run: |
          PYTHONPATH=src python scripts/run_fused_research.py \
            --suite "${{ steps.inputs.outputs.suite }}" \
            --steps "${{ steps.inputs.outputs.steps }}" \
            --seeds "${{ steps.inputs.outputs.seeds }}" \
            --output "fused-${{ steps.inputs.outputs.suite }}.json"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tacosm-fused-${{ github.run_id }}
          path: fused-*.json
