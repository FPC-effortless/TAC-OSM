name: BYTE100K-001 untrained FIT integration and original-weight replay
on:
  pull_request:
    paths:
      - 'src/tac_osm/byte100k_001.py'
      - 'scripts/check_byte100k_integration.py'
      - 'tests/test_byte100k_001.py'
      - 'research/byte100k_001/**'
      - '.github/workflows/byte100k-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      index_sha: ${{ steps.capture.outputs.index_sha }}
    env:
      PYTHONPATH: src:.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install pytest==8.4.2 numpy==2.3.5 safetensors==0.6.2 packaging==25.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen CPU plan and software falsifiers
        run: |
          mkdir -p evidence
          python -B scripts/phone_lab.py plan research/phone_queue/byte100k_001_20261115.json > evidence/CPU_PLAN.json
          cmp evidence/CPU_PLAN.json research/byte100k_001/COMPUTE_DECISION.json
          python -m pytest -q tests/test_byte100k_001.py tests/test_causal_byte_corpus.py tests/test_research_probe_agnostic.py --junitxml=evidence/TESTS.xml
      - name: Verify permanent original evidence and extract original saved untrained model bytes
        run: python -B research/byte100k_001/verify_saved_evidence.py --extract-original /tmp/byte100k-original
      - name: Replay original untrained model checks without recapturing initialization
        id: capture
        run: |
          python -B scripts/check_byte100k_integration.py --original /tmp/byte100k-original/capture --expected-index-sha "509865baa2b1bd903a4634e94e47101335519ecc65099d5c4370e5abb422fdc9" --output evidence/capture
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          pin=hashlib.sha256(Path('evidence/capture/INDEX.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('index_sha='+pin+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BYTE100K-001-ORIGINAL
          path: evidence/
          retention-days: 90
  original-weight-replay:
    needs: original
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      EXPECTED_INDEX_SHA: ${{ needs.original.outputs.index_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 safetensors==0.6.2 packaging==25.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: BYTE100K-001-ORIGINAL
          path: original
      - name: Restore actual original weights/buffers into different prototypes, recompute before expected tensors open
        run: |
          python -B scripts/phone_lab.py plan research/phone_queue/byte100k_001_20261115.json > /tmp/replay-plan.json
          cmp /tmp/replay-plan.json research/byte100k_001/COMPUTE_DECISION.json
          python -B scripts/check_byte100k_integration.py --original original/capture --expected-index-sha "$EXPECTED_INDEX_SHA" --output replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BYTE100K-001-REPLAY
          path: replay/
          retention-days: 90
