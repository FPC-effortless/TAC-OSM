name: ME050 real linked user sequence and native memory capability
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/tac_osm/me050_real_temporal_memory.py
      - scripts/me050_train_real_temporal.py
      - tests/test_me050_real_temporal_memory.py
      - research/mathematical-engineering/me050/**
      - docs/TACOSM-BASELINE-001.md
      - .github/workflows/me050-real-user-temporal.yml
permissions:
  contents: read
concurrency:
  group: me050-real-user-memory-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  software-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned numerical environment
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Check real-history mathematical interface (generated numbers only as unit tests)
        run: |
          python -m py_compile src/tac_osm/me050_real_temporal_memory.py scripts/me050_train_real_temporal.py
          python -m scripts.me050_train_real_temporal --self-test
          python -m pytest -q tests/test_me050_real_temporal_memory.py
      - name: Validate full original regressions and frozen baseline count
        run: |
          python -m pytest -q
          python scripts/sync_test_count.py --check
  real-sequence-original-eight-fits:
    needs: software-and-regression
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install same real model numerical dependencies
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Download immutable KuaiRand original, run eight FIT-only real training fits and sealed future-time tests
        run: |
          set -o pipefail
          python -m scripts.me050_train_real_temporal --out results/me050 | tee me050-original-fits.log
      - name: Replay all real frozen models' actual test probabilities exactly
        run: |
          set -o pipefail
          python -m scripts.me050_train_real_temporal --out results/me050 --replay | tee me050-original-replay.log
      - name: Enforce source, chronological splitting, and failure-claim boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/me050/results.json").read_text())
          assert r["complete"] and len(r["models"])==8
          assert r["all_eight_models_frozen_before_later_outcome_access"]
          assert not r["future_calendar_outcomes_loaded_before_source_fit"]
          assert r["sealed_test_opened"]
          assert r["genuine_temporal_history_used"]
          assert r["source_revision"]=="b86438794b71ac3ebb95d96e167f52d22edccda7"
          assert len(r["original_source_sha256"])==64
          assert r["prequential_test_uses_only_earlier_observed_clicks"]
          assert not r["resource_parity_across_distinct_architectures_qualified"]
          assert not r["real_logged_counterfactual_policy_qualified"]
          assert not r["continuous_memory_beyond_12_events_claim"]
          assert r["no_promotion_or_merge"]
          for split in ("FIT","DEV","TEST"):
              report=r["fit_cohort"] if split=="FIT" else r["later_cohorts"][split]
              assert report["n"]>=250 and report["user_count"]>=15
              assert 0<report["positive_clicks"]<report["n"]
          print("ME050_REAL_CHRONOLOGICAL_HISTORY_EVIDENCE_AND_HONEST_LIMITS_PASS")
          PY
      - name: Archive original trained weights, optimizer and metrics without raw user histories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me050-real-linked-user-native-chronology-original-model-evidence
          path: |
            results/me050/results.json
            results/me050/*-s*/
            me050-original-fits.log
            me050-original-replay.log
          if-no-files-found: ignore
          retention-days: 90
