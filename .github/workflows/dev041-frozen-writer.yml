name: DEV-041 random-frozen-writer attribution (development)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/dev041/protocol.json'
      - 'scripts/*dev041.py'
      - '.github/workflows/dev041-frozen-writer.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runner
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check source and regression contracts
        run: |
          ruff check --select F scripts/run_frozen_writer_dev041.py scripts/audit_frozen_writer_dev041.py tests/test_frozen_writer_dev041.py
          python -m pytest tests/ -q
      - name: Smoke every arm and strict separate-process replay
        run: |
          python scripts/run_frozen_writer_dev041.py --seed 4101 --smoke --output artifacts/DEV041-smoke
          python scripts/run_frozen_writer_dev041.py --seed 4101 --smoke --replay --output artifacts/DEV041-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV041-smoke-not-confirmatory
          path: artifacts/DEV041-smoke/
          if-no-files-found: warn
  matched-seeds:
    needs: integrity-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [4101, 4102, 4103]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same pinned CPU runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Matched trainable/frozen/memoryless experiment
        run: |
          python scripts/run_frozen_writer_dev041.py --seed ${{ matrix.seed }} --output artifacts/DEV041-seed${{ matrix.seed }}
          python scripts/run_frozen_writer_dev041.py --seed ${{ matrix.seed }} --replay --output artifacts/DEV041-seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV041-RAW-seed${{ matrix.seed }}-development
          path: artifacts/DEV041-seed${{ matrix.seed }}/
          if-no-files-found: warn
  separate-audit:
    needs: matched-seeds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV041-RAW-seed*-development
          path: artifacts/evidence
      - name: Install independent audit runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Independent labels, action, cost and seed audit
        run: |
          python scripts/audit_frozen_writer_dev041.py \
            artifacts/evidence/DEV041-RAW-seed4101-development \
            artifacts/evidence/DEV041-RAW-seed4102-development \
            artifacts/evidence/DEV041-RAW-seed4103-development \
            --output artifacts/evidence/analysis
      - uses: actions/upload-artifact@v4
        with:
          name: DEV041-COMPLETE-EVIDENCE-NOT-CONFIRMATORY
          path: artifacts/evidence/
          if-no-files-found: error
      - name: Publish summary after archive success
        run: cat artifacts/evidence/analysis/analysis.json
