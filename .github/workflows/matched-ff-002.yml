name: Research PLM matched feed-forward feedback 002
on:
  pull_request:
    branches: [master]
    paths:
      - "src/tac_osm/integrated_e2e_008_benchmark.py"
      - "src/tac_osm/integrated_e2e_005.py"
      - "src/tac_osm/integrated_e2e_005_benchmark.py"
      - "src/tac_osm/integrated_e2e_ff_feedback_baseline.py"
      - "scripts/run_matched_ff_002.py"
      - "contracts/TACOSM-PLM-MATCHED-FF-002.json"
      - "tests/test_matched_ff_002.py"
      - ".github/workflows/matched-ff-002.yml"
permissions:
  contents: read
jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest torch numpy==2.3.3 ruff==0.13.0
      - name: Integrity
        run: |
          ruff check --select F821 src/tac_osm/integrated_e2e_ff_feedback_baseline.py scripts/run_matched_ff_002.py tests/test_matched_ff_002.py
          python -m pytest tests/test_matched_ff_002.py -q
      - name: Smoke
        run: python scripts/run_matched_ff_002.py --smoke
      - name: Confirmatory measurement
        run: python scripts/run_matched_ff_002.py
      - name: Upload scientific artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-MATCHED-FF-002
          path: artifacts/TACOSM-PLM-MATCHED-FF-002.json
          if-no-files-found: error
