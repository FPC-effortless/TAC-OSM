name: ME008 original real native TAC equal-step training
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/me008_train_native_1000.py'
      - 'research/mathematical-engineering/me008/PROTOCOL.md'
      - '.github/workflows/me008-native1000.yml'
permissions:
  contents: read
concurrency:
  group: me008-native1000-original
  cancel-in-progress: true
jobs:
  mathematical-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m py_compile scripts/me008_train_native_1000.py
          python -m scripts.me008_train_native_1000 --self-test
  native-original-fit:
    needs: mathematical-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Train unchanged TAC 3 seeds x 1000 steps using authentic TRAIN only
        run: |
          python -m scripts.me008_train_native_1000 --out results/me008 | tee me008-original.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/me008/results.json').read_text())
          assert d['study']=='ME008_NATIVE_EQUAL_STEPS'
          assert len(d['fits'])==3 and not d['future_period_ever_opened_by_this_script']
          assert all(len(x['checkpoints'])==2 for x in d['fits'])
          assert {(x['seed'],m['steps']) for x in d['fits'] for m in x['checkpoints']} == {
              (seed,steps) for seed in (240401,240402,240403) for steps in (450,1000)}
          assert all(m['parameters']==9368 for x in d['fits'] for m in x['checkpoints'])
          assert len(list(Path('results/me008/checkpoints').glob('*.pt')))==6
          assert not d['promotion']
          PY
      - name: Preserve every original weight and negative/positive numerical outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: me008-original-native1000
          path: |
            results/me008/results.json
            results/me008/checkpoints/*.pt
            me008-original.log
          if-no-files-found: ignore
          retention-days: 90
