name: Research PLM next phases

on:
  pull_request:
    branches:
      - research/c5-composition-budget-audit-001
  push:
    branches:
      - research/plm-unified-phase-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: python -m pip install --quiet -e . pytest
      - name: Full repository suite
        run: python -m pytest tests/ -q
      - name: PLM research phase tests
        run: python -m pytest tests/test_plm_research_phases.py -q
      - name: Run P2 state stability
        run: python scripts/run_plm_state_stability_002.py
      - name: Run P3 operator scaling
        run: python scripts/run_plm_operator_scaling_003.py
      - name: Run P4 continual plasticity
        run: python scripts/run_plm_plasticity_004.py
      - name: Run P5 joint state + operator scaling
        run: python scripts/run_plm_joint_scaling_005.py
      - name: Upload next-phase artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-NEXT-PHASES
          path: artifacts/TACOSM-PLM-*.json
          if-no-files-found: error
