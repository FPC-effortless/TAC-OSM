name: ESWAM014 Lean whole observed world graph and physical invariants
on:
  pull_request:
    paths:
      - "research/mathematical-engineering/eswam014/WholeNativeGraph.lean"
      - ".github/workflows/eswam014-whole-native-lean.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean 4 release
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.25.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check whole observable candidate graph and physical fallback theorems, no sorry
        run: |
          lean --version
          lean research/mathematical-engineering/eswam014/WholeNativeGraph.lean
