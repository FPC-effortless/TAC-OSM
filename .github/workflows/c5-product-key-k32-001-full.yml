name: C5 product-key K32 — full registered run

on:
  push:
    branches: [research/c5-product-key-k32-001]
    paths:
      - "src/tac_osm/**"
      - "tests/**"
      - "scripts/run_c5_product_key_k32_001.py"
      - "docs/TACOSM-C5-PRODUCT-KEY-K32-001.md"
      - "contracts/TACOSM-C5-PRODUCT-KEY-K32-001.json"
      - ".github/workflows/c5-product-key-k32-001-full.yml"

permissions:
  contents: read

jobs:
  k32-full:
    if: contains(github.event.head_commit.message, '[run-c5-k32-full]')
    name: TACOSM-C5-PRODUCT-KEY-K32-001 — full
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Preconditions
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
      - name: Full registered measurement
        run: |
          mkdir -p artifacts
          python scripts/run_c5_product_key_k32_001.py > artifacts/TACOSM-C5-PRODUCT-KEY-K32-001.json
          cat artifacts/TACOSM-C5-PRODUCT-KEY-K32-001.json
      - name: Upload registered artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-C5-PRODUCT-KEY-K32-001-full
          path: artifacts/TACOSM-C5-PRODUCT-KEY-K32-001.json
          if-no-files-found: error
