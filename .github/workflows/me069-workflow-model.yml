name: ME069 authentic enterprise workflow model
on:
  pull_request:
    paths:
      - 'src/tac_osm/workflow_me069.py'
      - 'scripts/me069_*.py'
      - 'tests/test_me069_*.py'
      - 'research/mathematical-engineering/me069/**'
      - 'research/replay-bundles/ME069/**'
      - '.github/workflows/me069-workflow-model.yml'
  workflow_dispatch:
jobs:
  workflow-math-and-scientific-preflight:
    # Retained historical lane; current live guards still reject incompatible new fits.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_new_fits == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pytest==9.1.1
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. pytest -q tests/test_me069_workflow.py
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me069/FAIR_COMPARISON.json --phase preflight
      - run: |
          if [ -f research/replay-bundles/ME069/FAIR_COMPARISON_FINAL.json ]; then
            python scripts/validate_research_parity.py --manifest research/replay-bundles/ME069/FAIR_COMPARISON_FINAL.json --phase final
          fi
      - name: Restore original Git checkpoints and recompute real held-out scores
        run: |
          if [ -f research/replay-bundles/ME069/REAL_EVALUATION.json ]; then
            PYTHONPATH=src:. python scripts/me069_verify_workflow.py --phase restore --cache /tmp/me069-source
            PYTHONPATH=src:. python scripts/me069_verify_workflow.py --phase replay --cache /tmp/me069-source
          fi
      - name: Preserve replay outputs including numerical failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me069-real-score-replay
          path: |
            research/replay-bundles/ME069/REAL_EVALUATION.json
            research/replay-bundles/ME069/FAILED_REPLAY_EVALUATION.json
            research/mathematical-engineering/me069/RESTORATION.json
            research/mathematical-engineering/me069/REPLAY_AUDIT.json
          if-no-files-found: ignore
