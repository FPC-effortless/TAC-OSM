name: LANGPERSIST096 real lexical and general capability research
on:
  pull_request:
    paths:
      - 'research/mathematical-engineering/langpersist096/**'
      - '!research/mathematical-engineering/langpersist096/results/**'
      - 'tests/test_langpersist096_*.py'
      - '.github/workflows/langpersist096.yml'
      - 'research/phone_queue/langpersist096-real-state-utility.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-real-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: src
      LANGPERSIST096_JUDGE_BACKEND: docker
      PREREGISTRATION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Detect new scientific inputs in the head commit
        id: changes
        env:
          REQUESTED_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          commit = os.environ['PREREGISTRATION_COMMIT']
          if re.fullmatch('[0-9a-f]{40}', commit) is None:
              raise ValueError('a complete source commit is required')
          changed = subprocess.check_output(
              ['git', 'diff-tree', '--root', '--no-commit-id', '--name-only', '-r', commit],
              text=True).splitlines()
          root = 'research/mathematical-engineering/langpersist096/'
          scientific = any(
              (path.startswith(root) and not path.startswith(root + 'results/'))
              or path.startswith('tests/test_langpersist096_')
              or path == 'research/phone_queue/langpersist096-real-state-utility.json'
              for path in changed)
          # PR path filters inspect the cumulative diff. Report/workflow-only
          # commits still run software checks; explicit dispatch runs the study.
          run = os.environ['REQUESTED_EVENT'] == 'workflow_dispatch' or scientific
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('research=' + str(run).lower() + '\n')
          print('New model evaluation required:', run)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pytest>=8,<9'
      - run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare pinned isolated executable-code judge
        run: docker --host=unix:///var/run/docker.sock pull --platform linux/amd64 python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b
      - run: python scripts/phone_lab.py plan research/phone_queue/langpersist096-real-state-utility.json
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langpersist096/FAIR_COMPARISON.json --phase preflight
      - name: Software, information-boundary and source-streaming checks
        run: python -m pytest -q tests/test_langpersist096_*.py tests/test_research_probe_agnostic.py
      - name: Frozen real-data lexical and general capability study
        if: steps.changes.outputs.research == 'true'
        run: >-
          python research/mathematical-engineering/langpersist096/run.py
          --cache /tmp/langpersist096-cache
          --output ci-artifacts/langpersist096/experiment
          --preregistration-commit "$PREREGISTRATION_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langpersist096-research-${{ github.run_id }}
          path: ci-artifacts/langpersist096/
          if-no-files-found: warn
