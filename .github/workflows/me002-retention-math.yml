name: ME002 native TAC retention mathematical tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/me002_retention_math_probe.py
      - research/mathematical-engineering/me002/RESULTS.md
      - .github/workflows/me002-retention-math.yml
permissions:
  contents: read
jobs:
  five-seed-gradient-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run untrained mathematical checks, no dataset or training
        run: |
          python scripts/me002_retention_math_probe.py | tee me002-run.log
          python - <<'PY'
          import json
          d=json.load(open('results/me002/gradients.json'))
          assert d['seed_count']==5 and len(d['records'])==60
          assert all(r['valid'] for r in d['records'])
          assert d['not_trained'] and not d['real_world_performance_claim']
          PY
      - name: Archive raw original math diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: me002-five-seed-gradient-evidence
          path: |
            results/me002/gradients.json
            me002-run.log
          if-no-files-found: ignore
