name: ME062 authentic source-FIT numeric preflight (no training)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-fit-preflight-only:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original experiment dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: FIT-only, zero-step physical parameter/FLOP measurement
        run: |
          PYTHONPATH=src:. python scripts/me062_prefit_original_fit.py \
            --source-cache "${{ runner.temp }}/me062-original-source-cache" \
            --output research/mathematical-engineering/me062/PREFLIGHT_MEASURED.json
      - name: Persist original measured receipt to the SAME research Git branch
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/me062/PREFLIGHT_MEASURED.json
          git commit -m 'evidence(me062): preserve real FIT numeric preflight; no optimizer updates'
          git push origin "HEAD:refs/heads/$PUSH_BRANCH"
      - name: Confirm research did not fit or open heldout
        run: |
          python - <<'PY'
          import json
          f=json.load(open("research/mathematical-engineering/me062/PREFLIGHT_MEASURED.json"))
          assert f["optimizer_steps"]==0 and f["training_status"]=="NOT_RUN"
          assert not any(f[k] for k in ("cal_trajectory_opened","dev_trajectory_opened","test_trajectory_opened"))
          print("ME062_SOURCE_ONLY_PERSISTENCE_CONFIRMED",f["parameter_relative_gap"],f["operator_flop_relative_gap"])
          PY
