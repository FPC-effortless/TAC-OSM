name: DEV-021 trained decay/erase suffix transport (development)
on:
  pull_request:
    paths:
      - "scripts/run_dev021_suffix_transport.py"
      - "scripts/audit_dev021_suffix_transport.py"
      - "tests/test_dev021_suffix_transport.py"
      - ".github/workflows/dev021-suffix-transport.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrity-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU tests
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint, provenance count, all regression tests
        run: |
          ruff check --select F scripts/run_dev021_suffix_transport.py scripts/audit_dev021_suffix_transport.py tests/test_dev021_suffix_transport.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Mathematical diagnostics smoke (untrained, NOT evidence)
        run: |
          python scripts/run_dev021_suffix_transport.py --seed 43 --regime short --smoke --output artifacts/DEV-021-SMOKE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-021-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-021-SMOKE/
          if-no-files-found: warn
  frozen-grid:
    needs: integrity-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [43, 59, 71]
        regime: [short, long]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned frozen diagnostic runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch original immutable DEV-018 seed/regime checkpoint archive
        uses: actions/download-artifact@v4
        with:
          name: DEV-018-RAW-${{ matrix.regime }}-${{ matrix.seed }}-NOT-CONFIRMATORY
          run-id: 38802569971
          github-token: ${{ github.token }}
          path: frozen
      - name: Evaluate trained suffix decay and erase 2x2 factorial
        run: |
          python scripts/run_dev021_suffix_transport.py --seed ${{ matrix.seed }} --regime ${{ matrix.regime }} --frozen frozen --output artifacts/DEV-021-${{ matrix.regime }}-${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-021-RAW-${{ matrix.regime }}-${{ matrix.seed }}-NOT-CONFIRMATORY
          path: artifacts/DEV-021-${{ matrix.regime }}-${{ matrix.seed }}/
          if-no-files-found: warn
  independent-audit:
    needs: frozen-grid
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV-021-RAW-*-NOT-CONFIRMATORY
          path: artifacts/DEV-021-all
      - name: Independently regenerate suffixes and recompute factorial statistics without torch
        run: |
          python scripts/audit_dev021_suffix_transport.py artifacts/DEV-021-all/DEV-021-RAW-*-NOT-CONFIRMATORY/report.json --output artifacts/DEV-021-all/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-021-COMPLETE-AUDITED-DIAGNOSTIC-NOT-CONFIRMATORY
          path: artifacts/DEV-021-all/
          if-no-files-found: error
