name: System1 Observatory architecture-agnostic adapter regression
on:
  push:
    branches: [research/s1obs001-checkpoint-forensics-2026-10-26]
    paths:
      - 'src/tac_osm/research_probe.py'
      - 'src/tac_osm/research_anticheat.py'
      - 'src/tac_osm/research_torch_basics.py'
      - 'src/tac_osm/research_interpretation.py'
      - 'src/tac_osm/research_system1_adapter.py'
      - 'tests/test_research_system1_adapter.py'
      - '.github/workflows/s1obs001-adapter-contract.yml'
  pull_request:
    paths:
      - 'src/tac_osm/research_system1_adapter.py'
      - 'tests/test_research_system1_adapter.py'
permissions:
  contents: read
jobs:
  source-independent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      - name: Install CPU runtime
        run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run all actual System1 generic adapter invariants
        run: |
          PYTHONPATH=src:. python -m unittest tests.test_research_system1_adapter -v
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_s1motion005_gradient_budget.py -v
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_system1_velocity_anchored.py -v
