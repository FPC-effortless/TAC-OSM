name: GRAPH010 learned source query causal numerical contracts
on:
  push:
    branches: [research/graph010-learned-source-query-2026-10-28, research/graph011-calibrated-query-external-2026-10-28]
  pull_request:
  workflow_dispatch:
jobs:
  causal-query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Graph009 original and Graph010 learned-source causal and gradient tests
        run: |
          set -euo pipefail
          python -m py_compile research/language/flow_500k/learned_context_query_v6.py research/language/flow_500k/source_query_hybrid_v6.py research/language/flow_500k/fit_learned_query_v6.py research/language/flow_500k/source_query_hybrid_v7.py
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m unittest discover -s research/language/flow_500k -p 'test_calibrated_retrieval_v5.py' -v
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m unittest discover -s research/language/flow_500k -p 'test_learned_query_v6.py' -v
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m unittest discover -s research/language/flow_500k -p 'test_query_hybrid_v6.py' -v
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m unittest discover -s research/language/flow_500k -p 'test_query_hybrid_v7.py' -v
