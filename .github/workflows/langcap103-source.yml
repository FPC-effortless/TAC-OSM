name: LANGCAP103 publisher corpus and FIT resource audit (ZERO UPDATES)
on:
  pull_request:
    paths:
      - 'research/langcap103/**'
      - 'research/phone_queue/langcap103-source-audit.json'
      - '.github/workflows/langcap103-source.yml'
permissions:
  contents: read
jobs:
  source-and-resource-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan zero-GPU source audit and falsify broken corpus handling
        run: |
          python scripts/phone_lab.py plan research/phone_queue/langcap103-source-audit.json
          python -m unittest discover -s research/langcap103 -p test_source.py -v
      - name: Acquire exact publisher release without executing its code
        uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: 60403a5409ff2c3f3b07dd2ca91a7a3e096839c7
          path: ci-input/cpython
          fetch-depth: 1
          persist-credentials: false
      - name: Verify original blobs, preserve notices, freeze raw-file groups and exact duplicate exclusions
        run: python research/langcap103/source.py --source-dir ci-input/cpython --out ci-artifacts/langcap103-source
      - name: Install same observed CPU PyTorch version for original-FIT shape profiling
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy cryptography
      - name: Profile six original-FIT forward/backward graphs without optimizer or DEV scoring
        run: |
          python research/langcap103/profile_source.py \
            --receipt ci-artifacts/langcap103-source/SOURCE_RECEIPT.json \
            --corpus ci-artifacts/langcap103-source/corpus.tar \
            --out ci-artifacts/langcap103-source/FIT_RESOURCE_PROFILE.json
      - name: Prepare source-bound registration drafts and require unsigned training to be rejected
        run: |
          python research/langcap103/prepare_registration.py \
            --receipt ci-artifacts/langcap103-source/SOURCE_RECEIPT.json \
            --corpus ci-artifacts/langcap103-source/corpus.tar \
            --resources ci-artifacts/langcap103-source/FIT_RESOURCE_PROFILE.json \
            --out ci-artifacts/langcap103-source/registration-review
      - name: Preserve publisher source and original zero-update measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGCAP103-publisher-corpus-and-zero-update-profile
          path: |
            ci-artifacts/langcap103-source/
            research/langcap103/SOURCE_PLAN.json
          retention-days: 90
