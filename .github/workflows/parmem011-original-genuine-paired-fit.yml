name: PAR-MEM-011 original real history-content paired full TAC fits and checkpoint replay
on:
  pull_request:
    paths:
      - '.github/workflows/parmem011-original-genuine-paired-fit.yml'
      - 'scripts/parmem011_genuine_source_train.py'
      - 'scripts/parmem011_real_train_operator_preflight.py'
      - 'research/parallel-six/PAR-MEM-011-PROTOCOL.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parmem011-original-real-trained-paired-history
  cancel-in-progress: false
jobs:
  source-original-five-seed-real-neural-training:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TRAIN_BRANCH: ${{ github.event.pull_request.head.ref }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch from published distribution
        run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fail closed on prior run and require source-native old checkpoint family
        run: |
          set -euo pipefail
          test -s research/parallel-six/PAR-MEM-011-PROTOCOL.json
          test ! -e research/parallel-six/PAR-MEM-011-FROZEN-PLAN.json
          test ! -e research/replay-bundles/PAR-MEM-011
          test -s research/replay-bundles/PAR-TIME-005/TRAIN_RECEIPT.json
          test "$(find research/replay-bundles/PAR-TIME-005 -maxdepth 1 -name 'seed-*-original-continuous.pt' | wc -l)" -eq 5
          python -m py_compile scripts/parmem011_genuine_source_train.py scripts/parmem011_real_train_operator_preflight.py
      - name: Restore SHA-pinned original real publisher Beijing PRSA ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/parmem011-real
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip > /tmp/parmem011-real/source.zip
          test "$(sha256sum /tmp/parmem011-real/source.zip | awk '{print $1}')" = d1b9261c54132f04c374f762f1e5e512af19f95c95fd6bfa1e8ac7e927e3b0b8
      - name: Freeze original site owner + physical event index + lag + actual training case order WITHOUT FIT
        env:
          PYTHONPATH: '.:src'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -m scripts.parmem011_genuine_source_train --mode plan \
            --source /tmp/parmem011-real/source.zip
      - name: Git commit source schedule before profiler optimizer or any experimental fit
        shell: bash
        run: |
          set -euo pipefail
          test "$TRAIN_BRANCH" = research/parmem011-real-historic-content-trained-2026-10-27
          test -s research/parallel-six/PAR-MEM-011-FROZEN-PLAN.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/parallel-six/PAR-MEM-011-FROZEN-PLAN.json
          git diff --cached --quiet && exit 1
          git commit -m 'research: preregister real owner clock 129-event source windows and all five optimizer sampling orders'
          git push origin "HEAD:refs/heads/$TRAIN_BRANCH"
      - name: Fail-closed actual full training ATen operator trace parity prior to learned comparisons
        env:
          PYTHONPATH: '.:src'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -m scripts.parmem011_real_train_operator_preflight \
            --source /tmp/parmem011-real/source.zip
      - name: Fit ten real neural checkpoint originals: five seeds, paired same-shape event queries
        env:
          PYTHONPATH: '.:src'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -m scripts.parmem011_genuine_source_train --mode fit \
            --source /tmp/parmem011-real/source.zip
      - name: Freeze 10 original full model + AdamW + RNG + publisher SHA checkpoint files BEFORE DEV metrics
        shell: bash
        run: |
          set -euo pipefail
          test -s research/replay-bundles/PAR-MEM-011/TRAIN_RECEIPT.json
          test ! -e research/replay-bundles/PAR-MEM-011/DEV_RESULTS.json
          test "$(find research/replay-bundles/PAR-MEM-011 -maxdepth 1 -name 'seed-*-original.pt' | wc -l)" -eq 10
          git add research/replay-bundles/PAR-MEM-011
          git diff --cached --quiet && exit 1
          git commit -m 'research: freeze original 10 genuine long-history source TAC trained models optimizer RNG'
          git push origin "HEAD:refs/heads/$TRAIN_BRANCH"
      - name: Only now score formerly exposed May-Jun 2014 DEV real historical lags
        env:
          PYTHONPATH: '.:src'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -m scripts.parmem011_genuine_source_train --mode eval \
            --source /tmp/parmem011-real/source.zip
      - name: Save original real measured historical content forecasts for all 10 trained models
        shell: bash
        run: |
          set -euo pipefail
          test -s research/replay-bundles/PAR-MEM-011/DEV_RESULTS.json
          test "$(find research/replay-bundles/PAR-MEM-011 -maxdepth 1 -name 'seed-*-original_DEV_tensors.pt' | wc -l)" -eq 10
          git add research/replay-bundles/PAR-MEM-011
          git diff --cached --quiet && exit 1
          git commit -m 'research: preserve first original real source 16-64-128 event results, successes and negatives'
          git push origin "HEAD:refs/heads/$TRAIN_BRANCH"
      - name: Independent clean-checkout original genuine source ten-model read-only replay
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "$TRAIN_BRANCH" \
            "https://github.com/$GITHUB_REPOSITORY.git" /tmp/parmem011-cold
          cd /tmp/parmem011-cold
          PYTHONPATH='.:src' python -m scripts.parmem011_genuine_source_train --mode replay \
            --source /tmp/parmem011-real/source.zip
      - name: Keep essential scientific negative-reporting bounds
        run: |
          echo 'Historical measurements authentic; 2014 DEV is ALREADY EXPOSED and not independent.'
          echo 'Wrong-address control still uses persistent memory. Not a memoryless comparator.'
          echo 'Complete nonlinear backward/optimizer FLOP model not certified from subset profiler.'
          echo 'No held-out 2015-2017 physical numerics, no source action intervention, no GPU.'
          echo 'No architecture superiority or source-specific retention conclusion from training alone.'
