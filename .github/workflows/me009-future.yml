name: ME009F first real later-week reliability-gate test
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/me009_future.py'
      - '.github/workflows/me009-future.yml'
      - 'research/mathematical-engineering/me009/PROTOCOL.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: me009f-original-march30-april6-first-exposure
  cancel-in-progress: true
jobs:
  once-frozen-future:
    # First genuine exposure succeeded on original source SHA below.
    # Further PR notes must not rescore April 2020 period again.
    if: github.event.pull_request.head.sha == '71ffa66af9dbf42c4138513ffb85088b420f65a2'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed source-scoring CPU environment
        run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Software compile before any future target access
        run: python -m py_compile scripts/me009_future.py
      - uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39382850579
          name: me008-original-native1000
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39382074165
          name: me007-original-gru41-controls
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39384177806
          name: me009-original-real-reliability
          github-token: ${{ github.token }}
          path: .
      - name: Score all 3 frozen gate seeds on genuine March30-April6 observations
        run: |
          python -m scripts.me009_future | tee me009f-original.log
          python - <<'PY'
          import json
          d=json.load(open('results/me009f/results.json'))
          assert d['study']=='ME009F_FIRST_FROZEN_REAL_RELIABILITY_TEST'
          assert d['period_start']=='2020-03-30' and d['period_end_exclusive']=='2020-04-06'
          assert d['test_optimizer_updates']==0
          assert not d['source_after_end_read'] and not d['model_promoted']
          assert len(d['fits'])==13
          assert d['cohort']['future_week_examples']>=500
          assert {x['model'] for x in d['fits']}=={
             'persistence','native_tac1000','fixed_half_tac',
             'learned_reliability_tac','gru41_1000'}
          PY
      - name: Preserve original outcomes including any negative result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me009f-original-reliability-future
          path: |
            results/me009f/results.json
            me009f-original.log
          if-no-files-found: ignore
          retention-days: 90
