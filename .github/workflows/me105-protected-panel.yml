name: ME105 original protected model panel replay (no training)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/me105*'
      - 'src/tac_osm/variants/protected_sensor_world.py'
      - 'tests/test_protected_sensor_world.py'
      - 'tests/test_me105*'
      - 'research/mathematical-engineering/me105/**'
      - 'research/replay-bundles/ME105/**'
      - '.github/workflows/me105-protected-panel.yml'
permissions:
  contents: read
jobs:
  original-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pytest
      - run: python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me105/FAIR_COMPARISON.json --phase preflight
      - run: PYTHONPATH=src:. python -m pytest tests/test_protected_sensor_world.py tests/test_me105_protected_panel.py -q
      - run: |
          set -e
          if test -f research/replay-bundles/ME105/RESULTS.json; then
            python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me105/POSTFIT.json --phase final
            PYTHONPATH=src:. python scripts/me105_protected_panel.py replay
            PYTHONPATH=src:. python scripts/me105_fitted_graph_audit.py replay
            PYTHONPATH=src:. python scripts/me105_panel_summary.py
          else
            echo 'ME105_ORIGINAL_PANEL_REPLAY=BLOCKED not trained/scored yet'
          fi
