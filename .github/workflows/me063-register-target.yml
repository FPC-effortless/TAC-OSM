name: ME063 unopened real target metadata preregistration
on:
  pull_request:
    paths:
      - 'scripts/me063_register_target_metadata.py'
      - '.github/workflows/me063-register-target.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read official metadata, never target trajectories
        run: |
          PYTHONPATH=src:. python scripts/me063_register_target_metadata.py --source-cache "${{ runner.temp }}/me063-metadata"
      - name: Preserve frozen unseen physical task declaration in Git
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/mathematical-engineering/me063/TRANSFER_PROTOCOL.json'))
          assert x['target_trajectory_files_opened']==0 and not x['target_outcome_data_opened']
          assert x['training_updates']==0 and len(x['cohort'])>=40
          print('ME063_FROZEN_UNSEEN_TARGET_METADATA',x['task'],len(x['cohort']))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/mathematical-engineering/me063/TRANSFER_PROTOCOL.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(me063): freeze authentic untouched target metadata before outcomes'
            git fetch origin "$PUSH_BRANCH"
            git rebase "origin/$PUSH_BRANCH"
            git push origin "HEAD:refs/heads/$PUSH_BRANCH"
          fi
