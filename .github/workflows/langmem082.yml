name: LANGMEM082 actual compressed slow value recoverability
on:
  pull_request:
    paths:
      - 'scripts/langmem082*'
      - 'tests/test_langmem082.py'
      - 'research/mathematical-engineering/langmem082/**'
      - 'research/phone_queue/langmem082.json'
      - '.github/workflows/langmem082.yml'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.head_ref == 'research/langmem082-compressed-value-recoverability-2026-10-29'
    strategy:
      fail-fast: false
      matrix:
        seed: [1701,1702,1703]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned original CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Registered nofit compute and engineering gates
        run: |
          mkdir -p recover082-evidence
          PYTHONPATH=src:. python scripts/phone_lab.py plan research/phone_queue/langmem082.json > recover082-evidence/PLAN.json
          PYTHONPATH=src:. python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langmem082/FAIR_COMPARISON.json --phase preflight > recover082-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langmem082.py tests/test_langmem081.py tests/test_research_probe_agnostic.py
      - name: Pinned PNDS partial operator numerical parity
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/FPC-effortless/pnds-lean/a87501db300d43a4eef63d170ba1e6f5b472d5bf/foundation/v1/langmem082_compressed.py --output /tmp/langmem082_compressed.py
          PYTHONPATH=src:. python scripts/langmem082_math_parity.py --reference /tmp/langmem082_compressed.py > recover082-evidence/PNDS_OPERATOR_PARITY.json
      - name: Original trained checkpoints and source receipts read only
        run: |
          mkdir -p original-dual-ckpt original078-verified
          gh run download 40890642312 -R FPC-effortless/TAC-OSM --name "LANGMEM078-FIT-dual-seed${{ matrix.seed }}" --dir original-dual-ckpt
          gh run download 40890642312 -R FPC-effortless/TAC-OSM --name LANGMEM078-SOURCE-PAIRED-AGGREGATE --dir original078-verified
      - name: Actual original slow8x8 source readout and packed rings
        run: |
          PYTHONPATH=src:. python scripts/langmem082_recover.py --seed ${{ matrix.seed }} --checkpoint-dir original-dual-ckpt --original-aggregate original078-verified/RESULTS.json --output recover082-evidence/RECOVER_RESULTS.json
      - name: Preserve all positive negative and unknown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGMEM082-RECOVER-seed${{ matrix.seed }}
          path: recover082-evidence/
          retention-days: 90
  aggregate:
    needs: recover
    if: always() && github.head_ref == 'research/langmem082-compressed-value-recoverability-2026-10-29'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Strict original-source three-seed aggregate
        run: |
          gh run download "${{ github.run_id }}" -R FPC-effortless/TAC-OSM --pattern 'LANGMEM082-RECOVER-seed*' --dir recover-raw
          python scripts/langmem082_aggregate.py --results recover-raw --output recover-aggregate/RESULTS.json
          python - <<'PY'
          import json,os
          r=json.load(open('recover-aggregate/RESULTS.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              print('# LANGMEM082: internally measured, not independently qualified',file=f)
              print('Frozen original checkpoints; evaluator old keys are external; no trained decoding head.',file=f)
              print('| Age | Matrix recall | Wrong address | Permuted content | Isolated event ceiling | 256B ring coverage |',file=f)
              print('|---|---|---|---|---|---|',file=f)
              for age,m in r['history_metrics'].items():
                  vals=[m[k] for k in ('matrix_correct','wrong_address_correct','permuted_content_correct','isolated_event_correct','ring256_available')]
                  print('| '+age+' | '+' | '.join(f'{100*x:.2f}%' for x in vals)+' |',file=f)
              print('Native next-byte NLL: '+str(r['future_metrics']['full_nll']),file=f)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANGMEM082-SOURCE-VERIFIED-AGGREGATE
          path: recover-aggregate/
          retention-days: 90
