name: S1MOTION006 genuine coffee matched trial preflight NO TRAIN
on:
  push:
    branches: [research/s1motion006-velocity-event-ablation-2026-10-26]
    paths:
      - 'scripts/s1motion006_real_coffee_fit.py'
      - 'tests/test_s1motion006_real_coffee_prefit.py'
      - '.github/workflows/s1motion006-prefit.yml'
  pull_request:
    paths: ['scripts/s1motion006_real_coffee_fit.py','tests/test_s1motion006_real_coffee_prefit.py']
permissions:
  contents: read
jobs:
  no-real-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m py_compile scripts/s1motion006_real_coffee_fit.py
          PYTHONPATH=src:. python -m unittest tests.test_s1motion006_real_coffee_prefit -v
          PYTHONPATH=src:. python -m unittest tests.test_s1motion006_velocity_feature -v
