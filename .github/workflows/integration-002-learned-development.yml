name: Integration-002 trained address / bounded-cache DEV (NOT confirmatory)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/tac_osm/integration_002_learned_dev.py"
      - "tests/test_integration_002_learned_dev.py"
      - "scripts/diagnose_integration_002_learned_dev.py"
      - "src/tac_osm/integration_002_benchmark.py"
      - ".github/workflows/integration-002-learned-development.yml"

permissions:
  contents: read

jobs:
  development:
    name: Nonconfirmatory learned addressing + cache interference
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU research dependencies
        run: |
          python -m pip install --quiet -e . 'pytest>=8.0' torch
      - name: Verify learned address and cache controls
        run: python -m pytest tests/test_integration_002_learned_dev.py -q
      - name: Run fixed development pilot (not confirmatory)
        run: python scripts/diagnose_integration_002_learned_dev.py
      - name: Preserve research pilot raw cells
        uses: actions/upload-artifact@v4
        with:
          name: INTEGRATION-002-TRAINED-DEV-NOT-CONFIRMATORY
          path: artifacts/INTEGRATION-002-DEV-TRAINED-ADDRESS-001.json
          if-no-files-found: error
