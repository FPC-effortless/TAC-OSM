name: Authentic byte corpus - source and carry boundary audit
on:
  pull_request:
    paths:
      - 'src/tac_osm/causal_byte_corpus.py'
      - 'scripts/audit_causal_byte_corpus.py'
      - 'tests/test_causal_byte_corpus.py'
      - 'research/causal_byte_corpus_20261114/**'
      - 'research/source-bundles/LANGUAGE-SOURCE023/**'
      - '.github/workflows/causal-byte-corpus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      OMP_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen no-fit CPU plan and software falsifiers
        run: |
          mkdir -p corpus-evidence
          python -B scripts/phone_lab.py plan research/phone_queue/causal_byte_corpus_20261114.json > corpus-evidence/CPU_PLAN.json
          cmp corpus-evidence/CPU_PLAN.json research/causal_byte_corpus_20261114/COMPUTE_DECISION.json
          python -m pytest -q tests/test_causal_byte_corpus.py tests/test_research_probe_agnostic.py --junitxml=corpus-evidence/TESTS.xml
      - name: Check permanent original source receipts without model execution
        run: python -B research/causal_byte_corpus_20261114/verify_saved_evidence.py
      - name: Original Git-owned human-authored bytes, no model call or acquisition
        run: |
          python -B scripts/audit_causal_byte_corpus.py --output corpus-evidence/audit
          cmp corpus-evidence/audit/RESULTS.json research/causal_byte_corpus_20261114/LOCAL_RESULTS.json
          git diff --exit-code -- research/source-bundles/LANGUAGE-SOURCE023 src/tac_osm/csl125*.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CAUSAL-BYTE-CORPUS-20261114
          path: corpus-evidence/
          retention-days: 90
