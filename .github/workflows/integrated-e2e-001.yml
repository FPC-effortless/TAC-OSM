name: Legacy invalidated PLM integrated multimodal E2E-001

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  audit-only:
    name: E2E-001 invalidation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assert predecessor remains invalidated
        run: |
          grep -q "Status: INVALIDATED" docs/AUDIT-TACOSM-PLM-INTEGRATED-E2E-001.md
          grep -q "query-entity" docs/AUDIT-TACOSM-PLM-INTEGRATED-E2E-001.md
          grep -q "corrected successor" docs/AUDIT-TACOSM-PLM-INTEGRATED-E2E-001.md
          echo "E2E-001 remains provenance-only; no predecessor measurement is executed."
