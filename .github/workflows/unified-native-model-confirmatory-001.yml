name: Unified native model multimodal confirmatory run 001

on:
  push:
    paths:
      - research/CONFIRM_UNIFIED_MULTIMODAL_001
  workflow_dispatch:

concurrency:
  group: unified-native-model-confirmatory-001-${{ github.ref }}
  cancel-in-progress: false

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install preflight dependencies
        run: python -m pip install --quiet pytest numpy
      - name: Repository tests
        run: python -m pytest tests/ -q
      - name: Contract and leakage preflight
        run: python scripts/validate_unified_multimodal_001.py
      - name: Install numerical research dependencies
        run: python -m pip install --quiet numpy torch
      - name: Run registered multimodal measurement
        run: python scripts/run_unified_multimodal_001.py --confirmatory
      - name: Upload machine-readable result
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-UNIFIED-MULTIMODAL-001
          path: artifacts/TACOSM-UNIFIED-MULTIMODAL-001.json
