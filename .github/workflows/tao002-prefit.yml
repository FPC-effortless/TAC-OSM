name: TAO002 original-source no-fit preflight

on:
  push:
    branches:
      - 'research/tao002-*'
    paths:
      - 'scripts/tao002_prefit.py'
      - 'tests/test_tao002_prefit.py'
      - 'src/tac_osm/optimizer_tao.py'
      - 'tests/test_optimizer_tao.py'
      - 'research/mathematical-engineering/tao002/**'
      - '.github/workflows/tao002-prefit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tao002-prefit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-prefit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install small research preflight dependencies
        run: |
          python -m pip install --quiet numpy==2.3.3 torch pytest
      - name: Test optimizer and no-fit source preflight
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python -m pytest -q tests/test_optimizer_tao.py tests/test_tao002_prefit.py
      - name: Verify and print immutable original source/sample receipt
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python scripts/tao002_prefit.py --output /tmp/TAO002_PREFIT.json
      - uses: actions/upload-artifact@v4
        with:
          name: tao002-prefit-${{ github.sha }}
          path: /tmp/TAO002_PREFIT.json
          if-no-files-found: error
          retention-days: 14
