name: Research Torch E2E gate

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/tac_osm/integrated_e2e.py"
      - "scripts/run_integrated_e2e_001.py"
      - "tests/test_integrated_e2e.py"
      - "tests/test_integrated_e2e_contract.py"
      - "contracts/TACOSM-PLM-INTEGRATED-E2E-001.json"
      - "docs/TACOSM-PLM-INTEGRATED-E2E-001.md"
      - "docs/AUDIT-TACOSM-PLM-INTEGRATED-E2E-001.md"
      - ".github/workflows/integrated-e2e-001.yml"

permissions:
  contents: read

jobs:
  torch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package, test dependencies and CPU PyTorch
        run: |
          python -m pip install --quiet -e . pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Integrated E2E tests
        run: python -m pytest tests/test_integrated_e2e.py tests/test_integrated_e2e_contract.py -q
