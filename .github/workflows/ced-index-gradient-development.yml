name: CED first-index gradient DEV-009 (NOT confirmatory)
on:
  pull_request:
    paths:
      - "src/tac_osm/development/ced_hardened_router.py"
      - "scripts/run_ced_index_gradient_dev.py"
      - "scripts/validate_ced_index_gradient_dev.py"
      - "tests/test_ced_index_gradient_development.py"
      - ".github/workflows/ced-index-gradient-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-index-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax and lint
        run: |
          python -m py_compile src/tac_osm/development/ced_hardened_router.py scripts/run_ced_index_gradient_dev.py scripts/validate_ced_index_gradient_dev.py tests/test_ced_index_gradient_development.py
          ruff check --select F src/tac_osm/development/ced_hardened_router.py scripts/run_ced_index_gradient_dev.py scripts/validate_ced_index_gradient_dev.py tests/test_ced_index_gradient_development.py
      - name: Index gradient and legacy integration tests
        run: python -m pytest tests/test_ced_hardened_development.py tests/test_ced_index_gradient_development.py -q
      - name: Test count integrity gate
        run: python scripts/sync_test_count.py --check
      - name: DEV-009 smoke and checkpoint replay
        run: |
          python scripts/run_ced_index_gradient_dev.py --smoke --output artifacts/DEV-009-SMOKE
          python scripts/validate_ced_index_gradient_dev.py artifacts/DEV-009-SMOKE
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-009-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-009-SMOKE/
          if-no-files-found: warn

  three-seed-development:
    needs: first-index-mechanism
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Three paired-seed development run
        run: |
          python scripts/run_ced_index_gradient_dev.py --output artifacts/DEV-009
          python scripts/validate_ced_index_gradient_dev.py artifacts/DEV-009
      - name: Preserve six checkpoints and complete raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-009-RAW-NOT-CONFIRMATORY
          path: artifacts/DEV-009/
          if-no-files-found: error
