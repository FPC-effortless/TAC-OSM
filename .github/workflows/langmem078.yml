name: LANGMEM078 dual-native slow lane source-verified 3-seed genuine CPU training
on:
  pull_request:
    paths:
      - 'research/mathematical-engineering/langmem078/**'
      - 'research/phone_queue/langmem078.json'
      - 'scripts/langmem078_cpu_fit.py'
      - 'scripts/langmem078_aggregate.py'
      - 'tests/test_langmem078.py'
      - 'scripts/validate_research_parity.py'
      - '.github/workflows/langmem078.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-publisher-dual-fit:
    if: github.head_ref == 'research/langmem078-dual-timescale-native-2026-10-29'
    strategy:
      fail-fast: false
      matrix:
        seed: [1701,1702,1703]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin original CPU Torch, numpy and pytest
        run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen source, original learned-weight/dual-lane parity, planner
        run: |
          mkdir -p dual078-evidence
          PYTHONPATH=src:. python scripts/phone_lab.py plan research/phone_queue/langmem078.json > dual078-evidence/PLAN.json
          PYTHONPATH=src:. python scripts/validate_research_parity.py \
            --manifest research/mathematical-engineering/langmem078/FAIR_COMPARISON.json --phase preflight \
            > dual078-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langmem078.py
      - name: Run original licensed-source fixed 160 updates, checkpoint+optimizer/RNG/cold replay
        run: |
          PYTHONPATH=src:. python scripts/langmem078_cpu_fit.py \
            --arm dual --seed ${{ matrix.seed }} --steps 160 \
            --out dual078-evidence/TRAINED
          python - <<'PY'
          import json,glob,hashlib,pathlib
          p=pathlib.Path('dual078-evidence/TRAINED/FIT_AND_EXPOSED_DEV_RECEIPT.json')
          r=json.loads(p.read_text())
          assert r['study']=='LANGMEM078' and r['arm']=='dual'
          assert r['parameters']=={'trainable':499627,'deployed':499627}
          assert r['updates']==160 and r['target_bytes_seen']==163840
          assert r['original_fast_native_state_unchanged'] is True
          assert r['new_active_learned_scalars']==4 and r['slow_extra_FP32_persistent_bytes_per_owner']==256
          assert r['checkpoint_reloaded_identical_scored_DEV'] is True
          assert r['GPU_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          ck=p.parent/r['checkpoint_filename']
          assert hashlib.sha256(ck.read_bytes()).hexdigest()==r['checkpoint_sha256']
          PY
      - name: Archive original source outcomes even if failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGMEM078-FIT-dual-seed${{ matrix.seed }}
          path: dual078-evidence/
          retention-days: 90
          if-no-files-found: warn

  verified-original-source-aggregate:
    needs: original-publisher-dual-fit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download all three new actual models and previous original 070 verified source reference
        run: |
          mkdir -p dual-raw old070-source dual-aggregate
          gh run download "${{ github.run_id }}" -R FPC-effortless/TAC-OSM \
            --pattern 'LANGMEM078-FIT-dual-seed*' --dir dual-raw
          gh run download 40871491842 -R FPC-effortless/TAC-OSM \
            --name LANGSCALE070-SOURCE-VERIFIED-SCALING-SUMMARY --dir old070-source
      - name: Require three original checkpoint SHA and per-seed original FIT/DEV source hashes
        run: |
          PYTHONPATH=src:. python scripts/langmem078_aggregate.py \
            --results dual-raw --reference old070-source/RESULTS.json \
            --output dual-aggregate/RESULTS.json
          python - <<'PY'
          import json,os
          r=json.load(open('dual-aggregate/RESULTS.json'))
          assert r['new_original_checkpoint_count']==3
          assert r['source_reference_checkpoint_count']==3 and r['source_paired']
          assert r['parameter_parity_within_one_percent'] and r['gpu_minutes']==0
          assert r['protected_TEST']=='NOT_ACCESSED' and r['training_FLOP_parity']=='NOT_MATCHED'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              print('# LANGMEM078 — four-scalar slow native lane at 500K',file=f)
              print('Original publisher real FIT labels, already exposed DEV; no full streaming or independent qualification. Original fast/upper/FFN unchanged.',file=f)
              print('| Architecture | Parameters | Mean DEV NLL | Top1 | CPU training seconds |',file=f)
              print('|---|---:|---:|---:|---:|',file=f)
              for key in ('original_fast','dual_fast_slow'):
                  row=r['metrics'][key]
                  print(f"| {key} | {row['learned_parameters']} | {row['mean_nll']:.6f} | {row['mean_top1']:.2%} | {row['mean_cpu_process_seconds']:.2f} |",file=f)
              print(f"Paired ΔNLL dual minus original: {r['paired_dual_minus_original_nll']}; wins {r['new_better_seed_count']}/3",file=f)
              print('Training FLOPs NOT matched, no protected TEST/GPU/Kaggle, no model promotion. Long-history carried state still OPEN.',file=f)
          PY
      - name: Preserve all verified results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGMEM078-SOURCE-PAIRED-AGGREGATE
          path: dual-aggregate/
          retention-days: 90
          if-no-files-found: warn
