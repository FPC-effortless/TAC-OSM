name: Integration-001 development falsification (NOT confirmatory)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/tac_osm/integration_001_*"
      - "tests/test_integration_001_*"
      - "scripts/diagnose_plm_integration_001_shortcuts.py"
      - ".github/workflows/integration-001-development.yml"

permissions:
  contents: read

jobs:
  negative-control:
    name: Exact-key shortcut and operation-count audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --quiet -e . pytest>=8.0
      - name: Run strict causal diagnostic tests
        run: python -m pytest tests/test_integration_001_diagnostic.py -q
      - name: Measure development negative controls
        run: python scripts/diagnose_plm_integration_001_shortcuts.py
      - name: Upload development-only diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: INTEGRATION-001-DEV-NOT-CONFIRMATORY
          path: artifacts/TACOSM-PLM-INTEGRATION-001-DEV-EXACT-LOOKUP-NEGATIVE-CONTROL.json
          if-no-files-found: error
