name: S1MOTION006 causal velocity-feature matched-head contract
on:
  push:
    branches: [research/s1motion006-velocity-event-ablation-2026-10-26]
    paths:
      - 'src/tac_osm/variants/s1motion006_velocity_feature.py'
      - 'tests/test_s1motion006_velocity_feature.py'
      - '.github/workflows/s1motion006-contract.yml'
  pull_request:
    paths: ['src/tac_osm/variants/s1motion006_velocity_feature.py','tests/test_s1motion006_velocity_feature.py']
permissions:
  contents: read
jobs:
  math-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          PYTHONPATH=src:. python -m unittest tests.test_s1motion006_velocity_feature -v
          PYTHONPATH=src:. python -m unittest tests.test_research_system1_adapter -v
