name: SEQ007 intermediate-state teacher ablation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/run_seq_transfer_007.py'
      - 'tests/test_seq_transfer_007.py'
      - '.github/workflows/seq007-teacher-ablation.yml'
permissions:
  contents: read
concurrency:
  group: seq007-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify-objective-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/run_seq_transfer_006.py
            scripts/run_seq_transfer_007.py
            tests/test_seq_transfer_007.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch and numpy
        run: |
          python -m pip install numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Exact source and loss smoke
        run: |
          python -m unittest discover -s tests -p test_seq_transfer_007.py -v
          python scripts/run_seq_transfer_007.py --stage smoke --output results/seq007
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq007-objective-smoke
          path: results/seq007/smoke.json
          if-no-files-found: ignore
  fit-fixed-validation-pilots:
    needs: verify-objective-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/run_seq_transfer_006.py
            scripts/run_seq_transfer_007.py
            research/seq-transfer-007/PROTOCOL.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Train 12 paired validation-only pilots
        run: |
          python scripts/run_seq_transfer_007.py --stage pilot --output results/seq007
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('results/seq007')
          result=json.loads((root/'pilot.json').read_text())
          assert result['test_opened'] is False
          assert result['test_evaluations']==0
          assert len(result['fits'])==12
          assert all(x['updates']==400 and x.get('sha256') for x in result['fits'])
          assert len(list((root/'checkpoints').glob('*.pt')))==12
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq007-original-teacher-ablation-pilots
          path: |
            results/seq007/pilot.json
            results/seq007/checkpoints/*.pt
          if-no-files-found: ignore
