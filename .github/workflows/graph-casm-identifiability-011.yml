name: Research graph CASM public-support identifiability 011

on:
  push:
    branches:
      - research/graph-casm-identifiability-011
    paths:
      - contracts/TACOSM-GRAPH-CASM-IDENTIFIABILITY-011.json
      - docs/TACOSM-GRAPH-CASM-IDENTIFIABILITY-011.md
      - scripts/run_graph_casm_identifiability_011.py
      - tests/test_graph_casm_identifiability_011.py
      - scripts/run_graph_casm_selective_010.py
      - .github/workflows/graph-casm-identifiability-011.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: G-CASM-011 smoke/preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/cdl-attention-experiment
          ref: c31554413301e3c9d3e6b3f8c8c6be572a74a748
          path: third_party/cdl-attention-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -e . pytest torch
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: Experiment tests
        run: python -m pytest tests/test_graph_casm_identifiability_011.py -q
      - name: Smoke measurement
        run: python scripts/run_graph_casm_identifiability_011.py --smoke
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-GRAPH-CASM-IDENTIFIABILITY-011-smoke
          path: artifacts/TACOSM-GRAPH-CASM-IDENTIFIABILITY-011.json
          if-no-files-found: ignore

  full:
    name: G-CASM-011 full measurement
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-graph-casm-identifiability-011-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/cdl-attention-experiment
          ref: c31554413301e3c9d3e6b3f8c8c6be572a74a748
          path: third_party/cdl-attention-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -e . pytest torch
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: Experiment tests
        run: python -m pytest tests/test_graph_casm_identifiability_011.py -q
      - name: Full measurement
        run: python scripts/run_graph_casm_identifiability_011.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-GRAPH-CASM-IDENTIFIABILITY-011
          path: artifacts/TACOSM-GRAPH-CASM-IDENTIFIABILITY-011.json
          if-no-files-found: error
