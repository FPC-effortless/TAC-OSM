name: TAC-OSM research anticheat gates

on:
  pull_request:
    branches: [main, master]
    paths:
      - "src/tac_osm/research_anticheat.py"
      - "src/tac_osm/robot_anticheat.py"
      - "src/tac_osm/real_robot_transition_contract.py"
      - "scripts/run_robot_anticheat.py"
      - "tests/test_research_anticheat.py"
      - "tests/test_robot_anticheat.py"
      - "research/ANTICHEAT-DIAGNOSTICS-PROTOCOL-2026-10-26.md"
      - ".github/workflows/research-anticheat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-hidden-paths:
    name: no-fit negative controls and real-robot causal-cut integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install no-fit test dependencies
        run: python -m pip install --quiet 'pytest>=8' 'torch'
      - name: Reject known answer side-channels and dead paths
        run: python -m pytest -q tests/test_research_anticheat.py tests/test_robot_anticheat.py
      - name: Audit actual real-robot input constructor with diagnostic fixtures
        run: python scripts/run_robot_anticheat.py --fixture
      - name: Never promote fixture or unverified source to scientific evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("research/ANTICHEAT-DIAGNOSTICS-PROTOCOL-2026-10-26.md").read_text()
          assert "constructed records ONLY" in text
          assert "Every uninstrumented boundary must remain UNKNOWN/INCONCLUSIVE" in text
          PY
