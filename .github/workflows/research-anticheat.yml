name: TAC-OSM research anticheat gates

# These are independent mandatory no-fit CI checks for every PR and
# every mainline push, including changes outside the anti-cheat package.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-hidden-paths:
    name: no-fit negative controls and real-robot causal-cut integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install no-fit test dependencies
        run: python -m pip install --quiet 'pytest>=8' 'numpy==2.3.3' 'torch' 'cryptography'
      - name: Reject known answer side-channels and dead paths
        run: |
          mkdir -p ci-artifacts
          python -m pytest -q tests/test_research_anticheat.py tests/test_robot_anticheat.py \
            tests/test_research_reward_integrity.py tests/test_run_reward_integrity.py \
            tests/test_reward_runner_integration.py tests/test_real_robot_reward_readiness.py \
            --junitxml=ci-artifacts/anticheat-tests.xml
      - name: Exercise physical input-contract poison probes with fixture-only evidence
        run: |
          python scripts/run_robot_anticheat.py --fixture \
            --output ci-artifacts/anticheat-fixture.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("ci-artifacts/anticheat-fixture.json").read_text())
          assert report["status"] == "PASS"
          assert report["source_provenance"] == "constructed_fixture_not_capability"
          PY
      - name: Falsify proxy reward hacks under a constructed independent goal control
        run: |
          python scripts/run_reward_integrity.py --fixture \
            --output ci-artifacts/reward-hacking-negative-control.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('ci-artifacts/reward-hacking-negative-control.json').read_text())
          assert r['hacked_case_status'] == 'FAIL'
          assert r['honest_improvement_status'] == 'PASS'
          assert r['reward_promotion_status'] == 'FAIL'
          assert r['qualification'] == 'constructed_fixture_not_real_world_reward_hacking_evidence'
          assert 'goal_recomputation' in r['missing_live_checks']
          PY
      - name: Prevent promotion of fixture results to capability evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("research/ANTICHEAT-DIAGNOSTICS-PROTOCOL-2026-10-26.md").read_text()
          assert "constructed records ONLY" in text
          assert "Every uninstrumented boundary must remain UNKNOWN/INCONCLUSIVE" in text
          PY
      - name: Index existing CI evidence without changing test execution
        run: |
          python scripts/lab.py record \
            --run-id "ci-${{ github.run_id }}-anticheat" \
            --experiment ANTICHEAT-CI --variant Robot-input-contract \
            --stage fixture --evidence constructed_fixture \
            --source ci-artifacts/anticheat-fixture.json \
            --out ci-artifacts/lab
          python scripts/lab.py report --runs ci-artifacts/lab \
            --output ci-artifacts/lab/dashboard.html
      - name: Publish downloadable diagnostic and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anticheat-no-fit-ci
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
