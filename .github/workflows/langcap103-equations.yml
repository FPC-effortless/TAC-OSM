name: LANGCAP103 actual-source equation and architecture probes (ZERO UPDATES)
on:
  pull_request:
    paths:
      - 'research/langcap103/**'
      - 'research/phone_queue/langcap103-equations.json'
      - '.github/workflows/langcap103-equations.yml'
permissions:
  contents: read
jobs:
  original-source-equation-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan bounded zero-GPU source-equation verification
        run: python scripts/phone_lab.py plan research/phone_queue/langcap103-equations.json
      - name: Verify independent PNDS source/equation byte identity
        run: python research/langcap103/verify_math_pins.py
      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: 60403a5409ff2c3f3b07dd2ca91a7a3e096839c7
          path: ci-input/cpython
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact publisher FIT inputs without scoring DEV
        run: python research/langcap103/source.py --source-dir ci-input/cpython --out ci-artifacts/langcap103-equations/source
      - name: Install observed CPU inspection runtime
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Verify cross-model probe infrastructure
        run: python -m pytest -q tests/test_research_probe_agnostic.py
      - name: Compare full forward/state/parameter gradients and actual-model state boundaries
        run: |
          python research/langcap103/verify_graphs.py \
            --receipt ci-artifacts/langcap103-equations/source/SOURCE_RECEIPT.json \
            --corpus ci-artifacts/langcap103-equations/source/corpus.tar \
            --out ci-artifacts/langcap103-equations/GRAPH_VERIFICATION.json
      - name: Preserve original numerical checks, falsifiers and unresolved dimensions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGCAP103-equation-and-actual-source-probes
          path: |
            ci-artifacts/langcap103-equations/GRAPH_VERIFICATION.json
            research/langcap103/PNDS_PIN.json
            research/langcap103/MATH_SOURCE_MAP.json
          retention-days: 90
