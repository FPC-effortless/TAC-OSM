name: DEV-039 prediction-head integrity only
on:
  pull_request:
    types: [opened]
    paths:
      - 'research/dev039/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          ruff check --select F scripts/*dev039.py tests/*dev039.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
# Full training requires the archived frozen DEV-036 checkpoint and runs separately.
