name: DEV-052B end-to-end learned belief (manual development)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-matrix-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/veritas
          ref: b21d829b62d3cab2811e746267ca305e110ed004
          path: .veritas-public-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU research dependencies
        run: |
          python -m pip install -e . -e .veritas-public-runtime pytest==9.1.1 numpy==2.3.5 ruff==0.17.1 pydantic==2.13.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Integrity and regression gates
        run: |
          ruff check --select F src/tac_osm/development/learned_belief_world.py scripts/*belief*dev052b.py tests/test_learned_belief_dev052b.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Complete registered five-seed matrix
        run: python scripts/run_learned_belief_dev052b.py --veritas-root .veritas-public-runtime --output results/dev052b
      - name: Separate deterministic training and native primitive replay audit
        run: python scripts/audit_learned_belief_dev052b.py results/dev052b --veritas-root .veritas-public-runtime
      - name: Demonstrate loaded checkpoint end to end
        run: python scripts/demo_learned_belief_dev052b.py --evidence results/dev052b --veritas-root .veritas-public-runtime --shifted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV052B-complete-development-evidence
          path: results/dev052b/
          if-no-files-found: warn
