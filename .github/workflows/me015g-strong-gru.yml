name: ME015G first frozen real never-trained users vs strongest original GRU
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/me015g_strong_gru_future.py
      - research/mathematical-engineering/me015/ME015G_STRONGEST_GRU_UNSEEN_USERS_PROTOCOL.md
      - .github/workflows/me015g-strong-gru.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: me015g-first-untrained-user2-strongest-gru
  cancel-in-progress: true
jobs:
  once-frozen-genuine-new-users:
    # Original user-2 source first opened in successful run 39400617213 at the SHA below.
    # Later notes must never re-score this source as untouched.
    if: github.event.pull_request.head.sha == '33e9082367f3e32c94d38d804a040ce9f952e4af'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original exact CPU numerical environment
        run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile mathematical models and new-cohort evaluator before label exposure
        run: |
          python -m py_compile scripts/me015_native_optimization.py scripts/me015g_strong_gru_future.py
          python -m scripts.me015_native_optimization --self-test
      - name: Original 15 exact-capacity engineered TAC/GRU weights
        uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39398038257
          name: me015-authentic-native-bottleneck-diagnosis
          github-token: ${{ github.token }}
          path: .
      - name: Original six exact-capacity ME014B unanchored GRU/TAC controls
        uses: actions/download-artifact@v4
        with:
          repository: FPC-effortless/TAC-OSM
          run-id: 39394500641
          name: me014b-exact-real-original
          github-token: ${{ github.token }}
          path: .
      - name: First genuinely untrained user2 response scores against ALL original and anchored GRUs
        run: |
          python -m scripts.me015g_strong_gru_future | tee me015g-original.log
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('results/me015g/strongest_gru_new_user_results.json').read_text())
          assert d['study']=='ME015G_FIRST_FROZEN_STRONGEST_GRU_USER2'
          assert d['source_sha256']=='c23f211cf109c7a060a25a4afe9e8c681b1ccbbc816cca921d87ad37dd11c70c'
          assert d['user_group_never_fitted_by_models']==2
          assert d['original_training_user_group']==0
          assert d['future_period']==['2020-08-14','2020-09-06']
          assert d['all_21_original_checkpoint_hashes_verified_before_user2']
          assert d['source']['opened_after_all_frozen_checkpoint_hashes']
          assert d['source']['parsed_no_outcomes_on_or_after_sep6']
          assert d['new_actual_logged_reactions']>=500
          assert d['optimizer_steps_on_test']==0 and not d['model_promoted']
          assert len(d['models'])==12
          assert all(v['trainable']==135050 for v in d['models'])
          assert {(x['arm'],x['seed']) for x in d['models']}=={
            (a,s) for a in ('native_original','native_chrono_anchor',
            'gru_anchor','gru_original_unanchored') for s in (14001,14002,14003)}
          assert not d['causal_action_value_estimated']
          PY
      - name: Preserve original strong-baseline result even if TAC loses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me015g-first-original-strong-gru-disjoint-users
          path: |
            results/me015g/strongest_gru_new_user_results.json
            me015g-original.log
          retention-days: 90
          if-no-files-found: ignore
