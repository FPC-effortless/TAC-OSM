name: DEV-022 isolated runtime recovery and complete audit
on:
  pull_request:
    paths:
      - ".github/workflows/dev022-runtime-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bounded install of the same pinned CPU runtime
        timeout-minutes: 8
        run: |
          python -m pip install --quiet --timeout 60 --retries 3 -e . numpy==2.3.3
          python -m pip install --quiet --timeout 60 --retries 3 torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Retry only the cell blocked before training (unchanged scientific sources)
        run: |
          python scripts/run_dev022_retention.py --seed 59 --regime short --arm no_erase --output artifacts/cell
          python scripts/run_dev022_retention.py --seed 59 --regime short --arm no_erase --replay --output artifacts/cell
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-022-RECOVERED-short-59-no_erase-NOT-CONFIRMATORY
          path: artifacts/cell/
          if-no-files-found: error
  independent-audit:
    needs: recover-cell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download completed original cells without rerunning them
        uses: actions/download-artifact@v4
        with:
          pattern: DEV-022-RAW-*-NOT-CONFIRMATORY
          run-id: 38836296472
          github-token: ${{ github.token }}
          path: artifacts/all
      - uses: actions/download-artifact@v4
        with:
          name: DEV-022-RECOVERED-short-59-no_erase-NOT-CONFIRMATORY
          path: artifacts/recovered
      - name: Verify duplicate predictions if original also finished; assemble provenance
        env:
          RECOVERY_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path('artifacts/all')
          target = root / 'DEV-022-RAW-short-59-no_erase-NOT-CONFIRMATORY'
          repaired = Path('artifacts/recovered')
          duplicate = target.exists()
          if duplicate:
              a = json.loads((target / 'report.json').read_text())
              b = json.loads((repaired / 'report.json').read_text())
              assert a['training']['final_hash'] == b['training']['final_hash']
              assert all(a[k] == b[k] for k in ('source_sha256', 'rows', 'summary', 'seed', 'regime', 'arm', 'torch'))
          else:
              shutil.copytree(repaired, target)
          manifest = {'original_run': 38836296472, 'recovery_run': int(os.environ['RECOVERY_RUN_ID']),
                      'recovered_cell': {'seed': 59, 'regime': 'short', 'arm': 'no_erase'},
                      'reason': 'Original cell blocked in dependency installation before training',
                      'duplicate_original_present_and_prediction_checked': duplicate,
                      'scientific_code_unchanged_from': '1177096611cfa1f4f579bca71c8f4079a70cb1dc'}
          (root / 'execution-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Independent complete 60-cell stdlib history, decision and physical-cost audit
        run: python scripts/audit_dev022_retention.py artifacts/all/DEV-022-RAW-*-NOT-CONFIRMATORY --output artifacts/all/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-022-COMPLETE-AUDITED-NOT-CONFIRMATORY
          path: artifacts/all/
          if-no-files-found: error
