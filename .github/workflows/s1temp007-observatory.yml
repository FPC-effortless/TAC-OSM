name: S1TEMP007 actual four-rate Observatory source adapter
on:
  push:
    branches: [research/s1temp007-multiscale-state-2026-10-26]
    paths:
      - 'src/tac_osm/research_s1temp007_adapter.py'
      - 'tests/test_research_s1temp007_adapter.py'
      - '.github/workflows/s1temp007-observatory.yml'
  pull_request:
    paths:
      - 'src/tac_osm/research_s1temp007_adapter.py'
      - 'tests/test_research_s1temp007_adapter.py'
permissions:
  contents: read
jobs:
  real-four-rate-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          PYTHONPATH=src:. python -m unittest tests.test_research_s1temp007_adapter -v
          PYTHONPATH=src:. python -m unittest tests.test_s1temp007_multiscale_memory -v
