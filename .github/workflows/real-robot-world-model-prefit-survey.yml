name: TAC-OSM genuine robot world-model rival and fail-closed compute pilot
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/tac_osm/real_robot_gru_world_control.py
      - scripts/profile_real_robot_world_models_prefit.py
      - tests/test_gru_real_robot_world_model_fair_control.py
      - research/real-robot-strong-gru-resource-preflight-2026-10-22.md
      - docs/TACOSM-BASELINE-001.md
      - .github/workflows/real-robot-world-model-prefit-survey.yml
permissions:
  contents: read
concurrency:
  group: robot-world-model-resource-survey-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  controlled-interface-software:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATEN_CPU_CAPABILITY: avx2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned CPU-only numerical test environment
        run: |
          python -m pip install 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Test genuine-information symmetry, masked outcomes and recurrent feedback gradients
        run: |
          python -m py_compile src/tac_osm/real_robot_gru_world_control.py scripts/profile_real_robot_world_models_prefit.py
          PYTHONPATH=src python -m pytest -q tests/test_gru_real_robot_world_model_fair_control.py
  actual-original-FIT-source-only-resource-profile:
    needs: controlled-interface-software
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Pin original untrained resource-profiling environment
        run: |
          python -m pip install 'pyarrow==21.0.0'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Original 256 linked physical FIT frames, actual action/control and untrained gradients only
        run: |
          set -o pipefail
          PYTHONPATH=src python -m scripts.profile_real_robot_world_models_prefit --private-cache /tmp/private-real-FIT-robot-originals --receipt results/real-robot-world-model-prefit-limited-profile.json | tee real-robot-resource-pilot.log
      - name: Enforce incomplete FLOP instrumentation cannot authorize architecture fitting
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('results/real-robot-world-model-prefit-limited-profile.json').read_text())
          assert x['original_source']['sample_source_is_FIT']
          assert x['original_source']['real_state_action_frames']==256
          assert len(x['original_source']['original_publisher_parquet_SHA256'])==64
          assert x['model_weight_updates']==0
          assert not x['original_dev_test_files_opened']
          assert not x['all_real_outcome_prediction_accuracy_scores_computed']
          assert not x['operator_complete_training_FLOPs_available']
          assert not x['full_resource_parity_qualified']
          assert not x['model_training_authorized']
          assert not x['resource_fairness_diagnostics']['strict_preflight_PASS']
          assert not x['native']['complete_training_FLOPs_certified']
          assert not x['established_gru']['complete_training_FLOPs_certified']
          assert x['native']['median_profiler_CPU_seconds']>0
          assert x['established_gru']['median_profiler_CPU_seconds']>0
          print('HONEST_REAL_FIT_RESOURCE_SURVEY_COMPLETE__ARCHITECTURE_TRAINING_STILL_BLOCKED')
          PY
      - name: Archive SOURCE HASH/partial-resource evidence only; no human or robot frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-robot-256-real-FIT-pilot-untrained-TAC-versus-GRU-parity-report
          path: |
            results/real-robot-world-model-prefit-limited-profile.json
            real-robot-resource-pilot.log
          retention-days: 90
          if-no-files-found: ignore
