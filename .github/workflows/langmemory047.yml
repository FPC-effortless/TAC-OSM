name: LANGMEMORY047 fixed-byte-budget two-memory source retrieval vs raw history
on:
  pull_request:
    paths:
      - 'scripts/langmemory047_bounded.py'
      - 'tests/test_langmemory047_bounded.py'
      - 'research/mathematical-engineering/langmemory047/**'
      - 'research/phone_queue/langmemory047.json'
      - '.github/workflows/langmemory047.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-fit-fixed-memory-retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 pytest==8.4.2
      - name: Source and budget preregistration, phone no-fit plan and constructed causal tests
        run: |
          mkdir -p langmemory047-evidence
          python scripts/phone_lab.py plan research/phone_queue/langmemory047.json > langmemory047-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langmemory047/FAIR_COMPARISON.json --phase preflight > langmemory047-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langmemory047_bounded.py
      - name: Real publisher FIT 1536 anchor and extended 4096 source-only study
        run: |
          PYTHONPATH=src:. python scripts/langmemory047_bounded.py --output langmemory047-evidence/RESULTS.json
          python - <<'PY'
          import json
          r=json.load(open('langmemory047-evidence/RESULTS.json'))
          assert r['training_updates']==0 and r['gpu_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          a=r['cohorts']['anchor_1536']['summary']
          assert a['cases']==4928 and a['arms']['legacy_a_plus_b']['correct']==933
          for scope in r['cohorts'].values():
              s=scope['summary']
              assert all(x['calls']==s['cases'] for x in s['arms'].values())
              for owner in scope['owners']:
                  for b in (1344,4096):
                      for w in (1,2):
                          assert owner['allocated_state_bytes'][f'table{w}_{b}']==b
                      assert owner['allocated_state_bytes'][f'ring_{b}']==b
          PY
      - name: Archive all original raw by-owner and performance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGMEMORY047-original-source-fixed-allocated-buffers
          path: langmemory047-evidence/
          retention-days: 90
          if-no-files-found: warn
