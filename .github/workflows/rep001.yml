name: REP-001 successor diagnostic

on:
  push:
    branches: [successor/arch-v1]
    paths:
      - "scripts/run_successor_rep001.py"
      - "src/**"
      - "tests/**"
      - ".github/workflows/rep001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rep001:
    name: TACOSM-SUCCESSOR-REP-001
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Preconditions
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
          if git diff --name-only origin/master...HEAD | grep -E 'C5-001|C5-002|C5-003'; then
            echo "Frozen C5 evidence changed; REP-001 is invalid."
            exit 1
          fi

      - name: Run preregistered diagnostic
        run: python scripts/run_successor_rep001.py > artifacts/REP-001.stdout.json

      - name: Upload REP-001 result
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-SUCCESSOR-REP-001
          path: artifacts/
          if-no-files-found: error
