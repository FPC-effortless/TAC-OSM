name: ME044 multiscale native decoder and original model replay
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/tac_osm/me044*.py
      - scripts/me044*.py
      - tests/test_me044*.py
      - research/mathematical-engineering/me044/**
      - research/model-artifacts/me044/**
      - research/model-artifacts/me044-avx2/**
      - .github/workflows/me044-multiscale-decoder.yml
permissions:
  contents: read
concurrency:
  group: me044-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-models-and-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original numerical environment
        run: |
          python -m pip install -e . 'numpy==2.3.5' 'pytest==9.1.1'
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Numerical contracts and full regressions
        run: |
          python -m pytest -q
          python scripts/sync_test_count.py --check
      - name: Restore actual original models and all indexed payloads
        run: |
          python scripts/me044_artifacts.py verify research/model-artifacts/me044 restored-me044
          python scripts/me044_artifacts.py verify research/model-artifacts/me044-avx2 restored-me044-avx2
      - name: Exact separate AVX2-serving forecasts, original optimizer weights and metrics
        run: |
          python -m scripts.me044_train_multiscale --out restored-me044 --audit --portable-reference restored-me044-avx2
          python -m scripts.me044_inference --out restored-me044 --verify-only --portable-reference restored-me044-avx2
      - name: Preserve original trained models and independent replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me044-80-original-trained-models-and-evidence
          path: |
            research/model-artifacts/me044/**
            research/model-artifacts/me044-avx2/**
            restored-me044/portable-audit.json
            restored-me044/portable-compiled-replay.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
