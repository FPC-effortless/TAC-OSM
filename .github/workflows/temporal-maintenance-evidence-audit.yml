name: DEV-016 independent raw evidence audit (development only)
on:
  pull_request:
    paths:
      - "scripts/summarize_temporal_maintenance_dev.py"
      - ".github/workflows/temporal-maintenance-evidence-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the pinned full training and neural replay run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          for attempt in range(180):
              data = json.loads(subprocess.check_output([
                  'gh', 'api', '/repos/FPC-effortless/TAC-OSM/actions/runs/38532288200']))
              if data['head_sha'] != '1b62d49db358d1e703256cfc0ab8524d3b73d118':
                  raise SystemExit('Wrong source training commit')
              if data['status'] == 'completed':
                  if data['conclusion'] != 'success':
                      raise SystemExit('Training or neural replay failed: ' + data['conclusion'])
                  print('Pinned training and neural replay succeeded')
                  break
              print('Waiting for pinned training/replay run', flush=True)
              time.sleep(30)
          else:
              raise SystemExit('Training/replay did not complete within audit wait budget')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38532288200
          pattern: DEV-016-RAW-seed*-NOT-CONFIRMATORY
          path: artifacts/DEV-016-evidence
      - name: Independently regenerate targets, hash checkpoints and derive seed statistics
        run: |
          python -m py_compile scripts/summarize_temporal_maintenance_dev.py
          python scripts/summarize_temporal_maintenance_dev.py artifacts/DEV-016-evidence/DEV-016-RAW-seed43-NOT-CONFIRMATORY artifacts/DEV-016-evidence/DEV-016-RAW-seed59-NOT-CONFIRMATORY artifacts/DEV-016-evidence/DEV-016-RAW-seed71-NOT-CONFIRMATORY --output artifacts/DEV-016-evidence/analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-016-COMPLETE-AUDITED-EVIDENCE-NOT-CONFIRMATORY
          path: artifacts/DEV-016-evidence/
          if-no-files-found: error
