name: LANGPROFILE059 frozen original TAC ATen source callsites CPU
on:
  pull_request:
    paths:
      - 'scripts/langprofile059_lines.py'
      - 'tests/test_langprofile059_lines.py'
      - 'research/mathematical-engineering/langprofile059/**'
      - 'research/phone_queue/langprofile059.json'
      - '.github/workflows/langprofile059.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  traced-original-cpu-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU environment
        run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Source/compute preregistration and local profiler tests
        run: |
          mkdir -p langprofile059-evidence
          python scripts/phone_lab.py plan research/phone_queue/langprofile059.json > langprofile059-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langprofile059/FAIR_COMPARISON.json --phase preflight > langprofile059-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langprofile059_lines.py tests/test_langprofile058_ops.py tests/test_langdecode057_validation.py
      - name: Download original trusted checkpoint no training
        run: |
          gh run download 40797105091 --repo FPC-effortless/TAC-OSM --name LANGLAYER040-CPU-state48_no_graph-seed1701 --dir langprofile059-original/tac
      - name: Read-only original decoder exact parity then Python stack callsite CPU profile
        run: |
          PYTHONPATH=src:. python scripts/langprofile059_lines.py --tac-dir langprofile059-original/tac --output langprofile059-evidence/RESULTS.json
          python - <<'PY'
          import json,math
          r=json.load(open('langprofile059-evidence/RESULTS.json'))
          assert r['new_training_updates']==0 and r['gpu_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          assert len(r['results'])==2
          for row in r['results']:
              assert row['persistent_state_bytes']==3904 and row['step_to_transition_bitwise']
              assert row['bitwise_reference_comparison']['bitwise_original_incremental_logits_and_all_states']
              assert row['bitwise_reference_comparison']['snapshot_bidirectional_bitwise_continuation']
              profile=row['source_line_profile']
              assert profile['calls']==12 and profile['total_aten_self_cpu_us']>0
              assert 0<=profile['attributed_fraction']<=1
              assert math.isclose(profile['attributed_self_cpu_us']+profile['unattributed_self_cpu_us'],profile['total_aten_self_cpu_us'],rel_tol=1e-9)
              assert profile['status'] in ('SOURCE_CALLSITES_RECORDED','NO_ADVANCE_PYTHON_STACKS_AVAILABLE')
          PY
      - name: Retain actual result, including empty-stack negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGPROFILE059-original-trained-callsite-evidence
          path: langprofile059-evidence/
          retention-days: 90
          if-no-files-found: warn
