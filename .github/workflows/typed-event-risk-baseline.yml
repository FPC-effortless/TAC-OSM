name: Typed event risk product baseline (constructed fixtures only)
on:
  push:
    branches:
      - product/typed-event-risk-baseline-2026-10-27
  pull_request:
    paths:
      - 'specialist_models/typed_event_risk.py'
      - 'tests/test_typed_event_risk.py'
      - 'docs/TYPED_EVENT_RISK_BASELINE.md'
      - '.github/workflows/typed-event-risk-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-time-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source availability, label isolation and scoring fixture tests
        run: python -m unittest discover -s tests -p 'test_typed_event_risk.py' -v
      - name: Python syntax check
        run: python -m py_compile specialist_models/typed_event_risk.py tests/test_typed_event_risk.py
