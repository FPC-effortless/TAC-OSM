name: DEV-019 frozen DEV-017 prediction forensics (posthoc)
on:
  pull_request:
    paths:
      - "scripts/diagnose_dev017_predictions.py"
      - "tests/test_dev017_predictions_forensics.py"
      - "docs/DEV-019-FROZEN-FORENSICS.md"
      - ".github/workflows/dev019-forensics.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  forensic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and synthetic integrity tests
        run: |
          python -m pip install --quiet pytest==9.1.1 ruff==0.13.0
          ruff check --select F scripts/diagnose_dev017_predictions.py tests/test_dev017_predictions_forensics.py
          python -m pytest -q tests/test_dev017_predictions_forensics.py
      - name: Fetch ORIGINAL full-audited DEV-017 data (three seed reports)
        uses: actions/download-artifact@v4
        with:
          name: DEV-017-COMPLETE-AUDITED-EVIDENCE-NOT-CONFIRMATORY
          run-id: 38551851130
          github-token: ${{ github.token }}
          path: frozen/dev017
      - name: Derive read-only diagnostic tables from frozen model outputs
        shell: bash
        run: |
          mapfile -d '' REPORTS < <(find frozen/dev017 -type f -name report.json -print0 | sort -z)
          printf 'Archived report paths:\n%s\n' "${REPORTS[@]}"
          if [ "${#REPORTS[@]}" -ne 3 ]; then
            echo "Expected exactly three frozen full seed reports, refusing incomplete data"
            exit 1
          fi
          python scripts/diagnose_dev017_predictions.py "${REPORTS[@]}" --output artifacts/DEV-019
          test -s artifacts/DEV-019/analysis.json
          test -s artifacts/DEV-019/critical-H512.csv
          test -s artifacts/DEV-019/cancellation-by-history.csv
          cat artifacts/DEV-019/critical-H512.csv
      - name: Publish frozen-source diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-019-POSTHOC-FORENSICS-NOT-CONFIRMATORY
          path: artifacts/DEV-019/
          if-no-files-found: warn
