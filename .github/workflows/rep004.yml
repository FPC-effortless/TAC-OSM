name: REP-004 exploration on semantic program routing

on:
  push:
    branches: [research/rep004-exploration-semantic-routing]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_exploration_rep004.py"
      - "docs/TACOSM-LEARN-REP-004.md"
      - "docs/TACOSM-BASELINE-001.md"
      - ".github/workflows/rep004.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rep004:
    name: TACOSM-LEARN-REP-004
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Preconditions
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
          if git diff --name-only origin/master...HEAD | grep -E 'C5-001|C5-002|C5-003'; then
            echo "Frozen C5 evidence changed; REP-004 is invalid."
            exit 1
          fi
      - name: Run preregistered intervention
        run: |
          mkdir -p artifacts
          python scripts/run_exploration_rep004.py > artifacts/REP-004.stdout.json
          cat artifacts/REP-004.stdout.json
      - name: Upload REP-004 result
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-LEARN-REP-004
          path: artifacts/
          if-no-files-found: error