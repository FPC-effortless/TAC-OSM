name: ME064 real repo checkpoint byte storage proof (UNTRAINED)
on:
  workflow_dispatch:
permissions: {contents: write}
jobs:
  git-checkpoint-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python scripts/me064_storage_probe.py --write
      - name: Commit original checkpoint bytes, not external artifacts
        env: {PUSH_BRANCH: "${{ github.head_ref || github.ref_name }}"}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/replay-bundles/ME064/UNTRAINED_STORAGE_PROBE.pt research/replay-bundles/ME064/STORAGE_PROBE_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me064): original untrained checkpoint byte Git storage route'
            git fetch origin "$PUSH_BRANCH"
            git rebase "origin/$PUSH_BRANCH"
            for attempt in 1 2 3 4 5; do
            git fetch origin "$PUSH_BRANCH"
            git rebase "origin/$PUSH_BRANCH"
            if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
          done
          fi
  independent-clean-checkout:
    needs: git-checkpoint-bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}", clean: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python scripts/me064_storage_probe.py --check
