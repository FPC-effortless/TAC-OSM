name: LANGDECODE069 native ARM64 original trained TAC guarded cache CPU
on:
  pull_request:
    paths:
      - 'scripts/langdecode067_cache_guard.py'
      - 'scripts/langdecode067_benchmark.py'
      - 'tests/test_langdecode067_cache_guard.py'
      - 'research/mathematical-engineering/langdecode069/**'
      - 'research/phone_queue/langdecode069.json'
      - '.github/workflows/langdecode069.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-trained-state-and-decode:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify native ARM64 architecture and pinned PyTorch aarch64 wheel
        run: |
          python - <<'PY'
          import platform,torch
          arch=platform.machine().lower()
          print({'arch':arch,'processor':platform.processor(),'torch':torch.__version__})
          assert arch in ('aarch64','arm64'), 'must use native ARM64 processor'
          assert torch.__version__.startswith('2.10.0')
          assert not torch.cuda.is_available()
          PY
      - name: Frozen source/no-GPU planner original parity and constructed mask-state tests
        run: |
          mkdir -p langdecode069-evidence
          python scripts/phone_lab.py plan research/phone_queue/langdecode069.json > langdecode069-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langdecode069/FAIR_COMPARISON.json --phase preflight > langdecode069-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langdecode067_cache_guard.py tests/test_langdecode064_cached_cap.py tests/test_langdecode057_validation.py tests/test_langstream043.py
      - name: Retrieve immutable original stateful trained TAC checkpoint
        run: |
          gh run download 40797105091 --repo FPC-effortless/TAC-OSM --name LANGLAYER040-CPU-state48_no_graph-seed1701 --dir langdecode069-original/tac
      - name: Original checkpoint 16 token growing CPU decode bitwise comparison and timing
        run: |
          PYTHONPATH=src:. python scripts/langdecode067_benchmark.py --tac-dir langdecode069-original/tac --output langdecode069-evidence/RESULTS.json
          python - <<'PY'
          import json
          r=json.load(open('langdecode069-evidence/RESULTS.json'))
          assert r['new_training_updates']==0 and r['gpu_minutes']==0 and r['protected_TEST']=='NOT_ACCESSED'
          assert r['trained_parameters']==499623 and r['persistent_state_bytes_per_owner']==3904
          assert {x['prompt_bytes'] for x in r['results']}=={128,512}
          for row in r['results']:
              q=row['original_equivalence']
              assert q['bitwise_original_incremental_logits_and_all_states']
              assert q['snapshot_bidirectional_bitwise_continuation']
              assert q['state_tensor_bytes']==3904
              assert q['full_prefix_max_abs_error']<=3e-5
              assert set(row['arms'])=={'original','guarded_cap'}
          PY
      - name: Retain all successful or negative original checkpoint outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGDECODE069-native-arm64-guarded-original-trained
          path: langdecode069-evidence/
          retention-days: 90
          if-no-files-found: warn
