name: DEV-033 PNDS trace contract integrity
on:
  pull_request:
    types: [opened]
    paths:
      - 'research/dev033/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          ruff check --select F src/tac_osm/development/pnds_conformance.py scripts/*dev033.py tests/*dev033.py scripts/package_registered_gru_dev032.py scripts/summarize_registered_gru_dev032.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
          python scripts/run_pnds_conformance_dev033.py --output /tmp/dev033-trace-contracts.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-033-TRACE-CONTRACTS-NOT-FORMAL-PROOF
          path: /tmp/dev033-trace-contracts.json
