name: Historical-memory internal research and qualification boundaries

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-graph-and-authorization-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 0d9c9fbc8c5ed94762c9da129379158d36125e7f
          path: original-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only engineering test tools
        run: |
          python -m pip install --quiet pytest cryptography numpy==2.3.3 ruff
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify registration and CPU routing (not evaluation permission)
        run: |
          python scripts/phone_lab.py plan research/phone_queue/original-history-audit014.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/history_audit014/FAIR_COMPARISON.json --phase preflight
      - name: Real original CODE, constructed inputs only, no original data or checkpoint loading
        env:
          PYTHONPATH: .:src
          TAC_OSM_ORIGINAL_HISTORY_SOURCE: ${{ github.workspace }}/original-code
        run: |
          python -m ruff check --select E9,F63,F7,F82 src/tac_osm/history_audit_authorization.py scripts/audit_original_history.py scripts/original_history_trace.py tests/test_original_history_audit.py
          python -m pytest -q tests/
      - name: Independent qualification still blocks without external permission
        run: |
          mkdir -p ci-artifacts/history-audit014
          set +e
          python scripts/audit_original_history.py --execution-level independent_qualification --execute --source /unavailable/original.zip --implementation-root original-code --output ci-artifacts/history-audit014/BLOCKED.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          r = json.load(open('ci-artifacts/history-audit014/BLOCKED.json'))
          assert r['status'] == 'BLOCKED_INDEPENDENT_AUTHORIZATION'
          assert r['evaluation_executed'] is False
          assert r['scientific_qualification'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-history-audit014-permission-blocker
          path: ci-artifacts/history-audit014/
          if-no-files-found: warn

  internal-original-source-diagnostic:
    needs: source-graph-and-authorization-fixtures
    if: github.event_name == 'pull_request' && github.head_ref == 'research/original-history-audit-2026-10-27'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0d9c9fbc8c5ed94762c9da129379158d36125e7f
          path: original-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU-only original-source research environment
        run: |
          python -m pip install --quiet numpy==2.3.3
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify publisher download and exact original archive without opening other bundle members
        run: |
          mkdir -p ci-artifacts/history-internal
          python - <<'PY'
          import hashlib, io, json, urllib.request, zipfile
          from pathlib import Path
          receipt = json.loads(Path('research/mathematical-engineering/history_audit014/PUBLIC_SOURCE_RECEIPT.json').read_text())
          with urllib.request.urlopen(receipt['download_url'], timeout=90) as response:
              bundle = response.read()
          with zipfile.ZipFile(io.BytesIO(bundle)) as z:
              original = z.read(receipt['extracted_member'])
          assert hashlib.sha256(original).hexdigest() == receipt['archive_sha256']
          Path('/tmp/PRSA2017-original.zip').write_bytes(original)
          PY
      - name: Plan internal FIT-only CPU evaluation
        run: |
          python scripts/phone_lab.py plan research/phone_queue/original-history-audit014.json > ci-artifacts/history-internal/COMPUTE_DECISION.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/history_audit014/FAIR_COMPARISON.json --phase preflight
      - name: Run frozen original-source diagnostic (internally measured, not independently qualified)
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python scripts/audit_original_history.py --execute --implementation-root original-code --source /tmp/PRSA2017-original.zip --output ci-artifacts/history-internal/RESULTS.json
      - name: Replay from unchanged source and original checkpoints in a fresh Python process
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python scripts/audit_original_history.py --execute --implementation-root original-code --source /tmp/PRSA2017-original.zip --output ci-artifacts/history-internal/REPLAY.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          folder = Path('ci-artifacts/history-internal')
          first = (folder/'RESULTS.json').read_bytes()
          replay = (folder/'REPLAY.json').read_bytes()
          assert first == replay, 'frozen original-source replay differs'
          r = json.loads(first)
          assert r['execution_level'] == 'internal_research' and r['scientific_qualification'] is False
          (folder/'REPLAY_RECEIPT.json').write_text(json.dumps({'status':'PASS_BYTE_IDENTICAL_REPLAY','results_sha256':hashlib.sha256(first).hexdigest(),'evidence_level':'internally_measured_not_independently_qualified'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-history-internal-research
          path: ci-artifacts/history-internal/
          if-no-files-found: warn
          retention-days: 30
