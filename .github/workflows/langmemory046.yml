name: LANGMEMORY046 original-source random-vs-select verifier and indexed history
on:
  pull_request:
    paths:
      - 'scripts/langmemory046_verification_controls.py'
      - 'tests/test_langmemory046.py'
      - 'research/mathematical-engineering/langmemory046/**'
      - 'research/phone_queue/langmemory046.json'
      - '.github/workflows/langmemory046.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verifier-falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 pytest==8.4.2
      - name: Frozen no-fit source planner, original license preregistration and constructed tests
        run: |
          mkdir -p langmemory046-evidence
          python scripts/phone_lab.py plan research/phone_queue/langmemory046.json > langmemory046-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/langmemory046/FAIR_COMPARISON.json --phase preflight > langmemory046-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_langmemory046.py
      - name: Same-source five-seed random vs selective verification and indexed counts
        run: |
          PYTHONPATH=src:. python scripts/langmemory046_verification_controls.py --output langmemory046-evidence/RESULTS.json
          python - <<'PY'
          import json
          r=json.load(open('langmemory046-evidence/RESULTS.json'))
          assert r['documents']==14 and r['cases']==4928
          assert len(r['random_seeds'])==5
          assert r['training_updates']==0 and r['protected_TEST']=='NOT_ACCESSED' and r['gpu_minutes']==0
          for seed in r['random_seeds']:
              s=r['runs'][str(seed)]['summary']
              assert s['select_scan']['correct']==s['select_index']['correct']
              for name in ('random_all','random_uncertain'):
                  assert s[name]['verification_calls']==s['select_scan']['verification_calls']
          PY
      - name: Archive full per-owner source and timing receipts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGMEMORY046-FIT-matched-random-and-index-controls
          path: langmemory046-evidence/
          retention-days: 90
          if-no-files-found: warn
