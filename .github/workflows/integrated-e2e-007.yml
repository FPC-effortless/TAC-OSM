name: Research PLM integrated multimodal E2E 007

on:
  push:
    branches:
      - research/plm-e2e-007-residual-state-confirmatory-2026-10-07
    paths:
      - contracts/TACOSM-PLM-INTEGRATED-E2E-007.json
      - src/tac_osm/integrated_e2e_005.py
      - src/tac_osm/integrated_e2e_007_benchmark.py
      - scripts/run_integrated_e2e_005.py
      - scripts/run_integrated_e2e_007.py
      - scripts/validate_integrated_e2e_007.py
      - tests/test_integrated_e2e_005.py
      - tests/test_integrated_e2e_006.py
      - .github/workflows/integrated-e2e-007.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory:
    name: E2E-007 residual-state confirmatory measurement
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest numpy==2.3.3 torch
          python -m pip install --quiet "ruff==0.13.0"
      - name: Static gate
        run: |
          ruff check --select F821 src/tac_osm/integrated_e2e_005.py             src/tac_osm/integrated_e2e_007_benchmark.py             scripts/run_integrated_e2e_005.py             scripts/run_integrated_e2e_007.py             scripts/validate_integrated_e2e_007.py
      - name: Focused tests
        run: python -m pytest tests/test_integrated_e2e_005.py tests/test_integrated_e2e_006.py -q
      - name: Contract gate
        run: |
          python - <<'PY'
          import json
          p="contracts/TACOSM-PLM-INTEGRATED-E2E-007.json"
          x=json.load(open(p))
          assert x["status"]=="pre-registered"
          assert x["protocol"]["hidden_dim"]==64
          assert x["protocol"]["state_write_mode"]=="residual_linear"
          assert x["primary_endpoint"]["threshold"]==0.80
          assert len(x["heldout"])==8
          print("PASS: E2E-007 contract")
          PY
      - name: Full measurement
        run: python scripts/run_integrated_e2e_007.py
      - name: Independent result validation
        run: python scripts/validate_integrated_e2e_007.py artifacts/TACOSM-PLM-INTEGRATED-E2E-007.json
      - name: Upload scientific artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-INTEGRATED-E2E-007
          path: artifacts/TACOSM-PLM-INTEGRATED-E2E-007.json
          if-no-files-found: error
