name: LANGCOMPARE029 no-fit four-arm preflight (Mamba CUDA pending)
on:
  pull_request:
    paths:
      - "scripts/langcompare029_preflight.py"
      - "scripts/langcompare029_sampling.py"
      - "research/mathematical-engineering/langcompare029/**"
      - "tests/test_langcompare029_preflight.py"
      - ".github/workflows/langcompare029.yml"
permissions:
  contents: read
jobs:
  cpu-source-and-parameter-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install numpy==2.3.5 pytest
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch official BDH source (verify actual original Git blob in runner)
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/pathwaycom/bdh/main/bdh.py \
            --output /tmp/langcompare029_bdh.py
      - name: No-fit source and model preflight — NOT four-way benchmark
        run: |
          mkdir -p langcompare029-results
          python scripts/langcompare029_preflight.py \
            --bdh-source /tmp/langcompare029_bdh.py \
            --output langcompare029-results/NO_FIT_PREFLIGHT.json
          python scripts/langcompare029_sampling.py \
            --output langcompare029-results/FROZEN_TRAINING_SCHEDULE.json
          python -m pytest -q tests/test_langcompare029_preflight.py
          python - <<'PY'
          import json
          r=json.load(open("langcompare029-results/NO_FIT_PREFLIGHT.json"))
          assert r["optimizer_steps"]==0 and r["gpu_minutes"]==0
          assert r["status"]=="NO_FIT_PARTIAL_PREFLIGHT_NOT_READY_TO_TRAIN"
          assert r["models"]["mamba3_siso_official"]["status"].startswith("PENDING_")
          assert r["models"]["tac_context026"]["status"]=="PARAMETER_COUNT_VERIFIED"
          assert r["models"]["bdh_official"]["status"]=="PARAMETER_COUNT_VERIFIED"
          assert r["models"]["causal_transformer"]["status"]=="PARAMETER_COUNT_VERIFIED"
          sched=json.load(open("langcompare029-results/FROZEN_TRAINING_SCHEDULE.json"))
          assert sched["optimizer_steps_performed"]==0
          assert len(sched["by_seed"])==5
          assert all(x["examples_seen"]==2560 for x in sched["by_seed"])
          PY
      - name: Upload no-fit evidence (not prediction metrics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANGCOMPARE029-no-fit-CPU-source-and-model-audit
          path: langcompare029-results/
