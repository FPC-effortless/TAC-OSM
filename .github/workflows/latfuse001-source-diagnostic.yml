name: LATFUSE001 genuine FIT-only no-fit latent diagnostic

on:
  push:
    branches: [research/latfuse001-unified-latent-2026-10-26]
    paths:
      - "scripts/latfuse001_source_diagnostic.py"
      - "scripts/latfuse001_trainability_prefit.py"
      - "research/mathematical-engineering/latfuse001/FAIR_COMPARISON.json"
      - ".github/workflows/latfuse001-source-diagnostic.yml"
      - "src/tac_osm/latent_fusion_001.py"
  pull_request:
    paths:
      - "scripts/latfuse001_source_diagnostic.py"
      - "research/mathematical-engineering/latfuse001/FAIR_COMPARISON.json"
      - ".github/workflows/latfuse001-source-diagnostic.yml"
      - "src/tac_osm/latent_fusion_001.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-diagnostic-no-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install no-fit CPU-only dependencies
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Enforce no-fit research policy
        run: |
          python scripts/validate_research_parity.py \
            --manifest research/mathematical-engineering/latfuse001/FAIR_COMPARISON.json \
            --phase preflight
      - name: Retrieve pinned original source without switching the experiment source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse001-data
          # This exact ME111 source commit already contains the original CC-BY-4.0 archive.
          # No 2015-17 rows are converted: only first 512 FIT hours read by the diagnosis.
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse001-data/PRSA2017_original.zip
          echo "Original bytes retrieved from exact pinned commit, sha verified in runner."
      - name: Real FIT-only latent state and constructed mechanism diagnostics
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/latfuse001_source_diagnostic.py \
            --source /tmp/latfuse001-data/PRSA2017_original.zip
      - name: Probe live 100k source graph and FIT-only gradients without optimizer
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/latfuse001_trainability_prefit.py \
            --source /tmp/latfuse001-data/PRSA2017_original.zip
      - name: Disclose evidence limits
        run: |
          echo "ZERO optimizer updates, no future labels, no protected TEST, no unlogged candidate actions."
          echo "No model accuracy or architecture winner may be inferred from random initialized FIT latent traces."
