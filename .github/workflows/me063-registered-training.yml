name: ME063 original FIT frozen-checkpoint training with Git replay
on:
  workflow_dispatch:
    inputs:
      allow_new_fits:
        description: Explicit opt-in; current live gates remain compulsory
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  authentic-fit-train-and-git-publish:
    # Retained historical lane; current live guards still reject incompatible new fits.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_new_fits == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pyarrow==21.0.0'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Registered numeric preflight before any optimizer
        run: |
          python scripts/validate_research_parity.py --manifest research/mathematical-engineering/me063/FAIR_COMPARISON.json --phase preflight
          test -f research/mathematical-engineering/me063/PREFLIGHT_MEASURED.json
          test -f research/replay-bundles/ME063/STORAGE_PROBE_MANIFEST.json
          test -f research/replay-bundles/ME063/UNTRAINED_STORAGE_PROBE.pt
      - name: Real FIT only, matched frozen five-seed training
        env:
          ME063_PUBLISHER_CACHE: ${{ runner.temp }}/me063-real-source-cache
        run: |
          if [ -f research/replay-bundles/ME063/TRAINING_RESULT.json ]; then
            echo 'ME063 already trained and in this exact branch; NEVER retrain'
          else
            PYTHONPATH=src:. python scripts/me063_train_registered.py --fit
          fi
      - name: Validate actual postfit resource receipts before heldout
        run: |
          python scripts/validate_research_parity.py --manifest research/replay-bundles/ME063/FAIR_COMPARISON_FINAL.json --phase final
      - name: Commit original model and optimizer/RNG checkpoint BYTES into this repo
        if: always()
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/replay-bundles/ME063/
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(me063): preserve original real FIT checkpoints and optimizer/RNG state before heldout'
            git fetch origin "$PUSH_BRANCH"
            git rebase "origin/$PUSH_BRANCH"
            for attempt in 1 2 3 4 5; do
              git fetch origin "$PUSH_BRANCH"
              git rebase "origin/$PUSH_BRANCH"
              if git push origin "HEAD:refs/heads/$PUSH_BRANCH"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          else
            echo 'No new trained checkpoint bytes to publish'
          fi
  independent-git-checkpoint-audit:
    needs: authentic-fit-train-and-git-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify original hashes/load in an independent clean checkout WITHOUT heldout
        run: PYTHONPATH=src:. python scripts/me063_verify_repo_checkpoints.py --check
      - name: Persist clean-checkout model reload receipt
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/replay-bundles/ME063/CLEAN_CHECKOUT_MODEL_REPLAY.json
          git commit -m 'evidence(me063): independent checkpoint bytes/load replay receipt'
          git fetch origin "$PUSH_BRANCH"
          git rebase "origin/$PUSH_BRANCH"
          git push origin "HEAD:refs/heads/$PUSH_BRANCH"
