name: Research PLM functional completion runway

on:
  push:
    branches:
      - research/plm-functional-repair-casm-ste-2026-10-06
    paths:
      - src/tac_osm/functional_repair_signed_casm.py
      - src/tac_osm/integrated_e2e_005.py
      - src/tac_osm/integrated_e2e_005_benchmark.py
      - scripts/run_integrated_e2e_005.py
      - scripts/run_plm_functional_repair_dev.py
      - scripts/run_plm_functional_completion_dev.py
      - tests/test_plm_functional_repair.py
      - tests/test_workflow_local_script_references.py
      - docs/AUDIT-PLM-FUNCTIONAL-REPAIR.md
      - docs/TACOSM-BASELINE-001.md
      - .github/workflows/plm-functional-completion-dev.yml

permissions:
  contents: read

jobs:
  completion:
    name: PLM functional completion training-only runway
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e . pytest numpy==2.3.3 torch
          python -m pip install --quiet "ruff==0.13.0"
      - name: Static gate
        run: ruff check --select F821 src/tac_osm/functional_repair_signed_casm.py scripts/run_plm_functional_repair_dev.py scripts/run_plm_functional_completion_dev.py
      - name: Workflow reference gate
        run: python -m pytest tests/test_workflow_local_script_references.py -q
      - name: Repair tests
        run: python -m pytest tests/test_plm_functional_repair.py -q
      - name: Repository regression suite
        run: python -m pytest tests/ -q
      - name: Fixed 1200-step functionality runway
        run: python scripts/run_plm_functional_completion_dev.py
      - name: Upload development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLM-FUNCTIONAL-COMPLETION-SIGNED-CASM
          path: artifacts/development/PLM-FUNCTIONAL-COMPLETION-SIGNED-CASM.json
          if-no-files-found: ignore
