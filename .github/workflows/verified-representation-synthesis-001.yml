name: Research verified representation synthesis 001

on:
  pull_request:
    branches:
      - research/unified-plm-clm-final-2026-10-01
  push:
    branches:
      - research/verified-representation-synthesis-001
    paths:
      - contracts/TACOSM-VRS-DYNAMIC-REPRESENTATION-001.json
      - docs/TACOSM-VRS-DYNAMIC-REPRESENTATION-001.md
      - src/tac_osm/representation.py
      - tests/test_representation.py
      - src/tac_osm/contract.py
      - tests/test_contract.py
      - pyproject.toml
      - .github/workflows/verified-representation-synthesis-001.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --quiet -e . pytest
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: Verify VRS contract
        run: |
          python - <<'PY'
          import json
          from tac_osm.contract import load_contract
          path = "contracts/TACOSM-VRS-DYNAMIC-REPRESENTATION-001.json"
          raw = json.load(open(path, encoding="utf-8"))
          contract = load_contract("TACOSM-VRS-DYNAMIC-REPRESENTATION-001")
          assert contract.experiment_id == raw["experiment_id"]
          assert contract.status == "pre-registered"
          assert len(contract.amendments) == 1
          assert contract.amendments[0].id == "A1"
          assert contract.experiment_id == "TACOSM-VRS-DYNAMIC-REPRESENTATION-001"
          PY
      - name: Representation tests
        run: python -m pytest tests/test_representation.py -q

# Validation trigger checksum: 2026-10-02-A1
