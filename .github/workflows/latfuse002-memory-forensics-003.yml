name: LATFUSE002 trained original real FIT memory interference — no fit

on:
  push:
    branches: [research/latfuse002-source-memory-forensics-2026-10-27]
    paths:
      - "scripts/latfuse002_memory_forensics_003.py"
      - "research/mathematical-engineering/latfuse002/FORENSICS_003_REGISTRATION.json"
      - ".github/workflows/latfuse002-memory-forensics-003.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latfuse002-003-read-only-source-audit-once
  cancel-in-progress: false

jobs:
  original-trained-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: CPU PyTorch original source evaluation only
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compulsory no-fit parity and immutable checkpoint prerequisite
        run: |
          python scripts/validate_research_parity.py --manifest \
            research/mathematical-engineering/latfuse002/FORENSICS_003_REGISTRATION.json \
            --phase preflight
          test -f research/replay-bundles/LATFUSE002/seed-202601/final.pt
          test -f research/replay-bundles/LATFUSE002/seed-202602/final.pt
          test ! -e research/mathematical-engineering/latfuse002/FORENSICS_003_RESULTS.json
      - name: Pin original licensed source archive to previously acquired immutable original commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/latfuse002-forensics-input
          git fetch --no-tags --depth=1 origin 6e01290ddf3f10d298c4bcf463a219c9728c0565
          test "$(git rev-parse FETCH_HEAD)" = 6e01290ddf3f10d298c4bcf463a219c9728c0565
          git show FETCH_HEAD:research/source-bundles/ME100/PRSA2017_original.zip \
            > /tmp/latfuse002-forensics-input/PRSA2017_original.zip
      - name: Source-distinct encoder/key and mathematically exact delta-memory transport
        env:
          PYTHONPATH: ".:src"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/latfuse002_memory_forensics_003.py \
            --source /tmp/latfuse002-forensics-input/PRSA2017_original.zip \
            --output research/mathematical-engineering/latfuse002/FORENSICS_003_RESULTS.json
      - name: Freeze derived no-fit results in isolated draft research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "research/latfuse002-source-memory-forensics-2026-10-27"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mathematical-engineering/latfuse002/FORENSICS_003_RESULTS.json
          git diff --cached --quiet && exit 1
          git commit -m "research: preserve original LATFUSE002 trained source memory transport diagnostic"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Explicit limitation
        run: |
          echo "No training / original checkpoint mutation / 2015 DEV / protected numeric source."
          echo "No synthetic capability, intervention/causal utility or architectural superiority claim."
