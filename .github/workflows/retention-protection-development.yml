name: Retention protection DEV-005 (NOT confirmatory)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "development_protocols/RETENTION-PROTECTION-DEV-005.json"
      - "src/tac_osm/development/protection_benchmark.py"
      - "src/tac_osm/development/protected_memory.py"
      - "src/tac_osm/development/protection_experiment.py"
      - "scripts/run_retention_protection_dev.py"
      - "scripts/validate_retention_protection_dev.py"
      - "tests/test_retention_protection_development.py"
      - ".github/workflows/retention-protection-development.yml"

permissions:
  contents: read

jobs:
  protection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU research dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: All integrity and anti-freeze controls before training
        run: |
          ruff check --select F src/tac_osm/development/protection_benchmark.py src/tac_osm/development/protected_memory.py src/tac_osm/development/protection_experiment.py scripts/run_retention_protection_dev.py scripts/validate_retention_protection_dev.py tests/test_retention_protection_development.py
          python -m pytest tests/ -q
          python scripts/sync_test_count.py --check
      - name: Train all three matched protection arms on fixed budgets
        run: python scripts/run_retention_protection_dev.py
      - name: Reload every checkpoint and replay predictions and gate traces
        run: python scripts/validate_retention_protection_dev.py artifacts/RETENTION-PROTECTION-DEV-005
      - name: Preserve all weights and outcomes including negative findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RETENTION-PROTECTION-DEV-005-NOT-CONFIRMATORY
          path: artifacts/RETENTION-PROTECTION-DEV-005/
          if-no-files-found: error
