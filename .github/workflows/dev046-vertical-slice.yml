name: DEV-046 unified predictive state vertical-slice contracts
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/dev046/**'
      - 'src/tac_osm/development/unified_state_prototype.py'
      - 'tests/test_unified_state_prototype_dev046.py'
      - '.github/workflows/dev046-vertical-slice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested PyTorch and full regression dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Static checks, immutable baseline and entire regression suite
        run: |
          ruff check --select F src/tac_osm/development/unified_state_prototype.py tests/test_unified_state_prototype_dev046.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Smoke public event to selected action with gradients and verified update
        run: |
          python - <<'PY'
          import torch
          from tac_osm.development.unified_state_prototype import UnifiedPredictiveStatePrototype
          model=UnifiedPredictiveStatePrototype(entities=8,dim=16,budget=4)
          torch.manual_seed(461)
          obs=torch.randn(2,32,16)
          idx=torch.randint(0,8,(2,32))
          ticks=torch.arange(1,33).float().expand(2,-1)
          out=model(obs,idx,ticks,torch.tensor([32.,128.]))
          assert out.p_wait.shape==(2,8)
          assert out.p_service.shape==(2,8)
          assert out.retrievals==4
          out.p_wait.sum().backward()
          assert model.observation[0].weight.grad is not None
          before=out.state.fast.clone()
          denied=model.verified_update(out.state,torch.randn(2,16),
                torch.tensor([0,1]),torch.tensor([33.,33.]),torch.tensor([False,False]))
          assert torch.equal(before,denied.fast)
          print('UNTRAINED DEV046 PUBLIC-STATE VERTICAL SLICE INTEGRITY PASSED')
          PY
