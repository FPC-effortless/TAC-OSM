name: S1TEMP007 genuine fork pick up source-only 50 FIT episodes
on:
  push:
    branches: [research/s1temp007-multiscale-state-2026-10-26]
    paths: ['research/parallel-six/S1TEMP007-SOURCE-*.marker']
permissions:
  contents: read
jobs:
  original-frozen-real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
      - run: python scripts/s1temp007_real_fork_source_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1temp007-original-real-source-only
          path: research/diagnostics/s1temp007-source-original/**
          if-no-files-found: warn
          retention-days: 90
