name: Research PLM representation interface 007
on:
  pull_request:
    branches:
      - research/unified-plm-clm-final-2026-10-01
    paths:
      - "scripts/run_plm_representation_interface_007.py"
      - "tests/test_plm_representation_interface_007.py"
      - "src/tac_osm/c5_persistent_relational_loop.py"
      - "src/tac_osm/plm_unified.py"
  push:
    branches:
      - research/plm-representation-interface-007
    paths:
      - "scripts/run_plm_representation_interface_007.py"
      - "tests/test_plm_representation_interface_007.py"
      - "src/tac_osm/c5_persistent_relational_loop.py"
      - "src/tac_osm/plm_unified.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: python -m pip install --quiet -e . pytest
      - name: Full repository suite
        run: python -m pytest tests/ -q
      - name: Research phase tests
        run: python -m pytest tests/test_plm_representation_interface_007.py -q
      - name: Run representation/interface phase
        run: python scripts/run_plm_representation_interface_007.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-REPRESENTATION-INTERFACE-007
          path: artifacts/TACOSM-PLM-REPRESENTATION-INTERFACE-007.json
          if-no-files-found: error
