name: Predictive-world DEV-006 (NOT confirmatory)

on:
  push:
    branches:
      - research/predictive-objectives-dev-006-2026-10-12
    paths:
      - "src/tac_osm/development/predictive_world.py"
      - "scripts/run_predictive_world_dev.py"
      - "scripts/validate_predictive_world_dev.py"
      - "tests/test_predictive_world_development.py"
      - ".github/workflows/predictive-world-development.yml"
      - "docs/PREDICTIVE-WORLD-DEV-006.md"
  pull_request:
    paths:
      - "src/tac_osm/development/predictive_world.py"
      - "scripts/run_predictive_world_dev.py"
      - "tests/test_predictive_world_development.py"
  workflow_dispatch:
    inputs:
      run_full:
        description: "Run the full developmental grid (not confirmatory)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gates-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and CPU ML dependencies
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Python syntax and focused model checks
        run: |
          python -m py_compile src/tac_osm/development/predictive_world.py scripts/run_predictive_world_dev.py scripts/validate_predictive_world_dev.py tests/test_predictive_world_development.py
          ruff check --select F src/tac_osm/development/predictive_world.py scripts/run_predictive_world_dev.py tests/test_predictive_world_development.py
          python -m pytest tests/test_predictive_world_development.py -q
      - name: Baseline test-count integrity
        run: python scripts/sync_test_count.py --check
      - name: Matched-arm smoke and reset ceiling
        run: |
          python scripts/run_predictive_world_dev.py --smoke --output artifacts/PREDICTIVE-WORLD-DEV-006-SMOKE
          python scripts/validate_predictive_world_dev.py artifacts/PREDICTIVE-WORLD-DEV-006-SMOKE
      - name: Preserve smoke evidence (never used for capability claims)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PREDICTIVE-WORLD-DEV-006-SMOKE-NOT-CONFIRMATORY
          path: artifacts/PREDICTIVE-WORLD-DEV-006-SMOKE/
          if-no-files-found: warn

  development-full:
    if: (github.event_name == 'push' && github.ref_name == 'research/predictive-objectives-dev-006-2026-10-12') || (github.event_name == 'workflow_dispatch' && inputs.run_full)
    needs: gates-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU environment
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen development grid, three paired seeds
        run: |
          python scripts/run_predictive_world_dev.py --output artifacts/PREDICTIVE-WORLD-DEV-006
          python scripts/validate_predictive_world_dev.py artifacts/PREDICTIVE-WORLD-DEV-006
      - name: Preserve all raw episodes and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PREDICTIVE-WORLD-DEV-006-RAW-NOT-CONFIRMATORY
          path: artifacts/PREDICTIVE-WORLD-DEV-006/
          if-no-files-found: error
