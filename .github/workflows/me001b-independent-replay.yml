name: ME001B independent recorded-only real source and checkpoint audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/audit_me001b_real.py
      - .github/workflows/me001b-independent-replay.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore-recorded-only:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU replay dependencies
        run: |
          python -m pip install numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore ALL original frozen weights and score records
        uses: actions/download-artifact@v4
        with:
          name: me001b-original-scania-train-internal
          repository: FPC-effortless/TAC-OSM
          run-id: 39334730465
          github-token: ${{ github.token }}
          path: .
      - name: Recorded-only real-data and checkpoint audit (ZERO refits)
        run: |
          python -m scripts.audit_me001b_real --artifact-root results/me001b --output results/me001b-audit | tee audit-log.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/me001b-audit/audit.json')
          d=json.loads(p.read_text())
          assert d['replay_confirmed'] is True and d['refits']==0
          assert d['fits_replayed']==9 and not d['architecture_promoted']
          assert d['official_publisher_test_used'] is False
          assert d['official_publisher_validation_used'] is False
          assert len(d['checkpoint_sha256'])==9
          print('Verified complete ME001B recorded-only evidence; no retraining.')
          PY
      - name: Preserve audit result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me001b-independent-recorded-replay
          path: |
            results/me001b-audit/audit.json
            audit-log.txt
          if-no-files-found: ignore
          retention-days: 90
