name: DEV064B archived validation audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/audit_enabling_casm_dev064b.py'
      - '.github/workflows/dev064b-validation-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archived-validation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/run_enabling_casm_dev064b.py
            scripts/audit_enabling_casm_dev064b.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching numerical dependencies
        run: |
          python -m pip install numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore previously completed pilot archive without refitting
        uses: actions/download-artifact@v4
        with:
          name: dev064b-validation-pilots
          run-id: 39297333375
          github-token: ${{ github.token }}
          path: results/dev064b-original-pilots
      - name: Check original weights, replay validation, and inspect physical closure
        run: |
          python scripts/audit_enabling_casm_dev064b.py --artifact-dir results/dev064b-original-pilots --output results/dev064b-validation-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/dev064b-validation-audit.json').read_text())
          assert v['test_opened'] is False and v['heldout_test_evaluations']==0
          assert len(v['pilot_models'])==10
          assert v['status']=='VALIDATION_REJECTED_NOT_CONFIRMATORY'
          assert v['known_law_cost_oracle']['completed_fraction'] < .95
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev064b-closed-validation-report
          path: results/dev064b-validation-audit.json
          if-no-files-found: ignore
