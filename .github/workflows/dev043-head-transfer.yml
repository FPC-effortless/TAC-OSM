name: DEV-043 causal-order head adaptation (development)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/dev043/**'
      - 'scripts/*dev043.py'
      - 'tests/test_head_transfer_dev043.py'
      - '.github/workflows/dev043-head-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrity-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU environment
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint and full regression
        run: |
          ruff check --select F scripts/run_head_transfer_dev043.py scripts/audit_head_transfer_dev043.py tests/test_head_transfer_dev043.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Smoke research head-fitting on known DEV-041 checkpoint
        run: |
          gh api repos/FPC-effortless/TAC-OSM/actions/artifacts/12090820964/zip > /tmp/dev041.zip
          printf '%s  %s\n' b0dc2842537c50e2e76ecf0139b1519a032c2575af9181076897ccce0d5bd7c7 /tmp/dev041.zip | sha256sum -c -
          mkdir -p artifacts/dev041
          python -c "import zipfile;zipfile.ZipFile('/tmp/dev041.zip').extractall('artifacts/dev041')"
          python scripts/run_head_transfer_dev043.py --seed 4101 --checkpoints artifacts/dev041 --output artifacts/dev043-smoke --smoke
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FPC-effortless/TAC-OSM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV043-smoke-only
          path: artifacts/dev043-smoke/
          if-no-files-found: warn
  frozen-head-pilot:
    needs: integrity-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        seed: [4101,4102,4103]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact registered DEV-041 checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FPC-effortless/TAC-OSM
        run: |
          mkdir -p artifacts/dev041
          gh api repos/FPC-effortless/TAC-OSM/actions/artifacts/12090820964/zip > /tmp/dev041.zip
          printf '%s  %s\n' b0dc2842537c50e2e76ecf0139b1519a032c2575af9181076897ccce0d5bd7c7 /tmp/dev041.zip | sha256sum -c -
          python -c "import zipfile;zipfile.ZipFile('/tmp/dev041.zip').extractall('artifacts/dev041')"
      - name: Pinned CPU
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen representations, 0/10/50 mixed head fits, and causal-order evaluation
        run: |
          python scripts/run_head_transfer_dev043.py --seed ${{ matrix.seed }} --checkpoints artifacts/dev041 --output artifacts/dev043-seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV043-RAW-seed${{ matrix.seed }}-not-confirmatory
          path: artifacts/dev043-seed${{ matrix.seed }}/
          if-no-files-found: warn
  separate-audit:
    needs: frozen-head-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve per-seed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: DEV043-RAW-seed*-not-confirmatory
          path: artifacts/evidence
      - name: Retrieve immutable-by-hash DEV-041 checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FPC-effortless/TAC-OSM
        run: |
          mkdir -p artifacts/dev041
          gh api repos/FPC-effortless/TAC-OSM/actions/artifacts/12090820964/zip > /tmp/dev041.zip
          printf '%s  %s\n' b0dc2842537c50e2e76ecf0139b1519a032c2575af9181076897ccce0d5bd7c7 /tmp/dev041.zip | sha256sum -c -
          python -c "import zipfile;zipfile.ZipFile('/tmp/dev041.zip').extractall('artifacts/dev041')"
      - name: Pinned CPU reconstruction dependencies
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Recompute frozen predictions and exact physical interventions
        run: |
          python scripts/audit_head_transfer_dev043.py \
            artifacts/evidence/DEV043-RAW-seed4101-not-confirmatory \
            artifacts/evidence/DEV043-RAW-seed4102-not-confirmatory \
            artifacts/evidence/DEV043-RAW-seed4103-not-confirmatory \
            --checkpoints artifacts/dev041 --output artifacts/evidence/analysis
      - uses: actions/upload-artifact@v4
        with:
          name: DEV043-COMPLETE-EVIDENCE-NOT-CONFIRMATORY
          path: artifacts/evidence/
          if-no-files-found: error
      - name: Publish summary after successful evidence archiving
        run: cat artifacts/evidence/analysis/analysis.json
