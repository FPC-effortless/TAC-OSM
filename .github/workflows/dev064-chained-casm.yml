name: DEV064 chained-CASM preflight
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/dev064-chained-casm/**'
      - 'scripts/run_chained_casm_dev064.py'
      - 'tests/test_chained_casm_dev064.py'
      - '.github/workflows/dev064-chained-casm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: |
          python -m pip install numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify physical oracle and sealed test boundary
        run: |
          python -m unittest discover -s tests -p test_chained_casm_dev064.py -v
      - name: Run validation-only smoke
        run: |
          python scripts/run_chained_casm_dev064.py --stage smoke --output results/dev064-chained
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/dev064-chained/smoke.json').read_text())
          assert r['status']=='PREFLIGHT_ONLY' and r['test_opened'] is False
          assert len(r['fits'])==5
          assert all(x['steps']==8 for x in r['fits'])
          assert r['validation']['seed']==640642
          assert r['training']['seed']==640641
          assert r['validation']['oracle_vs_one_step_greedy_expected_regret']>=0
          print('preflight smoke PASS; no held-out test data opened')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev064-validation-only-smoke
          path: results/dev064-chained/smoke.json
          if-no-files-found: ignore
