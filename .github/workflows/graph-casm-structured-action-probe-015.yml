name: Research G-CASM structured action probe 015

on:
  push:
    branches:
      - research/graph-casm-structured-action-probe-015
    paths:
      - contracts/TACOSM-GRAPH-CASM-STRUCTURED-ACTION-PROBE-015.json
      - docs/AUDIT-TACOSM-GRAPH-CASM-STRUCTURED-ACTION-PROBE-015.md
      - scripts/run_graph_casm_structured_action_probe_015.py
      - scripts/run_graph_casm_selective_010.py
      - src/tac_osm/structured_action_probe.py
      - tests/test_structured_action_probe.py
      - .github/workflows/graph-casm-structured-action-probe-015.yml
  pull_request:
    branches:
      - research/graph-casm-adaptive-probe-014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: G-CASM-015 smoke/preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/cdl-attention-experiment
          ref: c31554413301e3c9d3e6b3f8c8c6be572a74a748
          path: third_party/cdl-attention-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -e . pytest torch
      - name: Contract validation
        run: |
          python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-GRAPH-CASM-STRUCTURED-ACTION-PROBE-015")
          assert c.check_consistency() == []
          print(c.primary_endpoint())
          PY
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: 015 focused tests
        run: python -m pytest tests/test_structured_action_probe.py -q
      - name: Smoke measurement
        run: python scripts/run_graph_casm_structured_action_probe_015.py --smoke
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-GRAPH-CASM-STRUCTURED-ACTION-PROBE-015-smoke
          path: artifacts/TACOSM-GRAPH-CASM-STRUCTURED-ACTION-PROBE-015.json
          if-no-files-found: ignore

  full:
    name: G-CASM-015 full confirmatory measurement
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(toJSON(github.event.commits), '[run-graph-casm-structured-action-probe-015-full]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: FPC-effortless/cdl-attention-experiment
          ref: c31554413301e3c9d3e6b3f8c8c6be572a74a748
          path: third_party/cdl-attention-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -e . pytest torch
      - name: Contract validation
        run: |
          python - <<'PY'
          from tac_osm.contract import load_contract
          c = load_contract("TACOSM-GRAPH-CASM-STRUCTURED-ACTION-PROBE-015")
          assert c.check_consistency() == []
          c.require_levels((32,64,128,256,512))
          c.require_seeds((0,1,2,3,4))
          c.require_steps(1)
          c.require_eval_steps(32)
          c.require_arms(["scalar_row","activation_trace"])
          PY
      - name: Repository suite
        run: python -m pytest tests/ -q
      - name: 015 focused tests
        run: python -m pytest tests/test_structured_action_probe.py -q
      - name: Full measurement
        run: python scripts/run_graph_casm_structured_action_probe_015.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-GRAPH-CASM-STRUCTURED-ACTION-PROBE-015
          path: artifacts/TACOSM-GRAPH-CASM-STRUCTURED-ACTION-PROBE-015.json
          if-no-files-found: error

# Full measurement is explicitly triggered only by workflow_dispatch or a marker commit after implementation audit.
# [run-graph-casm-structured-action-probe-015-full]
