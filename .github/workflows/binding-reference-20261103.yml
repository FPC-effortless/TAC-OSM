name: Independent repaired adjoint reference audit
on:
  push:
    branches: [repair/local-binding-diagnosis-20261103]
    paths: [research/binding_diagnosis_20261103/REFERENCE_REQUEST.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: repaired-binding-reference-20261103
  cancel-in-progress: false
jobs:
  no-fit:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'audit repaired binding reference 20261103 v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify source and no-fit compute plan
        run: |
          python -B research/binding_diagnosis_20261103/preflight.py > preflight-source.json
          python -O -B research/binding_diagnosis_20261103/preflight.py > preflight-source-optimized.json
          python -B scripts/phone_lab.py plan research/phone_queue/binding_diagnosis_20261103.json > preflight-plan.txt
          python -B research/binding_diagnosis_20261103/adjoint_reference.py > preflight-math.json
      - name: Restore frozen CPU runtime
        run: |
          python -m venv diagnostic-env
          diagnostic-env/bin/python -m pip --isolated install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.13.0+cpu Jinja2==3.1.6 MarkupSafe==3.0.3 filelock==4.2.4 fsspec==2026.9.0 mpmath==1.3.0 networkx==3.7 pip==25.0.1 setuptools==78.1.0 sympy==1.14.0 typing_extensions==4.16.0
      - name: Compare repaired forward and adjoint with independent equations; zero fits
        run: timeout --signal=TERM --kill-after=5s 180s diagnostic-env/bin/python -I -B research/binding_diagnosis_20261103/audit_reference.py --output research/binding_diagnosis_20261103/reference-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: binding-reference-${{ github.run_id }}
          path: |
            research/binding_diagnosis_20261103/reference-output/
            preflight-source.json
            preflight-source-optimized.json
            preflight-plan.txt
            preflight-math.json
          retention-days: 90
