name: Research C5 noisy full phase

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Full repository suite
        run: python -m pytest tests/ -q
      - name: Run C5 noisy full phase
        run: python scripts/run_c5_noisy_full_phase_001.py
      - name: Upload C5 noisy phase artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-C5-NOISY-FULL-PHASE-001
          path: artifacts/TACOSM-C5-NOISY-FULL-PHASE-001.json
          if-no-files-found: error
