name: ME062 original bytes Git checkpoint storage probe (UNTRAINED)
on:
  pull_request:
    paths:
      - 'scripts/me062_storage_probe.py'
      - '.github/workflows/me062-repo-storage-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit-untrained-probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:. python scripts/me062_storage_probe.py --write
      - name: Git-persist original untrained probe bytes
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/replay-bundles/ME062/UNTRAINED_STORAGE_PROBE.pt research/replay-bundles/ME062/STORAGE_PROBE_MANIFEST.json
          git commit -m 'evidence(me062): Git-preserve untrained checkpoint-byte transport probe'
          git push origin "HEAD:refs/heads/$PUSH_BRANCH"
  independent-clean-checkout-load:
    needs: commit-untrained-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5'
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Independently load checkpoint bytes from separate clean checkout
        run: PYTHONPATH=src:. python scripts/me062_storage_probe.py --check
