name: DEV-018 memory baselines and horizon controls (development)
on:
  pull_request:
    paths:
      - "src/tac_osm/development/memory_baselines.py"
      - "scripts/run_memory_controls_dev.py"
      - "scripts/audit_memory_controls_dev.py"
      - "tests/test_memory_baselines.py"
      - "contracts/DEV-018.json"
      - ".github/workflows/memory-controls-development.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gates-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Integrity and regression tests
        run: |
          ruff check --select F src/tac_osm/development/memory_baselines.py scripts/run_memory_controls_dev.py scripts/audit_memory_controls_dev.py tests/test_memory_baselines.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
      - name: Ten-arm smoke and exact prediction/sensing/cost checkpoint replay
        run: |
          python scripts/run_memory_controls_dev.py --seed 43 --regime short --smoke --output artifacts/DEV-018-SMOKE
          python scripts/run_memory_controls_dev.py --seed 43 --regime short --smoke --replay --output artifacts/DEV-018-SMOKE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-018-SMOKE-NOT-CONFIRMATORY
          path: artifacts/DEV-018-SMOKE/
          if-no-files-found: warn
  seed-regime:
    needs: gates-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [43, 59, 71]
        regime: [short, long]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --quiet -e . numpy==2.3.3
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fixed training and full checkpoint replay
        run: |
          python scripts/run_memory_controls_dev.py --seed ${{ matrix.seed }} --regime ${{ matrix.regime }} --output artifacts/DEV-018-${{ matrix.regime }}-${{ matrix.seed }}
          python scripts/run_memory_controls_dev.py --seed ${{ matrix.seed }} --regime ${{ matrix.regime }} --replay --output artifacts/DEV-018-${{ matrix.regime }}-${{ matrix.seed }}
      - name: Print accessible compact evidence
        run: cat artifacts/DEV-018-${{ matrix.regime }}-${{ matrix.seed }}/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEV-018-RAW-${{ matrix.regime }}-${{ matrix.seed }}-NOT-CONFIRMATORY
          path: artifacts/DEV-018-${{ matrix.regime }}-${{ matrix.seed }}/
          if-no-files-found: warn
  independent-audit:
    needs: seed-regime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: DEV-018-RAW-*-NOT-CONFIRMATORY
          path: artifacts/DEV-018-evidence
      - name: Recompute targets, costs, sensing choices, seed intervals and gates without torch
        run: |
          python scripts/audit_memory_controls_dev.py artifacts/DEV-018-evidence/DEV-018-RAW-*-NOT-CONFIRMATORY --output artifacts/DEV-018-evidence/analysis
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-018-COMPLETE-AUDITED-EVIDENCE-NOT-CONFIRMATORY
          path: artifacts/DEV-018-evidence/
          if-no-files-found: error
