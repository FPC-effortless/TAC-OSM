name: Unified native model multimodal research 001

concurrency:
  group: unified-native-model-001-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/unified-native-model-v1
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install preflight dependencies
        run: python -m pip install --quiet pytest numpy
      - name: Repository tests
        run: python -m pytest tests/ -q
      - name: Contract/schema and leakage preflight
        run: python scripts/validate_unified_multimodal_001.py

  confirmatory:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical research dependencies
        run: python -m pip install --quiet numpy torch
      - name: Confirmatory multimodal experiment
        run: python scripts/run_unified_multimodal_001.py --confirmatory
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-UNIFIED-MULTIMODAL-001
          path: artifacts/TACOSM-UNIFIED-MULTIMODAL-001.json
