name: Research PLM integrated E2E typed content 004

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - research/plm-integrated-e2e-004-typed-content
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full repository suite
        run: python -m pytest tests/ -q

  arm:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        arm: [typed_learned, typed_oracle]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run registered arm
        env:
          E2E004_ARM: \${{ matrix.arm }}
        run: |
          python scripts/run_integrated_e2e_004.py \
            --arm "$E2E004_ARM" \
            --output "artifacts/TACOSM-PLM-INTEGRATED-E2E-004-$E2E004_ARM.json"
      - name: Upload arm artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-INTEGRATED-E2E-004-\${{ matrix.arm }}
          path: artifacts/TACOSM-PLM-INTEGRATED-E2E-004-\${{ matrix.arm }}.json
          if-no-files-found: error

  aggregate:
    needs: arm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet -e . pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download arm artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/arms
          pattern: TACOSM-PLM-INTEGRATED-E2E-004-*
          merge-multiple: false
      - name: Normalize artifact paths
        run: |
          mkdir -p artifacts
          for arm in typed_learned typed_oracle; do
            cp "artifacts/arms/TACOSM-PLM-INTEGRATED-E2E-004-$arm/TACOSM-PLM-INTEGRATED-E2E-004-$arm.json" "artifacts/TACOSM-PLM-INTEGRATED-E2E-004-$arm.json"
          done
      - name: Aggregate result
        run: python scripts/aggregate_integrated_e2e_004.py
      - name: Upload combined result
        uses: actions/upload-artifact@v4
        with:
          name: TACOSM-PLM-INTEGRATED-E2E-004-COMBINED
          path: artifacts/TACOSM-PLM-INTEGRATED-E2E-004-COMBINED.json
          if-no-files-found: error
