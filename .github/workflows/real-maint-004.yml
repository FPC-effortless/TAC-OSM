name: Recorded factual repair-outcome forecasts
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/real-maint-004/**'
      - 'src/tac_osm/development/repair_outcome.py'
      - 'scripts/*real_maintenance_004.py'
      - 'scripts/runtime_repair_outcome_004.py'
      - 'tests/test_repair_outcome_004.py'
      - '.github/workflows/real-maint-004.yml'
permissions:
  contents: read
jobs:
  strict-repair-outcome-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e . numpy==2.5.4
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python scripts/restore_real_maintenance_004.py
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          url='https://raw.githubusercontent.com/openwashdata/floodchlorinationsurvey/a2755213c841fdfc7b65aaaff0b91016296f2985/inst/extdata/floodchlorinationsurvey.csv'
          with urllib.request.urlopen(url,timeout=45) as response:raw=response.read(1000000)
          assert hashlib.sha256(raw).hexdigest()=='6062eaa4c758d07820e7a13c4c31f783970dbf5598fa554afee2de5a36d58258'
          Path('results/real004-source.csv').write_bytes(raw)
          PY
          python scripts/audit_real_maintenance_004.py --directory results/real004-main --source results/real004-source.csv --output results/real004-remote-audit.json --exports results/real004-remote-forecasters
          python scripts/analyze_real_maintenance_004.py --directory results/real004-main --output results/real004-remote-statistics.json
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from audit_identity_dev0615 import compare
          root=Path('results/real004-main')
          assert not (root/'TEST-OPENED.json').exists() and not (root/'test-labels.json').exists()
          audit=json.load(open('results/real004-remote-audit.json'))
          assert audit['status']=='COMPLETE' and audit['checkpoints']==24
          assert audit['portable_predictions']==10 and audit['telemetry']['max_abs']<=1e-8
          compare(json.load(open('results/real004-remote-statistics.json')),json.load(open('research/real-maint-004/statistics.json')),{'values':0,'max_abs':0.})
          for path in Path('results/real004-remote-forecasters').glob('*/metadata.json'):
              metadata=json.loads(path.read_text())
              assert metadata['unit']=='seconds_per_20L' and not metadata['commercial_qualified']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real004-replayed-negative-result
          path: |
            results/real004-remote-*.json
            results/real004-remote-forecasters/**
          if-no-files-found: ignore
