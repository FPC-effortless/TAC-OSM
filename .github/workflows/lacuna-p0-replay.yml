name: LACUNA P0 offline original086087 checkpoint replay
on:
  pull_request:
    paths:
      - 'scripts/replay_langmem086087.py'
      - 'research/replication/langmem086087/**'
      - 'research/replay-bundles/LANGMEM086/**'
      - 'research/replay-bundles/LANGMEM087/**'
      - 'tests/test_replay_langmem086087.py'
      - '.github/workflows/lacuna-p0-replay.yml'
permissions:
  contents: read
jobs:
  offline-git-cold-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Original pinned CPU libraries
        run: |
          python -m pip install numpy==2.3.5 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Planner and no-fit source gate
        run: |
          mkdir -p replay-evidence
          python scripts/phone_lab.py plan research/phone_queue/lacuna-p0-replay086087.json > replay-evidence/PLAN.json
          python scripts/validate_research_parity.py --manifest research/replication/langmem086087/FAIR_COMPARISON.json --phase preflight > replay-evidence/PREFLIGHT.json
          PYTHONPATH=src:. python -m pytest -q tests/test_replay_langmem086087.py tests/test_research_probe_agnostic.py
      - name: Offline Git-owned archive replay, no artifact download or training
        run: python scripts/replay_langmem086087.py --output replay-evidence/REPLAY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LACUNA-P0-original086087-FIT-replay
          path: replay-evidence/
          retention-days: 90
