name: S1TEMP007 independent original nine frozen real models read-only replay
on:
  push:
    branches: [research/s1temp007-multiscale-state-2026-10-26]
    paths: ['research/parallel-six/S1TEMP007-REPLAY-001.marker']
permissions:
  contents: read
  actions: read
jobs:
  nine-original-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --quiet 'numpy<2' 'pyarrow==17.0.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Python syntax preflight before opening source
        run: python -m py_compile scripts/s1temp007_original_mobile_cold_replay.py
      - name: Fetch only the ORIGINAL frozen nine model optimizer RNG SHA artifact
        run: |
          gh run download 40297263363 --repo FPC-effortless/TAC-OSM \
            --name s1temp007-9-original-mobile-real-first-score-and-weights \
            --dir /tmp/s1temp007-first-original
      - name: Original FIT+DEV file SHA and 27 unchanged source H1024 score verification
        run: |
          INDEX="$(find /tmp/s1temp007-first-original -name BEFORE-DEV-SHA-FREEZE.json -print -quit)"
          test -n "$INDEX"
          PYTHONPATH=src:. python -u scripts/s1temp007_original_mobile_cold_replay.py \
            --original-dir "$(dirname "$INDEX")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1temp007-original-9-model-27-real-scores-no-fit-replay
          path: research/diagnostics/s1temp007-cold-replay/**
          if-no-files-found: warn
          retention-days: 90
