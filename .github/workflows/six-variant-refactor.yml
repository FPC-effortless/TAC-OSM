name: TAC-OSM six research variant boundary checks
on:
  push:
    branches:
      - research/six-variant-core-lanes-2026-10-23
    paths:
      - "src/tac_osm/variants/**"
      - "tests/test_six_variant_adapters.py"
      - ".github/workflows/six-variant-refactor.yml"
  pull_request:
    paths:
      - "src/tac_osm/variants/**"
      - "tests/test_six_variant_adapters.py"
      - ".github/workflows/six-variant-refactor.yml"
  workflow_dispatch:
jobs:
  validate-interfaces-no-model-fit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated software-test dependency
        run: python -m pip install pytest==9.1.1
      - name: Six variant integration boundary / no-execution fixtures
        run: PYTHONPATH=src:. python -m pytest -q tests/test_six_variant_adapters.py
