name: GRAPH009 bounded count scan, causal fusion, and parity
on:
  push:
    branches: [research/500k-calibrated-source-retrieval-009-2026-10-28]
  pull_request:
  workflow_dispatch:
jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Compile source and test strict integer scan, causal future, probability laws and learned parameter budget
        run: |
          python -m py_compile research/language/flow_500k/bayesian_cache_scan_v5.py research/language/flow_500k/source_calibrated_tac_v5.py
          OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python -m unittest discover -s research/language/flow_500k -p 'test_calibrated_retrieval_v5.py' -v
