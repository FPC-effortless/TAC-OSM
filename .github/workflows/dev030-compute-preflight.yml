name: DEV-030 portable compute integrity (CPU only)
on:
  pull_request:
    types: [opened]
    paths:
      - 'scripts/*dev030.py'
      - 'src/tac_osm/development/compute_runtime.py'
      - 'scripts/run_optimization_study_dev029.py'
      - 'tests/*dev030.py'
      - '.github/workflows/dev030-compute-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet -e . pytest==9.1.1 numpy==2.3.3 ruff==0.13.0
          python -m pip install --quiet torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: CPU regression, resume integrity and preflight fixture
        run: |
          ruff check --select F src/tac_osm/development/compute_runtime.py scripts/*dev030.py tests/*dev030.py scripts/run_optimization_study_dev029.py
          python scripts/sync_test_count.py --check
          python -m pytest tests/ -q
          python scripts/run_compute_preflight_dev030.py --cpu-only --smoke --output /tmp/dev030-cpu-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: DEV-030-CPU-INTEGRITY-NOT-GPU-VALIDATION
          path: /tmp/dev030-cpu-smoke.json
