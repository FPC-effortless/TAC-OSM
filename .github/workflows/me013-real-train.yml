name: ME013 real multi-station native predictive-state training
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/me013_multisite.py
      - research/mathematical-engineering/me013/PROTOCOL.md
      - .github/workflows/me013-real-train.yml
permissions:
  contents: read
concurrency:
  group: me013-original-real-multistation-fit
  cancel-in-progress: true
jobs:
  preflight:
    # Original accepted 9 fits in run 39391203298 at frozen SHA; never silently refit.
    if: github.event.pull_request.head.sha == 'fc563c13c30b69a9b265c67812276754e2333659'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Check source compiles and mathematical/software invariants
        run: |
          python -m py_compile scripts/me013_multisite.py
          python -m scripts.me013_multisite --self-test
  original-ten-site-train:
    if: github.event.pull_request.head.sha == 'fc563c13c30b69a9b265c67812276754e2333659'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'numpy==2.2.6'
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Train fixed 9 model fits on real 10-site early observations only
        run: |
          python -m scripts.me013_multisite --out results/me013 | tee me013-original.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/me013')
          d=json.loads((p/'results.json').read_text())
          assert d['study']=='ME013_UCI_REAL_MULTI_STATION'
          assert len(d['fits'])==9
          assert d['splits']['test_unopened'] and d['splits']['heldout_sites_unopened']
          assert not d['future_test_read'] and not d['architecture_promoted']
          assert 'Shunyi' not in d['source']['parsed_stations']
          assert 'Wanshouxigong' not in d['source']['parsed_stations']
          assert d['source']['source_rows_at_or_after_cutoff_parsed'] is False
          assert {(e['model'],e['seed']) for e in d['fits']}=={
              (arm,seed) for arm in ('native_plain','native_routed','gru')
              for seed in (13001,13002,13003)}
          assert len(list((p/'checkpoints').glob('*.pt')))==9
          PY
      - name: Preserve all checkpoints even when an arm loses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me013-original-ten-site-real-models
          path: |
            results/me013/results.json
            results/me013/checkpoints/*.pt
            me013-original.log
          if-no-files-found: ignore
          retention-days: 90
