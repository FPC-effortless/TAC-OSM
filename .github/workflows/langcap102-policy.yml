name: LANGCAP102 prospective scale policy (NO FIT)
on:
  pull_request:
    paths:
      - 'research/langcap102/**'
      - 'research/REAL-WORLD-EVIDENCE-RULES.md'
      - 'scripts/validate_research_parity.py'
      - 'tests/test_research_parity_gate.py'
      - 'tests/test_langcap102_design.py'
      - '.github/workflows/langcap102-policy.yml'
permissions:
  contents: read
jobs:
  policy-no-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies (no Torch, model weights or datasets)
        run: python -m pip install 'pytest>=8,<9' 'cryptography>=44,<47'
      - name: Check policy and design cannot silently authorize training
        run: python research/langcap102/gate.py design
      - name: Regression-test v1 original policy, v2 scale and fail-closed parity
        run: python -m pytest -q tests/test_research_parity_gate.py tests/test_langcap102_design.py
      - name: Check numerical scale guards, not training
        run: |
          python scripts/validate_research_parity.py --model-parameters 100000 --deployed-parameters 100000
          python scripts/validate_research_parity.py --model-parameters 1000000 --deployed-parameters 1000000 --target-trainable-parameters 1000000 --target-deployed-parameters 1000000
          python scripts/validate_research_parity.py --model-parameters 100000000 --deployed-parameters 100000000 --target-trainable-parameters 100000000 --target-deployed-parameters 100000000
          if python scripts/validate_research_parity.py --model-parameters 1000000 --deployed-parameters 1000000; then
            echo 'ERROR: undeclared scale bypass accepted'
            exit 1
          fi
          if python scripts/validate_research_parity.py --model-parameters 1100000 --deployed-parameters 1100000 --target-trainable-parameters 1000000 --target-deployed-parameters 1000000; then
            echo 'ERROR: 10% overfit accepted outside declared 5% band'
            exit 1
          fi
          echo 'PASS: v1 preserved; declared v2 scales pass; undeclared/overscale rejected'
