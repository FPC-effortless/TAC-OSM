name: MODEL01 native original three-seed independent fresh-checkout replay only
on:
  push:
    branches:
      - research/model01-native-tac-capability-fit-2026-10-27
    paths:
      - '.github/workflows/model01-native-clean-replay.yml'
      - 'research/replay-bundles/MODEL01-TAC-REAL-FIT-001/**'
      - 'specialist_models/model01_native_tac_real_fit.py'
  pull_request:
    paths:
      - '.github/workflows/model01-native-clean-replay.yml'
      - 'research/replay-bundles/MODEL01-TAC-REAL-FIT-001/**'
      - 'specialist_models/model01_native_tac_real_fit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-process-clean-original-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only exact numeric replay dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==2.2.6'
          python -m pip install --disable-pip-version-check --no-cache-dir 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm full original Git model plus optimizer/RNG/sampler and strict historical splits
        run: |
          python - <<'PY'
          import json
          p='research/replay-bundles/MODEL01-TAC-REAL-FIT-001/ORIGINAL_FIT.json'
          d=json.load(open(p))
          assert d['study']=='MODEL01-TAC-REAL-FIT-001'
          assert d['source_zip_sha256']=='2fccf354445d886e7917620b0195db1f3e3e34d5a067a93b844694a4c561255a'
          assert d['trainable_params']==d['deployed_params']==103252
          assert d['original_protected_tail_parsed'] is False
          assert d['seeds']==[1701,1702,1703] and len(d['runs'])==3
          for r in d['runs']:
            assert r['dev']['n']==1968
            assert len(r['checkpoint_b64_gzip'])>1_000_000
            assert len(r['checkpoint_sha256'])==64
          print('ORIGINAL_GIT_OWNED_THREE_NATIVE_MODELS_VERIFIED')
          PY
      - name: Run exact fresh-runner authentic source replay; never train or tune
        run: |
          python specialist_models/model01_native_tac_real_fit.py \
            --replay-from research/replay-bundles/MODEL01-TAC-REAL-FIT-001/ORIGINAL_FIT.json \
            --out native_original_fresh_checkout_replay.json
          python - <<'PY'
          import json
          x=json.load(open('native_original_fresh_checkout_replay.json'))
          assert x['mode']=='GIT_ORIGINAL_NO_REFIT_REPLAY'
          assert len(x['results'])==3
          assert all(r['CAL_DEV_replayed_within_1e6'] is True and r['fitted_during_replay'] is False for r in x['results'])
          print('FRESH_CHECKOUT_ORIGINAL_AUTHENTIC_UCI_NO_FIT_REPLAY=PASS')
          print('SHA='+json.dumps([r['original_checkpoint_sha256'] for r in x['results']]))
          PY
      - name: Preserve separate independent replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: model01-native-original-clean-checkout-replay-only
          path: native_original_fresh_checkout_replay.json
          if-no-files-found: error
          retention-days: 14
